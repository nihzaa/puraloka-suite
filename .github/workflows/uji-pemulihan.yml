name: Uji Pemulihan (DR drill)

# ============================================================================
# F1-4 — BUKTI bahwa database ini BISA DIPULIHKAN, bukan janji bahwa ia
#        ter-backup.
#
# ══════════════════════════════════════════════════════════════════════════
# KENAPA DI CI, DAN KENAPA TERJADWAL
# ══════════════════════════════════════════════════════════════════════════
#
# "Backup berhasil dibuat" bukan jaminan apa pun. Berkas bisa terbentuk,
# berukuran wajar, dan tetap tak bisa dipulihkan. Satu-satunya bukti bahwa
# cadangan berguna adalah cadangan itu PERNAH DIPULIHKAN.
#
# Terjadwal, karena latihan pemulihan yang dijalankan sekali lalu ditulis di
# dokumen akan membusuk diam-diam: skema berubah, ekstensi ditambah, versi
# server naik. Yang dulu berhasil belum tentu masih berhasil, dan tak ada yang
# akan tahu sampai hari yang paling buruk.
#
# Runner `ubuntu-latest` dipakai karena ia sudah membawa perkakas klien
# Postgres dan bisa menjalankan service container — sementara mesin pengembang
# belum tentu punya keduanya (mesin tempat ini ditulis: tanpa hak admin, WSL
# tanpa distro, jadi Docker tak bisa hidup).
#
# ── Yang diuji: DATABASE CI, bukan produksi
#
# `CI_DIRECT_URL`, bukan `DIRECT_URL`. Latihan pemulihan tak boleh memberi
# alasan apa pun untuk mengarahkan perkakas ke basis data yang berisi data
# pelanggan. pg_dump memang hanya membaca — tetapi kebiasaan menunjuk produksi
# dalam latihan adalah bagaimana kecelakaan lahir.
#
# ── Yang dibuktikan, dan kenapa itu yang dipilih
#
#   1. Jumlah TABEL cocok        — struktur sampai
#   2. Jumlah BARIS cocok        — isinya sampai, bukan cuma kerangkanya
#   3. RLS + POLICY ikut pulih   — TERPENTING. Memulihkan data tanpa RLS di
#      sistem multi-tenant bukan pemulihan, melainkan KEBOCORAN: tenant saling
#      melihat data, dan semua pemeriksaan jumlah baris di atas tetap hijau.
#   4. WAKTU tiap tahap tercatat — F1-4 mensyaratkannya, dan angka itu yang
#      menentukan janji RTO yang jujur.
# ============================================================================

on:
  schedule:
    # Setiap Senin 02:00 UTC (09:00 WIB). Mingguan, bukan harian: latihan ini
    # menyalin seluruh basis data, dan lebih sering tak menambah keyakinan.
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: uji-pemulihan
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Target sekali-pakai. Ia mati bersama job — tak punya nilai yang bisa
      # hilang, dan tak bisa jadi target yang salah.
      target:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # pg_dump HARUS >= versi server. Klien yang lebih tua bisa kehilangan
      # objek yang belum dikenalinya — kerusakan yang baru ketahuan saat
      # restore, yaitu saat paling gawat.
      - name: Pasang klien Postgres 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # ── PATH TIDAK CUKUP ────────────────────────────────────────────
          #
          # Runner ubuntu-latest SUDAH membawa postgresql-client-16, dan
          # /usr/bin/pg_dump menang atas /usr/lib/postgresql/17/bin/pg_dump.
          # Jadi `postgresql-client-17` terpasang dengan sukses, tetapi
          # `pg_dump` yang benar-benar berjalan tetap 16 — dan gagal dengan
          # "aborting because of server version mismatch" terhadap server 17.
          #
          # Terjadi sungguhan (run 30829393757): log menunjukkan
          # "Setting up postgresql-client-17" DAN "pg_dump (PostgreSQL) 16.14"
          # berjarak tiga detik. Memasang bukan berarti memakai.
          echo "PATH=/usr/lib/postgresql/17/bin:$PATH" >> $GITHUB_ENV

          # Buktikan sekarang, bukan tiga langkah lagi. Kegagalan versi yang
          # muncul saat dump membuat orang mencurigai kredensial lebih dulu —
          # itulah yang terjadi pada saya.
          V=$(/usr/lib/postgresql/17/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "versi yang AKAN dipakai: $V"
          [ "$V" -ge 17 ] || { echo "::error::pg_dump $V < 17 — dump bisa kehilangan objek"; exit 1; }

      # ── Sandi bersimbol WAJIB di-encode ──────────────────────────────────
      #
      # Insiden 2026-08-03: `@` di dalam sandi memisahkan URL di tempat yang
      # salah — `pg_dump` mengira nama servernya adalah "…sandi…@aws-0-…" dan
      # gagal dengan "could not translate host name".
      #
      # Yang membuatnya BERBAHAYA, bukan sekadar merepotkan: pesan galat itu
      # MENCETAK potongan sandi ke log. GitHub me-mask nilai secret yang PERSIS
      # sama, tetapi potongan hasil parsing yang keliru bukan nilai yang sama —
      # jadi lolos dari mask. Di repo publik, itu kredensial yang terbit.
      #
      # Karena itu langkah ini:
      #   • menyusun ulang URL dengan bagian sandi ter-encode
      #   • MEMBUNGKAM stderr pg_dump (2>/dev/null) — galat koneksi apa pun
      #     berpotensi memuat potongan URL. Yang dilaporkan hanya kode keluar.
      #
      # Membungkam stderr biasanya praktik buruk. Di sini kebalikannya: yang
      # hilang cuma teks galat yang bisa didiagnosis ulang dari kode keluar,
      # sedangkan yang dicegah adalah kebocoran permanen di repo publik.
      - name: Susun URL aman (sandi ter-encode)
        env:
          SUMBER: ${{ secrets.CI_DIRECT_URL }}
        run: |
          if [ -z "$SUMBER" ]; then
            echo "::error::Secret CI_DIRECT_URL kosong."; exit 1
          fi
          AMAN=$(SUMBER="$SUMBER" node -e '
            const u = process.env.SUMBER;
            // ⚠️ JANGAN encode URL yang SUDAH sah — meng-encode ULANG sandi
            // yang sudah ter-encode mengubah % jadi %25 dan MERUSAKNYA.
            // Galatnya menuduh username ("failed for user postgres") padahal
            // sandinya yang salah. Dua run cadangan gagal karena ini.
            const tanpaSkema = u.replace(/^postgres(ql)?:\/\//, "");
            if ((tanpaSkema.match(/@/g) || []).length === 1) {
              try {
                const p = new URL(u);
                if (p.hostname && p.username) { process.stdout.write(u); process.exit(0); }
              } catch { /* rusak — perbaiki di bawah */ }
            }
            const m = u.match(/^(postgres(?:ql)?:\/\/)([^:]+):(.*)@([^@]+)$/);
            if (!m) { console.error("format URL tak dikenali"); process.exit(1); }
            const [, skema, user, sandi, sisa] = m;
            // encodeURIComponent menutup @ : / ? # dan kawan-kawan.
            process.stdout.write(skema + encodeURIComponent(user) + ":" +
                                 encodeURIComponent(sandi) + "@" + sisa);
          ')
          # ::add-mask:: mendaftarkan nilai ini agar ikut disensor kalau
          # sampai tercetak — lapis kedua di belakang pembungkaman stderr.
          echo "::add-mask::$AMAN"
          echo "URL_AMAN=$AMAN" >> $GITHUB_ENV
          echo "✅ URL disusun ulang dengan sandi ter-encode"

          # ── Diagnostik yang AMAN ────────────────────────────────────────
          #
          # Membungkam stderr menutup kebocoran, tetapi juga menutup mata:
          # run pertama setelah perbaikan gagal tanpa satu pun petunjuk.
          # Yang dicetak di sini hanya BENTUK sambungan — host, port, nama
          # basis data — tanpa user maupun sandi. Ketiganya bukan rahasia
          # (host Supabase bisa ditebak dari region), tetapi hampir selalu
          # cukup untuk menjelaskan kenapa sambungan gagal.
          AMAN="$AMAN" node -e '
            const p = new URL(process.env.AMAN);
            console.log("   host :", p.hostname);
            console.log("   port :", p.port || "(bawaan 5432)");
            console.log("   db   :", p.pathname.slice(1) || "(kosong)");
            if (p.port === "6543") {
              console.log("   ::warning::port 6543 = pooler. pg_dump butuh 5432 (direct).");
            }
          '
          # Bisakah host-nya di-resolve sama sekali?
          HOST=$(AMAN="$AMAN" node -e 'process.stdout.write(new URL(process.env.AMAN).hostname)')
          if getent hosts "$HOST" >/dev/null 2>&1; then
            echo "   DNS  : ✅ terpecahkan"
          else
            echo "   DNS  : ❌ TIDAK terpecahkan — host salah atau project Supabase sudah tak ada"
          fi

      - name: Cadangkan (READ-ONLY terhadap sumber)
        run: |
          mkdir -p cadangan
          t0=$(date +%s)
          # ── HANYA schema `public` ────────────────────────────────────────
          #
          # Database CI dipakai bersama test suite, yang membuat lalu MENGHAPUS
          # schema sementara (`test_<run>_s<shard>`) sepanjang waktu. pg_dump
          # membaca daftar schema di awal lalu mengambilnya satu per satu —
          # kalau salah satu lenyap di antara kedua saat itu, ia mati dengan
          #     ERROR: schema "test_30829613331_s6" does not exist
          # Terjadi sungguhan di run 30830005729, padahal run sebelumnya hijau.
          #
          # `--schema=public` menutupnya sekaligus membuat drill lebih jujur:
          # yang perlu dipulihkan saat bencana memang hanya `public`. Schema
          # test adalah sampah sementara milik CI, bukan data yang berharga.
          #
          # stderr ditangkap ke berkas, TIDAK dicetak. Yang dilaporkan hanya
          # KELAS galatnya lewat pencocokan pola — cukup untuk mendiagnosis,
          # tanpa pernah menerbitkan teks yang bisa memuat kredensial.
          # --serializable-deferrable: dump diambil dari SATU snapshot yang
          # konsisten secara transaksional.
          #
          # Tanpanya, dump bisa memuat baris anak yang induknya belum/sudah
          # tak ada — dan restore gagal dengan pelanggaran FK
          # ("lesson_propagation_proposals violates foreign key constraint").
          # Itu bukan cacat cadangan, melainkan potret yang diambil sambil
          # bergerak. Cadangan yang tak konsisten secara referensial adalah
          # cadangan yang tak bisa dipulihkan utuh — persis hal yang drill ini
          # ada untuk menemukannya.
          if ! pg_dump --format=custom --no-owner --no-privileges \
                       --schema=public --serializable-deferrable \
                       --file=cadangan/drill.dump "$URL_AMAN" 2>/tmp/galat.txt; then
            echo "::error::pg_dump gagal."
            if   grep -qi "password authentication failed" /tmp/galat.txt; then
              echo "SEBAB: sandi SALAH. Perbarui secret CI_DIRECT_URL."
            elif grep -qi "could not translate host name\|Name or service not known" /tmp/galat.txt; then
              echo "SEBAB: host tak dikenali. Project Supabase CI mungkin sudah dihapus/di-pause,"
              echo "       atau URL-nya salah bentuk."
            elif grep -qi "Tenant or user not found" /tmp/galat.txt; then
              echo "SEBAB: user/tenant tak ada di pooler — username Supabase biasanya"
              echo "       berbentuk 'postgres.<ref-project>'."
            elif grep -qi "server version\|version mismatch" /tmp/galat.txt; then
              echo "SEBAB: versi pg_dump lebih tua dari server."
            elif grep -qi "timeout\|timed out\|connection refused" /tmp/galat.txt; then
              echo "SEBAB: sambungan ditolak/kehabisan waktu — project mungkin di-PAUSE."
            elif grep -qi "does not exist" /tmp/galat.txt; then
              echo "SEBAB: objek lenyap SAAT dump berjalan — test suite CI membuat/menghapus"
              echo "       schema sementara di database yang sama. Ini balapan, bukan kerusakan."
            else
              echo "SEBAB: tak dikenali. Teks galatnya SENGAJA tidak dicetak —"
              echo "       ia bisa memuat potongan kredensial, dan repo ini publik."
            fi
            # Jaring terakhir: cetak baris pertama dengan SEGALA yang menyerupai
            # URL/host/kredensial disensor lebih dulu. `sed` menyunting isinya,
            # bukan menyaring barisnya — menyaring baris justru berbahaya,
            # karena baris yang TIDAK cocok pola akan lolos utuh.
            #
            # Pola `@` HARUS menerima karakter apa pun sebelum `@` — bukan
            # hanya [A-Za-z0-9._%+-]. Versi pertama saya memakai kelas sempit
            # itu dan GAGAL menyensor justru string yang benar-benar bocor
            # (sandinya mengandung `*`). Diuji ulang terhadap string aslinya.
            sed -E 's#postgres(ql)?://[^ "]*#[URL-DISENSOR]#g; s#[^ "]*@[A-Za-z0-9.-]+#[KREDENSIAL-DISENSOR]#g' \
              /tmp/galat.txt | head -1 || true
            exit 1
          fi
          t1=$(date +%s)
          echo "DETIK_DUMP=$((t1-t0))" >> $GITHUB_ENV
          echo "MB=$(du -m cadangan/drill.dump | cut -f1)" >> $GITHUB_ENV
          echo "::notice::dump $((t1-t0))s, $(du -h cadangan/drill.dump | cut -f1)"

          # ── Rekam angka sumber SEKARANG, selagi dekat dengan saat dump ────
          #
          # Database CI dipakai bersama test suite yang terus menulis. Kalau
          # angka ini dihitung nanti (saat pembandingan), ia menggambarkan
          # keadaan yang BERBEDA dari isi dump — dan drill merah tanpa ada yang
          # rusak. Merekamnya di sini membuat pembandingan mengadu dua hal yang
          # memang sezaman.
          psql "$URL_AMAN" -tAc "SELECT count(*) FROM information_schema.tables
            WHERE table_schema='public' AND table_type='BASE TABLE'" 2>/dev/null \
            | tr -d '[:space:]' > /tmp/sumber-tabel.txt
          psql "$URL_AMAN" -tAc "SELECT count(*) FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity" 2>/dev/null \
            | tr -d '[:space:]' > /tmp/sumber-rls.txt
          psql "$URL_AMAN" -tAc "SELECT count(*) FROM pg_policies
            WHERE schemaname='public'" 2>/dev/null \
            | tr -d '[:space:]' > /tmp/sumber-policy.txt
          echo "sumber saat dump — tabel:$(cat /tmp/sumber-tabel.txt)" \
               "RLS:$(cat /tmp/sumber-rls.txt) policy:$(cat /tmp/sumber-policy.txt)"

          # ── Jumlah baris dihitung DARI DUMP, bukan dari database ──────────
          #
          # Percobaan sebelumnya merekam angka lewat kueri SETELAH pg_dump
          # selesai. Masih salah: dump berjalan 65 detik, dan test suite terus
          # menulis sepanjang itu. Hasilnya selisih 1–3 baris dengan gejala
          # khas — target justru LEBIH BANYAK (approval_chains dump=7 target=8).
          #
          # Selama pembandingnya diambil dari database hidup, jaraknya cuma bisa
          # diperkecil, tak pernah dihapus. Satu-satunya angka yang benar-benar
          # sezaman dengan isi dump adalah angka DI DALAM dump.
          #
          # `pg_restore --data-only` ke stdout lalu dihitung per tabel: inilah
          # kebenaran yang beku. Kalau restore kehilangan baris, angka ini dan
          # angka target berbeda — dan itu memang kegagalan yang dicari.
          # `-f -` WAJIB: tanpanya pg_restore memperlakukan argumen sebagai
          # target restore dan TIDAK menulis apa pun ke stdout — itulah kenapa
          # run 30832061986 menghasilkan daftar KOSONG lalu hijau palsu.
          pg_restore --data-only --format=custom -f - cadangan/drill.dump 2>/dev/null \
            | awk '
                # Perbandingan STRING PERSIS untuk penutup COPY, bukan regex:
                # pola /^\\\.$/ harus melewati YAML lalu shell lalu awk, dan di
                # setiap lapis backslash-nya bisa termakan. awk pun
                # memperingatkan "escape sequence \. treated as plain .".
                # `$0 == "\\."` tak punya ambiguitas itu.
                /^COPY /            { t=$2; sub(/^public\./,"",t); c=0; inblk=1; next }
                inblk && $0 == "\\." { print t "|" c; inblk=0; next }
                inblk               { c++ }
              ' | sort > /tmp/hitung-sumber.txt
          echo "tabel terekam dari dump: $(wc -l < /tmp/hitung-sumber.txt)"

          # ── Daftar kosong TIDAK BOLEH lolos sebagai hijau ─────────────────
          #
          # Run 30832061986 berakhir "success" dengan daftar KOSONG: tak ada
          # satu pun tabel yang dibandingkan, jadi tak ada yang bisa gagal.
          # Itu bentuk kegagalan paling berbahaya di seluruh drill ini — ia
          # terlihat persis seperti keberhasilan.
          #
          # Penjaga ini membuat "tak ada yang diperiksa" menjadi MERAH.
          if [ ! -s /tmp/hitung-sumber.txt ]; then
            echo "::error::gagal membaca jumlah baris dari dump — perbandingan isi"
            echo "akan KOSONG dan drill akan hijau tanpa memeriksa apa pun."
            echo "── 25 baris pertama keluaran --data-only (untuk diagnosis) ──"
            pg_restore --data-only --format=custom -f - cadangan/drill.dump 2>&1 \
              | head -25 | cut -c1-120
            exit 1
          fi

      # Dump yang "berhasil" tapi kosong adalah jebakan paling halus: ia lolos
      # setiap pemeriksaan yang hanya melihat kode keluar.
      - name: Buktikan dump berisi
        run: |
          N=$(pg_restore --list cadangan/drill.dump | grep -c "TABLE DATA" || true)
          echo "TABLE DATA dalam dump: $N"
          [ "$N" -gt 0 ] || { echo "::error::dump TIDAK berisi satu pun tabel data"; exit 1; }

      # ── Peran Supabase harus ADA sebelum restore ─────────────────────────
      #
      # 28 dari 377 policy terikat ke peran `authenticated` (dan kerabatnya
      # anon/service_role). Peran itu bikinan Supabase — di postgres:17 polos
      # ia TIDAK ADA, jadi `pg_restore` MELEWATI policy-nya diam-diam.
      #
      # Akibatnya drill melaporkan "POLICY TIDAK ikut pulih — isolasi tenant
      # hilang" (377 vs 349) padahal cadangannya baik-baik saja. Yang kurang
      # adalah PERANNYA di target, bukan policy-nya di dump.
      #
      # Ini bukan kelonggaran: kalau peran ini tak dibuat, drill akan selamanya
      # merah karena alasan yang salah — dan alarm yang selalu berbunyi adalah
      # alarm yang berhenti didengar. Yang benar-benar dijaga (jumlah policy
      # sumber vs target) TIDAK diubah sedikit pun.
      #
      # Di Supabase sungguhan peran ini disediakan platform, jadi memulihkan ke
      # project Supabase baru tak memerlukan langkah ini.
      - name: Siapkan peran Supabase di target
        run: |
          psql "postgresql://postgres:drill@localhost:5433/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          -- ── Schema `extensions` — TANPA INI RESTORE RUNTUH BERANTAI ──────
          --
          -- Banyak tabel memakai `extensions.uuid_generate_v4()` sebagai DEFAULT.
          -- Schema `extensions` disediakan platform Supabase; di postgres:17
          -- polos ia tak ada, jadi SETIAP tabel yang memakainya gagal dibuat —
          -- lalu setiap policy, comment, dan FK yang mengacu ke tabel itu ikut
          -- gagal. Run 30830650218: 753 galat, 124 tabel jadi 98.
          --
          -- Tiga galat terakhir menunjuk "relation … does not exist" (gejala).
          -- Galat PERTAMA-lah yang menunjuk sebab: schema "extensions" does not
          -- exist. Itulah kenapa memotong keluaran diagnostik di ujung yang
          -- salah menyesatkan diagnosis selama dua putaran.
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp"  WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto     WITH SCHEMA extensions;
          -- btree_gist: dibutuhkan constraint EXCLUDE `no_overlap_financial_config`.
          -- Tanpanya: "data type uuid has no default operator class for access
          -- method gist" — constraint anti-tumpang-tindih tak terbentuk, dan itu
          -- justru penjaga yang mencegah dua konfigurasi finansial berlaku
          -- bersamaan. Dipasang di `public` supaya operator class-nya terjangkau
          -- definisi constraint apa adanya dari dump.
          CREATE EXTENSION IF NOT EXISTS btree_gist;

          -- ── Schema `auth` — 21 policy tak bisa dibuat tanpanya ───────────
          --
          -- Diukur di DB dev: PERSIS 21 policy menyebut `auth.role()`, dan run
          -- 30830991287 melaporkan PERSIS 21 galat `schema "auth" does not
          -- exist` serta selisih policy 377 vs 356. Ketiga angka itu cocok.
          --
          -- Yang dibutuhkan hanya SATU fungsi. Shim-nya sengaja seminimal
          -- mungkin: ia cukup membuat policy BISA DIBUAT, sehingga jumlahnya
          -- bisa dibandingkan. Ia TIDAK dipakai untuk menguji perilaku
          -- otorisasi — itu tugas test suite terhadap Supabase sungguhan,
          -- bukan tugas drill pemulihan.
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
            LANGUAGE sql STABLE AS $fn$
              SELECT COALESCE(
                NULLIF(current_setting('request.jwt.claim.role', true), ''),
                'authenticated')
            $fn$;

          DO $$
          BEGIN
            -- NOLOGIN: peran ini hanya perlu ADA agar policy bisa menyebutnya.
            -- Memberinya kemampuan login di lingkungan uji tak ada gunanya dan
            -- hanya menambah permukaan.
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN
              CREATE ROLE anon NOLOGIN NOINHERIT;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN
              CREATE ROLE authenticated NOLOGIN NOINHERIT;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN
              CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
            END IF;
          END $$;
          SQL
          echo "✅ anon / authenticated / service_role tersedia"

      - name: PULIHKAN ke target sekali-pakai
        run: |
          t0=$(date +%s)
          # ── Kenapa --exit-on-error TIDAK dipakai, tapi galatnya DIRINGKAS ──
          #
          # pg_restore wajar keluar non-nol untuk galat yang benar-benar bisa
          # diabaikan. Yang menentukan tetap apakah DATANYA sampai (langkah
          # berikutnya) — bukan kode keluarnya.
          #
          # Tetapi versi pertama saya memipa ke `tail -20`, dan itu MEMBUTAKAN:
          # run 30830152113 menghasilkan 753 galat, dan saya hanya melihat tiga
          # yang terakhir. Tiga baris itu menunjuk gejala (policy gagal karena
          # tabelnya tak ada), bukan sebab (kenapa tabelnya tak ada).
          #
          # Sekarang galat DIRINGKAS PER KELAS dan yang PERTAMA ditampilkan —
          # yang pertama hampir selalu penyebab, sisanya akibat berantai.
          pg_restore --no-owner --no-privileges \
            --dbname "postgresql://postgres:drill@localhost:5433/postgres" \
            cadangan/drill.dump >/tmp/restore.log 2>&1 || true
          t1=$(date +%s)
          echo "DETIK_RESTORE=$((t1-t0))" >> $GITHUB_ENV
          echo "::notice::restore $((t1-t0))s"

          N=$(grep -c "^pg_restore: error" /tmp/restore.log || true)
          echo "galat pg_restore: ${N:-0}"
          if [ "${N:-0}" -gt 0 ]; then
            echo "── 5 galat PERTAMA (biasanya penyebabnya) ──"
            # `head` lebih dulu, baru `grep`: memipa grep KE head membuat grep
            # mati dengan "Broken pipe" begitu head cukup, dan pesan itu
            # menyusup ke keluaran diagnostik.
            head -400 /tmp/restore.log | grep -A1 "^pg_restore: error" | head -15
            echo "── ringkasan per kelas ──"
            grep -oiE "ERROR:  [a-z ]+" /tmp/restore.log | sort | uniq -c | sort -rn | head -8
          fi

      - name: Bandingkan target dengan sumber
        env:
          TARGET: postgresql://postgres:drill@localhost:5433/postgres
        run: |
          set -e
          # $URL_AMAN datang dari $GITHUB_ENV (langkah "Susun URL aman"), jadi
          # ia sudah jadi variabel lingkungan di shell ini. Dipakai lewat shell,
          # BUKAN lewat ekspresi env context: ekspresi itu dievaluasi sebelum
          # langkah berjalan dan tak melihat nilai yang ditulis langkah
          # sebelumnya.
          # $SUMBER tak lagi dipakai untuk menghitung apa pun — seluruh angka
          # sumber datang dari rekaman saat dump. Dibiarkan hanya supaya helper
          # q() tetap punya bentuk yang sama untuk keduanya bila kelak perlu.
          SUMBER="$URL_AMAN"
          # stderr dibungkam untuk kueri terhadap SUMBER; kegagalannya terlihat
          # dari hasil kosong, yang tetap membuat perbandingan di bawah merah.
          q() { psql "$1" -tAc "$2" 2>/dev/null | tr -d '[:space:]'; }

          Q_TABEL="SELECT count(*) FROM information_schema.tables
                    WHERE table_schema='public' AND table_type='BASE TABLE'"
          Q_RLS="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                  WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity"
          Q_POL="SELECT count(*) FROM pg_policies WHERE schemaname='public'"

          # Angka SUMBER direkam tepat sebelum dump (berkas /tmp/sumber-*.txt),
          # bukan dihitung ulang sekarang — database CI terus berubah karena
          # test suite berjalan bersamaan, dan membandingkan dua saat yang
          # berbeda menghasilkan alarm palsu.
          TS=$(cat /tmp/sumber-tabel.txt); TT=$(q "$TARGET" "$Q_TABEL")
          RS=$(cat /tmp/sumber-rls.txt);   RT=$(q "$TARGET" "$Q_RLS")
          PS=$(cat /tmp/sumber-policy.txt); PT=$(q "$TARGET" "$Q_POL")

          echo "tabel   sumber=$TS target=$TT"
          echo "RLS     sumber=$RS target=$RT"
          echo "policy  sumber=$PS target=$PT"

          GAGAL=0
          [ "$TS" = "$TT" ] || { echo "::error::jumlah tabel BEDA — struktur tak pulih utuh"; GAGAL=1; }
          # RLS/policy adalah pemeriksaan TERPENTING: data tanpa isolasi bukan
          # pemulihan, melainkan kebocoran lintas-tenant.
          [ "$RS" = "$RT" ] || { echo "::error::RLS TIDAK ikut pulih — isolasi tenant hilang"; GAGAL=1; }
          [ "$PS" = "$PT" ] || { echo "::error::POLICY TIDAK ikut pulih — isolasi tenant hilang"; GAGAL=1; }

          # ── Isi per tabel — HITUNGAN NYATA, bukan perkiraan ───────────────
          #
          # Versi pertama memakai `reltuples`, dan itu SALAH: reltuples hanya
          # perkiraan statistik yang mutakhir sejauh ANALYZE terakhir. Sumber
          # melaporkan goods_receipts≈4 dan financial_config≈8, padahal isi
          # sebenarnya 2 dan 14 — jadi drill membandingkan tebakan BASI di
          # sumber dengan angka SEGAR di target, lalu berteriak "isi tak cocok"
          # atas selisih yang tak pernah ada.
          #
          # Toleransi 5% pun tak menolong; ia hanya menyamarkan sebagian dan
          # membuat sisanya makin sulit dipercaya. Untuk pertanyaan "apakah
          # datanya sampai", satu-satunya jawaban yang sah adalah COUNT(*).
          #
          # Lebih lambat, dan itu harga yang benar: drill ini berjalan mingguan,
          # sementara jawabannya menentukan apakah cadangan bisa dipercaya.
          # ── Sumber kebenaran adalah DUMP, bukan database hidup ────────────
          #
          # Versi sebelumnya menghitung ulang baris di SUMBER saat pembandingan.
          # Itu salah secara mendasar: database CI dipakai bersama test suite,
          # yang terus menulis. Dump diambil 16:11, perbandingan 16:12 — dan
          # sumbernya sudah bergerak.
          #
          # Gejalanya khas dan seharusnya langsung mencurigakan: TARGET punya
          # LEBIH BANYAK baris daripada sumber (assemblies 0→2, clients 2→5).
          # Restore tak bisa mengarang data. Yang berubah adalah sumbernya.
          #
          # Yang benar-benar ingin dijawab drill ini adalah: "apakah isi DUMP
          # sampai utuh ke target?" — bukan "apakah target sama dengan database
          # yang sedang berubah". Maka pembandingnya diambil dari dump itu
          # sendiri, yang sifatnya beku.
          #
          # Ini BUKAN pelonggaran: kalau restore kehilangan baris, angka dump
          # dan angka target tetap berbeda dan drill tetap merah.
          # ⚠️ `pg_restore --list` mencatat entri TABLE DATA bahkan untuk tabel
          # yang isinya NOL BARIS. Versi sebelumnya menganggap setiap entri itu
          # "punya data", lalu berteriak "target KOSONG" untuk tabel yang di
          # sumbernya memang kosong (assets, bids, asset_movements semuanya 0
          # baris di dev). Alarm palsu buatan sendiri.
          #
          # Yang benar: bandingkan JUMLAHNYA. Angka sumber diambil dari rekaman
          # saat dump (/tmp/hitung-sumber.txt) supaya tak terpengaruh test suite
          # yang menulis bersamaan.
          # Lapis kedua: kalau berkas hitungan hilang/kosong sampai di sini,
          # perbandingan isi tak memeriksa apa pun. Hijau tanpa pemeriksaan
          # lebih buruk daripada merah.
          N_TABEL=$(wc -l < /tmp/hitung-sumber.txt 2>/dev/null || echo 0)
          echo "membandingkan isi $N_TABEL tabel"
          if [ "$N_TABEL" -lt 1 ]; then
            echo "::error::nol tabel dibandingkan — drill tak membuktikan apa pun"
            GAGAL=1
          fi

          BEDA=$(while IFS='|' read -r t s; do
            [ -z "$t" ] && continue
            g=$(psql "$TARGET" -tAc "SELECT count(*) FROM \"$t\"" 2>/dev/null | tr -d '[:space:]')
            if [ -z "$g" ]; then
              echo "$t: TABEL TIDAK ADA di target"
            elif [ "$s" != "$g" ]; then
              echo "$t: dump=$s target=$g"
            fi
          done < /tmp/hitung-sumber.txt)
          if [ -n "$BEDA" ]; then echo "::error::isi tak sampai:"; echo "$BEDA"; GAGAL=1; fi

          # ── Tabel yang FK-nya ditolak WAJIB diperiksa terang-terangan ─────
          #
          # Run 30832428831 hijau, tetapi restore mencatat 5 pelanggaran FK
          # pada tabel INTI (projects, scenarios, lesson_propagation_proposals).
          # Hijau + pelanggaran FK adalah kombinasi yang harus dicurigai:
          # entah barisnya memang tak hilang, entah perbandingan isi punya
          # lubang. Menebak di antara keduanya tidak sah.
          #
          # Angkanya dicetak apa adanya supaya bisa dibaca manusia, bukan
          # disimpulkan diam-diam.
          echo "── tabel dengan pelanggaran FK saat restore ──"
          for t in projects scenarios lesson_propagation_proposals; do
            s=$(grep "^$t|" /tmp/hitung-sumber.txt | cut -d'|' -f2)
            g=$(psql "$TARGET" -tAc "SELECT count(*) FROM \"$t\"" 2>/dev/null | tr -d '[:space:]')
            echo "   $t: dump=${s:-?} target=${g:-?}"
          done

          {
            echo "## Uji pemulihan — $(date -u +%FT%TZ)"
            echo ""
            echo "| | sumber | target |"
            echo "|---|---|---|"
            echo "| tabel | $TS | $TT |"
            echo "| RLS | $RS | $RT |"
            echo "| policy | $PS | $PT |"
            echo ""
            echo "**Waktu** — dump ${DETIK_DUMP}s · restore ${DETIK_RESTORE}s · ukuran ${MB} MB"
            echo ""
            echo "RTO terukur: **$((DETIK_DUMP + DETIK_RESTORE)) detik** untuk siklus penuh."
            [ "$GAGAL" = 0 ] && echo "" && echo "✅ PEMULIHAN TERBUKTI" || echo "" && echo "❌ PEMULIHAN GAGAL"
          } >> $GITHUB_STEP_SUMMARY

          exit $GAGAL

      - name: Simpan bukti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-uji-pemulihan
          # Dump-nya sendiri TIDAK diunggah — ia berisi seluruh isi basis data,
          # dan artifact GitHub bisa diunduh siapa pun yang punya akses repo.
          path: cadangan/*.txt
          retention-days: 30
          if-no-files-found: ignore
