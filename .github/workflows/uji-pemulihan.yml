name: Uji Pemulihan (DR drill)

# ============================================================================
# F1-4 — BUKTI bahwa database ini BISA DIPULIHKAN, bukan janji bahwa ia
#        ter-backup.
#
# ══════════════════════════════════════════════════════════════════════════
# KENAPA DI CI, DAN KENAPA TERJADWAL
# ══════════════════════════════════════════════════════════════════════════
#
# "Backup berhasil dibuat" bukan jaminan apa pun. Berkas bisa terbentuk,
# berukuran wajar, dan tetap tak bisa dipulihkan. Satu-satunya bukti bahwa
# cadangan berguna adalah cadangan itu PERNAH DIPULIHKAN.
#
# Terjadwal, karena latihan pemulihan yang dijalankan sekali lalu ditulis di
# dokumen akan membusuk diam-diam: skema berubah, ekstensi ditambah, versi
# server naik. Yang dulu berhasil belum tentu masih berhasil, dan tak ada yang
# akan tahu sampai hari yang paling buruk.
#
# Runner `ubuntu-latest` dipakai karena ia sudah membawa perkakas klien
# Postgres dan bisa menjalankan service container — sementara mesin pengembang
# belum tentu punya keduanya (mesin tempat ini ditulis: tanpa hak admin, WSL
# tanpa distro, jadi Docker tak bisa hidup).
#
# ── Yang diuji: DATABASE CI, bukan produksi
#
# `CI_DIRECT_URL`, bukan `DIRECT_URL`. Latihan pemulihan tak boleh memberi
# alasan apa pun untuk mengarahkan perkakas ke basis data yang berisi data
# pelanggan. pg_dump memang hanya membaca — tetapi kebiasaan menunjuk produksi
# dalam latihan adalah bagaimana kecelakaan lahir.
#
# ── Yang dibuktikan, dan kenapa itu yang dipilih
#
#   1. Jumlah TABEL cocok        — struktur sampai
#   2. Jumlah BARIS cocok        — isinya sampai, bukan cuma kerangkanya
#   3. RLS + POLICY ikut pulih   — TERPENTING. Memulihkan data tanpa RLS di
#      sistem multi-tenant bukan pemulihan, melainkan KEBOCORAN: tenant saling
#      melihat data, dan semua pemeriksaan jumlah baris di atas tetap hijau.
#   4. WAKTU tiap tahap tercatat — F1-4 mensyaratkannya, dan angka itu yang
#      menentukan janji RTO yang jujur.
# ============================================================================

on:
  schedule:
    # Setiap Senin 02:00 UTC (09:00 WIB). Mingguan, bukan harian: latihan ini
    # menyalin seluruh basis data, dan lebih sering tak menambah keyakinan.
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: uji-pemulihan
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Target sekali-pakai. Ia mati bersama job — tak punya nilai yang bisa
      # hilang, dan tak bisa jadi target yang salah.
      target:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # pg_dump HARUS >= versi server. Klien yang lebih tua bisa kehilangan
      # objek yang belum dikenalinya — kerusakan yang baru ketahuan saat
      # restore, yaitu saat paling gawat.
      - name: Pasang klien Postgres 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # ── PATH TIDAK CUKUP ────────────────────────────────────────────
          #
          # Runner ubuntu-latest SUDAH membawa postgresql-client-16, dan
          # /usr/bin/pg_dump menang atas /usr/lib/postgresql/17/bin/pg_dump.
          # Jadi `postgresql-client-17` terpasang dengan sukses, tetapi
          # `pg_dump` yang benar-benar berjalan tetap 16 — dan gagal dengan
          # "aborting because of server version mismatch" terhadap server 17.
          #
          # Terjadi sungguhan (run 30829393757): log menunjukkan
          # "Setting up postgresql-client-17" DAN "pg_dump (PostgreSQL) 16.14"
          # berjarak tiga detik. Memasang bukan berarti memakai.
          echo "PATH=/usr/lib/postgresql/17/bin:$PATH" >> $GITHUB_ENV

          # Buktikan sekarang, bukan tiga langkah lagi. Kegagalan versi yang
          # muncul saat dump membuat orang mencurigai kredensial lebih dulu —
          # itulah yang terjadi pada saya.
          V=$(/usr/lib/postgresql/17/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "versi yang AKAN dipakai: $V"
          [ "$V" -ge 17 ] || { echo "::error::pg_dump $V < 17 — dump bisa kehilangan objek"; exit 1; }

      # ── Sandi bersimbol WAJIB di-encode ──────────────────────────────────
      #
      # Insiden 2026-08-03: `@` di dalam sandi memisahkan URL di tempat yang
      # salah — `pg_dump` mengira nama servernya adalah "…sandi…@aws-0-…" dan
      # gagal dengan "could not translate host name".
      #
      # Yang membuatnya BERBAHAYA, bukan sekadar merepotkan: pesan galat itu
      # MENCETAK potongan sandi ke log. GitHub me-mask nilai secret yang PERSIS
      # sama, tetapi potongan hasil parsing yang keliru bukan nilai yang sama —
      # jadi lolos dari mask. Di repo publik, itu kredensial yang terbit.
      #
      # Karena itu langkah ini:
      #   • menyusun ulang URL dengan bagian sandi ter-encode
      #   • MEMBUNGKAM stderr pg_dump (2>/dev/null) — galat koneksi apa pun
      #     berpotensi memuat potongan URL. Yang dilaporkan hanya kode keluar.
      #
      # Membungkam stderr biasanya praktik buruk. Di sini kebalikannya: yang
      # hilang cuma teks galat yang bisa didiagnosis ulang dari kode keluar,
      # sedangkan yang dicegah adalah kebocoran permanen di repo publik.
      - name: Susun URL aman (sandi ter-encode)
        env:
          SUMBER: ${{ secrets.CI_DIRECT_URL }}
        run: |
          if [ -z "$SUMBER" ]; then
            echo "::error::Secret CI_DIRECT_URL kosong."; exit 1
          fi
          AMAN=$(SUMBER="$SUMBER" node -e '
            const u = process.env.SUMBER;
            const m = u.match(/^(postgres(?:ql)?:\/\/)([^:]+):(.*)@([^@]+)$/);
            if (!m) { console.error("format URL tak dikenali"); process.exit(1); }
            const [, skema, user, sandi, sisa] = m;
            // encodeURIComponent menutup @ : / ? # dan kawan-kawan.
            process.stdout.write(skema + encodeURIComponent(user) + ":" +
                                 encodeURIComponent(sandi) + "@" + sisa);
          ')
          # ::add-mask:: mendaftarkan nilai ini agar ikut disensor kalau
          # sampai tercetak — lapis kedua di belakang pembungkaman stderr.
          echo "::add-mask::$AMAN"
          echo "URL_AMAN=$AMAN" >> $GITHUB_ENV
          echo "✅ URL disusun ulang dengan sandi ter-encode"

          # ── Diagnostik yang AMAN ────────────────────────────────────────
          #
          # Membungkam stderr menutup kebocoran, tetapi juga menutup mata:
          # run pertama setelah perbaikan gagal tanpa satu pun petunjuk.
          # Yang dicetak di sini hanya BENTUK sambungan — host, port, nama
          # basis data — tanpa user maupun sandi. Ketiganya bukan rahasia
          # (host Supabase bisa ditebak dari region), tetapi hampir selalu
          # cukup untuk menjelaskan kenapa sambungan gagal.
          AMAN="$AMAN" node -e '
            const p = new URL(process.env.AMAN);
            console.log("   host :", p.hostname);
            console.log("   port :", p.port || "(bawaan 5432)");
            console.log("   db   :", p.pathname.slice(1) || "(kosong)");
            if (p.port === "6543") {
              console.log("   ::warning::port 6543 = pooler. pg_dump butuh 5432 (direct).");
            }
          '
          # Bisakah host-nya di-resolve sama sekali?
          HOST=$(AMAN="$AMAN" node -e 'process.stdout.write(new URL(process.env.AMAN).hostname)')
          if getent hosts "$HOST" >/dev/null 2>&1; then
            echo "   DNS  : ✅ terpecahkan"
          else
            echo "   DNS  : ❌ TIDAK terpecahkan — host salah atau project Supabase sudah tak ada"
          fi

      - name: Cadangkan (READ-ONLY terhadap sumber)
        run: |
          mkdir -p cadangan
          t0=$(date +%s)
          # stderr ditangkap ke berkas, TIDAK dicetak. Yang dilaporkan hanya
          # KELAS galatnya lewat pencocokan pola — cukup untuk mendiagnosis,
          # tanpa pernah menerbitkan teks yang bisa memuat kredensial.
          if ! pg_dump --format=custom --no-owner --no-privileges \
                       --file=cadangan/drill.dump "$URL_AMAN" 2>/tmp/galat.txt; then
            echo "::error::pg_dump gagal."
            if   grep -qi "password authentication failed" /tmp/galat.txt; then
              echo "SEBAB: sandi SALAH. Perbarui secret CI_DIRECT_URL."
            elif grep -qi "could not translate host name\|Name or service not known" /tmp/galat.txt; then
              echo "SEBAB: host tak dikenali. Project Supabase CI mungkin sudah dihapus/di-pause,"
              echo "       atau URL-nya salah bentuk."
            elif grep -qi "Tenant or user not found" /tmp/galat.txt; then
              echo "SEBAB: user/tenant tak ada di pooler — username Supabase biasanya"
              echo "       berbentuk 'postgres.<ref-project>'."
            elif grep -qi "server version\|version mismatch" /tmp/galat.txt; then
              echo "SEBAB: versi pg_dump lebih tua dari server."
            elif grep -qi "timeout\|timed out\|connection refused" /tmp/galat.txt; then
              echo "SEBAB: sambungan ditolak/kehabisan waktu — project mungkin di-PAUSE."
            else
              echo "SEBAB: tak dikenali. Teks galatnya SENGAJA tidak dicetak —"
              echo "       ia bisa memuat potongan kredensial, dan repo ini publik."
            fi
            # Jaring terakhir: cetak baris pertama dengan SEGALA yang menyerupai
            # URL/host/kredensial disensor lebih dulu. `sed` menyunting isinya,
            # bukan menyaring barisnya — menyaring baris justru berbahaya,
            # karena baris yang TIDAK cocok pola akan lolos utuh.
            #
            # Pola `@` HARUS menerima karakter apa pun sebelum `@` — bukan
            # hanya [A-Za-z0-9._%+-]. Versi pertama saya memakai kelas sempit
            # itu dan GAGAL menyensor justru string yang benar-benar bocor
            # (sandinya mengandung `*`). Diuji ulang terhadap string aslinya.
            sed -E 's#postgres(ql)?://[^ "]*#[URL-DISENSOR]#g; s#[^ "]*@[A-Za-z0-9.-]+#[KREDENSIAL-DISENSOR]#g' \
              /tmp/galat.txt | head -1 || true
            exit 1
          fi
          t1=$(date +%s)
          echo "DETIK_DUMP=$((t1-t0))" >> $GITHUB_ENV
          echo "MB=$(du -m cadangan/drill.dump | cut -f1)" >> $GITHUB_ENV
          echo "::notice::dump $((t1-t0))s, $(du -h cadangan/drill.dump | cut -f1)"

      # Dump yang "berhasil" tapi kosong adalah jebakan paling halus: ia lolos
      # setiap pemeriksaan yang hanya melihat kode keluar.
      - name: Buktikan dump berisi
        run: |
          N=$(pg_restore --list cadangan/drill.dump | grep -c "TABLE DATA" || true)
          echo "TABLE DATA dalam dump: $N"
          [ "$N" -gt 0 ] || { echo "::error::dump TIDAK berisi satu pun tabel data"; exit 1; }

      - name: PULIHKAN ke target sekali-pakai
        run: |
          t0=$(date +%s)
          # pg_restore keluar non-nol untuk galat yang bisa diabaikan (peran
          # yang tak ada di target). Yang menentukan bukan kode keluarnya,
          # melainkan apakah DATANYA sampai — itu diperiksa di langkah berikut.
          pg_restore --no-owner --no-privileges \
            --dbname "postgresql://postgres:drill@localhost:5433/postgres" \
            cadangan/drill.dump 2>&1 | tail -20 || true
          t1=$(date +%s)
          echo "DETIK_RESTORE=$((t1-t0))" >> $GITHUB_ENV
          echo "::notice::restore $((t1-t0))s"

      - name: Bandingkan target dengan sumber
        env:
          TARGET: postgresql://postgres:drill@localhost:5433/postgres
        run: |
          set -e
          # $URL_AMAN datang dari $GITHUB_ENV (langkah "Susun URL aman"), jadi
          # ia sudah jadi variabel lingkungan di shell ini. Dipakai lewat shell,
          # BUKAN lewat ekspresi env context: ekspresi itu dievaluasi sebelum
          # langkah berjalan dan tak melihat nilai yang ditulis langkah
          # sebelumnya.
          SUMBER="$URL_AMAN"
          # stderr dibungkam untuk kueri terhadap SUMBER; kegagalannya terlihat
          # dari hasil kosong, yang tetap membuat perbandingan di bawah merah.
          q() { psql "$1" -tAc "$2" 2>/dev/null | tr -d '[:space:]'; }

          Q_TABEL="SELECT count(*) FROM information_schema.tables
                    WHERE table_schema='public' AND table_type='BASE TABLE'"
          Q_RLS="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                  WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity"
          Q_POL="SELECT count(*) FROM pg_policies WHERE schemaname='public'"

          TS=$(q "$SUMBER" "$Q_TABEL"); TT=$(q "$TARGET" "$Q_TABEL")
          RS=$(q "$SUMBER" "$Q_RLS");   RT=$(q "$TARGET" "$Q_RLS")
          PS=$(q "$SUMBER" "$Q_POL");   PT=$(q "$TARGET" "$Q_POL")

          echo "tabel   sumber=$TS target=$TT"
          echo "RLS     sumber=$RS target=$RT"
          echo "policy  sumber=$PS target=$PT"

          GAGAL=0
          [ "$TS" = "$TT" ] || { echo "::error::jumlah tabel BEDA — struktur tak pulih utuh"; GAGAL=1; }
          # RLS/policy adalah pemeriksaan TERPENTING: data tanpa isolasi bukan
          # pemulihan, melainkan kebocoran lintas-tenant.
          [ "$RS" = "$RT" ] || { echo "::error::RLS TIDAK ikut pulih — isolasi tenant hilang"; GAGAL=1; }
          [ "$PS" = "$PT" ] || { echo "::error::POLICY TIDAK ikut pulih — isolasi tenant hilang"; GAGAL=1; }

          # Isi per tabel — pembeda "restore sungguhan" dari "skema kosong".
          psql "$TARGET" -q -c "ANALYZE" >/dev/null
          BEDA=$(psql "$SUMBER" -tAF'|' -c "
            SELECT c.relname, c.reltuples::bigint FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relkind='r' AND c.reltuples > 0" |
          while IFS='|' read -r t n; do
            g=$(psql "$TARGET" -tAc "SELECT COALESCE((SELECT reltuples::bigint FROM pg_class c
                  JOIN pg_namespace ns ON ns.oid=c.relnamespace
                 WHERE ns.nspname='public' AND c.relname='$t'), -1)" | tr -d '[:space:]')
            # reltuples adalah PERKIRAAN; toleransi 5% mencegah alarm palsu
            # tanpa menyembunyikan tabel yang benar-benar kosong di target.
            awk -v s="$n" -v g="$g" -v t="$t" \
              'BEGIN{ d=(g>s?g-s:s-g); tol=(s*0.05<1?1:s*0.05); if(g<0||d>tol) print t": sumber≈"s" target≈"g }'
          done)
          if [ -n "$BEDA" ]; then echo "::error::isi tak cocok:"; echo "$BEDA"; GAGAL=1; fi

          {
            echo "## Uji pemulihan — $(date -u +%FT%TZ)"
            echo ""
            echo "| | sumber | target |"
            echo "|---|---|---|"
            echo "| tabel | $TS | $TT |"
            echo "| RLS | $RS | $RT |"
            echo "| policy | $PS | $PT |"
            echo ""
            echo "**Waktu** — dump ${DETIK_DUMP}s · restore ${DETIK_RESTORE}s · ukuran ${MB} MB"
            echo ""
            echo "RTO terukur: **$((DETIK_DUMP + DETIK_RESTORE)) detik** untuk siklus penuh."
            [ "$GAGAL" = 0 ] && echo "" && echo "✅ PEMULIHAN TERBUKTI" || echo "" && echo "❌ PEMULIHAN GAGAL"
          } >> $GITHUB_STEP_SUMMARY

          exit $GAGAL

      - name: Simpan bukti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-uji-pemulihan
          # Dump-nya sendiri TIDAK diunggah — ia berisi seluruh isi basis data,
          # dan artifact GitHub bisa diunduh siapa pun yang punya akses repo.
          path: cadangan/*.txt
          retention-days: 30
          if-no-files-found: ignore
