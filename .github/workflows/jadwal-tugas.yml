name: Pemicu Jadwal Tugas

# Menggantikan manusia yang selama ini harus menekan tombol di /sistem.
#
# Sebelum ini, notifikasi tenggat & milestone TIDAK PERNAH TERBIT kecuali ada
# yang membukanya dan mengklik. Itu menjelaskan kenapa banyak fitur terasa
# "ada tapi tidak hidup".
#
# ── Kenapa tiap 15 menit, bukan sekali sehari pukul 07:00
#
# Server memutuskan sendiri tugas mana yang jatuh tempo (`lib/jadwal.ts`),
# jadi cron ini cukup jadi DENYUT — bukan jadwalnya sendiri. Jadwal sungguhan
# hidup di basis data, satu tempat, bisa diubah dari UI tanpa menyentuh
# berkas ini.
#
# Kalau cron ini dipasang pukul 07:00 persis, maka jadwal apa pun yang
# founder setel di jam lain tak akan pernah berjalan — dan tak ada yang
# memberi tahu. Denyut 15 menit membuat jam berapa pun bisa dipilih.
#
# ── Kenapa tak apa-apa dipanggil sesering itu
#
# Aturan pemicunya "sudah lewat jamnya DAN belum jalan di periode ini".
# Panggilan kedua di periode yang sama dijawab `dilewati:
# sudah-jalan-periode-ini` — diverifikasi langsung pada sistem nyata, bukan
# diasumsikan.
#
# ── Rahasia yang dibutuhkan
#
#   SCHEDULER_URL      https://<api>/api/v1/jadwal/jalankan
#   SCHEDULER_SECRET   sama dengan yang di apps/api/.env
#
# Selama keduanya belum disetel, langkahnya DILEWATI dengan pesan jelas —
# bukan gagal merah tiap 15 menit, yang akan melatih orang mengabaikan
# notifikasi CI.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # Denyut yang menumpuk lebih buruk daripada denyut yang terlewat: dua
  # pemicu bersamaan sama-sama membaca jadwal yang sama. Klaim atomik di
  # endpoint sudah menutupnya, tapi tak perlu diuji tiap seperempat jam.
  group: jadwal-tugas
  cancel-in-progress: false

jobs:
  picu:
    runs-on: ubuntu-latest
    steps:
      - name: Picu jadwal
        env:
          URL:     ${{ secrets.SCHEDULER_URL }}
          RAHASIA: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$RAHASIA" ]; then
            # ⚠ `::warning::`, BUKAN `::notice::` — dan bedanya bukan gaya.
            #
            # Versi pertama memakai `::notice::`, yang TIDAK muncul di ringkasan
            # run. Akibatnya diukur 2026-08-20: 72 tugas terjadwal berstatus
            # aktif di basis, `SCHEDULER_URL` tak pernah disetel, dan tak satu
            # pun tugas pernah dipanggil — berhari-hari, dengan status HIJAU
            # dan nol gejala.
            #
            # Niat aslinya benar: gagal MERAH tiap 15 menit akan melatih orang
            # mengabaikan notifikasi CI, jadi `exit 0` tetap dipertahankan.
            # Yang salah cuma tingkat anotasinya — warning terlihat di
            # ringkasan tanpa menandai run-nya gagal.
            #
            # Dijaga `apps/api/scripts/audit-penjadwal-hidup.mjs` (ambang NOL).
            echo "::warning::PENJADWAL MATI — SCHEDULER_URL / SCHEDULER_SECRET belum disetel. Seluruh tugas terjadwal TIDAK berjalan."
            echo "Setel keduanya di Settings → Secrets → Actions untuk menghidupkan penjadwal."
            echo "Lihat docs/execution/SIAP-DEPLOY.md."
            exit 0
          fi

          # `--fail-with-body` supaya badan respons ikut tercetak saat gagal —
          # tanpa itu, kegagalan hanya terlihat sebagai kode keluar.
          kode=$(curl -sS --fail-with-body -o hasil.json -w '%{http_code}' \
                  -X POST "$URL" \
                  -H "x-scheduler-secret: $RAHASIA" \
                  -H 'content-type: application/json' \
                  -d '{}' \
                  --max-time 300) || {
            echo "::error::Pemicu jadwal gagal (HTTP $kode)"
            cat hasil.json 2>/dev/null || true
            exit 1
          }

          cat hasil.json
          echo ""

          # Ringkasan dibaca dari responsnya sendiri, bukan dari kode HTTP:
          # endpoint membalas 200 walau sebagian tugas gagal — karena itu
          # memang informasi, bukan kegagalan permintaan.
          gagal=$(node -e "const h=require('./hasil.json'); console.log(h.gagal ?? 0)")
          if [ "$gagal" != "0" ]; then
            echo "::warning::$gagal tugas terjadwal GAGAL — periksa terakhir_galat di tabel jadwal_tugas"
          fi

          # TUGAS TAK DIKENAL — celah yang ditemukan 2026-08-30 pada jalan
          # pertama sesudah SCHEDULER_URL dipasang:
          #
          #   diperiksa 117 · sukses 0 · gagal 0 · dilewati 114
          #
          # 117 ≠ 0 + 0 + 114. Tiga baris `bersih-notifikasi` berstatus
          # `tak-dikenal` — migrasinya sudah jalan, kodenya belum ter-deploy.
          #
          # Tanpa pemeriksaan ini, tugas semacam itu DIAM SELAMANYA dengan
          # ringkasan yang terlihat sehat dan CI hijau.
          tak=$(node -e "const h=require('./hasil.json'); console.log(h.tak_dikenal ?? 0)")
          if [ "$tak" != "0" ]; then
            echo "::warning::$tak tugas TAK DIKENAL — rutenya belum ter-deploy, atau namanya salah ketik. Tugas ini tak akan pernah berjalan."
            node -e "const h=require('./hasil.json');
              const t=[...new Set((h.hasil??[]).filter(x=>x.status==='tak-dikenal').map(x=>x.tugas))];
              console.log('Tugas tak dikenal: ' + t.join(', '))"
          fi

          # GAGAL KLAIM — ditemukan test invarian pada hari yang sama, dan
          # sudah diam JAUH lebih lama daripada `tak-dikenal`.
          #
          # Artinya penanda `terakhir_jalan` gagal ditulis ke basis. Tugasnya
          # mungkin sudah berjalan, tetapi jejaknya tak tersimpan — jadi ia
          # akan berjalan LAGI pada denyut berikutnya. Untuk yang mengirim
          # notifikasi itu berarti pesan ganda; untuk yang menulis data,
          # pekerjaan ganda.
          klaim=$(node -e "const h=require('./hasil.json'); console.log(h.gagal_klaim ?? 0)")
          if [ "$klaim" != "0" ]; then
            echo "::warning::$klaim tugas GAGAL DIKLAIM — penanda terakhir_jalan tak tersimpan; tugas akan berjalan lagi pada denyut berikutnya"
          fi

          # ⚠ Penjumlahan WAJIB utuh. Kalau nanti ada status BARU yang tak
          # masuk ringkasan, ia akan hilang persis seperti `tak-dikenal` dan
          # `gagal-klaim` sebelum hari ini — dan kali ini kita akan tahu.
          #
          # Dijaga juga dari sisi kode oleh
          # `apps/api/src/lib/__tests__/jadwal-ringkas.test.ts`, yang menuntut
          # tiap status yang di-push punya pencacahnya. Dua lapis, karena yang
          # satu memeriksa BENTUK kode dan yang satu memeriksa JAWABAN nyata.
          node -e "const h=require('./hasil.json');
            const jml=(h.sukses??0)+(h.gagal??0)+(h.dilewati??0)+(h.tak_dikenal??0)+(h.gagal_klaim??0);
            if (jml !== (h.diperiksa??0)) {
              console.log('::warning::Ringkasan TIDAK UTUH: diperiksa=' + h.diperiksa +
                ' tetapi jumlah seluruh status=' + jml +
                ' — ada status yang tak terhitung di mana pun.');
            }"
