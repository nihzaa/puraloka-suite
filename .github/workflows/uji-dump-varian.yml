name: Uji varian pg_dump (sementara)
on: { workflow_dispatch: }
jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pasang klien 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "PATH=/usr/lib/postgresql/17/bin:$PATH" >> $GITHUB_ENV
      - name: Coba beberapa varian
        env: { U: "${{ secrets.DIRECT_URL }}" }
        run: |
          coba() {
            echo "── $1"
            shift
            if pg_dump --format=custom --no-owner --no-privileges "$@" \
                 --file=/tmp/x.dump "$U" 2>/tmp/e.txt; then
              echo "   ✅ BERHASIL — $(du -h /tmp/x.dump | cut -f1)"
            else
              echo "   ❌ $(grep -oE 'error: .*' /tmp/e.txt | head -1 | cut -c1-90)"
            fi
            rm -f /tmp/x.dump
          }
          coba "A. tanpa filter apa pun"
          coba "B. --schema=public"                --schema=public
          coba "C. --schema=public --no-comments"  --schema=public --no-comments
          coba "D. data saja"                      --schema=public --data-only
          coba "E. schema saja"                    --schema=public --schema-only
