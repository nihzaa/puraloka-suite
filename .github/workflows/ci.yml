name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # Schema test unik per run → tidak ada race antar CI run paralel yang
          # berbagi Supabase dev DB (akar "type user_role already exists").
          TEST_SCHEMA: test_${{ github.run_id }}

      - name: Drop per-run test schema
        if: always()
        run: pnpm exec tsx src/test-utils/drop-test-schema.ts
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          TEST_SCHEMA: test_${{ github.run_id }}

      - name: Build
        run: pnpm build
