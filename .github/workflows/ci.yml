name: CI

# ── PEMICU: SETIAP pull request, bukan hanya yang menargetkan `main` ─────────
#
# Sampai 2026-08-03, `pull_request` disaring `branches: [main]`. Akibatnya SETIAP
# PR bertumpuk (PR yang basenya branch lain, bukan `main`) berjalan **tanpa satu
# pun check**. Ditemukan lewat PR #134 → base `fix/search-proyek-gagal-senyap`:
# nol check berjalan, dan GitHub menampilkannya sebagai "mergeable" tanpa gejala.
#
# Konsekuensinya bukan teoretis: 13 penjaga arsitektural di berkas ini —
# gerbang tenancy, kegagalan senyap, penulisan tanpa periksa, catch senyap,
# migrasi sadar-schema, penomoran migrasi, ratchet coverage — **tidak menjaga
# apa pun** pada rantai PR mana pun yang belum menyentuh `main`. Penjaga yang
# hanya berjalan di satu jenis PR adalah penjaga yang bisa dilewati dengan
# memilih base branch, dan tak seorang pun akan menyadarinya.
#
# `pull_request` tanpa `branches` = berjalan untuk PR ke branch apa pun.
# `push` tetap disaring ke `main` — push ke branch kerja sudah tercakup oleh
# PR-nya sendiri, dan menjalankannya dua kali hanya menggandakan antrean pada
# project Supabase CI yang di-serialkan (lihat `concurrency` di bawah).
on:
  pull_request:
  push:
    branches: [main]

# CI kini memakai project Supabase CI TERPISAH (puraloka-suite-ci) — bukan dev.
# Test handler tetap menulis ke schema `public` project CI (service_role) + RLS-harness
# bypass TEST_SCHEMA, jadi run paralel masih bisa saling menimpa fixture di project CI.
# Serialkan SEMUA run yang berbagi project CI (group konstan). JANGAN cancel-in-progress:
# run yang dibatalkan di tengah bisa meninggalkan residu. Dev TIDAK LAGI disentuh CI.
# ── Concurrency: per-ref, run usang DIBATALKAN ──────────────────────────────
#
# Sebelumnya `group: ci-shared-ci-db` (konstan) + `cancel-in-progress: false`:
# SELURUH run dari branch mana pun antre di satu barisan, dan tak ada yang pernah
# dibatalkan. Push beruntun menumpuk — run ke-3 baru mulai setelah ke-1 dan ke-2
# selesai, padahal hasil keduanya sudah usang. Diukur 2026-08-03: satu run
# tertahan `pending` belasan menit hanya menunggu run lama yang sudah tak relevan.
#
# Itulah sumber keluhan "CI terlalu sering": bukan frekuensinya, melainkan
# antreannya. Kini tiap ref punya barisannya sendiri, dan push baru MEMBATALKAN
# run lama pada ref yang sama.
#
# ── Kenapa ini AMAN terhadap project CI bersama
#
# Kekhawatiran versi lama benar: job `api` menulis ke project Supabase CI, jadi
# dua job yang berjalan bersamaan bisa saling menimpa fixture. Yang dilupakan:
# `TEST_SCHEMA: test_${{ github.run_id }}` (lihat langkah Test) sudah membuat
# TIAP RUN memakai schema-nya sendiri. Isolasinya ada di level schema, bukan di
# level antrean.
#
# Sisa risikonya: langkah `Prepare CI project` menulis ke schema `public` bersama.
# Itu idempoten (skip yang sudah applied) dan hanya menambah, tak pernah
# menghapus — jadi dua run yang berbarengan menghasilkan keadaan akhir yang sama.
#
# `cancel-in-progress` di-set lewat ekspresi: HANYA untuk PR/branch kerja.
# Push ke `main` TIDAK PERNAH dibatalkan — commit di main adalah catatan sejarah,
# dan membatalkannya menyisakan lubang di bukti "commit ini pernah hijau".
# ── KOREKSI 2026-08-04 — per-ref TIDAK aman, dan buktinya mahal ────────────
#
# Alasan di atas menyatakan `TEST_SCHEMA` per-run sudah cukup mengisolasi.
# Itu BENAR untuk test yang memakai `test-db.ts`, dan SALAH untuk yang memakai
# `rls-harness.ts` — harness itu sengaja bekerja di schema `public`, karena di
# situlah RLS policy dan `auth.uid()` hidup. Headernya sendiri menyebut dirinya
# "read-safe, tidak pernah mengubah data public", tetapi **41 test rute sudah
# menulis lewatnya** (diukur 2026-08-04), dan tulisan itu mendarat di `public`
# bersama.
#
# Selama hanya SATU branch punya PR terbuka, itu tak terlihat: schema `public`
# hanya disentuh satu run. Begitu ada empat PR sekaligus, empat run × 6 shard =
# 24 job menulis ke `public` yang sama.
#
# Yang terjadi 2026-08-04, terekam di riwayat run:
#   11:00  f5-1                 HIJAU  (sendirian)
#   11:40  inti-3 dibuka        merah
#   12:00  inti-2               merah
#   12:03  f5-1 dijalankan lagi MERAH  ← kode IDENTIK dengan yang hijau 11:00
#   12:29  inti-4               merah
#
# Branch yang sama, commit yang sama, hasil berbeda — satu-satunya yang berubah
# adalah berapa banyak run lain yang berbarengan. Itu bukti yang cukup.
#
# Karena itu group dikembalikan KONSTAN: seluruh run yang berbagi project CI
# antre di satu barisan. Keluhan lama (antrean panjang) dijawab dengan
# `cancel-in-progress` untuk branch kerja — bukan dengan membuang serialisasi.
# Push baru pada branch kerja membatalkan run lamanya, jadi antrean tak
# menumpuk oleh hasil yang sudah usang.
#
# Push ke `main` TIDAK PERNAH dibatalkan: commit di main adalah catatan sejarah,
# dan membatalkannya menyisakan lubang di bukti "commit ini pernah hijau".
#
# Ini OBAT SEMENTARA. Obat sesungguhnya tetap R-009: isolasi nyata per shard
# (project CI terpisah, atau harness yang tak menyentuh `public`). Serialisasi
# membuat CI lebih lambat saat banyak PR — itu harga yang dibayar sadar, dan
# alasannya ada di sini supaya tak dibongkar lagi tanpa membaca riwayat ini.
#
# ⚠ BARISAN INI TIDAK MENCAKUP `ci-isolation.yml` — dan itu memakan tiga run.
#
# Diukur 2026-09-04: `ci-isolation.yml` sengaja memakai group SENDIRI per-run
# (`ci-isolation-ops-${run_id}`) supaya tak dibatalkan run lain. Akibatnya
# `setup-clean` (WIPE + replay) berjalan BERBARENGAN dengan CI di sini —
# keduanya menulis ke project CI yang sama, terpisah tiga detik:
#
#     19:25:24  CI                 ← 6 shard menjalankan Prepare CI project
#     19:25:21  CI Isolation       ← WIPE mengosongkan basis
#
# WIPE mengosongkan, shard langsung memutar migrasi ke dalamnya, salah satunya
# membuat `project_status`, lalu `setup-clean` mencoba 001 dan gagal dengan
# `type "project_status" already exists`. Galat yang menuduh migrasinya,
# padahal yang bertabrakan dua workflow.
#
# Gejala yang paling menyesatkan: WIPE mencetak "benar-benar kosong" dan
# inventaris sesudahnya menemukan 77 tabel berisi data. Keduanya benar pada
# saat masing-masing diukur.
#
# Sampai R-009 selesai: JANGAN menjalankan `setup-clean` selagi ada run CI
# aktif, dan jangan mem-push apa pun selama ia berjalan — push memicu CI, dan
# CI memicu balapannya.
concurrency:
  group: ci-shared-ci-db
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    # ⚠️ NAMA JOB = NAMA STATUS CHECK di branch protection.
    #
    # Dengan `strategy.matrix`, GitHub menambahkan nilai matrix ke nama check:
    # "API — test (shard 1)", "(shard 2)", dst. Nama lama
    # ("API — lint, typecheck, test, build") TIDAK AKAN PERNAH MUNCUL LAGI.
    #
    # Kalau daftar check wajib tak ikut diperbarui, GitHub menunggu check yang
    # tak akan pernah datang dan **setiap PR tertahan selamanya** — kegagalan
    # yang terlihat seperti "CI lambat", bukan seperti salah konfigurasi.
    # Daftar wajib diperbarui bersamaan; lihat docs/execution/CI-BUKTI.md §4.
    name: API — test (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # ── 6 SHARD — dinyalakan setelah F0-16 ────────────────────────────────
    #
    # Percobaan 6 shard sebelumnya GAGAL, dan kegagalannya berharga: ia
    # menyingkap cacat tenancy NYATA di kode produksi, bukan sekadar penghalang
    # CI —
    #
    #     null value in column "company_id" of relation "notifications"
    #
    # `utils/notifications.ts` meng-insert notifikasi tanpa `company_id` sama
    # sekali. Ia bekerja hari ini semata karena fallback satu-tenant
    # `fn_isi_company_id()`, dan akan menolak SETIAP notifikasi pada hari
    # perusahaan kedua lahir.
    #
    # F0-16 memperbaikinya di akar: `company_id` kini kolom WAJIB di
    # `NotificationParams` — bukan opsional dengan default. Satu user bisa jadi
    # anggota beberapa perusahaan (ADR-011 D5), jadi nilainya harus datang dari
    # PERISTIWA yang melahirkan notifikasi, bukan dari penerimanya. Tipe wajib
    # membuat TypeScript menemukan 31 pemanggil yang lupa — bukan produksi.
    #
    # ── Riwayat: kenapa shard sempat DITAHAN di 1, lalu di 4
    #
    # Percobaan pertama (2026-08-03) memangkas wall-clock 1317s → 434s (3×),
    # tetapi shard 1 gagal:
    #
    #     projects.company_id NOT NULL dilanggar (23502) di lessons-writeback
    #
    # Akarnya BUKAN sharding. `fn_isi_company_id()` mengisi `company_id`
    # otomatis HANYA bila `companies` berisi TEPAT SATU baris; begitu ambigu ia
    # menolak menebak — perilaku yang BENAR dan sengaja (migrasi 127).
    #
    # Yang salah ada di test: belasan berkas meng-INSERT ke tabel ber-tenant
    # (`projects`, `clients`, `approval_steps`, `notification_rules`, …) TANPA
    # menyebut `company_id`, mengandalkan fallback satu-tenant itu. Selama
    # berkas berjalan berurutan, asumsinya kebetulan selalu benar. Berjalan
    # PARALEL, `search-tenant-isolation` meng-COMMIT company kedua selama ~2
    # detik — dan setiap INSERT di shard lain dalam jendela itu ditolak.
    #
    # F0-14 memperbaikinya di tempat yang benar: 16 INSERT di 14 berkas kini
    # MENYATAKAN `company_id` secara eksplisit. Trigger tak disentuh sama
    # sekali — melemahkannya demi CI cepat adalah G-5, tepat sebelum Fase 2.
    #
    # Terverifikasi: seluruh berkas terdampak lulus SAAT ADA DUA COMPANY —
    # kondisi persis yang dulu menggagalkan shard 1.
    #
    # ⚠️ SAAT MENGUBAH JUMLAH SHARD, tiga hal WAJIB berubah bersamaan — kalau
    # tidak, sebagian test diam-diam tak pernah dijalankan (kegagalan paling
    # senyap): (1) daftar `shard:` di bawah · (2) penyebut di nama job DAN di
    # `--shard=` (tiga tempat) · (3) daftar check wajib di branch protection.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # A3: ratchet, bukan `pnpm lint` polos. `no-explicit-any` sebelumnya
      # di-set "off" padahal `01-coding-standards.md` MUST #3 menyebut rule
      # itu sebagai mekanisme verifikasinya sendiri. Kini `warn` + jumlahnya
      # dikunci per-rule — lihat apps/api/scripts/lint-ratchet.mjs.
      - name: Lint (ratchet — nol error, warning tak boleh bertambah)
        run: pnpm lint:ratchet

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Rute baru yang menyentuh `supabase` mentah WAJIB punya saringan tenant.
      # 8 celah lintas-tenant ditutup 2026-07-31 — semuanya LOLOS review manusia
      # berbulan-bulan; yang menemukannya alat ini. Alat yang cuma dijalankan
      # saat seseorang ingat tak menjaga apa pun, jadi ia dijadikan gerbang.
      # Tak menyentuh DB — murni analisis sumber.
      - name: Gerbang tenancy (rute tanpa saringan tenant tak boleh bertambah)
        run: node scripts/audit-gerbang-tenancy.mjs

      # Versi pnpm dideklarasikan di SEPULUH tempat: dua di package.json dan
      # delapan `version:` di berkas ini + ci-isolation + ci-keepalive.
      # `pnpm/action-setup` membaca dua sumber dan MENOLAK bila berbeda:
      #
      #     Error: Multiple versions of pnpm specified
      #
      # Diukur 2026-09-04 (PR #148): menaikkan pnpm hanya di package.json
      # memerahkan SEPULUH job di langkah setup — termasuk yang tak menyentuh
      # kode sama sekali. Lokal semuanya hijau; tak ada alat di sini yang
      # membandingkan kesepuluh angka itu.
      - name: Versi pnpm satu suara (10 tempat wajib sama)
        run: node scripts/audit-versi-pnpm-satu-suara.mjs

      # `?? []` pada hasil query mengubah KEGAGALAN jadi HASIL KOSONG yang
      # terlihat sah. Bukan hipotetis: kurva-s.ts kehilangan Rp 631,7 juta dari
      # AC selama berbulan-bulan karena `.select('amount')` (kolomnya
      # `total_amount`) gagal, lalu `?? []` menelan errornya — nol gejala,
      # laporan tetap terbit, hanya CPI yang terlalu optimis.
      # Ratchet: jumlahnya boleh turun, tak boleh naik.
      - name: Kegagalan senyap (query yang errornya tak pernah dilihat)
        run: node scripts/audit-kegagalan-senyap.mjs

      # `notification-rules.test.ts` memakai `TEST_EVENT = '__test_event__'` —
      # nama TETAP — lalu `beforeAll` MENGHAPUS baris bernama itu. Enam shard
      # berbagi satu database, jadi shard yang satu menghapus state yang sedang
      # dipakai shard lain.
      #
      # Yang kalah balapan gagal dengan "expected 403 to be 200" — galat yang
      # terbaca sebagai bug permission, bukan sebagai state yang dihapus orang
      # lain. Test yang merah berpindah tiap jalan, jadi paling mudah salah
      # disimpulkan sebagai "CI rewel" lalu di-retry sampai kebetulan hijau.
      #
      # `approval-chains.test.ts` punya pola persis sama — bom waktu yang belum
      # meledak saat ini ditemukan.
      - name: State bersama uji (nama tetap yang dihapus di setup)
        run: node scripts/audit-state-bersama-test.mjs

      # Kelas yang sama dengan penjaga di atas, sumbu berbeda: fixture yang
      # SAH bagi dirinya sendiri tapi melanggar invariant yang ditegakkan
      # berkas LAIN.
      #
      # `t9-kelola-badan-usaha` menuntut setiap akar grup punya pemilik —
      # akar tanpa pemilik adalah grup yang tak seorang pun bisa menambah
      # badan usaha di dalamnya. Invariant itu benar. Tapi ia memeriksa
      # SELURUH tabel `companies`, jadi perusahaan uji tanpa `owner_user_id`
      # dari berkas mana pun menjatuhkannya, dengan pesan yang tak ada
      # hubungannya dengan apa yang diuji berkas itu.
      #
      # Terjadi TIGA KALI dalam satu hari, dari fixture berbeda-beda. Tiap
      # kali "perbaikannya" hanya membersihkan fixture yang itu. Membersihkan
      # bukan perbaikan: `afterAll` tak berjalan kalau prosesnya mati.
      # Fixture harus SAH SEJAK LAHIR.
      - name: Fixture company yatim (akar grup uji tanpa pemilik)
        run: node scripts/audit-fixture-company-yatim.mjs

      # Sisi TULIS: `update`/`delete`/`insert` yang hasilnya dibuang. Kegagalan
      # apa pun — constraint, RLS, kolom salah — lewat tanpa jejak; request tetap
      # 200 dan datanya tak berubah. Tiga ditemukan 2026-08-01: settlement
      # borongan meninggalkan scope tetap aktif, ganti-permission role bisa
      # MENAMBAH akses alih-alih mengganti, dan progress_pct tak tersimpan.
      - name: Penulisan senyap (update/delete/insert tanpa cek hasil)
        run: node scripts/audit-tulis-tanpa-periksa.mjs


      # `catch {}` kosong membuang justru pesan yang dibutuhkan untuk menemukan
      # sebab kegagalan. 18 di antaranya membungkus pengiriman notifikasi — dan
      # rantai Web Push di repo ini PUTUS berbulan-bulan tanpa satu pun gejala,
      # karena orang yang tak menerima notifikasi tak tahu ada yang seharusnya
      # datang. Ambang NOL: perbaikannya satu baris log.
      - name: Catch senyap (error ditelan tanpa jejak)
        run: node scripts/audit-catch-senyap.mjs

      # Transisi keputusan yang menulis status tanpa mengikutkan status LAMA di
      # WHERE. Dua approval yang tiba bersamaan sama-sama berhasil: di
      # `change-orders` itu MENGGANDAKAN nilai kontrak, di `invoices` itu
      # MENGHILANGKAN satu pembayaran klien — keduanya tanpa error, tanpa
      # gejala. `kasbons` sudah benar sejak lama dan jadi polanya.
      # Ditemukan 2026-08-09 saat memverifikasi rencana lapisan AI; bukan
      # risiko yang dibawa AI, hanya risiko yang AI akan picu lebih sering.
      - name: Klaim status atomik (approval & pembayaran ganda)
        run: node scripts/audit-klaim-status-atomik.mjs

      # Penjaga yang tak pernah merah adalah hiasan (CLAUDE.md 8a.2). Bukti
      # itu dijalankan CI, bukan sekali saat penjaganya ditulis: ia melepas
      # klaim atomik yang sungguhan dipakai di 5 berkas, memastikan penjaga
      # MERAH untuk tiap-tiapnya, lalu memulihkannya. Menolak menilai kalau
      # mutasinya tak benar-benar tersuntik — pembuktian yang gagal diam-diam
      # lebih berbahaya daripada tak ada pembuktian.
      - name: Uji mutasi penjaga klaim status
        run: node scripts/uji-mutasi-klaim-status.mjs

      # Nilai kredensial pihak ketiga (kunci API penyedia AI, token WhatsApp)
      # TIDAK BOLEH meninggalkan server. Yang membuat aturan itu berlaku
      # sungguhan bukan penyembunyian di UI, melainkan kolomnya tak pernah
      # ikut di-select. Satu `select('*')` yang ditambahkan kelak sudah cukup
      # membocorkannya — TANPA error, tanpa test merah, dan responsnya justru
      # terlihat lengkap. Ambang NOL, bukan ratchet.
      - name: Kredensial tak bocor
        run: node scripts/audit-kredensial-tak-bocor.mjs

      # L-4 — kolom jadwal WAJIB punya pembaca.
      # `BackupPolicy` TJS punya kolom jadwal bertahun-tahun tanpa satu pun
      # kode yang membacanya: "terjadwal di layar, tidak di kenyataan". UI
      # menampilkan, basis menyimpan, dan TIDAK TERJADI APA-APA — tanpa error,
      # tanpa test merah. Satu-satunya gejalanya adalah hal yang tidak terjadi.
      - name: Kolom jadwal punya pembaca (L-4)
        run: node scripts/audit-jadwal-punya-pembaca.mjs

      # `format()` di migrasi SQL — placeholder harus punya argumennya.
      #
      # Migrasi 212 dan 215 keduanya menulis dua `%I` dengan satu argumen.
      # Postgres menolaknya saat DIJALANKAN dengan `too few arguments for
      # format()` — galat yang tak menyebut baris, nama policy, atau tabel.
      # Dan karena tiap migrasi dibungkus transaksi, kegagalan di blok policy
      # me-ROLLBACK tabel yang dibuat ratusan baris di atasnya, sehingga gejala
      # berikutnya berbunyi `relation "..." does not exist` di migrasi LAIN.
      #
      # Yang paling mahal: 215 tak pernah terlihat selama 212 masih ada, karena
      # rantainya berhenti di yang pertama. Tiga putaran CI habis untuk dua
      # cacat yang bentuknya identik dan bisa dipindai sekaligus.
      - name: format() di migrasi punya argumen cukup
        run: node scripts/audit-format-argumen-cukup.mjs

      # Migrasi yang memaku id perusahaan WAJIB bergerbang.
      #
      # `237_seed_lapangan_dummy.sql` memaku id perusahaan basis DEV. Di basis
      # CI — yang dimulai kosong — baris itu tak pernah ada, jadi FK-nya
      # menolak dan SELURUH rantai migrasi berhenti di situ. Enam shard test
      # merah berhari-hari karena data hiasan dashboard.
      #
      # Allowlist tak dipakai: ia hanya menolong CI. VPS, mesin developer baru,
      # dan tenant baru menabrak kegagalan yang sama.
      - name: Seed tak memaku id perusahaan tanpa gerbang
        run: node scripts/audit-seed-perusahaan-dipaku.mjs

      # `information_schema` di migrasi WAJIB menyaring `table_schema`.
      #
      # CLAUDE.md §1 mencatatnya: basis ini punya skema `test` yang membayangi
      # 9 tabel public bernama sama, plus `extensions` 5 lagi. Tanpa saringan,
      # cacah kolom jadi DUA KALI — "hanya 10 dari 5 kolom terpasang" — dan
      # yang lebih buruk, `rows[0]` bisa jatuh ke baris skema lain dan menjawab
      # benar secara KEBETULAN.
      #
      # Ratchet, bukan ambang nol: 31 migrasi lama sudah begitu, dan §5.5
      # melarang mengeditnya tanpa alasan kuat. Yang dijaga: jangan bertambah.
      - name: information_schema di migrasi disaring table_schema
        run: node scripts/audit-information-schema-disaring.mjs

      # Satu lapis LEBIH JAUH dari L-4, dan celah di antara keduanya nyata.
      # L-4 menjawab "adakah yang membaca kolom jadwal ini?" — jawabannya YA,
      # `jadwal.ts` membacanya dengan benar. Yang bolong: jalur yang dibaca itu
      # menunjuk rute yang TAK TERDAFTAR. Diukur 2026-08-13: 7 tugas automation
      # `aktif = true` di basis, `jumlah_jalan = 0`, memanggil endpoint yang
      # tidak ada karena berkasnya tak pernah di-register di `index.ts`.
      # Penjadwal memanggil, dapat 404, dan 404 itu tak dibaca siapa pun.
      - name: Tugas terjadwal punya rute terpasang
        run: node scripts/audit-tugas-punya-rute.mjs

      # ARAH SEBALIKNYA, dan cacatnya sudah terjadi TIGA KALI.
      #
      # Penjaga di atas menjamin tiap TUGAS punya rute. Ia tak menjamin tiap
      # RUTE punya tugas — dan rute otomasi tanpa tugas tak pernah bisa dipicu
      # siapa pun. Rute yang tak pernah dipanggil TIDAK error; ia hanya diam,
      # dan satu-satunya jejaknya adalah sesuatu yang TIDAK terjadi.
      #
      #   2026-08-16  8 rute otomasi ada sejak 15/16, tak pernah terdaftar
      #   2026-08-17  `kendali-dokumen/kirim-laporan` — akibatnya
      #               `terakhir_dikirim` selamanya NULL, dan deteksi MACET
      #               melaporkan SELURUH jadwal macet: peringatan yang BENAR
      #               untuk sebab yang SALAH
      #   2026-08-17  7 rute lagi — ditemukan penjaga ini pada jam yang sama
      #               ia ditulis
      #
      # Dua yang pertama ditemukan tangan. Yang ketiga ditemukan penjaga, dan
      # itulah alasan penjaganya ada.
      - name: Rute penjadwal punya tugas pemicu
        run: node scripts/audit-rute-penjadwal-punya-tugas.mjs

      # Titik KEEMPAT: tugasnya sah, rutenya ada, katalognya cocok — tapi
      # PERUSAHAANNYA sudah tidak ada.
      #
      # Diukur 2026-09-01: 122 dari 329 tugas terjadwal berstatus `gagal`,
      # semuanya dengan galat yang sama —
      #
      #   /api/v1/otomasi/jalankan/evm-kinerja membalas 403:
      #   {"error":"Anda bukan anggota perusahaan tersebut"}
      #
      # 403-nya BENAR. Dua company uji sudah `is_active = false`, tapi
      # `jadwal_tugas`-nya tertinggal aktif — menonaktifkan company tidak
      # menyentuh jadwalnya.
      #
      # Bahayanya bukan denyut terbuang. 122 kegagalan yang WAJAR dan BERULANG
      # membuat papan pemantauan otomasi menyesatkan: yang melihatnya
      # menyimpulkan otomasi rusak padahal 207 sisanya bekerja, lalu belajar
      # mengabaikan kolom status — dan kegagalan SUNGGUHAN nanti ikut
      # terabaikan. Bentuk yang sama dengan racun konteks di pembuka CLAUDE.md:
      # laporan yang salah melatih pembacanya berhenti membaca.
      #
      # Ditutup migrasi 563. (ambang NOL)
      - name: Jadwal tugas hanya milik company hidup
        run: node scripts/audit-jadwal-company-hidup.mjs

      # Titik KETIGA pada rantai yang sama, dan yang terakhir tertutup.
      #
      #   jadwal_tugas.tugas -> KATALOG_TUGAS[kunci] -> app.get(jalur)
      #      ^-- rute-penjadwal    ^-- INI              ^-- tugas-punya-rute
      #          -punya-tugas
      #
      # Diukur 2026-08-19: 58 rute otomasi terdaftar, 53 entri KATALOG_TUGAS.
      # Lima rute — tiga di antaranya sudah tiga hari begitu — tak dikenal
      # katalog, jadi penjadwal tak pernah memanggilnya. Migrasi lulus, baris
      # `jadwal_tugas` aktif, katalog UI menampilkannya sebagai terpasang, dan
      # tak satu pun pernah berjalan.
      #
      # Tanpa galat, tanpa 404, tanpa satu baris log. Kedua penjaga sepupunya
      # HIJAU sepanjang itu — mereka memeriksa arah yang lain.
      - name: Rute otomasi punya entri katalog tugas
        run: node scripts/audit-rute-otomasi-punya-entri.mjs

      # Titik KEEMPAT — di luar kode, dan yang paling lama tak terjaga.
      #
      #   jadwal_tugas → KATALOG_TUGAS → app.get(jalur) → WORKFLOW → GitHub
      #      ^ dijaga      ^ dijaga        ^ dijaga        ^ INI
      #
      # Diukur 2026-08-20: 72 tugas terjadwal aktif di basis, NOL pernah
      # dipanggil. Sebabnya `SCHEDULER_URL` tak pernah disetel, dan cabang
      # "dilewati" di jadwal-tugas.yml memakai `::notice::` — anotasi yang
      # TIDAK muncul di ringkasan run.
      #
      # Penjadwal mati berhari-hari dengan status HIJAU dan nol gejala.
      #
      # Penjaga ini tak bisa memeriksa GitHub (tak punya kewenangan membaca
      # daftar rahasia). Yang dijamin: kalau penjadwalnya mati, keadaannya
      # TERLIHAT — bukan bahwa ia hidup.
      - name: Penjadwal yang dilewati tetap terlihat
        run: node scripts/audit-penjadwal-hidup.mjs

      # Diukur 2026-08-30, jalan PERTAMA penjadwal di produksi:
      #   diperiksa 114 · sukses 49 · GAGAL 29 · dilewati 36
      #
      # Kedua puluh sembilan bergalat 403 "bukan anggota perusahaan tersebut" —
      # akun penjadwal cuma anggota 1 dari 3 tenant aktif, sementara dua tenant
      # lain punya proyek nyata.
      #
      # Itu BUKAN cacat penjadwal: `lib/akun-layanan.ts` sengaja menolak bypass
      # autentikasi, jadi 403 adalah pagar yang bekerja. Yang kurang cuma
      # pendaftarannya (diperbaiki migrasi 523).
      #
      # Migrasi memperbaiki keadaan HARI ITU. Tenant baru yang dibuat besok
      # lahir tanpa keanggotaan penjadwal, seluruh tugasnya gagal sejak hari
      # pertama, dan kegagalannya cuma tercatat di `terakhir_galat` yang tak
      # dibuka siapa pun. Penjaga ini yang menangkapnya.
      - name: Akun penjadwal anggota tiap tenant aktif
        run: node scripts/audit-penjadwal-anggota-tiap-tenant.mjs





      # Saluran keluar wajib berpagar terhadap test.
      #
      # Founder mengirim tangkapan layar WhatsApp 2026-08-14: enam pesan
      # "KASBON BARU DIAJUKAN" identik dalam dua menit. Bukan error alur —
      # itu suite test. Enam berkas test memanggil endpoint pengajuan kasbon,
      # tiap panggilan melewati `createNotifications()`, dan jembatan
      # `terbit-peristiwa.ts` meneruskannya ke webhook n8n sungguhan yang
      # mengirim WhatsApp sungguhan. Terukur: 15:21 (n=20), 16:01 (n=20),
      # 16:17 (n=18) — jadwal `vitest run`, bukan jadwal manusia.
      #
      # `wa-kirim.ts` menyentuh dunia luar juga dan AMAN — tapi amannya lewat
      # DISIPLIN (test menyetel `konfigurasi: null`). Itu bekerja selama
      # penulisnya TAHU ia menyentuh saluran keluar. `terbit-peristiwa` bocor
      # justru karena tak seorang pun tahu: enam berkas itu mengira sedang
      # menguji retensi, opname, dan approval — tak satu pun menyebut WhatsApp.
      #
      # Disiplin melindungi yang sengaja. Yang tak sengaja butuh pagar.
      #
      # Ambang NOL. Pengecualian didaftarkan DI DALAM penjaga beserta
      # alasannya, bukan lewat komentar penekan yang tersebar. Bukti merah:
      # pagar `terbit-peristiwa` dilepas → exit 1 menunjuk berkasnya →
      # dipulihkan → exit 0.
      - name: Saluran keluar berpagar terhadap test
        run: node scripts/audit-saluran-keluar-berpagar.mjs

      # Alur otomasi wajib TERCATAT di `otomasi_jalan`.
      #
      # Diukur 2026-08-14: 11 alur tercatat "aktif", 9 di antaranya NOL
      # eksekusi seumur hidup — termasuk `teruskan-kasbon-diajukan`, yang hari
      # itu juga mengirim 28 WhatsApp sungguhan ke founder. Buku eksekusi
      # bilang alurnya tak pernah jalan; kenyataannya founder menerima puluhan
      # pesan.
      #
      # Sebabnya `utils/terbit-peristiwa.ts` menembak webhook dengan `fetch()`
      # langsung, melewati `jalankanAlur()` — satu-satunya jalan yang mencatat
      # mulai/selesai/status/durasi. Webhooknya berhasil, pesannya terkirim,
      # dan bukunya diam.
      #
      # `otomasi_jalan` adalah satu-satunya tempat pertanyaan "otomasi ini
      # benar-benar jalan tidak?" bisa dijawab tanpa menebak. Selama ia kosong,
      # tiap jawaban tentang otomasi adalah tebakan yang terdengar seperti
      # fakta.
      #
      # Yang diperiksa JALANNYA, bukan isi basis: alur yang belum pernah
      # dipicu sah-sah saja kosong, dan memerahkan CI karenanya membuat
      # penjaga berhenti dibaca (pelajaran `rls-initplan`).
      #
      # Ambang NOL. Bukti merah: `fetch` ke `/webhook/` disuntikkan dalam DUA
      # bentuk (inline dan lewat variabel) → exit 1 keduanya → dipulihkan →
      # exit 0. Dua versi penjaga ini sebelumnya terbukti HIASAN lewat mutasi
      # yang sama.
      - name: Alur otomasi tercatat di otomasi_jalan
        run: node scripts/audit-alur-tercatat.mjs

      # Katalog otomasi wajib menjelaskan otomasi yang BENAR-BENAR ADA — dua
      # arah: rute tanpa penjelasan, DAN penjelasan tanpa rute.
      #
      # Repo ini sudah punya satu katalog otomasi yang membusuk
      # (`06-agentic-ai-*.md`: tujuh otomasi hidup masih tertulis `Next`), dan
      # salah membacanya memakan biaya dua kali dalam satu hari.
      #
      # Ambang NOL. Bukti merah, tiga mutasi terpisah: entri `gr-matching`
      # dihapus → exit 1; penjelasan dipendekkan jadi "Cek stok." → exit 1;
      # penjelasan diisi istilah teknis (SELECT/webhook) → exit 1. Ketiganya
      # dipulihkan → exit 0.
      - name: Katalog otomasi cocok dengan kode
        run: node scripts/audit-katalog-otomasi-nyata.mjs

      # Tiap ambang otomasi WAJIB bisa disetel dari halaman Pengaturan.
      #
      # Diukur 2026-08-16: 37 ambang di kode, 15 di halaman — DUA PULUH DUA
      # tak bisa disetel siapa pun. Nilainya ada di basis, rutenya
      # membacanya, dan satu-satunya cara mengubahnya SQL langsung. Persis
      # yang dilarang CHARTER §8 ("config-first berarti ada halaman
      # pengaturannya di UI").
      #
      # Penyebabnya bentuk, bukan kelalaian: halaman memelihara daftarnya
      # sendiri, dan dua daftar yang harus sejalan pasti melenceng — tanpa
      # gejala, karena halaman tetap tampil rapi, hanya lebih pendek.
      #
      # Ambang NOL. Bukti merah, dua mutasi terpisah: `akibat` dihapus dari
      # satu entri → exit 1; halaman memaku satu kunci `otomasi.…` → exit 1.
      # Keduanya dipulihkan → exit 0.
      - name: Ambang otomasi bisa disetel dari UI
        run: node scripts/audit-ambang-bisa-disetel.mjs

      # Tiap notifikasi wajib membawa `action_data.record_id`.
      #
      # `audit-notifikasi-tak-kembar` menilai kembar lewat
      # (user_id, type, record_id, tanggal) dan SENGAJA melewati baris
      # ber-record_id NULL — pengecualian yang benar, tetapi akibatnya
      # notifikasi tanpa record_id kebal dedup DAN tak terlihat penjaganya.
      #
      # Terukur 2026-08-16: `kasbon_approved` 968 notifikasi dengan hanya DUA
      # pasangan unik — rasio 484x. Penyebabnya `kasbons.ts` menulis
      # `kasbon_id`, bukan `record_id`.
      #
      # Pelajaran yang sama sudah dicatat panjang lebar di `mandor.ts` pada
      # 2026-08-14, lalu terulang di berkas lain dua hari kemudian. Catatan
      # saja tak cukup.
      #
      # RATCHET, bukan ambang nol: sebagian notifikasi memang tak menunjuk
      # catatan apa pun (sapaan, ringkasan), dan memaksanya mengarang
      # record_id menghasilkan nilai palsu yang membuat dedup menahan hal yang
      # seharusnya lewat.
      #
      # Bukti merah: `record_id` dibuang dari `kasbons.ts` → exit 1; dipulihkan
      # → exit 0. Mutasi pertama LOLOS karena penjaganya membaca komentar
      # sebagai kode — komentar sekarang dibuang sebelum diperiksa.
      - name: Notifikasi membawa record_id (ratchet)
        run: node scripts/audit-notifikasi-punya-record.mjs

      # Migrasi yang menyemai baris per-tenant wajib menyaring tenant yang
      # dipakai — `is_active` atau keanggotaan.
      #
      # Empat migrasi menulis 9.164 baris untuk 597 tenant sisa test yang sudah
      # nonaktif (diukur 2026-08-16), dan TIGA cacat potong-senyap lahir
      # darinya: notification_rules 1.736 baris, pembacaan penjadwal 4.794, dan
      # 2.018 tugas gagal 403 tiap denyut.
      #
      # RATCHET di 8 — kedelapan lantai migrasi LAMA yang sudah jalan; §5.5
      # melarang mengeditnya. Bukti merah: migrasi ke-9 tanpa saringan
      # disuntikkan → exit 1 → dibuang → exit 0.
      - name: Migrasi per-tenant menyaring tenant aktif
        run: node scripts/audit-migrasi-pertenant-aktif.mjs

      # Test yang membuat perusahaan wajib membersihkannya.
      #
      # 597 tenant sisa test menumpuk di `companies` karena 23 berkas test tak
      # pernah menghapus buatannya. RATCHET di 23 — tak boleh naik. Bukti
      # merah: berkas ke-24 disuntikkan → exit 1 → dibuang → exit 0.
      - name: Test membersihkan tenant buatannya
        run: node scripts/audit-test-bersihkan-company.mjs

      # Port yang dilayani API wajib sama dengan yang dituju web.
      #
      # Empat jam habis pada 2026-08-10 mengejar "Not Found": API di 3001 sehat
      # dan rutenya ada, tetapi web bicara ke 3007 yang menjalankan kode lama.
      # TERULANG 2026-08-16 dengan nilai yang sama persis.
      #
      # Tak ada satu pun galat yang menunjuk ketidakcocokannya — tiap lapisan
      # menjawab benar untuk dirinya sendiri. Karena itu ia butuh penjaga,
      # bukan komentar di dokumen (dan komentar itu pun sempat basi).
      #
      # Ambang NOL. Di CI hanya `.env.example` yang diperiksa (yang nyata tak
      # ikut ter-commit) — dan itu justru yang penting: contoh yang tak
      # konsisten menyebarkan jebakannya ke mesin berikutnya.
      #
      # Bukti merah: port web diubah → exit 1; PORT dihapus dari .env sehingga
      # kembali implisit → exit 1. Keduanya dipulihkan → exit 0.
      - name: Port API cocok dengan tujuan web
        run: node scripts/audit-port-api-cocok.mjs

      # Jalur UI di inbox approval wajib menunjuk halaman yang benar-benar ada.
      #
      # Ditemukan 2026-08-14 saat menambahkan `purchase_order` ke inbox:
      # tebakan pertama saya (`/procurement/purchase-order`) SALAH — yang benar
      # `/procurement/pesanan`. Sekalian diukur dua belas entri lain, dan EMPAT
      # di antaranya menunjuk halaman yang tidak ada.
      #
      # `audit-inbox-lengkap.mjs` menjaga hal berbeda (tiap jenis approval
      # punya entri, kolomnya nyata di schema) dan tak pernah memeriksa
      # `jalurUi`. Akibatnya: approver membuka inbox, melihat dokumen yang
      # menunggu keputusannya, menekan tautannya — dan mendarat di 404. Tak ada
      # galat, tak ada yang merah, dokumennya tertahan tanpa seorang pun tahu
      # sebabnya. Persis kerusakan yang inbox berusaha cegah, lewat pintu yang
      # tak ia jaga.
      #
      # AMBANG NOL. Lahir sebagai ratchet (lantai 4), lalu keempat jalur buntu
      # diperbaiki di commit yang sama begitu terukur:
      #   /procurement/material-request → /procurement/permintaan
      #   /kontrak/submittal            → /lapangan/submittal
      #   /lessons-learned              → /mutu/pelajaran
      #   /kontrak/change-order         → /proyek  (SEBAGIAN — CO tak punya
      #                                   halaman sendiri, ia seksi di /proyek/[id])
      #
      # Rute dinamis `[id]` diterima — `/mandor/back-charge` hidup lewat segmen
      # dinamis, dan pengukuran manual saya sempat salah menghitungnya buntu.
      #
      # Bukti merah: jalur PO dikembalikan ke tebakan yang salah → exit 1 →
      # dipulihkan → exit 0.
      - name: Jalur UI inbox menunjuk halaman nyata
        run: node scripts/audit-inbox-jalur-nyata.mjs

      # Konfirmasi tulis lewat WhatsApp tak boleh melonggar.
      #
      # Di WhatsApp, kata "ya" adalah satu-satunya yang memisahkan usulan dari
      # kasbon yang benar-benar tercatat atas nama seseorang. Cara paling wajar
      # menuliskannya juga yang paling berbahaya: `teks.includes('ya')` akan
      # menyetujui "yang penting jangan dulu" — kalimat yang artinya menolak.
      # Tak ada galat, tak ada gejala; yang mengetiknya baru tahu saat approver
      # bertanya.
      #
      # Bukti merah (2026-08-16): `includes` disuntikkan → exit 1; jendela
      # dinaikkan 20 menit → exit 1; saringan `user_id` dihapus → exit 1;
      # batal jadi `.delete()` → exit 1. Dipulihkan → exit 0.
      - name: Konfirmasi WhatsApp tetap ketat
        run: node scripts/audit-konfirmasi-wa-tak-longgar.mjs

      # Tiap jenis tulis wajib punya label di kartu konfirmasi web.
      #
      # `ENTITAS_TULIS` (backend) dan `LABEL_JENIS` (UI) adalah dua daftar yang
      # harus sama, ditulis di dua berkas. Diukur 2026-08-16: dua jenis terbaru
      # hidup di backend — tervalidasi, tertest, terjaga — sementara UI masih
      # berisi lima jenis lama, jadi kartunya berjudul `pembayaran_masuk`:
      # kunci mentah, di layar tempat orang memutuskan menyimpan UANG.
      #
      # Pola KELIMA yang sama dalam sepekan (tombol konfirmasi tak pernah ada,
      # riwayat tak pernah diisi, sub-menu tak pernah dinyalakan, asisten
      # owner/web tak pernah dipanggil). Yang ini ditangkap penjaga.
      #
      # Bukti merah (2026-08-16): satu label dihapus → exit 1 → pulih → exit 0.
      - name: Jenis tulis punya label UI
        run: node scripts/audit-jenis-tulis-punya-label.mjs

      # Padanan mutu beton K <-> f'c wajib SAMA di sisi API dan sisi WEB.
      #
      # Tabelnya hidup di DUA berkas karena `apps/web` tak boleh mengimpor
      # dari `apps/api`, dan `packages/shared` masih kosong:
      #
      #   apps/api/src/lib/struktur-mutu-nyata.ts   (lembar PDF, rute)
      #   apps/web/lib/mutu-beton.ts                (label isian, panel)
      #
      # Kalau menyimpang, angka K di LAYAR tak lagi cocok dengan f'c yang
      # dipakai MENGHITUNG — yang membaca layar memesan beton kelas yang
      # salah, dan tak ada satu pun gejala: dua-duanya menampilkan angka
      # yang terlihat wajar, hanya berbeda.
      #
      # Bukti merah (2026-08-20): faktor web 0,83 -> 0,85 => exit 1;
      # padanan fc25 K-300 -> K-325 => exit 1; keduanya pulih => exit 0.
      - name: Padanan mutu beton K sepakat (API vs WEB)
        run: node scripts/audit-mutu-beton-sepakat.mjs

      # Katalog tool asisten tak boleh membengkak diam-diam.
      #
      # Skema tool dikirim ULANG tiap ronde. Diukur 2026-08-16: 40 tool =
      # ~4.500 token, sementara rata-rata satu ronde nyata cuma ~2.230 token
      # masuk — katalognya lebih mahal daripada percakapannya sendiri.
      #
      # Tool ke-41 menaikkan tagihan tiap tenant selamanya, tanpa satu pun
      # galat dan tanpa test merah. Ratchet, bukan larangan: katalog memang
      # tumbuh, yang ditahan pertumbuhan yang tak disadari.
      #
      # Bukti merah (2026-08-16): ambang diturunkan → exit 1; berkas dihapus
      # dari daftar → exit 1 (daftar basi terdeteksi). Dipulihkan → exit 0.
      - name: Katalog tool asisten tak membengkak
        run: node scripts/audit-katalog-tool-tak-membengkak.mjs

      # Fungsi yang diekspor wajib punya pemanggil.
      #
      # Tiga cacat dari kelas yang SAMA ditemukan dalam satu hari (2026-08-27),
      # dan ketiganya lolos dari seluruh penjaga lain karena kode yang tak
      # dipanggil TAK BISA GAGAL:
      #
      #   1. fn_bersihkan_idempotency_kadaluarsa() — fungsi SQL pembersih
      #      tanpa pemanggil; `idempotency_keys` tumbuh tanpa batas.
      #   2. hapusDariAntrean() (mobile) — satu-satunya jalan keluar bagi
      #      kiriman macet; penanda antrean jadi tak pernah padam.
      #   3. pastikanProfilDidukung() — YANG TERMAHAL. Dokumentasinya berbunyi
      #      "Dipanggil di awal tiap fungsi analisa" dan itu keliru sejak modul
      #      dibuat. Kanal & siku dihitung pakai rumus profil I: verdict
      #      IDENTIK dengan WF sampai digit terakhir, kapasitas 20-40% terlalu
      #      besar, salah ke arah TIDAK AMAN, mengaku "SNI 1729 §F2".
      #
      # `noUnusedLocals` tak melihat ini: dari sudut pandang berkasnya, ekspor
      # selalu "terpakai". Yang harus diperiksa seluruh repo sekaligus.
      #
      # Ambang NOL — bukan ratchet. Diukur 2026-08-27: nol tersisa setelah
      # keempat sisanya disambungkan atau dibuang.
      #
      # Bukti merah (2026-08-27): fungsi hantu disuntik → exit 1 menyebut
      # namanya; `dirname` dikurangi satu tingkat sehingga korpus jadi 0 berkas
      # → exit 1 ("jalur pencarian meleset"), BUKAN hijau palsu. Dipulihkan →
      # exit 0, korpus 1.775 berkas.
      - name: Fungsi diekspor punya pemanggil
        run: node scripts/audit-ekspor-tanpa-pemanggil.mjs

      # Identitas aplikasi mobile — dan yang TERKUNCI dinyatakan.
      #
      # Founder bertanya 2026-08-27: "kalau nama aplikasinya nanti bukan
      # puraloka-suite lagi, apa masih relevan?" Jawabannya berbeda per medan:
      #
      #   name, slug, scheme        bisa diubah kapan saja
      #   bundleIdentifier, package TERKUNCI PERMANEN setelah rilis ke store
      #
      # Yang terkunci tak punya gejala saat salah. Ia menggigit berbulan
      # kemudian: mengubahnya = aplikasi BARU di mata store, pengguna lama tak
      # dapat pembaruan, harus pasang ulang, data lokal hilang.
      #
      # Penjaga ini TIDAK menuntut nama tertentu — nama produk memang masih
      # keputusan terbuka founder. Yang dijaga KONSISTENSI-nya.
      #
      # Bukti merah (2026-08-27): package dibedakan dari bundleId -> exit 1;
      # keduanya diubah jadi bukan reverse-DNS -> exit 1 (dua temuan).
      # Dipulihkan -> exit 0.
      - name: Identitas aplikasi mobile konsisten
        run: node scripts/audit-identitas-mobile.mjs

      # Nama produk tak dipaku di keluaran yang dilihat TENANT.
      #
      # Untuk SaaS multi-tenant, nama produk di kop PDF / footer / e-mail
      # berarti PT lain menerima dokumen berkop nama pesaingnya. Tak ada galat
      # yang menunjukkannya — yang melihatnya adalah PENERIMA dokumen.
      #
      # `lib/ekspor-tabel.ts` sudah mencatat cacat ini dan menyebutnya
      # diperbaiki; perbaikannya ternyata hanya di jalur ekspor BARU, sementara
      # tiga laporan PDF lama tetap salah. Catatan yang bilang 'sudah
      # diperbaiki' padahal sebagian adalah kebusukan dokumen yang paling
      # menipu.
      #
      # RATCHET, lantai 9: kop PDF sudah beres & terkunci; `utils/email.ts`
      # tercatat sebagai utang terukur (identitas tenant perlu mengalir sampai
      # ke pengirim e-mail — perubahan lebih besar dari mengganti literal).
      #
      # Bukti merah (2026-08-27): pakuan disisipkan ke pdfHeader -> 10 > 9,
      # exit 1 menyebut berkas & barisnya. Dipulihkan -> exit 0.
      - name: Nama produk tak dipaku di keluaran tenant
        run: node scripts/audit-nama-produk-tak-dipaku.mjs

      # Kredensial tak boleh dipakai tenant yang bukan pemiliknya.
      #
      # Founder 2026-08-14: "harus disiapkan kalo nanti banyak perusahaan".
      # Hari ini basis punya SATU perusahaan nyata, jadi tiap kekeliruan
      # isolasi kredensial "kebetulan benar" — kunci `.env` milik founder
      # memang dipakai perusahaan founder. Cacatnya baru terlihat saat
      # perusahaan kedua masuk, dan saat itu ia sudah terlanjur mengirim atau
      # menagih atas nama orang lain.
      #
      # Tiga jalan yang SAH: kunci sendiri (selalu menang) · warisan dari
      # induk langsung bila saklarnya menyala (migrasi 393) · jatuhan `.env`
      # HANYA untuk grup AI.
      #
      # Bedanya tegas: kunci AI salah = tagihan ke pemilik env, terlihat di
      # dasbor dan bisa dihentikan. Kunci WhatsApp/Email salah = pesan
      # TERKIRIM lewat identitas tenant lain — tak bisa ditarik.
      #
      # Penjaga ini menemukan cacat nyata saat dibuat: komentar di
      # `kredensial.ts` sudah memperingatkan bahaya WA sejak 2026-08-10,
      # tetapi kodenya tak pernah memagarinya. Peringatan yang tertulis dan
      # tak ditegakkan hanya menunda kejutannya.
      #
      # Ambang NOL, membaca KODE bukan isi basis: satu perusahaan tak bisa
      # membuktikan apa pun tentang perilaku saat ada sepuluh. Bukti merah:
      # ketiga aturan (K-1 pagar grup AI, K-2 induk langsung, K-3 saklar
      # warisan) dimutasi satu per satu → exit 1 semuanya → dipulihkan →
      # exit 0. Dua versi pertama penjaga ini terbukti HIASAN lewat mutasi
      # yang sama: ia sempat membaca komentar, bukan kode.
      - name: Kredensial tidak bocor lintas tenant
        run: node scripts/audit-kredensial-lintas-tenant.mjs



      # Tiap modul analisa struktur wajib terdaftar di penjaga terjemahan awam
      # (`lib/__tests__/struktur-awam.test.ts`). Penjaga itu menuntut tiap
      # pemeriksaan punya penjelasan non-teknis — tetapi ia hanya menjalankan
      # modul yang DIDAFTARKAN di dalamnya, sehingga modul baru lolos tanpa
      # gejala. Sudah terjadi DUA KALI dalam satu hari (baja balok: 3
      # pemeriksaan tanpa terjemahan; kolom baja + sambungan: 7 lagi), dan
      # keduanya ketahuan hanya dari audit manual yang kebetulan dijalankan.
      #
      # Akibat kalau lolos: istilah teknik bocor ke layar orang non-teknis —
      # dan verdict merah yang tak dipahami akan dilewati.
      #
      # Bukti merah: impor `struktur-baja-sambungan` dihapus dari berkas
      # penjaga → exit 1 menyebut modulnya → dipulihkan → exit 0.
      - name: Modul analisa struktur terdaftar di penjaga terjemahan awam
        run: node scripts/audit-modul-struktur-terdaftar.mjs




      # Baris `besi` memuat DUA barang berbeda: tulangan beton (BjTP/BjTS,
      # berdiameter, dijual per lonjor) dan profil baja (WF/H/CNP/INP,
      # berdesignation, per batang). Pembedanya cuma awalan `'profil '` pada
      # `peran` — kontrak tersirat yang tak dipaksa apa pun.
      #
      # Ditemukan 2026-08-19 dengan MEMOTRET layar: tabel menampilkan
      # "Ulir (BjTS) · D200 · profil WF 200x100x5.5x8". Besi ulir D200 tak ada
      # di pasar, dan "D200" itu TINGGI profil bukan diameter — estimator
      # memesan barang yang tak bisa dipenuhi supplier. 597 test struktur
      # hijau sepanjang waktu: tak satu pun memeriksa bagaimana barisnya
      # DITAMPILKAN, hanya bagaimana ia dihitung.
      #
      # Bukti merah: cacat aslinya dikembalikan (pembeda dilumpuhkan di UI)
      # → exit 1; penulis lupa awalan → exit 1; dipulihkan → exit 0.
      - name: Baris besi membedakan tulangan dari profil baja
        run: node scripts/audit-baris-besi-dibedakan.mjs

      # Rute rekap-volume membedakan dua keadaan yang terlihat sama: jenis yang
      # TERDAFTAR di TANPA_VOLUME dilaporkan "sengaja tak bervolume", yang tidak
      # terdaftar dilaporkan GAGAL ("cacat modul"). Pembedaan itu benar; yang tak
      # ada adalah apa pun yang memastikan daftarnya tetap sepadan.
      #
      # Ditemukan 2026-08-19: dua jenis baru tak masuk daftar (dituduh cacat
      # padahal benar), dan satu jenis LAMA (baja_interaksi) terdaftar padahal
      # BERVOLUME — volumenya dilewati senyap dari rekap proyek.
      #
      # Bukti merah: cacat aslinya dikembalikan → exit 1; jenis dihapus dari
      # daftar → exit 1; dipulihkan → exit 0.
      - name: Jenis tanpa volume terdaftar sepadan dengan modulnya
        run: node scripts/audit-jenis-volume-terdaftar.mjs

      # Medan `jumlah` milik RUTE, bukan milik modul.
      #
      # Rute menyusun input tiap modul sebagai `{ ...input, jumlah }`, dan
      # `jumlah` di sana berarti BANYAKNYA ELEMEN — pengali volume. Ia ditimpakan
      # DI ATAS input pengguna, jadi modul yang memakai nama medan yang sama
      # untuk mencacah hal LAIN (baut, angkur, paku, sekrup) kehilangan angka
      # yang ditulis penggunanya.
      #
      # Ditemukan 2026-08-19 lewat rute HIDUP, bukan lewat test: pemanggilan
      # langsung fungsinya memberi 29% terpakai, rute memberi 117% — dua angka
      # dari fungsi yang SAMA, tanpa satu pun galat di antaranya. Tiga modul
      # terkena: sambungan kayu (paku), sambungan baut, dan angkur.
      #
      # Arah kesalahannya dua-duanya berbahaya: elemen berjumlah 1 membuat
      # sambungan berpaku 14 dihitung berpaku 1 (merah palsu), dan elemen
      # berjumlah 20 membuat sambungan berbaut 4 dihitung berbaut 20 —
      # HIJAU PALSU pada sambungan yang sesungguhnya kurang.
      #
      # Bukti merah: nama medan dikembalikan ke `jumlah` → exit 1;
      # dipulihkan → exit 0.
      - name: Medan `jumlah` tak bentrok dengan pengali elemen
        run: node scripts/audit-medan-jumlah-tak-bentrok.mjs

      # Laporan cakupan gambar kerja — TIDAK menggagalkan CI.
      #
      # Diukur 2026-08-19: dari 32 jenis elemen, hanya TUJUH menghasilkan
      # gambar, dan ketujuhnya beton. Seluruh sisi baja tak punya satu pun.
      # Sesudah penampang profil baja masuk: 17/32.
      #
      # Dijalankan supaya angkanya terlihat di log tiap kali, bukan diingat.
      # Cakupan yang belum lengkap adalah urutan kerja, bukan cacat — karena
      # itu laporan, bukan penjaga.
      - name: Cakupan gambar kerja per jenis (laporan)
        run: node scripts/lapor-cakupan-gambar.mjs

      # ⚠ Laporan di atas PERKIRAAN — ia membaca BENTUK kode dan sudah salah
      # empat kali, sekali melapor 32/32 saat sesungguhnya 30/32.
      #
      # Yang berwenang `uji-gambar-semua-jenis.mjs`: ia MEMBUAT elemen untuk
      # tiap jenis lewat rute sungguhan, meminta gambarnya, dan MEMBUKA SVG-nya
      # (viewBox positif, aria-label ada, tak ada medan `…Gagal`). Contoh
      # inputnya dibaca dari halaman UI, jadi contoh UI yang rusak juga merah.
      #
      # TIDAK dijalankan di CI: ia butuh API hidup + akun. Dijalankan manual —
      # perintahnya di kepala berkasnya. Dicatat di sini supaya keberadaannya
      # tak hilang dari ingatan orang yang membaca daftar ini.

      # Tiap kunci gambar yang ditulis rute wajib punya JUDUL di halaman detail.
      #
      # Halaman memakai `JUDUL_GAMBAR[nama] ?? nama`, jadi kunci yang tak
      # terdaftar TIDAK menghilang dan TIDAK menggagalkan apa pun — ia muncul
      # apa adanya sebagai kepala gambar. Pengguna melihat kata "pola" atau
      # "tampak", dan itu terbaca seperti cacat aplikasi.
      #
      # Ditemukan 2026-08-19 dengan MEMOTRET LAYAR: sepuluh jenis gambar baru
      # lahir, tiga kunci baru bersamanya, dan tabel judulnya tetap 4 entri.
      # Tak ada yang salah secara teknis, jadi tak ada test yang bisa merah.
      #
      # Bukti merah: judul "pola" dicabut → exit 1; dipulihkan → exit 0.
      # Kalkulator volume di LAYAR wajib sepakat dengan modul take-off di API.
      #
      # Rumusnya sengaja ditulis DUA KALI: estimator ingin melihat volumenya
      # seketika saat mengetik dimensi, dan memanggil API tiap ketukan tombol
      # berarti layar yang tersendat — kalkulator tersendat tak dipakai orang.
      #
      # Tetapi dua implementasi rumus yang sama akan MENYIMPANG, dan
      # penyimpangannya tak mengeluarkan galat: layar memperlihatkan satu angka,
      # basis menyimpan angka lain, dan RAB memakai yang tersimpan. Estimator
      # memeriksa yang di layar.
      #
      # Dijaga: daftar sektor, ambang kemiringan (60 derajat, ditulis telanjang
      # di kedua sisi), dan satuan tiap sektor.
      #
      # Bukti merah: ambang layar diubah 60 ke 75 → exit 1; satu sektor
      # dihilangkan dari layar → exit 1; satuan API diubah → exit 1.
      # Catatan "BELUM diperiksa" tak boleh menyebut yang SUDAH ADA.
      #
      # Tiap modul struktur membawa catatan jujur tentang batasnya, dan
      # kejujuran itu berharga — justru karena itu ia berbahaya saat BASI.
      #
      # Diukur 2026-08-20: dua catatan menyebut hal yang sudah dibangun
      # berjam-jam sebelumnya (Mononobe-Okabe di struktur-dinding, penurunan
      # di struktur-pondasi-dangkal). Catatan itu TAMPIL DI LAYAR, dan
      # pembacanya menyimpulkan pemeriksaannya tak ada — lalu mencari
      # konsultan lain untuk hal yang sudah dihitung aplikasi ini.
      #
      # Bukti merah: kedua catatan basi dipulihkan → exit 1 masing-masing.
      # Tiap catatan batas WAJIB sudah ditimbang terhadap daftar klaim.
      #
      # Penjaga di bawah bekerja dari DAFTAR yang ditulis tangan, jadi ia
      # hanya menjaga yang didaftarkan. Diukur 2026-08-20: dua catatan
      # "BELUM diperiksa: SAMBUNGAN" di struktur-atap-ringan BASI berjam-jam,
      # dan penjaganya LOLOS karena frasa itu tak ada di daftarnya.
      #
      # Penjaga yang tak bisa tahu dirinya tertinggal adalah penjaga yang
      # pelan-pelan berhenti menjaga tanpa satu pun gejala: ia tetap hijau,
      # cakupannya yang menyusut.
      #
      # Yang dijaga BUKAN isi catatannya melainkan RASIONYA — berapa catatan
      # batas yang ada, berapa yang sudah ditimbang. Menambah catatan tanpa
      # menimbangnya = MERAH.
      #
      # Bukti merah: catatan batas baru disuntik ke struktur-sloof → exit 1.
      - name: Tiap catatan batas sudah ditimbang
        run: node scripts/audit-batas-terpetakan.mjs

      - name: Catatan batas tak menyangkal kemampuan yang sudah ada
        run: node scripts/audit-batas-tak-basi.mjs

      - name: Kalkulator layar sepakat dengan modul take-off API
        run: node scripts/audit-takeoff-kembar-sepakat.mjs

      - name: Tiap jenis gambar punya judul di layar
        run: node scripts/audit-gambar-punya-judul.mjs



      # Halaman yang mengambil data wajib lewat lapis cache bersama (F4-2).
      #
      # `apps/web/lib/data-cache.ts` dibangun 2026-08-04 - 232 baris, 10 test
      # hijau - lalu diukur 2026-08-16: NOL halaman memakainya, 154 dari 164
      # mengambil data sendiri-sendiri.
      #
      # Infrastruktur yang ada tetapi tak terpakai LEBIH berbahaya daripada
      # yang belum ada: ia membaca sebagai "sudah beres" dari mana pun orang
      # melihat - berkasnya ada, testnya hijau, QUEUE mencatat `wip` seolah
      # tinggal sedikit. Repo ini sudah punya kalimatnya: "Kolom DB sudah ada
      # BUKAN selesai."
      #
      # RATCHET, bukan ambang nol: memindahkan 154 halaman sekaligus adalah
      # perubahan yang tak bisa ditinjau siapa pun dengan jujur. Yang dijaga
      # arahnya.
      #
      # Bukti merah: halaman baru ber-useEffect+api ditambahkan -> exit 1;
      # halaman yang menyebut `useData` HANYA di komentar -> tetap exit 1
      # (komentar dilucuti sebelum diperiksa); dipulihkan -> exit 0.
      - name: Halaman mengambil data lewat lapis cache (ratchet)
        run: node scripts/audit-halaman-pakai-cache.mjs

      # Galat MUAT dan galat AKSI tak boleh berbagi satu state.
      #
      # Cacat yang sama muncul di SEBELAS halaman selama pemindahan ke lapis
      # cache (F4-2). Satu state `galat` dipakai untuk gagal-memuat DAN
      # gagal-menyimpan: pengguna yang jaringannya putus melihat "Gagal
      # memuat", menekan Simpan, dan baris pertama simpan MENGHAPUS pesan itu.
      # Ia lalu menyimpulkan datanya sudah termuat — padahal tidak.
      #
      # Tak ada galat, tak ada test merah, layarnya terlihat masuk akal.
      # Sebelas kali bukan kebetulan: itu cara halaman di repo ini ditulis.
      #
      # Ambang NOL, terukur sesudah sebelas perbaikan.
      #
      # ⚠ Penjaga ini sendiri sempat BUTA: bentuk pertamanya memindai dari
      # `export default function` ke bawah, dan melewatkan pola `PageInner()`
      # yang menaruh seluruh isi komponen DI ATAS pembungkusnya. Ia melaporkan
      # "nol pelanggar" untuk berkas yang tak pernah dilihat isinya, dan itu
      # ketahuan HANYA karena mutasinya dijalankan.
      #
      # Bukti merah: `setGalatAksi` dikembalikan jadi `setGalat` di halaman
      # yang sudah pindah → exit 1; `setGalat` milik komponen pembantu di
      # berkas yang sama → TETAP hijau (benar diabaikan); dipulihkan → exit 0.
      - name: Galat muat terpisah dari galat aksi
        run: cd ../web && node scripts/uji-galat-muat-terpisah.mjs

      # Halaman rute [id] ber-`useData` wajib mencocokkan identitasnya.
      #
      # `useData` TIDAK mengosongkan `data` lama saat URL berganti — ia
      # menaikkan `memuat` lalu MENIMPA `data` sesudah jawaban baru tiba.
      # Untuk halaman ber-saringan itu tak berbahaya. Untuk rute [id] itu
      # KEBOCORAN IDENTITAS: pindah dari /x/A ke /x/B menampilkan data A di
      # bawah URL B sampai jawaban B tiba.
      #
      # Di `/portal/proyek/[id]` (dibuka KLIEN) dan `/verify/invoice/[id]`,
      # itu bukan tampilan keliru — itu memperlihatkan data pihak lain.
      #
      # Ditemukan 2026-08-16 saat memindahkan `mandor/[id]`: kode LAMA punya
      # pelacakan `dimuat !== id` yang justru ada untuk mencegah ini, dan
      # pemindahan polos menghapusnya. Tak ada test yang merah — test tak
      # pernah berpindah dari satu id ke id lain.
      #
      # Enam rute [id] lain belum dipindah saat penjaga ini ditulis.
      #
      # Bukti merah: pencocokan identitas dibuang → exit 1; pencocokan hanya
      # ditulis di KOMENTAR → tetap exit 1; dipulihkan → exit 0.
      - name: Rute [id] tak menampilkan data basi
        run: cd ../web && node scripts/uji-rute-id-tak-basi.mjs

      # Sesi habis TIDAK boleh melahirkan putaran muat-ulang.
      #
      # Dilaporkan founder 2026-09-04: /dashboard "reload terus". Sebabnya
      # token akses kedaluwarsa (~1 jam) sementara cookie-nya berumur 7 hari.
      # `middleware.ts` hanya memeriksa cookie ADA atau tidak — bukan sah
      # atau tidak — jadi selama cookie belum terhapus, /login selalu
      # dilempar balik ke home:
      #
      #   401 semua API → 400 refresh → 200 logout (TAK ditunggu)
      #   → 307 /login → 200 /dashboard → ulang, ~3x per detik
      #
      # Diukur dari browser sungguhan:
      #   cookie dibiarkan   : 64 navigasi / 12 detik → /dashboard
      #   cookie dibersihkan :  2 navigasi / 12 detik → /login
      #
      # Tak satu pun dari 200+ penjaga, tsc, maupun seluruh test menangkapnya:
      # kodenya SAH di tiap lapisan, yang salah cuma urutan dua operasi async
      # — dan akibatnya baru muncul sejam sesudah login, di browser pengguna.
      #
      # Bukti merah: keempat syarat dibuang satu per satu → exit 1 semuanya;
      # dipulihkan → exit 0. (ambang NOL)
      - name: Alih keluar saat sesi habis tak berputar
        run: node scripts/audit-alih-auth-tak-berputar.mjs

      # Sisi SERVER dari putaran yang sama — dan ini yang sebenarnya memutus.
      #
      # `clearCookie` dipanggil hanya dengan `{ path: '/' }`, sementara
      # cookie-nya dipasang `COOKIE_OPTS` (httpOnly + secure + sameSite).
      # Peramban mencocokkan cookie yang dihapus lewat ATRIBUTNYA; `Secure`
      # yang hilang membuatnya menganggap itu cookie LAIN — penghapusan tak
      # mengenai sasaran, balasan tetap 200, nol galat.
      #
      #     dipasang : HttpOnly; Secure; SameSite=Lax; Path=/
      #     dihapus  :           ~~~~~~  SameSite=Lax; Path=/
      #
      # Perbaikan di sisi KLIEN saja tak cukup: sesudah `clearAuthAndRedirect`
      # dibetulkan, produksi MASIH 80 navigasi dalam 12 detik. Cookie HttpOnly
      # hanya bisa dihapus server.
      #
      # DUA jalur, dan yang kedua nyaris terlewat: `/auth/logout` dan
      # `/auth/refresh` yang gagal — justru jalur kedua yang berjalan saat
      # sesi habis.
      #
      # Bukti merah: tiap jalur dirusak SENDIRI-SENDIRI → exit 1 (penjaga
      # menilai per-panggilan, bukan per-berkas); dipulihkan → exit 0.
      # (ambang NOL)
      - name: clearCookie cocok dengan setCookie
        run: node scripts/audit-hapus-cookie-cocok-pasang.mjs
      # URL verifikasi dokumen tak boleh dipaku, dan /verify wajib publik.
      #
      # Dilaporkan founder 2026-09-04 dari PDF invoice sungguhan:
      #
      #     Verifikasi keabsahan dokumen: puraloka.app/verify/invoice/<id>
      #
      # `puraloka.app` tak pernah ada. QR code di dokumen yang sama menunjuk
      # domain mati itu juga — dua tempat terpisah, jadi memperbaiki satu
      # meninggalkan yang lain tanpa gejala.
      #
      # Ditelusuri, ada dua cacat lagi: `/verify` tak terdaftar publik
      # (produksi membalas 307 ke /login — halaman bukti keaslian yang
      # menuntut login, padahal yang membukanya KLIEN), dan rute publik yang
      # dibuka saat SUDAH login dilempar ke home (staf tak pernah bisa
      # membuka tautan yang mereka kirim sendiri).
      #
      # Taruhannya bukan kenyamanan: tautan verifikasi yang tak bisa dibuka
      # pada dokumen TAGIHAN membuat penerimanya curiga dokumennya palsu —
      # kebalikan persis dari gunanya.
      #
      # Bukti merah: keempat cacat disuntik sendiri-sendiri → exit 1 semua.
      # Penjaganya sendiri sempat LOLOS pada bentuk asli cacatnya (regex
      # rakus: `[a-z0-9.-]*` menelan `.app/verify/...` sampai TLD tak lagi
      # di ujung) dan sempat MENUDUH komentar yang menjelaskan cacat ini.
      # Keduanya diperbaiki sebelum didaftarkan. (ambang NOL)
      - name: URL verifikasi dokumen tak dipaku
        run: node scripts/audit-url-dokumen-tak-dipaku.mjs

      # Tiap nilai enum `tax_scheme` wajib tertangani di tarif, label, dan tipe.
      #
      # Migrasi 566 menambah `tanpa_pajak` atas permintaan founder ("pas bikin
      # proyek juga bisa gapake pajak"). Menambah nilai enum itu SATU baris;
      # yang tak terlihat, belasan tempat memakai pola
      #
      #     scheme === 'ppn' ? A : B
      #
      # yang diam-diam memperlakukan nilai BARU sebagai cabang else. Diukur saat
      # 566 ditulis: KEDUA `getTaxRate` berbunyi begitu, jadi proyek yang
      # pajaknya sengaja dimatikan tetap dipotong PPh Final 2%. Tak ada galat —
      # angkanya sah, jurnalnya seimbang, yang salah cuma jumlah uang yang
      # ditagihkan ke klien.
      #
      # Nilai berikutnya pasti ada (PPN 12%, PPh 21, bebas-PPN kawasan), dan
      # cacatnya akan berbentuk sama persis.
      #
      # Bukti merah: ketiga sumber penanganan dibuang sendiri-sendiri → exit 1.
      # Penjaganya sempat LOLOS karena komentar yang menjelaskan baris yang
      # dihapus masih menyebut nilainya — komentar kini dibuang sebelum
      # dipindai. (ambang NOL)
      - name: Skema pajak tertangani lengkap
        run: node scripts/audit-skema-pajak-lengkap.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Dialog bawaan peramban DILARANG di web.
      #
      # Diminta founder 2026-09-04. Diukur saat itu: 32 confirm/alert + 13
      # prompt di 22 berkas, termasuk pada keputusan uang.
      #
      # Alasannya bukan selera: tombolnya berbahasa SISTEM OPERASI (pengguna
      # Indonesia membaca "OK / Cancel"), ia tak bisa membedakan tindakan
      # merusak dari yang biasa, ia MEMBEKUKAN seluruh tab, dan peramban
      # MENEKAN dialog yang muncul berkali-kali — confirm() yang ditekan
      # memulangkan false DIAM-DIAM, jadi tindakannya tak pernah berjalan
      # tanpa satu pun gejala.
      #
      # Penggantinya `tanya()` / `minta()` / `kabari()` di components/tanya.
      # Fungsi LOKAL bernama confirm (mis. `void confirm(gr.id)` di halaman
      # penerimaan) sengaja tak dituduh.
      #
      # Bukti merah: ketiga jenis disuntik sendiri-sendiri → exit 1 dengan
      # baris yang tepat; dipulihkan → exit 0. (ambang NOL)
      - name: Dialog bukan bawaan peramban
        run: node scripts/audit-dialog-bukan-bawaan.mjs

      # Dropdown bawaan DILARANG — pakai `Pilihan` yang punya kotak pencarian.
      #
      # Diminta founder 2026-09-04: "semua dropdown saya mau searchable juga",
      # lalu ditegaskan: semua, tanpa kecuali. Diukur sebelum: 418 kemunculan
      # di 202 berkas.
      #
      # Alasannya bukan selera: sebagian memuat RIBUAN pilihan — pemilih
      # analisa di Komposer 3.040 baris — dan elemen bawaan hanya bisa
      # diloncati dengan mengetik huruf awal. Orang lapangan yang tahu
      # barangnya tapi tak hafal urutan katalog praktis tak bisa memakainya.
      #
      # Penyebutan dalam KOMENTAR sengaja dibiarkan: beberapa berkas
      # menjelaskan kenapa mereka tak memakainya lagi, dan penjaga yang
      # memerahkan dokumentasi tentang dirinya sendiri mengajari orang
      # menghapus dokumentasi itu.
      #
      # Bukti merah: satu tag dikembalikan ke bentuk bawaan → exit 1 dengan
      # baris yang tepat; dipulihkan → exit 0. (ambang NOL)
      - name: Dropdown bisa dicari
        run: node scripts/audit-dropdown-bisa-dicari.mjs

      # Keputusan persetujuan hanya lewat SATU pintu (utils/approval.ts).
      # Menulis `approved_by` langsung berarti entitas yang menurut
      # konfigurasi butuh dua level bisa lolos dengan satu ketukan — dan
      # konfigurasinya tetap terlihat benar di halaman pengaturan.
      #
      # Ratchet PER BERKAS: ratchet berbasis jumlah lolos saat satu modul
      # diperbaiki dan satu dirusak dalam PR yang sama.
      - name: Approval satu pintu
        run: node scripts/audit-approval-satu-pintu.mjs


      # Jejak audit tak boleh hilang diam-diam.
      # `audit_logs.record_id` bertipe uuid, dan LIMA modul memakai `recordId`
      # untuk identitas yang bukan UUID (kode, entity_type, nama kunci).
      # Insert-nya ditolak basis, galatnya masuk log aplikasi, dan barisnya
      # tak pernah sampai — NOL baris audit untuk modul yang justru mengubah
      # cara sistem MEMUTUSKAN. Tak ada gejala: orang membaca audit untuk
      # memastikan sesuatu terjadi, bukan membaca log untuk memastikan audit
      # tertulis.
      - name: Jejak audit tak hilang
        run: node scripts/audit-jejak-tak-hilang.mjs

      # TJS punya DUA tabel harga hardcode yang tak sepakat: Opus $5/$25 dipakai
      # MENCATAT biaya, $15/$75 dipakai UI. Biaya yang tercatat 3x lebih rendah
      # dari yang admin lihat — dan tak ada yang salah secara teknis, keduanya
      # "bekerja". Angka biaya yang keliru lebih berbahaya daripada tak ada
      # angka: ia dipercaya, dan keputusan diambil di atasnya.
      - name: Satu sumber harga AI
        run: node scripts/audit-satu-sumber-harga.mjs

      # Batas biaya yang diperiksa SESUDAH panggilan bukan batas — ia laporan
      # kerusakan. Satu pesan bisa memicu 16 ronde tool-calling, jadi tenant
      # berbatas Rp 100 ribu bisa tembus empat kali lipat dalam satu percakapan
      # sebelum barisnya terlihat. Penjaga ini memeriksa URUTAN, bukan sekadar
      # keberadaan: tiap panggilan wajib punya gerbang tersendiri sebelumnya.
      - name: Gerbang biaya AI
        run: node scripts/audit-gerbang-biaya-ai.mjs

      # L-6. Memanggil SDK model langsung melewati EMPAT hal sekaligus: timeout
      # (TJS tak punya — bawaan SDK 10 menit x 16 ronde), `isError` (C-6:
      # adaptor selain Anthropic menelannya, jadi model tak tahu tool-nya
      # gagal), pemetaan alasan gagal, dan normalisasi argumen tool (gaya
      # OpenAI mengirim STRING JSON — `args.qty` jadi undefined tanpa galat).
      # Jalur pintas itu tetap bekerja sampai penyedianya lambat atau tool-nya
      # gagal, jadi ia tak pernah terasa salah saat ditulis.
      - name: Satu jalan ke model (L-6)
        run: node scripts/audit-satu-jalan-ke-model.mjs

      # I-1 (spec §5.3). Satu-satunya pertahanan prompt injection yang TIDAK
      # bergantung pada model berperilaku baik: tak ada tool yang menulis, jadi
      # bujukan seberhasil apa pun tak menghasilkan tulisan. Titik lemahnya bukan
      # modelnya melainkan sesi berikutnya yang menambah tool tulis karena
      # kelihatan berguna — kalimat wajar, tak ada test yang merah, dan I-1
      # lenyap dalam satu commit. Sekaligus T-1: tool wajib lewat TenantDb.
      - name: Tool AI read-only & sadar tenant
        run: node scripts/audit-tool-ai-read-only.mjs

      # Pasangan I-1 di sisi PROMPT. Sejak migrasi 382 watak asisten bisa
      # dipilih tenant (pelapor/penasihat/teman), dan pelonggaran itu diminta
      # founder. Yang TIDAK boleh ikut longgar adalah pagar faktanya —
      # "jangan mengarang angka", "sebutkan sumber", aturan blok <data>.
      #
      # Keduanya dulu satu konstanta, jadi melonggarkan gaya berarti mencabut
      # pagar. Sekarang terpisah, dan penjaga ini memastikan pemisahannya tak
      # bocor kembali: mode baru yang lupa berpagar, atau pagar yang disambung
      # di balik ternary, keduanya merah di sini.
      - name: Pagar fakta utuh di semua mode bicara
        run: node scripts/audit-pagar-fakta-utuh.mjs

      # Ingatan asisten (migrasi 385) bocor lewat PROMPT, bukan lewat tool —
      # jadi tak satu pun gerbang izin yang sudah ada melihatnya. Gejalanya
      # NOL: tak ada 403, tak ada galat, tak ada baris log. Yang terjadi hanya
      # asisten yang suatu hari menyebut angka margin kepada mandor, dan tak
      # seorang pun bisa menunjuk izin mana yang jebol — karena tak ada.
      #
      # Penjaganya sendiri sempat HIJAU-KARENA-BUTA DUA KALI saat dibuat:
      # pertama karena dicocokkan ke seluruh berkas (kata yang sama ada di
      # komentar), lalu karena `'</ingatan>'` memuat `<ingatan>` sebagai
      # substring. Keduanya ketahuan hanya lewat mutasi uji, bukan lewat
      # membaca ulang.
      - name: Ingatan asisten tak bocor (ambang NOL)
        run: node scripts/audit-ingatan-tak-bocor.mjs

      # PRASYARAT proaktivitas. Repo ini NOL jam tenang, NOL opt-out, NOL
      # batas frekuensi sampai migrasi 389 — dan `kirimWa` tak punya throttle
      # sama sekali. Penyedia bawaan (Evolution) juga tak punya batas jendela
      # 24 jam seperti WhatsApp Business resmi.
      #
      # Menambah satu `kirimWa` di penjadwal adalah lima baris yang tampak
      # wajar. Yang terjadi sesudahnya: pesan pukul 03:00, berulang, ke orang
      # yang tak pernah diminta persetujuannya — nol galat, nol test merah.
      # Repo ini sudah pernah mengirim 28 WhatsApp sungguhan seperti itu.
      - name: Pesan proaktif lewat gerbang (ambang NOL)
        run: node scripts/audit-proaktif-lewat-gerbang.mjs

      # T-1. AMBANG NOL, berbeda dari `audit-gerbang-tenancy` yang memakai
      # ratchet — dan bedanya disengaja: untuk utang lama "tak boleh bertambah"
      # masuk akal, untuk jalur AI tidak. SATU tool yang bocor sudah cukup
      # membuat asisten tenant A menjawab dengan angka tenant B, dengan nada
      # yang sama percaya dirinya, dan ratchet mengizinkannya selama jumlahnya
      # tetap. Memindai PEMAKAIAN, bukan pembungkus, jadi arrow-const dan
      # method objek sama-sama terlihat (titik buta penjaga lama).
      - name: Tenancy jalur AI (T-1)
        run: node scripts/audit-tenancy-jalur-ai.mjs

      # TJS baru merapikan pengiriman WA SETELAH tersebar ke 10 titik di
      # aplikasi + 30 di n8n. Header lib/wa/send.ts mereka mencatat akibatnya:
      # satu titik memakai bentuk muatan yang menyimpang, Evolution menolaknya,
      # dan alert stok TIDAK PERNAH terkirim — gagalnya senyap. Ketersebaran
      # itu tumbuh satu titik demi satu titik, masing-masing tampak wajar saat
      # ditulis.
      - name: Satu pintu keluar WhatsApp
        run: node scripts/audit-satu-pintu-wa.mjs

      # Kriteria D1 menunjuk cacat nyata: approval.ts:62 membaca
      # request.currentUser.role apa adanya. Untuk sesi WEB itu aman —
      # `authenticate` yang mengisinya dari basis. Untuk sesi SINTETIS tidak:
      # pesan WhatsApp tak lewat authenticate, jadi siapa pun yang menyusun
      # objek request-nya menentukan perannya sendiri. Satu webhook yang
      # dipalsukan cukup mengirim `admin` untuk mendapat seluruh permission,
      # tanpa galat apa pun.
      - name: Sesi sintetis aman
        run: node scripts/audit-sesi-sintetis-aman.mjs

      # Webhook WhatsApp satu-satunya route yang tak lewat `authenticate` —
      # penyedia bukan pengguna, ia tak punya sesi. Akibatnya tiap gerbang
      # ditegakkan dengan tangan, dan yang ditegakkan dengan tangan hanya
      # sekuat penjaganya.
      #
      # Ambangnya NOL, bukan ratchet: SATU webhook tanpa gerbang cukup untuk
      # membuka basis ke siapa pun yang menebak URL-nya. Rujukan TJS-nya punya
      # dedup tapi NOL verifikasi asal (diukur 2026-08-10, 158 baris, nol
      # `signature`/`hmac`/apikey) — celah yang sengaja tak ditiru.
      #
      # Kelima gerbangnya terbukti bisa MERAH: `bash scripts/bukti-mutasi-webhook.sh`.
      # G-5 sempat HIJAU-KARENA-BUTA (memotong dari baris `import`, bukan dari
      # pemanggilan) dan hanya mutasi yang menemukannya.
      - name: Webhook publik bergerbang
        run: node scripts/audit-webhook-bergerbang.mjs

      # Satu-satunya jalur di mana sebuah PESAN berujung pada uang berpindah.
      # Empat cacat TJS yang dirujuk kriteria E1 semuanya senyap: nominal
      # ditebak dari nama field (jenis baru = null = lolos), batas melekat pada
      # nomor (daftarkan nomor kedua = plafon ganda), token diperiksa lalu
      # dipakai (dua klaim bersamaan = dua kali), approve memanggil
      # `recordApproval` (saldo & rantai bertingkat terlewat).
      #
      # Ambang NOL. Terbukti bisa merah: `bash scripts/bukti-mutasi-setujui.sh`.
      # E-6 sempat HIJAU-KARENA-BUTA — ia MENGHITUNG kemunculan gerbang, dan
      # berkas ini punya tiga rute, jadi mencabut satu masih menyisakan dua.
      # Penghitungan agregat tak bisa membuktikan pernyataan "setiap".
      - name: Jalur preview→setujui bergerbang
        run: node scripts/audit-preview-setujui.mjs

      # Kriteria C2 menyebutnya sendiri: "T-2 adalah kebocoran lintas-tenant
      # PALING MUNGKIN di seluruh rencana ini." Alasannya bukan kodenya lebih
      # sulit, melainkan kebocorannya TAK BERGEJALA — pencarian vector
      # mengembalikan "paling mirip", dan spesifikasi beton K-300 di dua
      # perusahaan konstruksi hampir identik. Kalau dokumen tenant lain menang,
      # jawabannya tetap terdengar benar, dan tak ada yang melaporkan jawaban
      # yang terdengar benar.
      #
      # Ambang NOL. Terbukti bisa merah: `bash scripts/bukti-mutasi-rag.sh`.
      # R-4 menjaga pelajaran yang mahal: `auth_company_id()` KOSONG pada klien
      # service-role, jadi memakainya di RPC membuat fungsinya mengembalikan
      # nol baris untuk SETIAP pemanggilan sah — fitur mati, test tetap hijau.
      - name: Jalur RAG bertenancy (T-2/T-4/T-5)
        run: node scripts/audit-rag-tenancy.mjs

      # Registry penyedia adalah tempat yang PALING MENGGODA untuk menaruh
      # kunci API: ia sudah menyimpan alamat, instance, dan nama penyedia, jadi
      # menambahkan satu kolom `api_key` terasa seperti kerapian.
      #
      # Tapi kredensial di dua tempat berarti satu yang tak terjaga —
      # `audit-kredensial-tak-bocor` berambang NOL dan hanya mengawasi
      # `app_credentials`; ia tak tahu apa-apa tentang tabel kedua.
      #
      # Ambang NOL. Terbukti bisa merah: `bash scripts/bukti-mutasi-registry.sh`.
      # P-5 sempat HIJAU-KARENA-BUTA — ia memeriksa KEMUNCULAN nama tabel, dan
      # nama itu masih muncul di endpoint yang MEMBACA jejak. Menyebut sebuah
      # tabel bukan menulis ke sana.
      - name: Registry penyedia tak menyimpan rahasia
        run: node scripts/audit-registry-penyedia.mjs

      # Founder memilih "CRUD terbatas + token konfirmasi" (2026-08-10), dan
      # itu MELAMPAUI TJS yang nol create/update/delete. Yang membuatnya boleh
      # ada cuma satu hal: jalur tulisnya tak bisa dipicu KALIMAT model.
      #
      # I-1 tetap utuh — tak satu pun TOOL menulis, dan
      # `audit-tool-ai-read-only` tetap berambang NOL. Penjaga ini menjaga sisi
      # lainnya: jalur tulis yang memang ada tetap menuntut token yang diklaim
      # ATOMIK, tetap terbatas daftar putih, dan tetap nol hapus.
      #
      # Ambang NOL. Terbukti bisa merah: `bash scripts/bukti-mutasi-tulis.sh`.
      - name: Jalur tulis asisten berkonfirmasi
        run: node scripts/audit-tulis-berkonfirmasi.mjs

      # n8n hanya disentuh lewat `lib/otomasi-n8n.ts`; jejak jalan ditulis
      # SEBELUM panggilan (proses yang mati di tengah harus meninggalkan bukti
      # bahwa alurnya mungkin sudah jalan — kalau tidak, orang memicunya lagi
      # dan pelanggan menerima pesan yang sama dua kali); dan rute pemicu
      # bergerbang `otomasi:alur:jalankan`, bukan izin melihat.
      #
      # Ambang NOL. Terbukti bisa merah: `bash scripts/bukti-mutasi-otomasi.sh`.
      - name: Otomasi n8n satu pintu
        run: node scripts/audit-otomasi-satu-pintu.mjs

      # Kunci yang DIBACA kode wajib punya tempat diisi di halaman Kredensial.
      # Tanpa ini, halaman menyuruh orang mengisi sesuatu yang tak punya kotak
      # — N8N_BASE_URL begitu selama S7, dan pesan galatnya menunjuk ke
      # halaman yang memang tak memuatnya. Pada jalan PERTAMA penjaga ini juga
      # menemukan AI_PROVIDER_BASE_URL: katalog menawarkan nama LAIN
      # (AI_CUSTOM_BASE_URL), jadi kotak yang diisi orang tak pernah terpakai.
      #
      # Ambang NOL: kunci tanpa tempat isi selalu cacat, tak ada kasus sahnya.
      - name: Kredensial yang dibaca punya tempat diisi
        run: node scripts/audit-kredensial-punya-tempat.mjs

      # Byte kontrol TAK KASAT MATA di kode sumber (NUL, BEL, ESC, dst).
      #
      # Lahir dari cacat nyata 2026-08-12: dedup automation kasbon menulis
      # kunci ber-NUL (`${type}<NUL>${id}`) lalu mencarinya dengan SPASI.
      # Panjang string sama, tampilan identik di editor/diff/log, TypeScript
      # menerima keduanya sebagai `string` — dan notifikasi terkirim ulang
      # tiap denyut penjadwal tanpa satu pun gejala.
      #
      # Biayanya lima putaran diagnosis salah sebelum ketemu. Asalnya bukan
      # diketik manusia melainkan skrip `node -e` yang memangsa spasi jadi
      # NUL — cacat yang lahir dari ALAT, jadi ia akan berulang.
      #
      # Penjaga ini juga langsung menemukan satu contoh LAMA di
      # `extract-harga-analisa-cibuluh.mjs` pada jalan pertamanya.
      #
      # Ambang NOL: tak ada alasan sah menaruh byte kontrol mentah di kode.
      # Kalau memang perlu, tulis sebagai escape TERLIHAT (`' '`).
      - name: Nol byte kontrol tersembunyi di kode sumber
        run: node scripts/audit-byte-kontrol.mjs

      # Jatuhan .env tak boleh bertambah. process.env SATU untuk seluruh
      # proses, jadi tiap kunci berjatuhan adalah satu kunci yang diam-diam
      # dibagi antar-tenant: ANTHROPIC memakai kunci pemilik server
      # (tagihannya ikut), WA_* mengirim WhatsApp lewat NOMOR TENANT LAIN —
      # dan yang kedua tak bisa ditarik kembali.
      #
      # Ratchet, bukan larangan: lima yang ada adalah jaring pengaman
      # satu-instalasi, dan saklar KREDENSIAL_TANPA_JATUHAN_ENV=1 mematikannya
      # untuk operator yang melayani banyak perusahaan.
      - name: Jatuhan env kredensial tak bertambah
        run: node scripts/audit-jatuhan-env-tak-bertambah.mjs

      # Nominal dari permintaan yang dibaca `parseFloat` mentah. Rantai cacatnya
      # dibuktikan 2026-08-08 di Node DAN di Postgres: `qty: "abc"` → NaN → cek
      # saldo LOLOS (setiap perbandingan dengan NaN bernilai false) → Postgres
      # `numeric` MENERIMA NaN → `SELECT sum(...)` seluruh laporan jadi NaN.
      # Requestnya membalas 201, jadi tak ada yang tahu sampai laporan dibuka
      # berminggu-minggu kemudian. Ratchet: yang lama boleh tinggal, yang baru
      # wajib lewat `lib/nominal.ts`.
      - name: Nominal mentah (parseFloat atas nilai dari permintaan)
        run: node scripts/audit-nominal-mentah.mjs

      # `to_regclass('nama')` tanpa skema mengikuti search_path, dan pencarian
      # itu MENEMBUS ke schema lain. Guard yang bermaksud "objek ini ada di
      # sini?" jadi menjawab "ada di mana pun?" — di production keduanya sama,
      # jadi cacatnya diam sampai ada schema kedua. Repo ini PUNYA schema
      # kedua: schema test. Pola itu membuat 24 integration test tak pernah
      # berjalan selama berbulan-bulan, dan gejalanya "skipped" bukan "failed".
      # Pemeriksaan saldo yang bisa DILEWATI DIAM-DIAM: `if (acc && saldo < x)`
      # terlihat defensif, tapi saat `acc` null kondisinya jadi false —
      # pemeriksaan dilewati dan transaksi lolos. Ditemukan 2026-08-02: TUJUH
      # penjaga seperti itu di jalur uang, termasuk approve kasbon yang tetap
      # memotong saldo saat kasbonnya sendiri tak ketemu.
      #
      # Ambang NOL, bukan ratchet: tak ada kasus sah untuk melanjutkan saat
      # akunnya tak ditemukan. Yang benar menolak (404).
      # Migrasi yang memaku `public.` menulis ke schema itu walau rantai migrasi
      # sedang dibangun di tempat lain — sehingga perubahannya TAK BISA
      # diverifikasi test apa pun. Ditemukan 2026-08-02: migrasi 100 adalah
      # bugfix untuk `ON CONFLICT` yang membuat setiap approve kasbon gagal;
      # perbaikannya benar tapi tak pernah sampai ke schema test, jadi selama
      # setahun tak ada test yang bisa membuktikannya bekerja.
      - name: Migrasi sadar-schema (skema tak boleh dipaku)
        run: node scripts/audit-migrasi-skema-dipaku.mjs

      # Nomor migrasi ganda membuat ci-project-setup mencatat keduanya sebagai
      # satu versi — yang kedua DILEWATI SENYAP di setiap lingkungan baru. Itu
      # mekanisme yang sama dengan cacat P0 047 vs 167 (dua definisi `accounts`
      # bertabrakan, satu menang tanpa pesan galat).
      #
      # Lompatan nomor membuat orang menyimpulkan jumlah dari nomor terakhir —
      # audit 2026-08-02 tergelincir persis di situ (melapor 174, nyatanya 171).
      # Lompatan LAMA (30, 59, 64) dikecualikan beralasan; yang dijaga yang baru.
      - name: Penomoran migrasi (nol ganda, nol lompatan baru)
        run: node scripts/audit-penomoran-migrasi.mjs

      # Arah sebaliknya dari penjaga di atas, dan yang menjawab pertanyaan
      # sesungguhnya: bukan "apakah nomornya rapi" melainkan "apakah tiap
      # migrasi BENAR-BENAR JALAN di lingkungan baru".
      #
      # Diukur 2026-08-29: 13 migrasi TAK PERNAH jalan di basis kosong —
      # seluruh modul struktur, take-off sektor, mitra, tujuh otomasi
      # bertenggat. Di basis pengembangan semuanya tampak sehat karena
      # tabelnya sudah terlanjur ada; yang rusak justru SERVER BARU.
      #
      # Tak menyentuh basis, jadi tak butuh kredensial apa pun.
      - name: Replay bersih — nol migrasi dilewati senyap
        run: node scripts/audit-replay-bersih.mjs

      # Kunci fitur paket menghubungkan DUA repo: konsol vendor MENJANJIKAN
      # ("paket X dapat 3 proyek"), ERP MENEGAKKAN. Keduanya bertemu hanya
      # lewat string kunci — tak ada foreign key, karena basisnya terpisah.
      #
      # Kunci yang menyimpang tak mengeluarkan galat: ERP mencari, tak
      # menemukan, lalu pulang "TAK DIBATASI". Pelanggan paket 3-proyek bisa
      # membuat 300, dan yang bergejala cuma tagihan yang tak naik-naik.
      #
      # Repo konsol vendor terpisah, jadi penjaga ini MELEWATI (bukan gagal)
      # bila repo itu tak ter-checkout — dan mengatakannya, supaya "0 kunci
      # diperiksa" tak terbaca sebagai lulus.
      - name: Kunci fitur paket sepakat ERP ↔ konsol vendor
        run: node scripts/audit-kunci-fitur-sepakat.mjs

      # R-001 syarat 3 — dua migrasi mendefinisikan tabel yang sama.
      #
      # `CREATE TABLE IF NOT EXISTS` melindungi dari "sudah dibuat oleh migrasi
      # INI", BUKAN dari "sudah dibuat oleh migrasi LAIN dengan bentuk berbeda".
      # Pendefinisi belakangan lalu no-op senyap: tanpa galat, tanpa test merah.
      #
      # Sapuan pertama atas 171 migrasi menemukan 13 tabel bertabrakan. Sepuluh
      # sudah terjaga (149 membuang bentuk 045; 143 pakai to_regclass guard; 093
      # identik dengan 081). Tiga sisanya adalah cacat P0 GL yang nyata:
      # accounts, journal_entries, journal_entry_lines (047 vs 167).
      - name: Tabrakan definisi tabel (IF NOT EXISTS tanpa penegas bentuk)
        run: node scripts/audit-tabrakan-definisi-tabel.mjs

      # ADR-004 — otorisasi HANYA lewat requirePermission.
      #
      # Diuji 2026-08-03 (langkah 5 mandat CI): menyisipkan `u.role === 'admin'`
      # ke berkas route LOLOS seluruh 14 penjaga yang ada. Aturan sepenting ini
      # ternyata selama ini hanya konvensi, bukan gerbang.
      #
      # Ratchet (lantai 52), bukan ambang nol: utang lama dibersihkan terjadwal
      # di F3-1. Ambang nol hari ini = CI merah permanen = penjaga dimatikan orang.
      - name: Literal peran sebagai gerbang otorisasi (ADR-004)
        run: node scripts/audit-literal-peran.mjs

      # Rencana yang ditulis rapi lalu tak pernah dikerjakan — bukan karena
      # diputuskan ditunda, melainkan karena tak ada yang tahu ia ada. Repo ini
      # sudah punya preseden: ERP_MASTER_PLAN Modul 9a/9b, AHSP-EDITION-BUILDER
      # §3.5, GOLDEN-FILE-SPEC paritas end-to-end.
      #
      # Yang dituntut terhubung HANYA dokumen yang memuat pekerjaan TERBUKA.
      # Arsip, aturan tetap (Constitution/ADR), dan laporan status dikecualikan
      # dengan alasan tertulis — mereka dirujuk, bukan dikerjakan.
      # Indeks SELURUH docs/ (236 dokumen) tak boleh basi. Dokumen baru yang
      # ditambahkan tanpa memperbarui indeks adalah persis cara 134 dokumen
      # sempat jadi tak terlihat — dan laporan "dikecualikan beralasan"
      # membuatnya terdengar seperti sudah tertangani.
      # Sepuluh sub-menu ber-ledger & lintas-modul (ACL, CVR, profitabilitas
      # per cost code, contingency, eskalasi harga, claims, retensi subkontrak,
      # rekonsiliasi bank, kepatuhan subkontraktor, markup/margin) WAJIB
      # dirancang sebelum dikerjakan — sekali angka masuk, mengubah modelnya
      # mahal.
      #
      # Penjaga ini menangkap kalau salah satunya naik status tanpa rancangan.
      # Pada jalan pertamanya ia menemukan TIGA yang sudah terlanjur digarap —
      # didaftarkan di docs/RANCANGAN-DIKERJAKAN.md beserta apa yang masih
      # terbuka, bukan disembunyikan.
      - name: Sub-menu berisiko punya rancangan
        run: node scripts/audit-rancangan-submenu.mjs

      # F5-1 — dua penjaga sub-menu, dua pertanyaan BERBEDA. Jangan tertukar:
      #
      #   audit-rancangan-submenu : yang SUDAH digarap, apakah dirancang dulu?
      #   audit-triase-submenu    : yang BELUM digarap, sudah diputuskan
      #                             urutannya (INTI/PEMBEDA/TUNDA)?
      #
      # Yang kedua menjawab risiko C-7 — bukan salah memilih fitur, melainkan
      # mengerjakannya dalam urutan yang salah sampai kehabisan tenaga sebelum
      # produknya bisa dijual. Terbukti bisa merah: exit 1 saat satu sub-menu
      # dihapus dari triase, dan saat satu item ada di dua golongan.
      - name: Sub-menu belum digarap sudah ditriase
        run: node scripts/audit-triase-submenu.mjs

      # Kolom yang rute BACA DARI BODY tapi tak satu pun berkas UI menyebut
      # namanya — artinya rute menunggu sesuatu yang tak akan pernah datang.
      #
      # Pola ini lolos TIGA KALI dalam dua hari, dengan seluruh penjaga hijau
      # setiap kalinya:
      #
      #   2026-08-07  rfq.po_id     DIBACA di UI, tak pernah DITULIS siapa pun
      #   2026-08-08  POST /rfq/:id/penawaran  ber-test, NOL tombol memanggilnya
      #   2026-08-08  rfq.mr_id     rute menerimanya, UI nol rujukan
      #                             → 3 dari 3 RFQ ber-mr_id NULL
      #
      # Ia lolos JUSTRU karena tiap bagiannya ber-test: test satuan
      # membuktikan potongan bekerja, bukan bahwa potongan itu terhubung.
      #
      # Ratchet dengan ALASAN WAJIB per kolom — lantai tanpa alasan adalah
      # daftar yang tak bisa ditinjau siapa pun. Terbukti bisa merah lewat
      # tiga mutasi: kolom baru di body, alasan dihapus, lantai diturunkan
      # diam-diam.
      - name: Kolom yang diterima API punya jalan pengisian di UI
        run: node scripts/audit-kolom-tak-tersambung.mjs

      # `viaProject(tabel, id)` menyusun `.eq(kolom, id)` dengan `kolom` dari
      # `lewat:` di peta tenancy. 22 tabel mewarisi lewat kolom BUKAN
      # `project_id` (`assignment_id`, `invoice_id`, `rap_budget_id`, …), dan
      # mengoper `projectId` ke sana membandingkan dua jenis id berbeda:
      # NOL BARIS, tanpa satu pun error.
      #
      # Bug ini sudah TERULANG meski sudah didokumentasikan panjang lebar di
      # tempat kejadiannya:
      #   2026-07-30  rap.ts:102       estimate_items ← projectId
      #   2026-08-08  cost-control.ts  weekly_wage_reports ← projectId
      #               (menyembunyikan Rp 243 juta upah dari laporan biaya)
      #
      # Dokumentasi yang bagus tidak mencegah pengulangan. Terbukti bisa merah
      # lewat dua mutasi: panggilan salah disuntik, dan peta tenancy diubah
      # bentuknya (penjaga exit 2 — menolak berjalan buta, bukan melaporkan
      # "0 pelanggaran" dengan percaya diri).
      - name: Argumen viaProject cocok dengan kolom tenancy-nya
        run: node scripts/audit-viaproject-argumen.mjs



      # Status sub-menu yang membusuk sementara kode maju. Terbukti terjadi
      # TUJUH kali (F5-1 §3a satu item, §3b enam item) tanpa satu pun penjaga
      # menabraknya — skrip ini sudah ada sejak lama tetapi tak pernah
      # dijalankan CI, dan keenam modul basi tak punya entri PETA sehingga
      # ia melaporkan "BASI: 0" dengan percaya diri.
      #
      # Ratchet dua angka: `basi` (🔴 tapi buktinya ada) dan `takDipetakan`
      # (belum punya entri PETA, jadi tak terperiksa sama sekali).
      - name: Status sub-menu vs kode (F8-1)
        run: node scripts/audit-taksonomi-vs-kode.mjs

      # Penjaga di atas membaca `ERP-KONTRAKTOR-TAKSONOMI-MENU.md`. Layar yang
      # DIBACA FOUNDER adalah `/peta-modul`, yang sumbernya `peta-menu.ts` —
      # berkas lain, tak pernah diperiksa siapa pun.
      #
      # 2026-08-12 founder membuka layar itu dan bertanya "masih banyak yang
      # belum dikerjakan, bener?". Dari empat kartu "Direncanakan", TIGA sudah
      # punya halaman yang jalan. Penjaga di atas hijau sepanjang waktu.
      #
      # Dua dokumen, dua sumber kebenaran, satu penjaga. Ini penjaga keduanya.
      #
      # Terbukti bisa merah lewat dua mutasi: status `hidup` diubah jadi
      # `rencana` (→ MERAH), dan satu `key` dirusak namanya sehingga tak
      # terbaca (→ MERAH pada pemeriksaan cakupan, bukan "0 pelanggaran"
      # dengan percaya diri — versi pertamanya membaca 224 dari 226 dan
      # melewatkan tepat entri yang salah).
      - name: Peta Modul vs halaman nyata (F8-1b)
        run: node ../web/scripts/audit-peta-modul-vs-halaman.mjs

      # Arah SEBALIKNYA dari penjaga di atas, dan lubang di antara keduanya
      # yang dipijak founder 2026-08-16: ia mengeklik `/aset/perawatan` di
      # sidebar lalu terlempar ke dashboard.
      #
      # Penjaga F8-1b memeriksa entri Peta Modul `rencana` yang ternyata PUNYA
      # halaman. `audit-nav-yatim` memeriksa halaman yang tak punya menu.
      # Tak satu pun memeriksa MENU AKTIF yang halamannya tak pernah dibuat —
      # dan diukur, ada LIMA. Keempatnya bahkan tak tercatat di Peta Modul
      # sama sekali, jadi F8-1b hijau dengan percaya diri.
      #
      # Terbukti bisa merah DAN hijau: penyaringnya dicopot (→ HIJAU palsu,
      # membuktikan ia memang yang menentukan), lalu dipulihkan (→ MERAH
      # dengan kelima menu itu disebut namanya).
      #
      # Butuh DATABASE_URL: sumber sidebar adalah tabel `menu_items`, bukan
      # konstanta di kode. Tanpa kredensial ia melapor DILEWATI — dan
      # "dilewati" BUKAN "lulus".
      - name: Menu aktif wajib punya halaman (ambang NOL)
        run: node ../web/scripts/audit-menu-punya-halaman.mjs

      # F8-2 — CLAUDE.md §8: "Kolom DB sudah ada BUKAN selesai." Commit
      # db463d9: lima modul berturut-turut dibangun sampai endpoint lalu
      # dilaporkan "INTI #N selesai" — endpoint `retensi-register` yang
      # dibanggakan di situ tak pernah dipanggil dari mana pun. Larangan di
      # CLAUDE.md tanpa penjaga hanya konvensi; ini penjaganya.
      #
      # Peta modul→endpoint ditulis tangan (bukan pola `/api/v1/<modul>`):
      # Klaim/Surat/Instruksi bersarang di `/api/v1/projects/{id}/claims` dkk,
      # dan pola naif akan merah palsu di modul yang sehat.
      #
      # Lantai 1 (sisa INTI #2 IPC). Ukuran pertama sempat 2: peta #8 Geotag
      # semula memakai `latitude`/`longitude`, padahal komponennya sendiri
      # (penanda-lokasi.tsx) menamai fieldnya `lintang`/`bujur` — penjaga ini
      # nyaris merah palsu pada dirinya sendiri.
      - name: Modul INTI tanpa UI (F8-2)
        run: node scripts/audit-modul-tanpa-ui.mjs

      - name: Indeks dokumen mutakhir
        run: node scripts/gen-indeks-docs.mjs --check






      # F1-5 — berkas contoh env harus benar-benar sampai ke orang yang mengklon.
      #
      # `apps/web/.gitignore` punya `.env*` yang ikut menelan `.env.example`.
      # Cacatnya TAK BERGEJALA di mesin mana pun yang berkasnya sudah tertinggal
      # secara lokal — hanya klon bersih yang merasakannya. Terungkap saat waktu
      # klon→siap diukur pada klon sungguhan, bukan diperkirakan.
      - name: Contoh env ter-track git
        run: node scripts/audit-contoh-env-terlacak.mjs

      - name: Dokumen rencana harus terhubung ke ROADMAP
        run: node scripts/audit-docs-vs-roadmap.mjs

      # Fase 0 (0.3) — racun konteks agent.
      #
      # `CLAUDE.md` dibaca agent AI di awal setiap sesi. Versi lamanya menyatakan
      # jumlah migrasi & tabel yang sudah lama tidak benar, dan bahkan tambalan
      # koreksinya ikut basi. Memperbaiki angkanya sekali tidak menyelesaikan apa
      # pun — ia akan basi lagi tanpa gejala. Dua penjaga di bawah membuat repo
      # MENOLAK kelas kesalahan itu masuk kembali.
      - name: Dokumen konteks bebas angka yang membusuk
        run: node scripts/audit-docs-freshness.mjs

      - name: Tidak ada dokumen kembar di dua lokasi
        run: node scripts/audit-no-stale-docs-path.mjs


      - name: Penjaga saldo (pemeriksaan tak boleh bisa dilewati)
        run: node scripts/audit-penjaga-saldo.mjs

      - name: Guard sadar-schema (to_regclass tanpa kualifikasi)
        run: node scripts/audit-guard-schema.mjs

      # Apply-pending migrasi + seed uji ke project CI (idempoten: skip yang sudah
      # applied, apply yang baru, re-seed jika hilang). BUKAN push-semua tiap run.
      - name: Prepare CI project (apply pending migrations + seed)
        run: node scripts/ci-project-setup.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # ── Penjaga yang MENGUKUR KEADAAN BASIS ────────────────────────
      #
      # Kesembilan belas langkah di bawah ini semula berjalan di ATAS,
      # sebelum `ci-project-setup` menerapkan migrasi. Dua akibatnya:
      #
      #   1. Tanpa `DIRECT_URL` mereka keluar kode 2 dengan
      #      "DIRECT_URL tidak ditemukan" dan menjatuhkan seluruh job.
      #   2. Sesudah env-nya dipasang, mereka gagal lebih jauh dengan
      #      `relation "otomasi_alur" does not exist` — basis CI belum
      #      punya tabelnya, karena migrasinya memang belum jalan.
      #
      # Keduanya gejala dari satu sebab: penjaga yang bertanya kepada
      # skema harus berjalan SESUDAH skema itu ada. Pola ini sudah
      # dinyatakan di langkah "Kolom .select() harus ada di skema":
      # "Berjalan SESUDAH migrasi karena skema adalah wasitnya."
      # Report builder (G6d) bersandar sepenuhnya pada daftar sumber di
      # `lib/laporan-susun.ts`: apa pun yang tak ada di daftar ditolak. Yang
      # TIDAK dijaga siapa pun sebelum ini: apakah yang ADA di daftar benar-
      # benar ada di basis. Kolom karangan LOLOS seluruh pemeriksaan pustaka
      # — ia ada di daftar, jadi sah — lalu gagal di basis dengan pesan yang
      # menunjuk query, sehingga yang membacanya mengira query-nya yang salah.
      # Sudah terjadi sekali (`project_expenses.amount`, yang benar
      # `total_amount`). Yang paling mahal kalau salah: sumber yang keliru
      # menyatakan cara penyaringan tenant-nya menarik data perusahaan lain,
      # dan hasilnya terlihat seperti laporan yang wajar. Ambang NOL.
      - name: Sumber laporan cocok dengan skema nyata
        run: node scripts/audit-sumber-laporan-nyata.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Sepupu L-4 untuk arah sebaliknya: bukan "kolom punya pembaca" melainkan
      # "peristiwa punya alur". `utils/terbit-peristiwa.ts` memetakan jenis
      # notifikasi ke kode alur otomasi, dan kode itu jadi `path` webhook n8n.
      #
      # Kalau kodenya salah ketik atau alurnya hilang, panggilannya membalas
      # 404 — dan `terbitkanPeristiwa` SENGAJA diam pada 404, karena itu
      # keadaan wajar selama alur belum dinyalakan. Jadi salah ketik terlihat
      # persis sama dengan "belum dinyalakan", dan satu-satunya gejalanya
      # adalah WhatsApp yang tak pernah datang.
      #
      # Memeriksa empat hal: kode punya resep di `bangun-alur.mjs`, kodenya sah
      # sebagai path URL, dan (bila ada DATABASE_URL) barisnya ada di
      # `otomasi_alur`. Ambang NOL. Bukti merah: dua mutasi (salah ketik kode;
      # kode berspasi), keduanya MERAH lalu HIJAU sesudah dipulihkan.
      - name: Peristiwa otomasi menunjuk alur yang ada
        run: node scripts/audit-peristiwa-punya-alur.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Fungsi izin tak boleh RUNTUH saat konteks tenant tak ada.
      #
      # Migrasi 366 membuat `get_role_permissions` sadar-tenant, dan
      # penyaringnya benar saat `auth_company_id()` terisi — lalu runtuh diam
      # saat tidak: `NULL = NULL` bukan TRUE, jadi hanya baris template lolos.
      # `plugins/auth.ts` memanggilnya lewat service_role TANPA konteks, dan
      # diukur 2026-08-14 ia mengembalikan 1 izin, bukan 217. Seluruh
      # `requirePermission` menolak dengan 403.
      #
      # Login TIDAK ikut rusak (API menyetel app.company_id per-request), dan
      # itu yang membuatnya berbahaya: jalur normal benar, jalur tanpa konteks
      # diam. Gejalanya muncul sepuluh langkah dari sebabnya.
      #
      # Menguji JAWABAN fungsinya, bukan teks SQL-nya — bentuk boleh berubah.
      # Ambang NOL. Bukti merah: cacat 366 dikembalikan (izin 217 → 1),
      # penjaga MERAH, lalu HIJAU sesudah 372 dipulihkan.
      - name: Fungsi izin tidak kosong tanpa konteks tenant
        run: node scripts/audit-izin-tanpa-konteks.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Dedup notifikasi harian wajib benar-benar MENAHAN.
      #
      # Founder bertanya 2026-08-14 "kenapa banyak banget?" — diukur: 14.568
      # notifikasi, 5.598 belum dibaca di akun founder sendiri. Sebabnya dedup
      # yang mati karena SATU BYTE: kunci ditulis dengan pemisah `NUL`, dicari
      # dengan SPASI. Tak terlihat di editor mana pun.
      #
      # Sudah diperbaiki commit e8ba8d02, dan test dedupnya hijau. Tetapi test
      # hanya membuktikan fungsinya benar untuk dua panggilan berturut — ia tak
      # pernah bertanya "berapa kembar yang sudah terlanjur ada di basis". Dari
      # 11 Agustus: 8.478 baris untuk 234 kombinasi unik, 36× lipat.
      #
      # Yang diukur: kembar HARI INI (ambang NOL). Residu lama dilaporkan tanpa
      # memerahkan — penjaga yang merah selamanya berhenti dibaca, pelajaran
      # `rls-initplan`. Bukti merah: satu notifikasi kembar disisipkan → MERAH,
      # dihapus → HIJAU.
      - name: Notifikasi tidak kembar (dedup harian menahan)
        run: node scripts/audit-notifikasi-tak-kembar.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Pembacaan tabel penuh tak boleh terpotong diam-diam di 1.000 baris.
      #
      # PostgREST memulangkan maksimal 1.000 baris TANPA galat dan TANPA
      # penanda: `data` terisi, `error` null, kode jalan terus dengan data
      # yang tak lengkap.
      #
      # `utils/role-guard.ts` membaca seluruh `role_permissions` (1.640 baris
      # sejak migrasi 364) untuk memutuskan apakah pencabutan izin akan
      # mengunci sistem. 640 baris terakhir tak pernah terbaca, jadi role yang
      # SEBENARNYA memegang izin kritikal terbaca kosong — dan penjaga
      # anti-lockout MELOLOSKAN pencabutan yang ia dirancang cegah.
      #
      # Gejalanya menyamar sebagai test flaky: merah/hijau bergantian pada run
      # berturut dengan keadaan basis identik (diukur 217/217 sebelum & sesudah
      # tiap run). Yang bergeser hanya baris mana yang masuk 1.000 pertama.
      #
      # Yang diukur KENYATAAN, bukan teks: untuk tiap tabel yang dibaca utuh
      # tanpa pembatas, berapa baris yang benar-benar ada. Ambang NOL di 1.000,
      # peringatan di 800 — cacat yang tak berbunyi harus tertangkap SEBELUM
      # garisnya terlewati. Bukti merah: paging di `role-guard` dilepas →
      # MERAH (exit 1, menunjuk role-guard.ts:69) → dipulihkan → HIJAU (exit 0).
      - name: Baca tabel penuh tidak terpotong di 1.000 baris
        run: node scripts/audit-baca-tak-terpotong.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Tiap pengguna aktif wajib punya keanggotaan default.
      #
      # Cacat yang SAMA dibersihkan DUA KALI dalam satu hari: migrasi 379
      # (3 pengguna, verifikasi lulus nol tersisa) lalu migrasi 394 (13 lagi).
      # Keduanya membersihkan gejala tanpa menutup sumbernya — celah di
      # `PATCH /my/companies/:id/default`, yang menurunkan SEMUA default lebih
      # dulu lalu menaikkan yang dipilih. Kegagalan penurunan sudah diperiksa;
      # kegagalan KENAIKAN tidak, dan di situ pengguna tertinggal nol default.
      # Urutannya sudah dibalik di commit yang sama.
      #
      # Kenapa nol default melumpuhkan: `auth_company_id()` jatuh ke
      # keanggotaan default. Tanpa satu pun ia NULL, lalu `tenant_isolation`
      # RESTRICTIVE (migrasi 373) menyaring HABIS — pengguna melihat NOL data
      # tanpa galat, layar merah, maupun baris log.
      #
      # Sekali ini menjatuhkan `t5b-kill-switch` dengan pesan yang menunjuk ke
      # arah SALAH: "kebocoran lintas-tenant". Sepuluh langkah dari sebabnya.
      #
      # Ambang NOL untuk keanggotaan TUNGGAL (tak ada yang perlu ditebak).
      # Yang berkeanggotaan ganda dilaporkan tanpa memerahkan — memilih company
      # mana yang terbuka saat login adalah preferensi pemiliknya.
      #
      # Bukti merah: satu `is_default` dicabut → exit 1 → dipulihkan → exit 0.
      - name: Pengguna aktif punya keanggotaan default
        run: node scripts/audit-keanggotaan-punya-default.mjs

      # Akun NONAKTIF wajib benar-benar tertutup. Diukur 2026-09-01 lewat
      # rute sungguhan, SEBELUM diperbaiki:
      #
      #     AKTIF     login=200  GET /projects = 200
      #     NONAKTIF  login=200  GET /projects = 200   ← sama persis
      #
      # Fiturnya lengkap di tiap lapisan kecuali yang menegakkannya: rute
      # toggle ada dan berpagar tenant, kolomnya ada, UI menampilkannya.
      # Yang tak ada cuma pemeriksaannya saat permintaan masuk — dan
      # ketiadaan itu tak memunculkan galat, tak menggagalkan test, tak
      # terlihat di layar. Admin menekan nonaktifkan, layar berkata
      # nonaktif, orangnya tetap masuk.
      #
      # DUA pintu: routes/v1/auth.ts (menerbitkan token) dan
      # plugins/auth.ts (memvalidasi tiap permintaan). Satu saja tak cukup
      # — menutup rute saja membiarkan token yang sudah terbit tetap sah.
      #
      # Ambang NOL. Bukti merah: empat arah.
      - name: Akun nonaktif benar-benar tertutup
        run: node scripts/audit-nonaktif-benar-tertutup.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Kunci izin yang dipakai kode wajib benar-benar ada di `permissions`.
      #
      # Saat membangun automation 1.1 (2026-08-15) saya menulis
      # `izin: 'expenses:create'` — kunci yang TIDAK ADA. Yang benar
      # `cash:expense:create`. Ketahuannya kebetulan, saat mengukur hal lain.
      #
      # Kenapa kunci hantu tak pernah berbunyi: `requirePermission` untuk kunci
      # yang tak ada TIDAK melempar. Ia memeriksa kepemilikan, dan tak seorang
      # pun memiliki kunci hantu — jadi fiturnya menolak SEMUA ORANG dengan 403
      # yang terbaca seperti "Anda tak punya izin", bukan seperti "kuncinya
      # salah ketik". Orang akan memeriksa peran, menambah permission ke role,
      # memeriksa RBAC — dan tak satu pun menolong.
      #
      # Ambang NOL, dan itu bukan ambisi: diukur 180 kunci dipakai di kode, NOL
      # hantu. Penjaga ini mengunci keadaan yang sudah bersih.
      #
      # Hanya LITERAL yang diperiksa; `requirePermission(variabel)` dilewati —
      # nilainya baru diketahui saat berjalan, dan menebaknya menghasilkan
      # positif palsu yang membuat penjaga berhenti dibaca.
      #
      # Bukti merah: izin karangan dikembalikan → exit 1 menunjuk kuncinya →
      # dipulihkan → exit 0.
      # Daftar-lewat `BUTUH_CI` di jalankan-semua-penjaga.mjs melewati penjaga
      # TANPA menjalankannya. Itu sah untuk yang mustahil dijalankan di laptop —
      # tapi dibuktikan lewat mutasi 2026-08-31 bahwa mekanismenya bisa dipakai
      # mematikan penjaga secara diam-diam: penjaga dirusak + namanya ditambahkan
      # ke daftar → kegagalannya muncul sebagai "dilewati", bukan "MERAH", dan
      # yang berubah cuma satu angka hijau yang tak ada yang hafal.
      #
      # Penjaga ini MENJALANKAN tiap entri, lalu menuntut kegagalannya berupa
      # lingkungan yang hilang — bukan cacat kode yang sedang ditutupi.
      #
      # Bukti merah: penjaga sehat diselundupkan ke daftar → exit 1; penjaga
      # MERAH-sungguhan diselundupkan → exit 1; dipulihkan → exit 0.
      - name: Daftar-lewat penjaga jujur (ambang NOL)
        run: node scripts/audit-daftar-lewat-jujur.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Rute modul BERBAYAR tanpa `requireModul` tak mengeluarkan galat: menu
      # disembunyikan di web, tapi API-nya tetap menerima — dan yang tahu
      # caranya memakai modul yang tak ia bayar lewat curl. Yang bergejala
      # cuma tagihan yang tak naik-naik, berbulan kemudian.
      #
      # Ikut menjaga URUTAN (modul sebelum izin — menentukan pesan penolakan
      # mana yang diterima pengguna) dan JALUR PEMULIHAN (langganan,
      # pengaturan, ekspor tak boleh digerbang: pelanggan yang ingin membayar
      # harus selalu bisa membayar).
      #
      # Bukti merah: gerbang dilucuti dari gl.ts -> exit 1 · urutan dibalik ->
      # exit 1 · auth.ts digerbang -> exit 1 · berkas hantu di peta -> exit 1 ·
      # dipulihkan -> exit 0.
      # Halaman /modul-terkunci ada untuk memandu orang KELUAR dari jalan
      # buntu. Tautan mati DI SANA adalah kegagalan yang paling menyakitkan
      # bentuknya: orang yang sudah terhalang sekali, mengklik jalan keluar
      # yang ditawarkan aplikasi sendiri, lalu menemui 404.
      #
      # Bukan bahaya teoretis — saat halaman itu ditulis, tautannya menunjuk
      # /pengaturan/langganan, rute yang tak pernah ada. Next.js me-render
      # <Link> ke rute apa pun tanpa galat; 404-nya baru muncul saat diklik.
      #
      # Bukti merah: tautan diarahkan ke rute tak ada -> exit 1 · kunci hantu
      # di ISI_MODUL -> exit 1 · halaman dihapus -> exit 1 · dipulihkan -> 0.
      # Penegakan BACA-SAJA yang dipasang di tempat salah TIDAK mengeluarkan
      # galat, dan seluruh test tingkat-fungsi tetap hijau — yang rusak cuma
      # tempat ia dipanggil.
      #
      # Bukan bahaya teoretis: percobaan pertama memakai hook preHandler
      # global di index.ts. Hook instance-level berjalan SEBELUM preHandler
      # rute, jadi request.companyId masih undefined dan hook pulang lebih
      # awal pada setiap permintaan. Diukur lewat rute sungguhan: POST
      # /api/v1/clients tetap 201 saat tenant ditandai baca-saja.
      #
      # Bukti merah: penegakan dilepas -> exit 1 · GET masuk METODE_TULIS ->
      # exit 1 · hook global dikembalikan -> exit 1 · dipulihkan -> exit 0.
      # `kuota.penyimpanan_gb` terdaftar di katalog sejak migrasi 538 dan
      # dijual di halaman paket — dengan NOL pembaca sampai 2026-09-01. Paket
      # yang menjanjikan 5 GB tak membatasi apa pun.
      #
      # Sesudah dipasang, bahayanya titik unggah BARU yang lupa memeriksa:
      # unggahan itu lolos tanpa dihitung, kuota tetap terlihat bekerja karena
      # titik lain menolak, dan batas 5 GB diam-diam jadi entah berapa.
      #
      # Ikut memeriksa tiap BUCKET yang ditulis kode benar-benar DIHITUNG
      # fungsi basisnya — migrasi 555 sempat mendaftarkan TIGA bucket
      # sementara kode menulis ke ENAM.
      #
      # Bukti merah: kuota dilepas dari satu rute -> exit 1 · bucket dihapus
      # dari fungsi -> exit 1 · kuota dijadikan KOMENTAR -> exit 1 ·
      # dipulihkan -> exit 0.
      - name: Tiap unggahan berkuota (ambang NOL)
        run: node scripts/audit-unggah-berkuota.mjs
        working-directory: apps/api

      - name: Baca-saja terpasang sesudah companyId terisi (ambang NOL)
        run: node scripts/audit-baca-saja-terpasang.mjs
        working-directory: apps/api

      - name: Tautan upsell hidup (ambang NOL)
        run: node scripts/audit-tautan-upsell-hidup.mjs
        working-directory: apps/api

      - name: Rute modul berbayar bergerbang (ambang NOL)
        run: node scripts/audit-modul-punya-gerbang.mjs
        working-directory: apps/api

      - name: Kunci izin benar-benar ada di basis
        run: node scripts/audit-izin-benar-ada.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Peran tak boleh memegang izin di luar wewenangnya.
      #
      # 2026-08-29: `client` — PIHAK LUAR yang membayar kontraktor — memegang
      # `gl:view` (buku besar), `gudang:susut:view` (rencana susut = MARGIN
      # kontraktor), `assets:view`, `gudang:view`, `finance:view` (termasuk
      # kasbon karyawan). Dan `mandor` memegang empat dari lima yang sama,
      # padahal `mandor-portal` tak memanggil satu pun rute itu — diukur nol.
      #
      # Middleware TIDAK menahannya: ia menjaga halaman web, sementara rute API
      # dijaga permission saja. Klien yang memanggil `GET /api/v1/gl/…` dengan
      # tokennya sendiri menerima buku besar, tanpa satu pun galat.
      #
      # Migrasi 526 menutupnya. Penjaga ini menjaga agar tak kembali: yang
      # mengembalikannya cukup satu baris INSERT di seed atau UI pengaturan
      # peran, dan kebocorannya tak bergejala — yang melihat terlalu banyak
      # adalah PELANGGAN, yang tak akan melapor.
      #
      # AMBANG NOL, di company mana pun termasuk template.
      - name: Peran tak kelebihan izin
        run: node scripts/audit-peran-tak-kelebihan.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # `ROLE_HOME` dan `ROLE_ALLOWED` di middleware.ts harus sepakat: home
      # sebuah peran WAJIB tercakup daftar izinnya. Kalau tidak, redirect ke
      # home ditolak lagi — tanpa akhir. ERR_TOO_MANY_REDIRECTS, layar kosong,
      # dan tak satu pun galat menyebut middleware.
      #
      # Sudah 3x terjadi di repo ini: `pm` (2026-08-02), tiga sub-menu Master
      # Data (2026-08-17), `/admin-portal` nyaris (2026-08-22). Tiap kali
      # halamannya ADA, dan tiap kali orang menyimpulkan modulnya belum jadi.
      #
      # Tak butuh basis — memeriksa kesepakatan dua konstanta, bukan runtime.
      - name: Home tiap peran ada di daftar izinnya
        run: node scripts/audit-home-peran-diizinkan.mjs

      # Token mobile WAJIB lewat lapisan terenkripsi (SecureStore), bukan
      # AsyncStorage polos.
      #
      # 2026-08-31: access_token DAN refresh_token tersimpan di AsyncStorage —
      # file SQLite biasa di Android, file sandbox di iOS, keduanya ikut backup
      # yang tak terenkripsi. `refresh_token` memperpanjang dirinya sendiri,
      # jadi satu kali terbaca berarti akses yang tak kedaluwarsa sampai
      # seseorang mencabutnya — dan tak ada gejala yang memberi tahu.
      #
      # `expo-secure-store` sudah terpasang sejak awal dan NOL berkas
      # memakainya. Paket terpasang yang tak dipakai adalah cacat yang paling
      # mudah lolos: package.json terlihat benar.
      #
      # Tak butuh basis maupun emulator — yang diperiksa keputusan di kode.
      - name: Token mobile terenkripsi
        run: node scripts/audit-token-mobile-terenkripsi.mjs

      # Aksesibilitas mobile. Repo ini menjalankan axe-core sungguhan di web
      # (137 halaman, nol pelanggaran) — dan angka itu TIDAK mengatakan apa pun
      # tentang aplikasi HP: axe-core bekerja pada DOM, React Native tak punya
      # DOM. Jadi mobile berjalan tanpa satu pun pemeriksaan a11y sampai
      # 2026-08-31, dan 25 dari 43 elemen sentuh ternyata tak punya
      # `accessibilityRole` maupun `accessibilityLabel` — termasuk "Keluar" di
      # dashboard dan "Kembali" di seluruh layar isian.
      #
      # TalkBack/VoiceOver menyebut elemen semacam itu TEKS BIASA. Penggunanya
      # tahu ada tulisan di layar, tapi tak diberi tahu itu bisa ditekan — dan
      # yang paling bergantung pada pembaca layar justru pengguna berperangkat
      # lama dan berliterasi digital rendah yang jadi alasan WCAG wajib di repo
      # ini (CLAUDE.md §8a.3).
      #
      # Yang diperiksa KEPUTUSAN DI KODE, bukan hasil render — jadi ini bukan
      # "mobile sudah teraudit a11y". Ia menjaga satu hal yang bisa dijaga
      # tanpa emulator. Ambang NOL: lantainya sudah bersih, tak ada hutang
      # yang sedang dicicil.
      - name: A11y mobile (tombol punya role)
        run: node scripts/audit-a11y-mobile.mjs

      # Tabel penjaga di CLAUDE.md tak boleh menjanjikan yang tak ada. Penjaga
      # yang TERCATAT tapi tak dijalankan CI membuat pembacanya berhenti
      # memeriksa hal yang sebenarnya tak dijaga siapa pun — dan berhentinya
      # tak punya gejala. Bentuk yang sama dengan `audit-klaim-layar-nyata`.
      #
      # Arah sebaliknya (jalan tapi tak tertabel) SENGAJA tidak dijaga: diukur
      # 2026-08-31, 206 penjaga jalan dan 49 tertabel. Tabel itu bukan daftar
      # isi melainkan penjaga yang ALASANNYA perlu diketahui sebelum menyentuh
      # kode terkait; menuntutnya lengkap menghasilkan 206 baris yang tak
      # seorang pun baca. Kepala bagian 6 CLAUDE.md menyatakan itu eksplisit.
      - name: Penjaga tercatat wajib jalan
        run: node scripts/audit-penjaga-tercatat-jalan.mjs

      # Kontras teks mobile DIHITUNG, bukan ditaksir. Preseden di repo ini:
      # `kontras-situs.mjs` lahir karena tiga angka kontras yang ditulis dari
      # taksiran ketiganya meleset. `#9CA3AF` terlihat "abu-abu sedang yang
      # wajar" padahal 2.54:1 — hampir setengah dari WCAG AA 4.5:1.
      #
      # Diukur 2026-08-31: 15 tempat `color:` memakainya, PLUS
      # `tabBarInactiveTintColor` — label tab 11px yang hadir di SETIAP layar.
      # Diganti #6B7280 (4.83:1).
      #
      # Berlatar gelap diperiksa terhadap navy, bukan dilewati: SplashMerek
      # memakai #7FA8CC yang 5.03:1 di atas #003366 (lulus) tapi 2.51:1 di
      # atas putih. Versi pertama penjaga ini merah untuk warna yang benar.
      - name: Kontras teks mobile
        run: node scripts/audit-kontras-mobile.mjs

      # Warna mobile wajib datang dari token, bukan hex yang diketik. Diukur
      # 2026-09-04, sebelum `lib/tema.ts` dibuat: 39 hex unik di 445 tempat,
      # `#003366` sendiri 88 kali, nol token, nol mode gelap. Web punya 105
      # token dengan riwayat WCAG tertulis; mobile mewarisi nol.
      #
      # Akibatnya dua hal MUSTAHIL: mengubah merek tanpa ratusan suntingan,
      # dan menambah mode gelap tanpa membuka ulang setiap layar.
      #
      # RATCHET, bukan ambang nol: penjaga yang menuntut nol pada hari
      # pertama akan dimatikan orang pertama yang terhalang.
      # Bayangan mobile wajib dari `ELEVASI`, dan TAK BOLEH hitam. `#000` pada
      # opacity berapa pun MENCUCI warna di bawahnya jadi kelabu; yang benar hue
      # latar dengan saturation & lightness diturunkan (navy #003366 -> #26425C).
      #
      # Yang kedua lebih mahal daripada warna: kartu DAFTAR tak boleh berbayang
      # sama sekali. Tiap lapis = satu alpha blending, dan Android menggambar
      # bagian tertutupnya juga. Daftar nyata di aplikasi ini kasbon 67 baris,
      # pekerjaan 63 — dibayar tiap baris tiap frame, dan paling buruk PERSIS
      # saat aplikasi paling dipakai.
      - name: Bayangan mobile bertoken
        run: node scripts/audit-bayangan-mobile-bertoken.mjs

      - name: Warna mobile bertoken
        run: node scripts/audit-warna-mobile-bertoken.mjs

      # Font merek yang DIMUAT wajib benar-benar DIPAKAI. Diukur 2026-09-04,
      # tepat sesudah Bricolage Grotesque + Plus Jakarta Sans dipasang dan
      # splash ditahan sampai keduanya siap: `fontFamily` di seluruh layar
      # NOL. Aplikasi mengunduh dua keluarga font, menunggu keduanya, lalu
      # merender semua teks dengan huruf bawaan sistem.
      #
      # Biaya penuh, nol hasil - dan tsc, Metro, penjaga a11y serta penjaga
      # kontras semuanya hijau, karena tak ada yang salah: cuma tak ada yang
      # memanggilnya. Kembaran cacat `useData()` di web (bagian 6).
      - name: Font merek mobile terpakai
        run: node scripts/audit-font-mobile-terpakai.mjs

      # Layar mobile wajib membaca bentuk balasan yang BENAR-BENAR dikirim
      # rute. Diukur 2026-09-04, potret pertama dashboard yang berhasil
      # login: "Proyek Aktif 0 - Total Kontrak Rp 0 - Kas Bersih Rp 0",
      # sementara API pada detik yang sama mengirim 15 proyek dan
      # Rp 7.135.525.000.
      #
      # Sebabnya satu tingkat sarang: API mengirim { kpis: { ... } }, layar
      # membaca data?.active_projects. `?? 0` menelan seluruh ketidakcocokan,
      # dan NOL YANG SALAH TAK BISA DIBEDAKAN DARI NOL YANG BENAR - layar
      # memuat cepat, tanpa galat, tanpa spanduk merah.
      #
      # tsc hijau karena `res.data` bertipe any dari axios.
      - name: Bentuk balasan mobile cocok rutenya
        run: node scripts/audit-bentuk-balasan-mobile.mjs

      # Tiap Pressable wajib memberi umpan balik saat ditekan. Diukur
      # 2026-09-04: 17 dipakai, 1 berumpan, 16 TELANJANG. Pressable
      # BAWAANNYA diam total - tak ada ripple, tak ada pudar - kecuali
      # style ditulis sebagai fungsi ({ pressed }) atau android_ripple
      # dipasang. Itu membuatnya LEBIH berbahaya daripada TouchableOpacity:
      # keduanya terlihat sama di kode, hanya satu yang diam.
      #
      # Tiga dari enam berkas terdampak adalah layar TULIS (ncr/lapor,
      # punch/lapor, izin-kerja/ajukan). Mandor bersarung tangan menekan
      # lagi karena tekanan pertama tak terasa terjadi - dua NCR dari satu
      # temuan, tanpa satu pun galat.
      #
      # Kelas cacat yang bahkan MEMOTRET tak bisa temukan: umpan balik
      # hanya hidup 100ms saat jari menempel.
      - name: Pressable mobile berumpan balik
        run: node scripts/audit-tekan-berumpan.mjs

      # Daftar panjang wajib FlatList, bukan ScrollView + .map(). Diukur
      # 2026-09-04: NOL FlatList di seluruh apps/mobile, 14 layar memakai
      # ScrollView + map. Lalu diukur ke API produksi: kasbons 67 baris,
      # pekerjaan 63, notifications 30. Ambang virtualisasi 50 (pedoman
      # stack react-native, severity High).
      #
      # ScrollView menahan SELURUH anaknya di memori, termasuk yang tak
      # pernah tergulir. Tak ada galat - yang muncul cuma gulir tersendat
      # yang MAKIN PARAH seiring bertambahnya data, jadi ia paling buruk
      # persis saat aplikasinya paling dipakai. Di perangkat penguji
      # dengan 5 baris, semuanya terasa mulus.
      - name: Daftar mobile tervirtualisasi
        run: node scripts/audit-daftar-mobile-virtual.mjs

      # Tiap nilai status yang bisa sampai ke layar mobile wajib punya LABEL
      # Indonesia. Ditemukan 2026-09-04 dari MEMOTRET layar mandor: lencana
      # statusnya berbunyi "submitted" - kunci basis apa adanya, di aplikasi
      # berbahasa Indonesia.
      #
      # `statusLabel()` memakai `map[status] ?? status`, jadi status yang tak
      # terdaftar TIDAK gagal - ia muncul MENTAH. Tiga dari sepuluh status
      # hilang dari peta: draft, submitted, settled.
      #
      # Daftarnya dibaca dari tipe ENUM PostgreSQL, bukan dari isi tabel:
      # tabel yang hari ini cuma berisi dua nilai tetap boleh menghasilkan
      # yang ketiga besok.
      #
      # Kelas yang sama dijaga audit-jenis-tulis-punya-label.mjs di web;
      # mobile memakai peta lain di berkas lain dan tak pernah ikut.
      - name: Status mobile berlabel
        run: node scripts/audit-status-mobile-berlabel.mjs

      # Tiap pasangan token mobile wajib >= 7:1 (WCAG AAA), bukan 4.5:1.
      # Aplikasi ini dibaca di LOKASI PROYEK - layar berdebu, matahari
      # langsung. Riset praktik lapangan (Corvus Intell, ABLEMKR)
      # menyarankan 7:1 untuk kondisi itu dan menyebut 4.5:1 sebagai
      # LANTAI. Keputusan founder 2026-09-05: naikkan SEMUANYA.
      #
      # Diukur sebelum: 0 gagal AA, tapi 29 dari 40 pasangan gagal AAA.
      # Nilai barunya dicari dengan menggeser LIGHTNESS saja - hue dan
      # saturasi dipertahankan, jadi navy tetap navy.
      - name: Kontras token mobile AAA
        run: node scripts/audit-kontras-aaa-mobile.mjs

      # Layar kosong wajib menyebut LANGKAH BERIKUTNYA, bukan cuma
      # keadaannya. Riset onboarding menemukan bukti kuat menentang
      # carousel penjelas fitur (NN/G 91% vs 94%; Vevo +10% login selesai)
      # dan merekomendasikan contextual help sebagai gantinya - empty
      # state adalah bentuk paling murninya.
      #
      # Yang paling mahal: layar kosong karena IZIN dibaca sebagai
      # aplikasi rusak, lalu ditinggalkan tanpa dilaporkan siapa pun.
      - name: Layar kosong berpetunjuk
        run: node scripts/audit-kosong-berpetunjuk.mjs

      # Versi paket mobile wajib cocok dengan Expo SDK. Diukur 2026-08-31,
      # PERTAMA kalinya `expo export` dijalankan di repo ini: bundling GAGAL,
      # dan sebelas paket tak cocok — React 18 (butuh 19), React Native 0.76
      # (butuh 0.79), expo-router 4 (butuh 5, beda MAYOR).
      #
      # Artinya aplikasi mobile TAK PERNAH BISA DI-BUILD jadi APK, dan itu
      # bertahan lama karena `tsc` hijau, 16 layar typecheck bersih, seluruh
      # penjaga mobile hijau — tak satu pun menjalankan Metro. TypeScript
      # memeriksa tipe; ia tak tahu apa-apa soal transformasi Babel di dalam
      # node_modules.
      #
      # Satu keluarga dengan template_penerapan dan pgvector: benar di satu
      # lapis, patah di lapis yang sesungguhnya dipakai.
      - name: Versi paket mobile cocok Expo SDK
        run: node scripts/audit-versi-expo-cocok.mjs

      # Tiap modul WebView mobile wajib menunjuk halaman web yang ADA. Jalur
      # tanpa `page.tsx` membuka 404 Next.js DI DALAM bingkai aplikasi —
      # tanpa tombol kembali yang jelas, tanpa penjelasan apa pun.
      #
      # Mudah terjadi karena petanya di `web/[modul].tsx` dan halamannya di
      # `apps/web/app/(dashboard)/`: dua tempat, tak ada yang menghubungkan.
      # Menghapus atau memindahkan halaman web tak menimbulkan galat apa pun
      # di sisi mobile.
      #
      # Pada jalan PERTAMANYA penjaga ini menemukan `/sdm` sudah buntu sejak
      # dibuat — kelompok itu hanya punya lima sub-halaman, tak ada indeks.
      # Diarahkan ke `/sdm/timesheet`.
      - name: Modul mobile menunjuk halaman nyata
        run: node scripts/audit-modul-mobile-nyata.mjs

      # Halaman yang ADA belum tentu BISA DIBUKA. Penjaga di atas membuktikan
      # `page.tsx`-nya nyata; yang ini membuktikan sesinya nyambung.
      #
      # Founder melaporkan 2026-09-05 "beberapa tak bisa menampilkan WebView".
      # Diukur terhadap produksi: bukan beberapa, SEMUA tujuh belas modul
      # menjawab 307 -> /login. Dengan cookie dipasang manual: 200.
      #
      # Tiga lapis yang masing-masing benar sendiri — WebView menanam token ke
      # localStorage (sah), middleware menggerbang lewat cookie (sah), dan
      # middleware berjalan di SERVER sebelum JS halaman ada (sah). Tak ada
      # yang salah kecuali sambungannya, dan tak satu pun dari 241 penjaga
      # lain melihat kedua sisi sekaligus.
      - name: Sesi WebView nyambung ke gerbang web
        run: node scripts/audit-sesi-webview-nyambung.mjs

      # Tiap kiriman antrean mobile wajib menunjuk rute API yang ADA. Gejalanya
      # paling buruk dari semua kelas cacat di aplikasi ini, karena antrean
      # dirancang untuk MENAHAN kegagalan: mandor mengisi laporan di lokasi,
      # layar berkata "tersimpan" (dan itu benar — tersimpan di HP), server
      # menjawab 404, antrean menahannya, dan mandor tak pernah membuka layar
      # antrean karena tak ada alasan. Laporannya di HP selamanya.
      #
      # Lahir dari temuan 2026-09-01: foto progres TAK PERNAH sampai sekali pun
      # — antrean mengirim multipart, rute membaca body.photos sebagai JSON.
      # project_photos 36 baris, NOL dalam 30 hari.
      #
      # ⚠ Yang dijaga JALURNYA, bukan bentuk muatannya. Cacat foto itu hanya
      # ketahuan dengan MEMANGGIL rutenya sungguhan; penjaga ini menandai
      # kiriman ber-`fotoUri` sebagai peringatan, bukan kegagalan.
      - name: Antrean mobile menunjuk rute nyata
        run: node scripts/audit-antrean-punya-rute.mjs

      # Kontrak login mobile wajib utuh di KEDUA sisinya. Diukur 2026-09-01:
      # aplikasi mobile TAK PERNAH bisa login sekali pun — login memulangkan
      # `session: { expires_at }` saja karena token hanya dikirim lewat cookie
      # HttpOnly, dan mobile tak memakai cookie. Ia menyimpan `undefined`, lalu
      # setiap permintaan dijawab 401.
      #
      # Tak ada galat yang menyebutnya: layar login menampilkan pesan
      # kredensial, jadi mandor mengira sandinya yang salah.
      #
      # Kontraknya hidup di DUA berkas yang tak saling tahu (auth.ts membaca
      # `x-client`, mobile/lib/api.ts mengirimnya). Menghapus salah satunya
      # tak menggagalkan tsc dan tak menyentuh satu test pun.
      #
      # Ikut dijaga: token diberikan HANYA saat header itu hadir. Memberikannya
      # ke semua klien membuang perlindungan XSS yang jadi alasan cookie
      # HttpOnly dipakai.
      - name: Kontrak login mobile utuh
        run: node scripts/audit-auth-mobile-utuh.mjs

      # Rantai hook build EAS wajib utuh. SEMBILAN build APK gagal sebelum
      # berhasil, dan sebab terakhirnya tersembunyi di celah dua versi pnpm:
      # server EAS memakai 9.15.5, mesin pengembang 11.8.0. `overrides` di
      # repo ini tinggal di `pnpm-workspace.yaml` — fitur pnpm 10+ — dan pnpm 9
      # TAK MEMBACANYA dari sana, lalu menolak dengan galat yang menuduh
      # lockfile.
      #
      # Perbaikannya rantai tiga berkas + .easignore yang harus mengirimnya:
      #   apps/mobile/package.json → eas-pre-install.mjs → scripts/eas-lockfile-*
      #
      # Menghapus salah satunya TAK menggagalkan tsc dan TAK menyentuh test —
      # pnpm 11 lokal tak membutuhkan satu pun dari mereka. Yang gagal cuma
      # build di server, dua puluh menit kemudian, dengan galat yang menunjuk
      # ke tempat lain.
      #
      # Ikut dijaga: `packageManager` TIDAK boleh ada di apps/mobile — build
      # keenam gagal karena EAS menempelkan prefiks tebakannya jadi
      # `yarn@pnpm@11.8.0`.
      - name: Rantai hook build EAS utuh
        run: node scripts/audit-hook-eas-utuh.mjs

      # `overrides` tanpa batas ATAS menarik versi yang menuntut Node lebih
      # baru dari server EAS. Build kesembilan gagal begitu: undici 8.9.0
      # butuh Node >= 22.19, server memakai 20.19.2, dan galatnya menyebut
      # nama fungsi internal undici — `webidl.util.markAsUncloneable is not
      # a function` — bukan nama paket atau versinya.
      #
      # Tak terlihat di mesin mana pun di sini: pengembang, API, dan web
      # semuanya Node 24.
      - name: engines.node vs lingkungan build tertua
        run: node scripts/audit-engines-node-cocok.mjs

      # Paket ber-kode NATIVE hanya boleh satu versi. Build kesebelas gagal
      # di perakitan Android dengan galat yang menuduh berkas yang tak
      # seorang pun tulis:
      #
      #     PackageList.java: cannot find symbol
      #     import expo.core.ExpoModulesPackage;
      #
      # Sebabnya lockfile memuat dua pohon paralel — web memakai React
      # 19.2.4, mobile dikunci 19.0.0 oleh Expo, dan react-native-webview
      # ikut bercabang bersamanya. Autolinking memungut versi mana pun yang
      # ditemuinya lebih dulu.
      #
      # React SENGAJA tidak diperiksa: dua React memang boleh berbeda.
      # Yang tak boleh adalah paket native, karena hanya satu yang bisa
      # dirakit ke dalam APK.
      - name: Paket native satu versi
        run: node scripts/audit-native-satu-versi.mjs

      # Daftar jenis elemen struktur ada di DUA tempat yang harus sama: CHECK
      # `struktur_elemen_jenis_check` di basis, dan konstanta JENIS di
      # `routes/v1/struktur.ts`. Kalau berbeda, kegagalannya berbeda arah dan
      # keduanya menyesatkan — yang ada di kode tetapi tak di basis ditolak
      # dengan pesan constraint MENTAH; yang ada di basis tetapi tak di kode
      # jadi tak terjangkau lewat aplikasi tanpa satu pun galat.
      #
      # Bukti merah: jenis karangan ditambahkan ke konstanta JENIS → exit 1
      # menyebut namanya → dipulihkan → exit 0.
      - name: Jenis elemen struktur cocok antara kode dan basis
        run: node scripts/audit-jenis-struktur-cocok.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Harga bahan wajib masuk akal untuk SATUANNYA. Ditemukan 2026-08-19:
      # harga per m3 tersalin apa adanya ke resource bersatuan kg — pasir beton
      # Rp 370.200/kg, kerikil Rp 352.300/kg — dan akibatnya 1 m3 beton f'c 25
      # terhitung **Rp 626.849.988**, bukan Rp 1,2 juta. Menyebar ke 32 AHSP.
      #
      # Tak ada satu pun yang salah secara struktural: resource ada, satuan
      # terisi, harga angka positif, resolver dan AHSP menghitung benar. Yang
      # salah cuma BESARAN — dan besaran tak punya penjaga sampai penjaga ini.
      #
      # Cara memutuskannya tak memakai daftar harga wajar (daftar begitu ikut
      # membusuk): bahan yang sama muncul di satuan ruah DAN massa dengan harga
      # SAMA PERSIS. Satu m3 pasir ~1.400 kg, jadi keduanya tak mungkin bertemu
      # di angka yang sama kecuali salah satunya hasil salin.
      #
      # Bukti merah: memilih entri harga TERLAMA alih-alih yang berlaku → exit 1
      # menyebut 4 pasangan → dipulihkan → exit 0.
      - name: Harga bahan masuk akal untuk satuannya
        run: node scripts/audit-harga-satuan-waras.mjs

      # Nilai kontrak wajib masuk akal TERHADAP BELANJANYA SENDIRI.
      # Ditemukan 2026-09-01: sebuah proyek renovasi dapur & kamar mandi
      # tercatat Rp 900.525.000.000 — sembilan ratus miliar. Belanja
      # nyatanya Rp 150 juta, dan dengan nilai kontrak tiga nol lebih
      # sedikit serapannya jadi 16,7%, angka yang wajar.
      #
      # Kolomnya numeric, jadi nilainya sah secara tipe. Yang rusak cuma
      # ARTINYA — dan rusaknya ke arah paling sulit dilihat: serapan
      # terhitung 0,0%, yang terbaca seperti belum mulai belanja, bukan
      # seperti nilai kontraknya salah. Papan Portofolio Biaya
      # menampilkannya dengan tenang.
      #
      # BUKAN ambang mutlak: kontraktor yang memang menggarap proyek besar
      # akan salah dituduh, dan repo ini menuju SaaS multi-tenant. Yang
      # diperiksa RASIO belanja terhadap kontrak, dan proyek yang BELUM
      # belanja apa pun sengaja dilewati.
      #
      # Ratchet (bukan ambang NOL): datanya milik pengguna dan mengubahnya
      # butuh konfirmasi. Bukti merah dua arah — janggal baru MERAH,
      # kontrak besar tanpa belanja tetap HIJAU.
      - name: Nilai kontrak waras terhadap belanjanya
        run: node scripts/audit-nilai-kontrak-waras.mjs

      # ci.yml wajib YAML yang SAH. Diukur 2026-09-01: berkas ini RUSAK
      # sejak commit 31349bb1, dan 41 commit berturut-turut tak pernah
      # diperiksa CI sama sekali.
      #
      # Satu baris: . Kutip di
      # AWAL nilai membuat YAML mengurainya sebagai string berkutip, lalu
      # tersisa teks yang tak punya tempat.
      #
      # Yang membuatnya nyaris tak terlihat: GitHub tak menjalankan SATU
      # PUN langkah — ia gagal sebelum itu dengan pesan "workflow file
      # issue". Nol job merah, nol langkah merah, dan permintaan lognya
      # menjawab "log not found". Di daftar ia terlihat sama persis
      # dengan kegagalan biasa.
      #
      # Dan penjaga LOKAL tetap melapor "216 hijau" karena ia membaca
      # ci.yml sebagai TEKS untuk mencari perintah — bukan mengurainya.
      # Dua alat, dua jawaban, dan yang menentukan justru yang tak
      # dilihat siapa pun.
      #
      # Ambang NOL untuk keterbacaan YAML; ratchet 10% untuk jumlah
      # langkah (struktur salah bisa menelan langkah tanpa galat).
      - name: ci.yml sah dan langkahnya terbaca
        run: node scripts/audit-ci-yml-sah.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Daftar SEKTOR take-off ada di dua tempat yang harus sama: CHECK
      # `takeoff_sektor_sah` (migrasi 465) dan konstanta SEKTOR_SAH di
      # `lib/takeoff-sektor.ts`. Yang ada di kode tetapi tak di basis membuat
      # rute menghitung volumenya lalu basis menolak dengan pesan constraint
      # MENTAH; yang ada di basis tetapi tak di kode membuat sektornya tak
      # terjangkau siapa pun lewat aplikasi, tanpa satu pun galat.
      #
      # Ikut memeriksa tiap sektor punya satuan DAN cabang perhitungan —
      # sektor tanpa cabang lolos typecheck dan melempar di jalan, pada layar
      # estimator, sesudah ia mengisi seluruh dimensinya.
      #
      # Bukti merah: 4 mutasi (sektor karangan di kode · sektor dihapus dari
      # kode · cabang dihapus · satuan dihapus) → keempatnya exit 1 dengan
      # pesan yang menyebut sektornya → dipulihkan → exit 0.
      - name: Sektor take-off cocok antara kode dan basis
        run: node scripts/audit-sektor-takeoff-cocok.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Kunci routing notifikasi wajib punya aturan, dan aturan wajib punya
      # penerima. Keduanya berujung sama bila dilanggar: `resolveRecipients`
      # memulangkan himpunan KOSONG, `createNotifications([])` menulis nol baris
      # dan memulangkan sukses, dan rutenya membalas 200 dengan
      # `notifications_created: 0` — tak bisa dibedakan dari "hari ini tak ada
      # temuan". Otomasinya terlihat sehat selamanya sambil tak memberi tahu
      # siapa pun.
      #
      # Yang diperiksa argumen `resolveRecipients`, BUKAN `type:`. Bentuk
      # pertama memeriksa `type:` dan salah menuduh delapan dari sepuluh:
      # `type` itu kategori tampilan, kunci routing string yang lain
      # (`resolveRecipients('material_request_submitted')` + `type: 'general'`).
      #
      # Ambang NOL: diukur 73 kunci dipakai, 73 punya aturan, 0 aturan yatim.
      #
      # Bukti merah: satu huruf dihapus dari kunci → exit 1; target satu-satunya
      # sebuah aturan dihapus → exit 1; keduanya dipulihkan → exit 0.
      - name: Kunci routing notifikasi punya aturan dan penerima
        run: node scripts/audit-jenis-notifikasi-punya-aturan.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Tiap jenis approval WAJIB muncul di inbox terpusat.
      # Inbox yang tak lengkap mengajarkan approver bahwa antrean kosong
      # berarti tak ada pekerjaan — lalu ia berhenti memeriksa modul yang tak
      # pernah muncul. Dokumennya tertahan, pengajunya menunggu, dan tak ada
      # error yang menandainya.
      - name: Inbox approval lengkap
        run: node scripts/audit-inbox-lengkap.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # TJS-P4 — Segregation of Duties. Diukur 2026-08-12: `recordApproval`
      # (satu-satunya pintu approval, ADR-007) menerima `approvedBy` dan tak
      # pernah membandingkannya dengan pengaju. Sembilan jenis, 18 pemanggilan,
      # nol pengecekan — seorang mandor bisa mengajukan kasbon lalu
      # menyetujuinya sendiri dalam dua ketukan.
      #
      # Yang ADA hanyalah lencana "pengajuan Anda" di inbox dan tombol yang
      # disembunyikan. Tombol tersembunyi itu UX, bukan batas keamanan.
      #
      # Terbukti bisa merah lewat EMPAT mutasi: gerbang dicabut dari satu rute,
      # satu jenis dihapus dari registri, kolom pengaju dikarang (dicek ke
      # information_schema), dan nama `recordApproval` diubah sehingga satu
      # berkas keluar dari pengawasan — yang terakhir ini sempat LOLOS pada
      # versi pertama penjaga, dan itulah alasan ada LANTAI_PEMANGGIL.
      - name: Gerbang SoD di tiap jalur persetujuan (TJS-P4)
        run: node scripts/audit-sod-gerbang.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # TJS-P5 — enum `cf_entitas` hanya boleh menyebut TABEL YANG ADA.
      #
      # Migrasi 321 versi pertama menulis 'vendors'; tabelnya bernama
      # `suppliers`. Enum tidak memvalidasi apa pun ke katalog — bagi Postgres
      # itu label sah. Akibatnya entitas yang tak pernah bisa dipakai, tanpa
      # satu pun galat: tenant memilih "Vendor", membuat field, mengisinya,
      # dan nilainya menggantung di `entitas_id` yang tak menunjuk baris mana
      # pun.
      #
      # Yang menangkapnya kebetulan — saya mengukur nama tabel sebelum
      # menjalankan migrasi. Ini penjaganya supaya tak bergantung kebetulan.
      #
      # Terbukti bisa merah lewat tiga mutasi: 'vendors' disuntik ke enum
      # (cacat aslinya), tabel ber-id bigint disuntik, dan entitas tak
      # terklasifikasi tenancy.
      - name: Entitas custom field menunjuk tabel nyata (TJS-P5)
        run: node scripts/audit-custom-field-entitas.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # F3-1 — ADR-004 Rule #2: RLS tak boleh mengotorisasi dari nama peran.
      #
      # Rule #1 (kode aplikasi) sudah dijaga & lantainya kini 0. Rule #2 (RLS)
      # TIDAK dijaga siapa pun sampai F3-1 — dan 68 dari 381 policy
      # melanggarnya.
      #
      # RATCHET, bukan tuntutan nol: ADR-004 sendiri menempatkan migrasinya di
      # Epic 4, karena mengubah 68 policy sekaligus berarti 68 kesempatan
      # mematikan tabel. Yang mendesak adalah menghentikan pertumbuhannya.
      - name: RLS literal peran (ADR-004 Rule #2)
        run: node scripts/audit-rls-literal-peran.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # F2-6 — tripwire keputusan "tidak memaksa RLS".
      #
      # Keputusan itu bertumpu pada satu fakta yang bisa berubah: koneksi API
      # memakai peran ber-rolbypassrls, sehingga FORCE menghasilkan NOL
      # perubahan perilaku (diuji: 15 proyek sebelum & sesudah FORCE).
      #
      # Begitu faktanya berubah — API pindah peran (ADR-011 §7 sudah
      # merencanakannya) atau ada tabel bermilik lain — FORCE berubah dari
      # tak-berguna jadi WAJIB, dan keputusannya kedaluwarsa tanpa memberi tahu.
      - name: Tripwire FORCE RLS (F2-6)
        run: node scripts/audit-force-rls.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # F2-2 — tabel BARU wajib punya jalur tenancy yang jelas.
      #
      # Klasifikasi 123 tabel menemukan tepat 4 yang perlu keputusan manusia.
      # Angka itu benar hari ini dan akan salah begitu ada migrasi menambah
      # tabel tanpa company_id maupun rantai FK NOT NULL — tanpa satu pun
      # galat, hanya isinya terlihat oleh semua tenant.
      #
      # RATCHET: lantai 4. Menaikkannya = menyatakan "ada satu lagi tabel yang
      # tenancy-nya tak jelas, dan itu tak apa-apa" — keputusan yang harus
      # terlihat di diff, bukan efek samping.
      - name: Klasifikasi tenancy (F2-2)
        run: node scripts/audit-klasifikasi-tenancy.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Tabel di-FORCE RLS ber-company_id WAJIB punya pagar RESTRICTIVE.
      #
      # 2026-08-28: `document_number_series` membocorkan 27 dari 27 baris ke
      # admin tenant lain. Tabelnya punya EMPAT policy permissive, dua di
      # antaranya hanya memeriksa izin tanpa menyebut `company_id`.
      #
      # PERMISSIVE digabung dengan OR: satu policy yang lupa menyaring tenant
      # MEMBATALKAN penyaringan saudaranya. Menambah policy justru
      # melonggarkan — intuisi terbalik, dan itu sebabnya cacat ini lolos.
      #
      # Yang menyelamatkan 129 tabel lain: lapis RESTRICTIVE `tenant_isolation`
      # yang digabung dengan AND. Sembilan tabel tak punya lapis itu.
      #
      # AMBANG NOL. Bocornya tak mengeluarkan galat — halaman menampilkan
      # data perusahaan lain seolah miliknya sendiri. Ember [C].
      - name: Tabel FORCE wajib berpagar tenant
        run: node scripts/audit-tabel-force-berpagar.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Tabel yang lahir DI LUAR jalur migrasi hidup nyaman di dev dan HILANG
      # di tiap basis baru — VPS termasuk. Tiga kali terjadi 2026-08-31, dan
      # tiap kali gejalanya menunjuk ke tempat lain:
      #
      #   template_rab        terbaca LINTAS TENANT di basis baru (migrasi 541)
      #   template_penerapan  tak dibuat migrasi mana pun (migrasi 542),
      #                       padahal tenant-map mendaftarkannya kategori C
      #   dua sektor take-off CHECK basis 11 sektor, migrasi 477 menulis 9
      #
      # Ketiganya tak mengeluarkan satu pun galat di dev. AMBANG NOL.
      - name: Tiap tabel wajib punya migrasi yang membuatnya
        run: node scripts/audit-tabel-punya-migrasi.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
      # Test tak boleh membandingkan dua hitungan GLOBAL atas schema bersama.
      #
      # TUJUH kali dalam rantai ini CI merah oleh cacat yang sama: asumsi global
      # atas `public` yang dipakai bersama 6 shard paralel. Setelah keenam saya
      # menambal satu per satu; setelah ketujuh jelas menambal bukan jawabannya.
      - name: Test tanpa asumsi global
        run: node scripts/audit-asumsi-global-test.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}


      # Nama kolom di `.select()` adalah STRING — TypeScript tak bisa
      # menjaganya. Query dengan kolom yang tak ada SELALU gagal, lalu `?? []`
      # mengubah kegagalan itu jadi daftar kosong yang terlihat sah. ENAM bug
      # kelas ini ditemukan dalam satu hari (2026-08-01); salah satunya
      # menyembunyikan Rp 755,7 juta dari AC kurva-S selama berbulan-bulan.
      # Berjalan SESUDAH migrasi karena skema adalah wasitnya.
      - name: Kolom .select() harus ada di skema
        run: node scripts/audit-kolom-select.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # 4a — SCHEMA-DIFF: bandingkan skema `public` CI (dibangun bersih dari
      # migrasi) dengan baseline dev. Baseline di-generate lokal dari dev
      # (read-only) & di-commit.
      #
      # ⚠️ CARA MEMBACA: selisih di sini berarti **dev menyimpang dari
      # migrasi**, bukan CI yang salah. CI dibangun dari nol setiap run, jadi
      # ia SELALU cerminan migrasi. Dev punya riwayat operasi di luar migrasi
      # (repo ini baru punya `schema_migrations` belakangan), jadi dialah yang
      # bisa menyimpan keadaan yang tak berasal dari mana pun.
      #
      # Dibuktikan 2026-08-02: dev tak punya satu pun `trg_protect_created_at`
      # sementara rantai migrasi bersih menghasilkan 10/10 — jadi CI aman,
      # dev-nya yang tertinggal. Ditutup migrasi 166.
      #
      # BASELINE HARUS DIREGENERASI setiap kali skema berubah:
      #   node scripts/schema-fingerprint.mjs emit > scripts/schema-baseline-dev.json
      # Sempat basi 6 hari (91 tabel vs 119 di dev) — laporan drift jadi 1.023
      # baris dan praktis tak terbaca siapa pun.
      #
      # INFORMATIONAL (continue-on-error): outputnya laporan yang dibaca dari
      # run summary, bukan gerbang.
      - name: Schema-diff vs dev baseline (4a)
        continue-on-error: true
        run: node scripts/schema-fingerprint.mjs compare scripts/schema-baseline-dev.json
        env:
          FP_URL: ${{ secrets.CI_DIRECT_URL }}

      # ── Invarian skema: constraint yang benar-benar menolak ────────────────
      #
      # Constraint yang ditulis di migrasi bisa saja tak pernah aktif: salah
      # nama kolom, sintaks yang diterima tapi selalu benar, atau tabelnya
      # sudah ada lebih dulu sehingga `CREATE TABLE IF NOT EXISTS` melewatinya
      # DIAM-DIAM. Satu-satunya cara tahu adalah mencoba melanggarnya.
      #
      # Ketiganya sudah ada sejak modulnya lahir tapi TAK PERNAH DIDAFTARKAN —
      # hanya dijalankan tangan. Penjaga yang tak pernah dijalankan otomatis
      # adalah penjaga yang berhenti dijalankan.
      #
      # Absensi yang terdepan di antara ketiganya: ia menentukan `days_worked`
      # di laporan upah, jadi constraint yang bocor di sana adalah uang yang
      # salah bayar tanpa satu pun gejala di layar.
      - name: Invarian absensi (porsi, lembur, tanggal, anti dobel-absen)
        run: node scripts/uji-invarian-absensi.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Transfer stok menyentuh saldo DUA proyek sekaligus. Yang dijaga bukan
      # hanya nilai buruk (qty ≤ 0, asal = tujuan), tapi juga bahwa policy
      # RESTRICTIVE-nya memeriksa KEDUA sisi: policy yang hanya melihat proyek
      # asal membuat material bisa didorong ke proyek tenant LAIN — barangnya
      # hilang dari kartu stok kita dengan alasan yang terlihat sah, dan muncul
      # di tenant yang tak pernah memintanya. Tak ada satu pun layar yang akan
      # menunjukkannya.
      #
      # Diuji-mutasi 2026-08-06: melepas tiap CHECK, menjadikan RLS satu sisi,
      # dan mematikan RLS — keempatnya membuat penjaga ini merah.
      - name: Invarian transfer stok (qty, beda proyek, RLS dua sisi)
        run: node scripts/uji-invarian-transfer-stok.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Material milik klien (free issue). Selain invarian nilainya, penjaga ini
      # memuat TRIPWIRE: `goods_receipts.po_id` dan `supplier_id` harus tetap
      # NOT NULL.
      #
      # Rancangan pertama fitur ini menaruh penanda `milik_klien` di
      # `goods_receipts` — dan uji invariannya langsung merah, sebab material
      # owner tak punya PO maupun supplier. Melanjutkannya berarti
      # `DROP NOT NULL` pada tabel berisi data finansial hidup (Gerbang Keras
      # G-2), dan `supplier-invoices` sudah membandingkan `gr.supplier_id`
      # sehingga null di sana merambat tanpa ada yang menyadarinya.
      #
      # Rancangannya diganti jadi tabel tersendiri. Tripwire ini menjaga agar
      # tak ada yang diam-diam menempuh jalur lama itu lagi.
      - name: Invarian material milik klien (+ tripwire G-2 goods_receipts)
        run: node scripts/uji-invarian-material-klien.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # RFQ & penawaran vendor — tabel yang MEMILIH VENDOR.
      #
      # Yang paling dijaga: harga 0 tanpa penanda `tidak_menawar`. Nol SELALU
      # menang sebagai termurah, jadi tanpa pagar itu PO bisa terbit ke vendor
      # yang tak menawarkan apa pun — dan tabulasinya tetap terlihat rapi.
      #
      # Juga menjaga keunikan (vendor+material sekali per RFQ; nomor RFQ
      # unik): penawaran revisi yang masuk sebagai baris kedua membuat satu
      # vendor terhitung dua kali dengan dua harga berbeda.
      - name: Invarian RFQ & penawaran vendor
        run: node scripts/uji-invarian-rfq.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Polis asuransi — bukti pertanggungan saat klaim.
      #
      # Yang paling dijaga: periode TERBALIK. Ia membuat seluruh perhitungan
      # celah pertanggungan menghasilkan angka negatif yang terbaca "lebih
      # dari cukup" — dokumen terlihat sah, dan klaimnya ditolak.
      #
      # Juga menjaga keunikan (proyek+penerbit+nomor): salinan kedua membuat
      # nilai pertanggungan terhitung dua kali, dan perusahaan tampak lebih
      # terlindungi daripada kenyataannya.
      - name: Invarian polis asuransi
        run: node scripts/uji-invarian-asuransi.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Cadangan risiko (contingency) — sisa cadangan adalah dasar keputusan
      # "boleh ambil lagi atau tidak".
      #
      # Yang paling dijaga: `alasan` WAJIB terisi. Cadangan yang terpakai tanpa
      # jejak adalah persis "hilang ke dalam biaya lain-lain" yang modul ini
      # dibuat untuk mengakhiri — dan CHECK-nya memakai `btrim` supaya spasi
      # kosong tak lolos sebagai alasan.
      #
      # Penarikan MELEBIHI cadangan sengaja TETAP diterima basis: secara fisik
      # itu mungkin (uang keluar sebelum ada yang memeriksa). Menolaknya di
      # sini akan menyembunyikan kejadian yang paling perlu dilihat; yang
      # benar adalah menandainya di lapis perhitungan sebagai `terlampaui`.
      - name: Invarian contingency
        run: node scripts/uji-invarian-contingency.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Tender subkontraktor — borongan Rp 15jt–280jt per lingkup kerja.
      #
      # Dua invarian yang paling mahal kalau bocor:
      #   • DUA pemenang dalam satu tender → dua kontrak untuk pekerjaan yang
      #     sama, baru ketahuan saat keduanya menagih (index unik parsial)
      #   • yang TAK MENAWAR bisa menang → pelaksana yang tak pernah
      #     mengajukan harga ditunjuk lewat satu salah klik
      - name: Invarian tender subkontraktor
        run: node scripts/uji-invarian-tender-subkon.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Sertifikat IPC — pintu masuk uang dari owner proyek.
      #
      # Diukur 2026-08-07: 40 termin (18 dibayar · 7 tertagih), Rp 4,88 miliar
      # nilai kontrak, nol jejak dasar penagihannya.
      #
      # Empat invarian yang paling mahal kalau bocor:
      #   • progres > 100%            → menagih lebih dari nilai kontrak
      #   • DUA sertifikat / termin   → termin yang sama ditagih dua kali,
      #     baru ketahuan saat owner menolak invoice kedua (index unik parsial)
      #   • "disetujui" tanpa penyetuju → tanda tangan kosong
      #   • potongan lain tanpa alasan  → kolom yang menyerap selisih apa pun
      #     tanpa pernah ditanyakan
      - name: Invarian sertifikat IPC
        run: node scripts/uji-invarian-sertifikat-ipc.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # F6-1: alasan keputusan HARUS di kolom `reason`, bukan dikubur di dalam
      # `newValues`. Diukur 2026-08-07: 636 `estimate.rejected` dan 624
      # `estimate.approved` tercatat NOL beralasan — bukan karena tak dicatat,
      # melainkan dicatat di tempat yang tak bisa dicari.
      #
      # Statis, tak butuh database.
      - name: Alasan keputusan di kolomnya sendiri
        run: node scripts/audit-alasan-di-kolomnya.mjs

      # F6-1: langkah rantai persetujuan wajib membawa `workflowId`.
      #
      # `correlation_id` hanya mengikat dalam SATU request. Persetujuan
      # berjenjang terjadi di request berbeda, oleh orang berbeda, di hari
      # berbeda — tanpa `workflow_id`, merunutnya berarti menebak dari
      # record_id dan waktu. Diukur 2026-08-07: 0 dari 21.005 baris terisi.
      #
      # Penjaga ini menemukan DUA titik yang pencarian tangan saya lewatkan
      # (procurement, submittal) — itu justru alasannya ada.
      - name: Rantai persetujuan terikat workflow_id
        run: node scripts/audit-alur-persetujuan-terikat.mjs

      # Akhir baris: LF tetap LF.
      #
      # Terjadi DUA KALI pada 2026-08-07: skrip penyunting memakai
      # `io.open(f,'w')` (akhir baris platform), dan 11 berkas berubah
      # LF -> CRLF. Akibatnya `submittal-aturan.test.ts` merah dengan pesan
      # yang menunjuk ke tempat salah, dan diff 70 baris membengkak jadi
      # 5.764 — perubahan nyata tenggelam di antara baris palsu.
      - name: Akhir baris tak berubah (LF tetap LF)
        run: node apps/api/scripts/audit-akhir-baris.mjs
        working-directory: .

      # F7-1: tenant baru lahir dengan alur persetujuan yang HIDUP.
      #
      # Diukur 2026-08-07: company kedua punya 0 dari 7 jenis rantai approval.
      # Pengajuan tetap masuk, lalu tak pernah bisa diputuskan siapa pun —
      # tak ada galat, hanya antrean yang tak bergerak. Ketahuannya pun
      # kebetulan, lewat satu test yang hanya menutupi 1 dari 7 jenis.
      - name: Pendirian tenant menyiapkan rantai approval
        run: node scripts/audit-pendirian-tenant.mjs

      # Prakualifikasi & evaluasi vendor (TUNDA kelompok A).
      #
      # Dua invarian yang paling mahal kalau bocor:
      #   • ditolak/daftar-hitam TANPA alasan — keputusan yang menutup pintu
      #     rezeki orang, lalu tak ada yang bisa dijawab saat ditanya
      #   • skor di luar 0-100 — peringkat vendor jadi omong kosong
      - name: Invarian kualifikasi vendor
        run: node scripts/uji-invarian-vendor.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Operasional alat (TUNDA kelompok B).
      #
      # Yang paling mahal kalau bocor:
      #   • meter mundur / pemakaian ganda sehari — jam operasi salah, lalu
      #     jadwal perawatan jatuh tempo lebih cepat atau lebih lambat dari
      #     nyata. Alat berhenti di tengah proyek, dan pekerjaan ikut berhenti.
      #   • jadwal TANPA interval — jadwal yang tak pernah jatuh tempo, dan
      #     terlihat persis seperti alat yang terawat
      #   • akumulasi penyusutan < nilai bulan ini — beban melebihi totalnya
      #     sendiri; neraca tak akan pernah cocok
      - name: Invarian operasional alat
        run: node scripts/uji-invarian-alat.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Jadwal: CPM · kalender · sumber daya · method statement (TUNDA kelompok C).
      #
      # Yang paling mahal kalau bocor:
      #   • pekerjaan menunggu DIRINYA SENDIRI — jadwal yang tak pernah bisa
      #     dimulai, tapi daftarnya terlihat rapi
      #   • pola kerja TANPA satu pun hari kerja — setiap durasi jadi tak
      #     terhingga; perhitungan tak pernah selesai, tanpa gejala
      #   • method statement ditolak tanpa alasan — pelaksana mengajukan
      #     dokumen yang sama berulang, dan siklusnya tak putus
      #   • libur nasional kembar — `UNIQUE` biasa TIDAK mengikat saat
      #     `project_id` NULL (NULL <> NULL); ditutup migrasi 213
      - name: Invarian jadwal CPM & kalender
        run: node scripts/uji-invarian-jadwal.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Kendali dokumen (TUNDA kelompok D).
      #
      # Yang paling mahal kalau bocor:
      #   • gambar "digantikan" tanpa menyebut penggantinya — yang membacanya
      #     tahu gambar ini mati tapi tak tahu mana yang hidup, lalu tetap
      #     mengerjakan yang lama
      #   • transmittal "diterima" tanpa tanggal — klaim tanpa bukti, dan
      #     bukti itulah seluruh gunanya transmittal
      #   • butir rapat tanpa penanggung jawab — keputusan yang tak pernah
      #     dikerjakan, dan rapat berikutnya membahasnya lagi
      #   • tanda tangan tanpa sidik SHA-256 sah — tak bisa diverifikasi ulang
      - name: Invarian kendali dokumen
        run: node scripts/uji-invarian-dokumen.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # LPAD MEMANGKAS nomor dokumen (cacat P1, ditemukan 2026-08-07).
      #
      # `LPAD('1001', 3, '0')` = '100' — Postgres memangkas, bukan hanya
      # menambal. Begitu counter sebuah tenant melewati 999, nomor MR/PO/GR
      # mulai BERULANG dan unique index menolak setiap INSERT berikutnya:
      # penerimaan barang berhenti bisa dicatat sama sekali.
      #
      # Gejalanya menyesatkan — yang muncul "duplicate key", bukan "nomor
      # terpangkas". Diperbaiki migrasi 217.
      - name: Nomor dokumen tak terpangkas LPAD
        run: node scripts/audit-lpad-memangkas.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Kepatuhan & K3 (TUNDA kelompok E).
      #
      # Yang paling mahal kalau bocor — dan ini soal nyawa, bukan uang:
      #   • izin kerja disetujui SENDIRI oleh pengajunya — bukan pengendalian
      #     apa pun; ini yang pertama ditanya saat terjadi kecelakaan
      #   • izin disetujui TANPA pengendalian risiko — tanda tangan atas
      #     dokumen kosong
      #   • "terverifikasi" tanpa siapa & kapan — klaim yang tak bisa
      #     ditelusuri saat dipersoalkan
      #   • daftar hitam tanpa alasan — menutup pintu rezeki orang tanpa jejak
      #
      # Ikut memeriksa 5 permission baru benar-benar terpasang ke peran:
      # permission yang tak dimiliki siapa pun membuat halamannya lahir
      # TERKUNCI, dan gejalanya layar kosong — bukan "akses ditolak".
      - name: Invarian kepatuhan & K3
        run: node scripts/uji-invarian-kepatuhan.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Pengadaan lanjutan (TUNDA kelompok F).
      #
      # Yang paling mahal kalau bocor:
      #   • terpakai > kuota — PO menarik 1.200 ton dari kontrak 1.000 ton;
      #     kelebihannya ditagih di luar harga kontrak dan baru ketahuan saat
      #     rekonsiliasi akhir tahun
      #   • nota kredit DITERAPKAN tanpa pernah disetujui — uang hilang tanpa
      #     satu pun tanda tangan
      #   • pemutus nota kredit = pengajunya — potongan yang disetujui sendiri
      #   • "sudah tiba" tanpa tanggal — keterlambatan jadi tak bisa dihitung
      #
      # Ikut memeriksa `purchase_orders.kontrak_payung_id` ada: tanpa kolom
      # itu, PO tak bisa ditautkan ke kontrak dan penarikan kuota kehilangan
      # jejaknya.
      - name: Invarian pengadaan lanjutan
        run: node scripts/uji-invarian-pengadaan.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      - name: Invarian NCR
        run: node scripts/uji-invarian-ncr.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      - name: Invarian geotag
        run: node scripts/uji-invarian-geotag.mjs
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Fase 0 (0.5) — test SEKALIGUS mengukur coverage.
      #
      # Coverage digabung ke langkah Test yang sudah ada, BUKAN langkah terpisah:
      # suite ini butuh ~3,5 menit terhadap Postgres nyata, dan menjalankannya dua
      # kali menggandakan waktu CI tanpa menambah satu pun informasi.
      #
      # Ambang di-nol-kan di sini karena gerbangnya bukan ambang statis melainkan
      # RATCHET di langkah berikutnya (lantai hari ini tak boleh turun). Ambang
      # 90% bawaan `vitest.config.ts` tetap berlaku untuk `src/lib/**` saat
      # `pnpm test` dijalankan tanpa flag ini.
      # ── Test ter-shard ────────────────────────────────────────────────────
      #
      # Diukur 2026-08-03 (docs/execution/CI-PROFIL.md): langkah ini 1203s dari
      # 1317s total job — **91%**. Seluruh target optimasi lain (cache, tsbuildinfo,
      # filter path) bernilai gabungan < 2 menit, jadi hanya di sinilah kemenangan
      # yang berarti.
      #
      # Kenapa lambat: suite ini INTEGRATION test terhadap Postgres nyata
      # (keputusan sadar, lihat vitest.config.ts) — ~6.000 query round-trip.
      # Di CI tiap round-trip menyeberangi Pasifik: DB project CI ada di
      # ap-northeast-1 (Tokyo), runner GitHub di US-East. Itu faktor 10× terhadap
      # lokal (~230s). Perbaikan akarnya = pindahkan region DB (RATIFIKASI B-3);
      # sharding adalah yang bisa dikerjakan dari dalam repo.
      #
      # ⚠️ TEST_SCHEMA WAJIB unik per SHARD, bukan hanya per run. Shard berjalan
      # PARALEL; kalau berbagi schema, `resetTestSchema()` satu shard men-DROP
      # schema yang sedang dipakai shard lain — kerusakan yang gejalanya terlihat
      # seperti test flaky, bukan seperti kesalahan konfigurasi.
      - name: Test + coverage (shard ${{ matrix.shard }}/6)
        run: |
          npx vitest run --shard=${{ matrix.shard }}/6 --coverage \
            --coverage.include='src/**/*.ts' \
            --coverage.exclude='src/**/*.test.ts' \
            --coverage.exclude='src/**/__tests__/**' \
            --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.statements=0 \
            --coverage.reporter=json --coverage.reportsDirectory=./coverage
        env:
          SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
          # KUNCI PUBLIK — tanpa ini 24 berkas test merah dengan HTTP 500.
          #
          # `utils/supabase.ts` memakainya untuk klien ber-token pengguna, dan
          # menolak keras bila kosong:
          #
          #     "SUPABASE_PUBLISHABLE_KEY (atau SUPABASE_ANON_KEY) kosong. Tanpa
          #      kunci publik, klien ber-token tak bisa dibuat, dan memakai
          #      service_role sebagai gantinya akan MELEWATI RLS diam-diam."
          #
          # Penolakan itu BENAR — RLS yang dilewati diam-diam persis cacat yang
          # hendak ditutup. Yang salah: CI tak pernah diberi kuncinya, jadi tiap
          # rute yang menyentuh data pengguna membalas 500 dan puluhan test
          # merah untuk satu sebab yang sama.
          #
          # Dibuktikan lokal 2026-08-31: `SUPABASE_PUBLISHABLE_KEY= npx vitest run
          # mitra` memerahkan test yang hijau tanpa variabel itu dikosongkan,
          # dengan pesan galat yang sama persis seperti di CI.
          #
          # Fallback ke placeholder DISENGAJA: bila secret belum dipasang, test
          # tetap berjalan dan yang gagal hanya yang benar-benar butuh kunci
          # sungguhan — bukan seluruh 24 berkas.
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
          # Unik per SHARD — lihat peringatan di atas.
          TEST_SCHEMA: test_${{ github.run_id }}_s${{ matrix.shard }}

      # Coverage tiap shard disimpan; ratchet dievaluasi SETELAH digabung di job
      # terpisah. Ratchet yang mengukur satu shard saja akan melaporkan angka
      # jauh di bawah lantai dan menggagalkan build yang sebenarnya sehat —
      # persis kelas cacat "apel vs jeruk" yang sudah ditangkap coverage-ratchet.mjs.
      - name: Simpan coverage shard
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: apps/api/coverage/coverage-final.json
          retention-days: 1

      # WAJIB cocok dengan TEST_SCHEMA langkah Test. Kalau tertinggal di
      # `test_<run_id>` (tanpa `_s<shard>`), keempat schema shard menggantung di
      # project CI selamanya — persis asal-usul schema `mut6` yang ditemukan
      # audit 2026-08-02 dan sampai kini masih perlu dibersihkan (F0-8).
      - name: Drop per-shard test schema
        if: always()
        run: pnpm exec tsx src/test-utils/drop-test-schema.ts
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
          TEST_SCHEMA: test_${{ github.run_id }}_s${{ matrix.shard }}

      - name: Build
        run: pnpm build

  # ── Ratchet coverage: SETELAH seluruh shard, atas gabungannya ──────────────
  #
  # Job terpisah karena ratchet harus menilai coverage SELURUH suite. Menjalankannya
  # di dalam job ter-shard berarti tiap shard menilai ~25% kode dan melaporkan
  # angka jauh di bawah lantai — build sehat divonis regresi. `coverage-ratchet.mjs`
  # sudah punya penjaga "apel vs jeruk" yang akan MENOLAK membandingkan (exit 2),
  # jadi kesalahan ini akan ketahuan; tapi lebih baik tak dibuat sejak awal.
  coverage:
    name: Ratchet coverage (gabungan semua shard)
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Unduh coverage semua shard
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: apps/api/coverage-shards

      - name: Gabungkan coverage lalu jalankan ratchet
        run: |
          node scripts/gabung-coverage.mjs
          node scripts/coverage-ratchet.mjs

      - name: Route ber-coverage NOL (F8-3)
        run: node scripts/audit-route-coverage-nol.mjs

  # ── A1 (STATUS.md §AUDIT) — apps/web SEBELUMNYA SAMA SEKALI DI LUAR CI ─────
  # Sampai 2026-07-31 hanya job `api` yang ada: frontend bisa rusak (tsc error,
  # build gagal, lint error baru) tanpa CI tahu, dan seluruh aturan WCAG yang
  # hidup di sisi web tak pernah tersentuh penegakan apa pun.
  #
  # SENGAJA tanpa `needs: api` — kegagalan frontend harus terlihat cepat dan
  # tak menunggu test DB yang ~12 menit. Job ini juga tidak menyentuh DB sama
  # sekali, jadi tak ikut antre di concurrency group project CI.
  web:
    name: Web — lint (ratchet), typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # ⚠️ Ketiga step di bawah memanggil binari LANGSUNG, bukan `pnpm <script>`.
      # Sengaja, jangan "dirapikan" jadi `pnpm lint:ratchet` dst.
      #
      # pnpm v11 menjalankan pemeriksaan status dependensi sebelum setiap
      # `pnpm run`. Pemeriksaan itu tak bisa memverifikasi `xlsx` yang dipasang
      # dari tarball CDN sheetjs — untuk paket ber-URL tarball, entri `snapshots:`
      # di lockfile v9 memang kosong (`{}`, pnpm-lock.yaml:14900) sementara
      # `integrity`-nya hidup di blok `packages:` (:7072). Job mati dengan
      # ERR_PNPM_MISSING_TARBALL_INTEGRITY *setelah* install BERHASIL
      # (run 30598129116: install lulus 19 detik, `pnpm lint:ratchet` yang gagal).
      #
      # `verifyDepsBeforeRun: false` di pnpm-workspace.yaml mematikannya secara
      # lokal tapi TIDAK di CI. Memanggil binari langsung melewati jalur itu
      # sepenuhnya — tak bergantung pada perilaku config pnpm sama sekali.

      # Ratchet, bukan `eslint` polos: 315 error menumpuk selama web di luar
      # CI. Aturannya diturunkan ke `warn` (eslint.config.mjs) lalu jumlahnya
      # DIKUNCI per-rule — boleh turun, tak boleh naik. Nol error tetap wajib.
      # Alasan lengkap: apps/web/scripts/lint-ratchet.mjs
      - name: Lint (ratchet — nol error, warning tak boleh bertambah)
        run: node scripts/lint-ratchet.mjs

      # E11 — tiap halaman dashboard wajib memakai token lebar. Sebelum ini
      # 13 dari 26 halaman tak memusatkan diri sama sekali (di 1920px isinya
      # melebar sampai 1700px). Yang dijaga bukan "rapi hari ini" melainkan
      # halaman ke-27 yang akan disalin dari yang ke-26.
      - name: Tata letak (token lebar halaman)
        run: node scripts/tata-letak-ratchet.mjs

      # UI-0-4 — halaman yang menulis `<table>` sendiri, bukan `<Tabel>`.
      #
      # ARAH-VISUAL-2026 menyuruh "bangun komponen bersama". Diukur 2026-08-07,
      # premis itu SALAH: komponennya sudah ada dan bagus. Yang tak ada adalah
      # pemakaiannya — 1 halaman memakai <Tabel>, 28 menulis <table> mentah.
      #
      # Bukan soal rupa. <Tabel> menjaga caption, scope="row", tabular-nums,
      # dan overflow-x; tiap tabel mentah adalah empat kesempatan melupakannya.
      # Riwayat repo membuktikan itu TIDAK diingat: commit 16164e9 memperbaiki
      # 24 tabel tanpa caption, ed3a55d + 0adb5b9 menurunkan scope="row" yang
      # hilang dari 55 → 14. Tiga commit untuk cacat yang komponennya sudah
      # cegah sejak awal.
      - name: Tabel mentah (pakai <Tabel>, bukan <table>)
        run: node scripts/tabel-mentah-ratchet.mjs

      # UI-0-1 — padding & gap wajib lewat token kerapatan.
      #
      # Token kerapatannya SUDAH bernilai benar (--pad-kartu 12px dari 24px,
      # --gap-grid 8px dari 16-20px), tapi diukur 2026-08-07 hanya TIGA berkas
      # memakainya sementara 184 padding besar ditulis langsung di kode.
      #
      # Ini kelas cacat KETIGA yang sama dalam satu hari: Tabel<T> dibangun
      # lalu 1 halaman memakainya, token kerapatan disetel lalu 3 berkas
      # memakainya, KartuKPI dibangun lalu 2 halaman memakainya. Tiap kali
      # fondasinya selesai dan penyebarannya tidak — dan halaman ke-N+1
      # disalin dari yang ke-N, jadi memperbaiki sekali tak menyelesaikannya.
      - name: Kerapatan (token, bukan padding dipaku)
        run: node scripts/kerapatan-ratchet.mjs

      # UIR-1 — nominal & tanggal wajib lewat lib/format.ts.
      #
      # Diukur 2026-08-08: 141 pemanggilan toLocaleString/Intl tersebar, dua
      # bentuk mendominasi (53 formatter rupiah, 51 pemisah ribuan). Tiap
      # penyalinan adalah kesempatan berbeda satu detail — dan nominal yang
      # formatnya berbeda antar halaman tidak terbaca sebagai ketidakrapian,
      # melainkan sebagai aplikasi yang tak bisa dipercaya.
      #
      # Tiga jebakan diselesaikan sekali di lib/format.ts, bukan di 141 tempat:
      # spasi tak-putus ICU (U+00A0), `numeric` Postgres yang tiba sebagai
      # STRING, dan jam yang ikut zona MESIN alih-alih WIB.
      - name: Format (lib/format.ts, bukan Intl langsung)
        run: node scripts/format-ratchet.mjs

      # UIR-0C — useSearchParams() wajib punya batas <Suspense>.
      #
      # Next 16 menolak PRERENDER halaman mana pun yang memuatnya tanpa batas
      # itu — build gagal, bukan sekadar memberi peringatan. Dan galatnya
      # menunjuk halaman yang kebetulan diprerender lebih dulu, BUKAN berkas
      # yang bersalah: 2026-08-08 build menyalahkan /procurement/lanjutan dan
      # /keuangan/contingency, padahal keduanya tak memakai useSearchParams
      # sama sekali — penyebabnya components/sidebar.tsx yang dirender layout.
      #
      # Penjaga ini menunjuk berkas yang benar-benar memanggil, jadi diagnosis
      # tak lagi dimulai dari nama halaman yang salah alamat.
      - name: Suspense (useSearchParams wajib berbatas)
        run: node scripts/suspense-ratchet.mjs

      # UIR-2 — judul halaman wajib lewat <KepalaHalaman>.
      #
      # Diukur 2026-08-08: KepalaHalaman dipakai 0 dari 105 halaman, padahal
      # komponennya ada, bertoken penuh, dan ber-test. Akibatnya 27 VARIAN
      # gaya <h1> berbeda — 20-28px, bobot 700/800, tiga sumber warna. Itu
      # sumber paling langsung dari "tiap halaman terasa buatan sendiri",
      # dan paling murah diperbaiki karena tak menyentuh isi halaman.
      #
      # Penjaganya membuang komentar lebih dulu: repo ini berkomentar padat,
      # dan enam halaman sempat tercatat "punya dua <h1>" yang KEENAMNYA
      # artefak komentar. Tanpa itu, halaman yang sudah benar akan "diperbaiki".
      - name: Judul (KepalaHalaman, bukan <h1> sendiri)
        run: node scripts/judul-ratchet.mjs

      # K-6 — kotak isian wajib lewat kosakata bersama `components/isian.tsx`.
      #
      # Diukur 2026-08-11: 16 halaman mendefinisikan `inputStyle` sendiri dalam
      # 11 BENTUK berbeda, dan repo ini tak punya satu pun komponen input
      # bersama. Empat bentuk tanpa penanda fokus sama sekali (WCAG 2.4.7), dan
      # SELURUH varian ber-radius 6px sementara kartu pembungkusnya 14px —
      # kontrol yang jauh lebih tajam dari wadahnya terlihat ditempel.
      #
      # Pola keempat yang sama: 27 varian <h1>, 8 bentuk kartu, 4 gaya tab,
      # 11 bentuk isian. Sebabnya selalu halaman yang menyalin tetangga
      # terdekat — tak ada satu pun yang salah saat ditulis.
      #
      # Penjaga ini menghitung DUA hal, karena keduanya lolos lewat jalur
      # berbeda: definisi dari nol (terlihat saat membaca berkas) dan
      # `GAYA_ISIAN` yang cincin fokusnya dibuang (TIDAK terlihat saat review —
      # bentuknya sudah memakai kosakata bersama). Bukti mutasinya menguji
      # keduanya terpisah: apps/web/scripts/bukti-mutasi-isian.sh
      - name: Isian (kosakata bersama + cincin fokus)
        run: node scripts/isian-ratchet.mjs

      # WCAG 2.1.2 "No Keyboard Trap" — overlay layar-penuh wajib punya jalan
      # keluar papan tik. Ambang NOL: tiga pelanggar terakhir dibereskan
      # 2026-08-11 (pengaturan/keuangan 2 modal, portal/proyek lightbox,
      # milestone-section konfirmasi hapus).
      #
      # Kenapa penjaga sendiri, bukan mengandalkan
      # `jsx-a11y/click-events-have-key-events`: aturan itu melaporkan 63 titik
      # dan 50 di antaranya modal — TERMASUK `dialog-bersama.tsx` yang justru
      # sudah benar (memakai <dialog> asli). jsx-a11y menganggap <dialog>
      # non-interaktif; itu batas alatnya.
      #
      # Lebih penting: saran harfiahnya — `role="button"` pada latar modal —
      # MERUSAK a11y sambil terlihat memperbaikinya. Latar modal bukan tombol;
      # pembaca layar akan mengumumkan "tombol" untuk area kosong. Penjaga ini
      # menanyakan yang benar-benar penting: adakah jalan keluar papan tik.
      #
      # Bukti mutasi 6/6: apps/web/scripts/bukti-mutasi-esc.sh
      - name: Esc (jalan keluar papan tik dari modal)
        run: node scripts/esc-ratchet.mjs

      # F4-1 — warna wajib lewat token, bukan hex di komponen.
      #
      # Alasannya bukan kerapian: WHITE-LABEL PER TENANT. Selama warna ditulis
      # langsung di komponen, mengganti palet untuk satu pelanggan berarti
      # menyunting puluhan berkas — dan yang terlewat akan memakai warna
      # perusahaan lain.
      #
      # RATCHET (lantai 62 sejak 2026-08-05, sebelumnya 578): 519 hex disapu
      # ke token saat rombak visual. Sisa 62 adalah warna yang memang bukan
      # milik palet — merek Google di tombol OAuth, pink kategori, cyan grafik.
      - name: Hex literal (token desain)
        run: node scripts/hex-ratchet.mjs

      # Deret warna grafik harus bisa dibedakan mata buta warna — dan itu
      # BUKAN klaim yang boleh ditulis tanpa diukur. Komentar lama di
      # globals.css menyatakan deretnya aman deutan/protan; saat akhirnya
      # diuji, --data-2 dan --data-5 jatuh ke ΔE 1,9 pada protanopia. Grafik
      # lima seri jadi empat seri bagi ~8% pria, tanpa satu pun galat.
      - name: Deret data (deutan/protan)
        run: node scripts/uji-deret-data.mjs

      # Identitas merek: gradasi wajib tetap navy 210° sepanjang rentangnya
      # (founder menolak ujung yang bergeser ke biru langit), dan permukaan
      # merek TIDAK boleh dibalik di mode gelap. Sekalian menjaga
      # lib/warna-merek.ts tetap sinkron dengan globals.css — dua sumber yang
      # menggambarkan warna yang sama pasti menyimpang, pertanyaannya kapan.
      - name: Identitas merek (rona, saturasi, sinkron)
        run: node scripts/uji-token-merek.mjs

      # `var(--token)` yang dipakai harus BENAR-BENAR ADA di globals.css.
      # Dua cacat dalam satu sesi (2026-08-09): token padding bernilai string
      # berkutip, dan enam token warna yang tak pernah ada (--sukses/--bahaya/
      # --peringatan, mestinya --success/--danger/--warning).
      #
      # Keduanya lolos SELURUH penjaga: tsc bersih (ini CSS), hex-ratchet
      # senang (tak ada hex dipaku), dan kerapatan-ratchet justru MEMUJINYA —
      # token dipakai, angka tak dipaku. CSS tak punya kompilator yang
      # mengeluh soal nama salah; warnanya hilang tanpa gejala.
      - name: Token CSS yang dipakai harus ada
        run: node scripts/uji-token-css-ada.mjs

      # Tiap halaman dashboard wajib punya <h1>. Diukur di peramban
      # 2026-08-12: TIGA BELAS halaman tak punya, dan semuanya TERLIHAT
      # berjudul — yang terbaca ("Ajukan cuti", "Tambah sertifikat") ternyata
      # judul FORM di tengah halaman. Mata membaca sesuatu di puncak dan
      # menganggapnya judul; pembaca layar membaca struktur, dan strukturnya
      # bolong di puncak (WCAG 1.3.1).
      #
      # Ambang NOL: ketiga belasnya sudah diperbaiki, jadi lantainya memang
      # nol. Bukti merah: scripts/bukti-mutasi-judul-halaman.sh (5/5).
      - name: Tiap halaman dashboard punya judul <h1>
        run: node scripts/uji-judul-halaman-ada.mjs

      # Layar kosong wajib punya JALAN KELUAR, bukan sekadar tak error.
      #
      # 2026-08-16: tab "Material & RAP" di /estimasi merender HALAMAN PUTIH —
      # satu dropdown lalu ruang kosong, dan memilih proyek tak mengubahnya.
      # Kosongnya JUJUR (`rap_budget` cuma 1 baris), tetapi tak seorang pun
      # bisa tahu bahwa RAP dibentuk dari versi estimasi terkunci. Layar itu
      # terbaca sebagai "fitur belum jadi". Nol galat, nol log, nol test merah
      # — kelas cacat yang selalu lolos karena tak punya gejala.
      #
      # RATCHET (lantai 126): 100+ halaman lama menulis kekosongannya lepas,
      # dan memperbaiki semuanya bukan pekerjaan satu commit. Yang dijaga:
      # tidak bertambah. Turunkan dengan --turunkan setelah memperbaiki.
      #
      # Bukti merah (mutasi sengaja, 2026-08-16): halaman yang menyatakan
      # "Belum ada data" tanpa <LayarKosong> → 126→127, exit 1; dihapus →
      # exit 0. Uji itu JUGA menemukan cacat di penjaganya sendiri: versi
      # pertama bisa dipuaskan oleh kata "LayarKosong" yang cuma muncul di
      # KOMENTAR. Sekarang komentar dilucuti sebelum diperiksa.
      - name: Layar kosong menjelaskan diri & punya jalan keluar
        run: node scripts/uji-layar-kosong-menjelaskan.mjs

      # Sel tabel tak boleh memaku padding. 61 halaman memakai <Tabel>
      # bersama; tabel `<table>` mentah mengarang gayanya sendiri — diukur
      # tiga tabel, tiga gaya berbeda, semuanya beda dari yang bersama.
      #
      # RATCHET, bukan ambang nol: sebagian tabel memang sengaja rapat (kisi
      # jadwal, tabel dalam modal), dan memaksanya ke `--pad-baris` akan
      # memperburuk halaman demi menghijaukan angka.
      # Bukti merah: scripts/bukti-mutasi-tabel-seragam.sh (5/5).
      - name: Sel tabel memakai token padding (ratchet)
        run: node scripts/uji-tabel-seragam.mjs

      # Pola yang sama, kelima kalinya: 5 berkas memakai `<input type="radio">`
      # dengan 5 bentuk kartu berbeda (radius 6/8/10, border 1/1.5px, tiga
      # warna latar). Disatukan jadi `components/pilihan-kartu.tsx`.
      #
      # R-2 yang paling menggigit: founder minta lingkaran radionya dibuang,
      # dan cara termudah melakukannya (`display:none`, atau `<div onClick>`)
      # menghasilkan tampilan yang benar DAN kontrol yang hilang dari urutan
      # Tab — cacat yang tak terlihat oleh siapa pun yang mengetes dengan
      # tetikus. Input aslinya tetap ada, disembunyikan `opacity: 0`.
      # Bukti merah: R-1 & R-2 disuntik satu per satu, keduanya MERAH.
      - name: Kontrol pilihan seragam (ambang NOL)
        run: node scripts/uji-pilihan-seragam.mjs

      # Founder 2026-08-15: *"kenapa di sidebarnya kebaca gaada yang aktif,
      # ini aneh"* — membuka /pengaturan/asisten/pemilik. Sebabnya bukan
      # logika penyorotan: keempat sub-menu Asisten ber-`is_active = false`,
      # dan `menu.ts` menyaring `is_active = true`. Yang tak pernah dikirim
      # tak bisa disorot, dan tak ada satu pun galat yang menyebutkannya.
      #
      # RATCHET, bukan nol: 146 baris menunjuk halaman yang ADA sementara
      # barisnya mati, dan sebagian memang sengaja disembunyikan (triase
      # F5-1). Yang dijaga: angkanya tak boleh NAIK — halaman baru yang
      # dibuat tanpa menyalakan barisnya merah di sini.
      # Bukti merah: satu baris dimatikan → MERAH → dipulihkan → HIJAU.
      - name: Baris menu vs halaman yang ada (ratchet)
        run: node scripts/uji-menu-halaman-hidup.mjs

      # Tiap modul wajib punya nama di `breadcrumbMap`. Cadangan
      # `getPageTitle` menurunkan nama dari URL dan sengaja terlihat mentah
      # ("yang mentah menuntut diperbaiki, yang berbohong tidak") — tapi itu
      # hanya bekerja kalau ada yang MELIHAT. Diukur 2026-08-12:
      # `/sdm/timesheet` menampilkan "Sdm", dan sebelas modul lain sedang
      # menunggu giliran yang sama.
      #
      # Ambang NOL. Bukti merah: scripts/bukti-mutasi-remah-lengkap.sh (4/4).
      - name: Tiap modul punya nama di breadcrumb
        run: node scripts/uji-remah-lengkap.mjs

      # "Lainnya" wajib jadi entri TERAKHIR di sidebar PC. navItems melayani
      # dua pembaca dengan aturan berbeda: bottom nav HP mengambil empat
      # pertama, sidebar PC merender semuanya. Menaruh entri kelima SESUDAH
      # "Lainnya" adalah keputusan yang benar untuk HP (empat slot tak
      # bergeser) dan salah untuk sidebar.
      #
      # Diukur 2026-09-01 di /admin-portal @1440px:
      #   Beranda · Approval · Proyek · Keuangan · Lainnya · Kontrak
      #
      # tsc hijau, test hijau, dan potret-portal-adaptif pun HIJAU untuk
      # ketiga pengukurannya. Semua benar; menunya tetap salah susun.
      #
      # Ambang NOL. Bukti merah: tiga arah (tanda dicabut · entri lain ikut
      # bertanda · korpus kosong).
      - name: Entri Lainnya di dasar sidebar portal
        run: node scripts/uji-lainnya-di-dasar-sidebar.mjs

      # Jalur bar progres wajib TERLIHAT di atas kartunya. Sepuluh bar di
      # portal memakai --surface-subtle (#F9FAFB) di atas --surface
      # (#FFFFFF) — kontras 1,05:1. Bar 0% berarti isian selebar nol, jadi
      # yang tersisa cuma jalur yang tak tergambar, dan barisnya tampak
      # seperti elemen yang GAGAL DIRENDER.
      #
      # Diukur 2026-09-01 dengan memotret /pm-portal @1440px: tiga proyek,
      # ketiganya 0%, ketiganya berlubang.
      #
      # tsc hijau, uji-token-css-ada hijau (tokennya memang terdefinisi),
      # potret-portal-adaptif hijau. Tak satu pun punya pendapat soal
      # apakah dua warna bisa dibedakan mata.
      #
      # Kontras DIHITUNG dari hex di globals.css, untuk KEDUA mode — jalur
      # yang terlihat di terang bisa lenyap di gelap.
      #
      # Cakupan PORTAL saja; dashboard belum diperiksa dengan mata.
      # Ambang 1,2:1 (bukan WCAG 3:1 — ini latar, bukan teks, dan angka
      # persennya tertulis di sebelahnya).
      - name: Jalur bar progres terlihat
        run: node scripts/uji-jalur-progres-terlihat.mjs

      # Ubin ikon judul hanya boleh digambar DUA komponen bersama, dan
      # keduanya harus sebentuk. Founder 2026-08-14 menyebut tiga gejala yang
      # tampak terpisah — "ada yg double icon", "grup pengadaan/akuntansi/
      # keuangan belum ada iconnya", "grup mandor iconnya belum konsisten" —
      # dan ketiganya satu penyebab: ubin digambar di lebih dari satu tempat.
      #
      # `JudulBagian` (34 halaman lewat layout empat modul) tak pernah
      # menggambar ubin sama sekali; sebagian halaman menggambar ubin 42px
      # sendiri lalu `KepalaHalaman` menambah yang kedua; sebagian lagi
      # menaruh ikon inline di dalam <h1> tanpa ubin. Tak satu pun bergalat:
      # tiap halaman wajar saat ditatap sendirian, dan salahnya hanya terasa
      # saat berpindah halaman.
      #
      # Ambang NOL — keduanya bersih hari ini, dan pelanggaran baru selalu
      # berarti cacat yang persis sama kembali. Bukti merah: dua mutasi
      # (ubin JudulBagian 40→42 px; ubin ganda dikembalikan di /kalender),
      # keduanya MERAH lalu HIJAU sesudah dipulihkan.
      - name: Ubin ikon judul seragam
        run: node scripts/uji-ubin-judul-seragam.mjs

      # `<Panel padat>` menyetel padding badan jadi NOL sementara kepalanya
      # tetap 16px. Baris daftar yang lebih sempit membuat isi terlihat
      # menepi — founder menunjuknya dengan satu kata, "mepet" (2026-08-10),
      # dan saat diukur ternyata 28 baris di 8 halaman, bukan cuma yang ia
      # lihat. Sudah dilunasi jadi NOL, jadi ini larangan, bukan ratchet.
      #
      # Terbukti bisa merah: `bash scripts/bukti-mutasi-mepet.sh` — dan
      # terbukti TIDAK cerewet: padding tombol/sel tabel sengaja diabaikan.
      - name: Baris daftar tak boleh lebih sempit dari kepala panel
        run: node scripts/uji-baris-tak-mepet.mjs

      # Tombol aksi utama memakai `var(--grad-aksen)` — itu yang dilakukan
      # `<Tombol jenis="utama">`. Puluhan halaman menulis gayanya sendiri
      # sebagai `background: C.navy`, jadi DUA konvensi hidup berdampingan
      # untuk elemen yang sama. Diukur 2026-08-16 saat founder bertanya
      # "apakah styling setiap tombol udh sama?": 115 gradasi : 29 padat.
      # Sudah dilunasi jadi 115+25 = 140 gradasi : 4 padat.
      #
      # RATCHET dengan lantai 4, bukan ambang nol — empat sisanya BENAR:
      # kartu "FOKUS HARI INI" di rail (satu-satunya blok navy di sana, dan
      # ujung terang gradasi mode gelap cuma berkontras 1.99 dengan teks
      # putih), dua tombol 11.5px di dalam kartu navyLight, dan halaman 404
      # di luar shell dashboard.
      #
      # Terbukti bisa merah: satu tombol dikembalikan ke navy → 5 > 4 → exit 1.
      - name: Tombol primer seragam bergradasi
        run: node scripts/uji-tombol-primer-seragam.mjs

      # `var(--pad-atas) var(--pad-x) var(--pad-bawah)` adalah padding SHELL
      # HALAMAN (32px 36px 64px). Disalin ke sebuah <select>, ia menghasilkan
      # dropdown setinggi 108px yang terlihat seperti kartu — founder
      # menunjuknya 2026-08-16 ("tombol/dropdown filter yg terlalu besar").
      # Diukur saat itu: 6 kontrol di 6 halaman, bukan cuma 2 yang ia lihat.
      #
      # Lolos tinjauan justru KARENA memakai token: penjaga hex & kerapatan
      # melihat `var(--…)` lalu menyatakan patuh. Token yang benar di tempat
      # yang salah tetap cacat. Ambang NOL — tak ada kasus sah sebuah kontrol
      # memakai padding shell; penggantinya `--pad-tombol`/`--pad-tombol-kcl`.
      - name: Kontrol tak boleh memakai padding shell halaman
        run: node scripts/uji-kontrol-bukan-shell.mjs

      # Keadaan kosong yang digambar sendiri menyimpang bentuknya (padding 40
      # vs 48, ikon 26 vs 32) dan biasanya lupa menyebut LANGKAH BERIKUTNYA —
      # operate.md: "empty states that teach the interface, not nothing here".
      # Ratchet, bukan ambang nol: sebagian "Belum ada …" memang teks sel
      # tabel atau pesan toast, dan memaksanya jadi <Kosong> akan salah.
      #
      # Terbukti bisa merah DAN tidak cerewet: bash scripts/bukti-mutasi-kosong.sh
      - name: Keadaan kosong lewat komponen bersama
        run: node scripts/uji-kosong-seragam.mjs

      # Salinan `hasPerm` membaca localStorage saat render → pohon server ≠
      # klien → React membuang hasil server dan merender ulang. Tambalannya
      # (penjaga `mounted`) merender NULL pada putaran pertama: layar kosong
      # sepersekian detik tiap muat, yang terbaca sebagai aplikasi lambat.
      # `useIzin` memakai useSyncExternalStore — tanpa layar kosong.
      #
      # Ratchet: enam berkas tersisa punya bentuk berbeda-beda dan menuntut
      # dibaca satu per satu (hook tak boleh dipanggil bersyarat).
      - name: Izin lewat satu sumber
        run: node scripts/uji-izin-satu-sumber.mjs

      # Path API yang salah GAGAL DALAM DIAM: 404 hanya muncul di konsol
      # peramban, sementara halamannya tampil rapi bertuliskan "Tidak ada
      # invoice". Dua endpoint ditulis dari ingatan saat memecah modul
      # Keuangan dan keduanya salah — ketahuan hanya karena sapuan layar
      # otomatis, bukan karena ada yang melapor.
      #
      # Dijalankan dari root repo: ia membaca apps/api DAN apps/web.
      - name: Path API di web menunjuk rute yang ada
        run: node apps/web/scripts/uji-endpoint-ada.mjs
        working-directory: .

      # Halaman yang tak terdaftar di `middleware.ts` DIALIHKAN diam-diam ke
      # home — tanpa galat, tanpa 404. Tiga halaman jadi (`/lapangan/punch-list`,
      # `/lapangan/inspeksi`, `/lapangan/submittal`) ternyata tak pernah bisa
      # dibuka siapa pun; ketahuan hanya karena penjaga ini dibuat.
      #
      # Gejalanya terlihat seperti "halamannya belum dibikin", jadi tak ada
      # yang melapor.
      - name: Rute halaman terdaftar di middleware
        run: node apps/web/scripts/uji-rute-terdaftar.mjs
        working-directory: .

      # Penjaga di atas menanyakan "rute ini terdaftar di middleware?".
      # Penjaga di bawah menanyakan hal yang BERBEDA dan sama pentingnya:
      # "halaman ini bisa dicapai dari mana?"
      #
      # 2026-08-07: empat halaman lengkap (/jadwal, /kepatuhan,
      # /aset/operasional, /dokumen/kendali) hanya bisa dibuka dengan mengetik
      # URL — 20 entri menunya masih menunjuk halaman "segera hadir" yang
      # MENYATAKAN fitur itu belum ada. Rutenya terdaftar, jadi penjaga di atas
      # hijau. Test hijau. Nol yang berbunyi.
      #
      # Butuh DIRECT_URL: sidebar membaca `menu_items` di DB, bukan peta-menu.ts.
      - name: Halaman yatim & link mati di navigasi
        run: node apps/web/scripts/audit-nav-yatim.mjs
        working-directory: .
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # `nav-yatim` di atas memeriksa TAUTAN; ini memeriksa IZIN.
      #
      # 2026-08-11 (G2b): `/sdm/timesheet` punya halaman, endpoint, migrasi
      # menu, dan entri peta-menu — `nav-yatim` HIJAU. Tapi mengkliknya
      # membawa pengguna ke /dashboard, karena `/sdm` tak ada di ROLE_ALLOWED
      # `middleware.ts`. Redirect diam-diam: nol pesan galat, nol jejak log,
      # dan yang mengklik menyangka salah klik.
      - name: Menu aktif yang rutenya dikunci middleware
        run: node apps/web/scripts/audit-rute-terkunci.mjs
        working-directory: .
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Dua sumber kebenaran untuk menu: `peta-menu.ts` (halaman "segera hadir")
      # dan tabel `menu_items` (sidebar). `gen-migrasi-menu.mjs` meramalkan
      # keduanya akan berpisah diam-diam — dan itu terjadi: 23 href berbeda,
      # yang melahirkan empat halaman lengkap tak bisa dicapai siapa pun.
      # Catatan di peta-menu yang MENJANJIKAN sebuah layar wajib punya jejak
      # layar itu di kode. Ditemukan 2026-08-19: entri `crm-boq` menyatakan
      # "SELESAI 2026-08-16 — ditutup migrasi 431 + tab 'Take-off Volume'".
      # Migrasinya ada, endpoint-nya ada, TAB ITU TIDAK PERNAH DIBANGUN —
      # `/estimasi/rab` memuat NOL rujukan takeoff. Akibatnya seluruh take-off
      # dimensional hanya terjangkau lewat API, jadi estimator tetap mengetik
      # volume langsung ke RAB: persis masalah yang hendak diselesaikan 431.
      #
      # Kelas cacat yang sama dengan tujuh sub-menu yang pernah ditandai merah
      # padahal UI-nya hidup (F5-1 §3a), tetapi BERLAWANAN ARAH — dan arah ini
      # lebih berbahaya: yang membacanya menyilang pekerjaan itu dari daftar
      # dan tak pernah kembali. `audit-taksonomi-vs-kode` tak menangkapnya
      # karena ia memeriksa TABEL, dan tabelnya memang ada.
      #
      # Bukti merah: cacat aslinya dikembalikan ke peta-menu → exit 1 menyebut
      # entrinya → dipulihkan → exit 0. Ditambah satu mutasi kedua (rujukan ke
      # halaman yang tak ada) yang juga merah.
      - name: Klaim layar di peta-menu terbukti di kode
        run: node apps/web/scripts/audit-klaim-layar-nyata.mjs
        # ⚠ `working-directory: apps/web` DIHAPUS 2026-08-31 — path-nya ganda.
        #
        # Ia berpasangan dengan `node apps/web/scripts/…`, jadi CI mencari
        #
        #     apps/web/apps/web/scripts/audit-klaim-layar-nyata.mjs
        #
        # dan mati `Cannot find module` — exit 1 yang terbaca seperti penjaga
        # MENEMUKAN pelanggaran, padahal ia tak pernah berjalan sama sekali.
        #
        # Penjaga yang crash tidak menjaga apa pun. Kelas cacat yang sudah
        # tercatat tiga kali di repo ini (SyntaxError di audit-nav-yatim,
        # ENOENT dari cwd di penjaga ini sendiri, dan tujuh penjaga yang mati
        # exit 2 karena `process.exit` tak bisa ditangkap try/catch).
        #
        # Lokal ia HIJAU (0 klaim tak terbukti dari 230 entri) — jadi merahnya
        # di CI sama sekali bukan tentang kode yang diperiksanya.
        working-directory: .

      - name: Drift peta-menu.ts vs menu_items
        run: node apps/web/scripts/audit-peta-menu-vs-db.mjs
        working-directory: .
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # 144 item menu pernah berbagi 27 href: klik "Cost Baseline (BAC)" mendarat
      # di daftar proyek biasa. Pengguna belajar sub-menu tak bisa dipercaya,
      # lalu berhenti memakainya — dan taksonomi 191 sub-menu kehilangan gunanya.
      # Ratchet: sub-menu baru wajib punya tujuan sendiri, atau /m/<key> yang jujur.
      # Sesudah migrasi 232 ini LARANGAN MUTLAK, bukan ratchet: satu route =
      # satu link sidebar. Founder: "kalo link sidebar yg aktifnya 2 kan jadi
      # aneh" — dan tak ada penjelasan yang membuatnya tidak aneh.
      - name: Satu route satu link sidebar
        run: node apps/web/scripts/audit-menu-berbagi-href.mjs
        working-directory: .
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Urutan sidebar — `sort_order` tak boleh bentrok dalam satu grup.
      # Ambang NOL.
      #
      # Diukur 2026-08-12 atas keluhan founder: 5 pasang item berbagi
      # sort_order, DUA di antaranya dari migrasi 276 & 278 yang memakai
      # `max(sort_order) + n` tanpa memeriksa angkanya sudah dipakai.
      #
      # Urutannya TIDAK acak — `routes/v1/menu.ts` sudah punya tie-break
      # `key`. Cacatnya lebih halus: urutan tampil ditentukan ABJAD KUNCI,
      # bukan niat siapa pun. Akibat nyatanya lima halaman asisten (satu
      # rangkaian, migrasi 276) terpotong "Pemakaian & Biaya" dan "Kanal
      # WhatsApp" yang nyempil di tengah — dan yang mencari "Asisten Staf"
      # berhenti di sisipan itu lalu mengira daftarnya habis.
      #
      # Bukti mutasi 5/5: apps/web/scripts/bukti-mutasi-sidebar-urutan.sh
      # (mutasinya di DB, dijalankan dalam transaksi yang selalu ROLLBACK).
      - name: Urutan sidebar tak bentrok
        run: node apps/web/scripts/audit-sidebar-urutan.mjs
        working-directory: .
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Founder 2026-08-08: "style tab nya konsisten ga yaa?" — tidak. Diukur:
      # 22 berkas merender tab dengan EMPAT pola, dan tiga menghasilkan bentuk
      # visual berlainan (tombol kotak navy · garis bawah 12px · garis bawah
      # 14px). Tak ada alasan di balik perbedaannya; ia lahir karena ketiga
      # halaman ditulis pada waktu berbeda.
      #
      # `aria-pressed` sengaja TIDAK diperiksa: sebelas pemakainya bukan tab
      # (nilai kehadiran, saklar denda, pengurutan). Memaksanya jadi role="tab"
      # membuat pembaca layar mengumumkan "tab 1 dari 3" untuk sebuah nilai.
      - name: Tab lewat komponen bersama
        run: node apps/web/scripts/audit-tab-seragam.mjs
        working-directory: .

      # Modal dibangun `<dialog>`, bukan `<div position:fixed>`. Diukur
      # 2026-08-08: 37 overlay layar penuh di dashboard, NOL di antaranya
      # `<dialog>` — jadi nol fokus terkunci, nol Esc, nol `role="dialog"`.
      #
      # Kenapa ini tak pernah berbunyi: `audit-a11y-runtime.mjs` memindai
      # HALAMAN, dan modal baru ada di DOM sesudah dibuka. Ke-37 lolos bukan
      # karena bersih, melainkan karena tak pernah dilihat.
      #
      # Ratchet: yang baru wajib pakai `DialogBersama`; 37 yang lama turun saat
      # berkasnya disentuh.
      - name: Modal pakai <dialog> (bukan div overlay)
        run: node apps/web/scripts/audit-modal-dialog.mjs
        working-directory: .

      # EXPO_PUBLIC_* DIPANGGANG ke bundel saat build, bukan dibaca saat jalan.
      # apps/mobile/.env berisi http://localhost:3001 — dan di HP mandor,
      # localhost adalah HP-nya sendiri. Build yang salah konfigurasi tak
      # menghasilkan galat saat membuild; ia menghasilkan aplikasi yang gagal
      # di tangan mandor dengan pesan yang MENUDUH SERVER.
      #
      # DUA TINGKAT: kosong = PERINGATAN (alamat publik adalah keputusan
      # founder, dan memerahkan CI karena keputusan yang belum diambil melatih
      # orang mengabaikan CI merah). Terisi TAPI localhost/LAN = MERAH —
      # di sinilah bahayanya, karena alamat yang terisi TERLIHAT sudah
      # dipikirkan. Otomatis jadi tegas begitu alamatnya diisi.
      - name: Alamat API profil build mobile terisi
        run: node apps/mobile/scripts/audit-alamat-api-terisi.mjs
        working-directory: .

      # Lambang mobile disalin dari apps/web/public/puraloka-lambang.svg —
      # Expo menuntut PNG dan React Native tak membaca SVG tanpa dependensi
      # tambahan, jadi salinannya tak terhindarkan. Yang bisa dihindari adalah
      # salinan yang menyimpang DIAM-DIAM: lambang web diperbarui, HP mandor
      # membawa bentuk lama, dan tak ada yang memberi tahu. Ambang NOL.
      - name: Lambang mobile sinkron dengan web
        run: node apps/mobile/scripts/audit-aset-merek-sinkron.mjs
        working-directory: .

      # apps/mobile tak pernah tercakup satu pun dari penjaga CI repo ini, dan
      # tiga cacat hidup di sana tanpa ada yang menyebut: rute `/mandor/kasbons`
      # yang TIDAK ADA (404 tiap muat), 5 `catch {}` kosong yang membuat 404 itu
      # tampil sebagai "belum ada data", dan literal peran sebagai gerbang tab
      # (ADR-004 — peran custom per-tenant kehilangan seluruh menunya).
      # Ketiganya kelas yang sudah dijaga di sisi API; yang kurang jangkauannya.
      - name: apps/mobile sehat (rute, catch, ADR-004)
        run: node apps/mobile/scripts/audit-mobile-sehat.mjs
        working-directory: .

      # Antrean offline mengirim ULANG kiriman yang timeout — dan HTTP tak
      # menjanjikan apakah yang timeout sudah sampai. Tanpa kunci idempotensi
      # yang TETAP antar percobaan, satu kiriman putus jadi dua log progres
      # (masuk kurva-S & EVM) atau dua kasbon menunggu persetujuan.
      # Diuji terhadap lib/antrean.ts SUNGGUHAN, bukan salinan logikanya.
      - name: Antrean offline mobile
        run: node apps/mobile/scripts/uji-antrean.mjs
        working-directory: .

      # Env yang hilang di repo ini TIDAK melempar — ia jatuh ke bawaan yang
      # TERLIHAT benar. APP_URL kosong jadi localhost:3000 di tautan surel KE
      # KLIEN; RESEND_API_KEY kosong membuat sendEmail() no-op tanpa galat,
      # sehingga jadwal berjalan dan terakhir_dikirim ter-update tanpa satu
      # pun surel terkirim.
      #
      # Penjaga ini TIDAK menuntut .env terisi (mesin CI memang tak punya
      # kunci Resend) — ia menuntut NAMANYA disebut .env.example, supaya saat
      # deploy tiba daftarnya lengkap. Ambang NOL.
      - name: Env produksi terdokumentasi di .env.example
        run: node apps/api/scripts/audit-env-siap-deploy.mjs
        working-directory: .
        env:
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # Audit a11y runtime (axe-core) MELEWATI rute dinamis yang tak diberi
      # contoh id — dan tetap melaporkan "0 pelanggaran". Diukur 2026-08-07:
      # enam halaman terlewat selama ini, dan outputnya terbaca sebagai
      # cakupan penuh.
      #
      # Penjaga ini statis (hanya membaca berkas), jadi ia bisa jalan tanpa
      # server web maupun peramban. Yang dijaganya: halaman dinamis BARU yang
      # ditambahkan tanpa contoh id, lalu tak pernah dipindai siapa pun.
      - name: Tiap rute dinamis bisa diaudit a11y
        run: node apps/web/scripts/uji-rute-dinamis-teraudit.mjs
        working-directory: .

      # Kartu rail wajib `flexShrink: 0`. Rail adalah kolom flex, dan
      # `flex-shrink` bawaan bernilai 1 — begitu isinya melebihi tinggi layar,
      # browser MENGECILKAN anaknya alih-alih menggulirkan.
      #
      # Diukur 2026-08-09: pada viewport 1600x800 kartu Kalender menyusut dari
      # 146px menjadi 2px — seluruh kisi tanggal lenyap. Empat kartu rail lain
      # kebetulan sudah ber-`flexShrink: 0`; kalender tidak, jadi seluruh
      # kelebihan tinggi ditimpakan kepadanya sendirian.
      #
      # Kenapa perlu penjaga, bukan sekadar diperbaiki: cacatnya TAK TERLIHAT
      # di layar besar (pada 1600x1000 rail masih muat, kalender normal). Ia
      # hanya muncul di laptop — tempat sebagian besar orang bekerja. Kartu
      # rail berikutnya akan mewarisi jebakan yang sama tanpa ada yang tahu.
      - name: Kartu rail tak bisa digepengkan flexbox
        run: node apps/web/scripts/uji-rail-tak-gepeng.mjs
        working-directory: .

      # Menu induk yang punya anak wajib punya HALAMAN IKHTISAR — halaman
      # satu-ruas yang menaungi anak-anaknya (/keuangan bagi /keuangan/invoice).
      #
      # Founder 2026-08-09: "kalo nanti ada menu lain dari taksonomi menu yg
      # emang perlu dashboard biar ga lupa dibangun halaman dashboard nya
      # gimana?" — dan jawabannya harus penjaga, bukan catatan. Repo ini sudah
      # membuktikannya: TUJUH sub-menu pernah bertanda merah di taksonomi
      # padahal UI-nya sudah hidup berbulan-bulan (F5-1 §3a/§3b).
      #
      # Aturan pemilihannya dipinjam dari `lib/tujuan-grup.ts` — sumber yang
      # SAMA dengan yang dipakai sidebar untuk memutuskan apakah baris induk
      # bisa diklik. Kalau penjaga memakai aturannya sendiri, ia bisa hijau
      # untuk grup yang di layar tetap tak bisa diklik.
      #
      # RATCHET: 3 grup memang belum punya ikhtisar hari ini (Estimasi & Biaya,
      # Gudang, Mutu & Kepatuhan). Angkanya lantai — tak boleh bertambah.
      #
      # STATIS (membaca migrasi menu + berkas halaman), bukan lewat peramban:
      # CI ini tak menjalankan satu pun penjaga berbasis peramban — bahkan
      # `audit-a11y-runtime` dan `uji-sidebar-disiplin` pun dijalankan manual.
      # Penjaga yang butuh server hidup akan merah di CI karena servernya tak
      # ada, lalu dimatikan orang. Yang dimatikan tidak menjaga apa-apa.
      - name: Menu induk punya halaman ikhtisar (ratchet)
        run: node apps/web/scripts/uji-induk-punya-ikhtisar.mjs
        working-directory: .

      # Struktur sidebar sesuai standar ERP — Master Data ada, akuntansi tak
      # tercampur anggaran, master data tak tercecer di grup transaksi.
      #
      # Founder 2026-08-09: "apakah sudah benar semua sesuai standar ERP
      # penempatannya seperti ini? yg saya lihat gaada data master" — dan ia
      # benar. Tiga cacat struktural bertahan berbulan-bulan tanpa membuat
      # satu pun test merah, karena tak ada yang membandingkan sidebar dengan
      # dokumen taksonomi baris per baris. Persis yang perlu dijaga mesin.
      #
      # Statis (membaca migrasi + berkas halaman), jadi tak butuh server.
      # Tiga mutasi dibuktikan MERAH: akuntansi dipindah ke anggaran, klien
      # dipindah ke proyek, menu 'hidup' tanpa berkas halaman.
      - name: Struktur sidebar sesuai standar ERP
        run: node apps/web/scripts/uji-sidebar-struktur.mjs
        working-directory: .

      # Rumus jarak geotag ada di DUA tempat (api/lib/geotag.ts dan
      # web/components/penanda-lokasi.tsx) — digandakan supaya galeri foto tak
      # perlu satu permintaan jaringan per foto.
      #
      # Kalau keduanya menyimpang, server bisa bilang "di lokasi" sementara
      # layar bilang "800 m dari lokasi" untuk foto yang SAMA, dan tak ada
      # yang tahu mana yang benar.
      - name: Rumus jarak geotag sinkron (web ↔ api)
        run: node scripts/uji-geotag-sinkron.mjs

      # Token deret grafik (`--data-1`…`--data-8`) dipakai sebagai warna TEKS.
      #
      # Ambangnya 3:1 sebagai komponen non-teks — mereka dipilih supaya saling
      # terbedakan di bawah simulasi buta warna, bukan supaya terbaca sebagai
      # huruf. Sebagai warna teks mereka gagal 4,5:1 (diukur: `--data-5` di
      # atas `--warning-bg` = 3,43:1; `--data-2` di atas putih = 3,68:1).
      #
      # Cacat yang sama diperbaiki LIMA KALI di tempat berbeda sebelum penjaga
      # ini ada. Tiap perbaikan benar, dan tiap kali yang berikutnya muncul
      # lagi — karena tak ada yang menolaknya di pintu masuk.
      - name: Token grafik bukan warna teks
        run: node scripts/uji-token-grafik-bukan-teks.mjs

      # `opacity` pada teks — kelas cacat paling produktif di repo ini.
      #
      # Ia mencampur warna teks dengan latarnya, jadi kontras yang terhitung
      # benar pada TOKEN-nya bisa jatuh jauh di bawah ambang. Tak satu pun
      # pemindai statis melihatnya; keenam kejadiannya ditemukan axe runtime:
      #
      #   sidebar 0,55 → 227 dari 235 pelanggaran (5,98:1 → 2,34:1)
      #   lencana EVM 0,7 · kartu finansial 0,65 · garis Gantt 0,7
      #   judul milestone 0,75 · hitungan foto 0,8
      #
      # `disabled`, ikon, bilah warna, dan pemisah satu karakter dikecualikan:
      # di situ meredupkan memang cara yang benar.
      - name: opacity bukan pada teks
        run: node scripts/uji-opacity-teks.mjs

      # Halaman yang sudah jadi tapi TAK BISA DIBUKA SIAPA PUN.
      #
      # `middleware.ts` menyaring per-prefiks lewat daftar tulis-tangan. Membuat
      # halaman baru berarti menyentuh dua berkas berjauhan, dan yang kedua tak
      # punya satu pun sinyal kalau terlewat — build, test, dan typecheck semua
      # hijau, lalu halamannya diarahkan diam-diam ke home tanpa 404 dan tanpa
      # log.
      #
      # Persis itu yang menimpa `/gudang/rekonsiliasi` (2026-08-06): endpoint
      # jalan, tenancy terjaga, menu terarah — dan yang muncul `/dashboard`.
      # Ditemukan hanya karena halamannya dibuka dengan mata sendiri.
      - name: Setiap rute punya izin di middleware
        run: node scripts/uji-izin-rute-lengkap.mjs

      # Sidebar kini memuat 20 grup & 202 sub-menu (migrasi 153). Pola lama
      # menulis tinggi collapse sebagai ANGKA MATI (`maxHeight: "140px"`) —
      # cukup untuk 4 submenu Keuangan, tapi grup 18 anak butuh ±540px dan
      # sisanya terpotong DIAM-DIAM: tanpa scrollbar, tanpa error. Orang akan
      # menyimpulkan menunya memang belum dibuat.
      - name: Sidebar (tinggi diukur, state generik, a11y)
        run: node scripts/sidebar-ratchet.mjs

      # Audit axe dengan login NYATA menemukan 296 pelanggaran WCAG AA yang
      # SELURUHNYA lolos eslint-plugin-jsx-a11y — plugin itu tak punya rule
      # untuk kontrol yang berdiri tanpa label sama sekali. Semuanya sudah
      # ditutup; ini menjaga agar tak tumbuh lagi.
      - name: Aksesibilitas (kontrol wajib punya nama)
        run: node scripts/a11y-ratchet.mjs

      # Tabel: 59 tabel di web, dan sampai 2026-08-05 TAK SATU PUN punya
      # `tabular-nums`. Akibatnya kolom rupiah bergoyang — "Rp 111.111"
      # lebih sempit daripada "Rp 888.888" meski digitnya sama — jadi
      # besaran tak bisa dibandingkan dari panjang kolom. Untuk halaman
      # piutang yang tugasnya "mana yang paling besar", itu menghapus
      # gunanya tabel. Sudah ditutup semua; ambangnya NOL.
      #
      # `<caption>` dan `scope="row"` ratchet, bukan nol: keduanya butuh
      # kalimat/keputusan manusia per tabel, dan penjaga yang menuntut
      # nol pada 93 keputusan tidak menghasilkan 93 perbaikan — ia
      # menghasilkan penjaga yang dimatikan.
      - name: Tabel terbaca (tabular-nums nol · caption/scope ratchet)
        run: node scripts/uji-tabel-terbaca.mjs

      # Lima halaman membaca `r.data.data` dari `GET /api/v1/projects`,
      # yang mengirim `{ total, projects }`. `?? []` mengubah kunci yang
      # tak ada jadi daftar kosong, jadi pemilih proyek di lima modul
      # lapangan (inspeksi, punch-list, submittal, RFI, estimasi) KOSONG
      # BAGI SIAPA PUN — tanpa satu pun galat. Modulnya tak bisa dipakai.
      #
      # Kelas yang sama dengan `(logs ?? [])` di /aset: kegagalan yang
      # menyamar sebagai keadaan sah. "Belum ada proyek" masuk akal, jadi
      # tak ada yang curiga.
      #
      # Cakupannya sengaja sempit — hanya panggilan tunggal dengan path
      # literal. Versi luasnya memberi 25 alarm palsu, dan penjaga yang
      # berisik tidak dipatuhi, ia dimatikan.
      - name: Bentuk balasan API (kunci yang dibaca web harus dikirim)
        run: node scripts/uji-bentuk-balasan.mjs

      # `--data-*` adalah deret KATEGORI: mode gelapnya sengaja mengorbankan
      # kesetiaan rona demi keterbedaan buta warna (ΔE 3,6 adalah batas yang
      # bisa dicapai kalau rona dipertahankan — batas fisik, bukan kurang
      # usaha). Akibatnya `--data-5` yang oranye di mode terang menjadi
      # abu-abu terang di mode gelap.
      #
      # /piutang memakainya untuk bucket umur 31–60 hari di tengah ramp
      # warning→danger, jadi di mode gelap bucket TENGAH tampil paling pucat
      # dan Rp 119,6 juta yang menua terbaca sebagai paling ringan.
      # /procurement sama, plus dua bucket berwarna identik.
      #
      # Keduanya LOLOS `uji-deret-data` — penjaga itu memeriksa apakah kelima
      # warna saling terbedakan, bukan apakah dipakai di tempat yang benar.
      - name: Ramp urgensi (--data-* bukan untuk tingkatan gawat)
        run: node scripts/uji-ramp-urgensi.mjs

      # `rgba(0,51,102,0.2)` — navy merek yang dipaku — tak punya varian
      # mode gelap. Yang samar-tapi-terlihat di latar putih menjadi TAK
      # TERLIHAT di latar #12141F: ikon lima kartu KPI /procurement hilang
      # sepenuhnya, menyisakan kotak kosong.
      #
      # Tak satu pun penjaga warna yang ada menangkapnya: hex-ratchet
      # menghitung hex mentah, uji-token-merek memeriksa pembalikan mode,
      # kontras-hex memeriksa pasangan sebaris. Tiap penjaga mengukur satu
      # sumbu, dan pelanggaran di sumbu lain lewat sambil semuanya hijau.
      #
      # `boxShadow` dikecualikan: bayangan yang hilang adalah hiasan
      # kedalaman, bukan isi.
      - name: Warna buta-mode (rgba merek pada properti isi)
        run: node scripts/uji-warna-buta-mode.mjs

      # `hasPermission()` membaca localStorage: false di server, true di klien.
      # Dipanggil saat render, ia membuat pohon server dan klien berbeda —
      # React MEMBUANG hasil SSR lalu merender ulang seluruh halaman. Terlihat
      # sebagai "2 Issues" di overlay Next.js pada 17 halaman; ongkosnya render
      # ganda di muat pertama, paling terasa di HP lapangan.
      #
      # Yang terparah gerbang akses (`if (!hasPermission(...)) return <Tolak/>`)
      # di /audit dan /sistem: di situ SELURUH halaman berbeda.
      #
      # Perbaikan: `useIzin()` — `useSyncExternalStore` memang dirancang untuk
      # nilai yang berbeda antara server dan klien. Panggilan di dalam handler
      # tetap boleh; di sana tak ada hydration sama sekali.
      - name: Izin-hydration (hasPermission bukan di jalur render)
        run: node scripts/uji-izin-hydration.mjs

      # Kontras warna — 260 dari 296 pelanggaran WCAG itu kontras, dan sampai
      # 2026-08-01 ia SATU-SATUNYA yang tak dijaga otomatis. Catatannya berbunyi
      # "butuh browser + login, kredensial di CI ditolak sadar" — benar untuk
      # axe, tapi TIDAK untuk token: warnanya literal di globals.css dan
      # kontras adalah aritmetika murni.
      #
      # Penjaga ini menemukan pelanggaran pada jalan PERTAMANYA: --danger di
      # mode gelap 4,47:1 (syarat 4,5). Lolos berbulan-bulan karena audit axe
      # hanya menjalankan mode terang — mode gelap tak pernah diaudit.
      - name: Kontras warna (WCAG AA dari token)
        run: node scripts/kontras-ratchet.mjs

      # `kontras-ratchet.mjs` berhenti di token. 394 warna ditulis sebagai hex
      # langsung di komponen — 302 di antaranya untuk `color`, yaitu TEKS,
      # persis yang WCAG atur. Penjaga ini menutup celah itu untuk kasus yang
      # bisa dinilai pasti: `color` dan `background` pada baris yang sama.
      #
      # Temuan jalan pertamanya: dua TOMBOL, bukan teks hias — "+ Update"
      # 3,35:1 dan tombol tutup dialog 2,45:1 (syarat 4,5:1).
      - name: Kontras warna hex-mentah (pasangan sebaris)
        run: node scripts/kontras-hex-ratchet.mjs

      # ADR-004: UI memutuskan lewat PERMISSION, bukan nama jabatan. Sisi API
      # sudah patuh; sisi web punya 27 pemakaian `role === "admin"` yang sudah
      # MENGGIGIT — role kustom `direktur` punya 7 permission procurement tapi
      # tombolnya disembunyikan karena UI mengecek nama role. Orang berwenang
      # melihat halaman tanpa tombol, tanpa pesan apa pun.
      - name: ADR-004 (permission, bukan nama role)
        run: node scripts/adr004-ratchet.mjs

      # Medan hantu: nilai yang DIKIRIM ke API tapi tak punya cara diisi.
      # Lahir dari tiga bug nyata yang ditemukan 2026-08-01 — semuanya lolos
      # tsc, test, dan review karena secara tipe memang benar: modal
      # pengeluaran mengirim `notes` tanpa punya textarea; kasbon selalu
      # tercatat "Dana Owner" karena pemilihnya tak pernah dirender.
      # Bug begini tak melempar error, ia hanya menghasilkan data yang selalu
      # identik — dan baru ketahuan berbulan-bulan kemudian.
      - name: Medan hantu (dikirim ke API tapi tak bisa diisi)
        run: node scripts/medan-hantu-ratchet.mjs

      # Di web, `catch {}` pada AKSI PEMAKAI berarti: orang menekan tombol, tak
      # terjadi apa-apa, dan layar tetap menampilkan seolah berhasil — karena
      # tampilan lokal diperbarui sebelum tahu servernya menerima. Ditemukan
      # 2026-08-01 pada menonaktifkan akun (tindakan keamanan), approve/reject
      # kasbon (uang), dan menyetujui laporan upah (pembayaran).
      - name: Catch senyap web (aksi pemakai gagal tanpa pemberitahuan)
        run: node scripts/catch-senyap-ratchet.mjs

      # Modal yang hanya bisa ditutup dengan mengklik latarnya MENJEBAK pemakai
      # keyboard — Tab berputar di dalamnya, satu-satunya jalan keluar adalah
      # mengambil tetikus. WCAG 2.1.2 (Level A). Ditemukan 2026-08-01: 36 modal
      # di seluruh aplikasi, nol penanganan Esc.
      - name: Modal bisa ditutup dengan Esc
        run: node scripts/modal-esc-ratchet.mjs

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      # HARNESS TEST WEB — sebelumnya NOL. Sisi API punya 1.215 test; sisi web
      # hanya dijaga bentuk kodenya (lint, tsc, ratchet), bukan perilakunya.
      #
      # Konsekuensinya nyata: `useTutupEsc` dipasang di 51 tempat untuk menutup
      # jebakan papan tik, dan `modal-esc-ratchet` menangkap KEBERADAAN
      # panggilannya — bukan efeknya. Mengubah `'Escape'` jadi `'Esc'` (nama
      # usang) akan lolos setiap pemeriksaan statis sementara 51 modal kembali
      # menjebak tanpa gejala.
      #
      # Tak menyentuh DB sama sekali — jsdom, tanpa browser.
      - name: Test (perilaku komponen)
        run: ./node_modules/.bin/vitest run

      # Env dummy khusus build. `lib/supabase.ts` memanggil createClient() di
      # module scope, jadi klien ikut dievaluasi saat Next.js MEM-PRERENDER
      # halaman — `/auth/callback` mati dengan "supabaseUrl is required" kalau
      # variabelnya kosong (run 30598325258). Build lokal lolos hanya karena ada
      # .env.local, jadi kegagalan ini memang cuma muncul di CI.
      #
      # Nilai dummy aman: yang diuji step ini adalah apakah proyek BISA di-build,
      # bukan apakah ia bisa bicara dengan Supabase. Tak ada halaman yang menarik
      # data build-time dari Supabase — semuanya client-side atau dynamic.
      # Memakai kredensial asli di sini justru menaruh rahasia di log CI.
      - name: Build
        run: ./node_modules/.bin/next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_placeholder_untuk_build_ci
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ''

  # ── ROADMAP #7 — integritas dokumentasi ───────────────────────────────────
  # Dokumen di repo ini dipakai sebagai BUKTI audit (completion audit, ADR,
  # gate manifest). Tautan yang menunjuk ke ruang hampa membuat bukti itu tak
  # bisa ditelusuri — dan audit 2026-07-31 menemukan 60 tautan rusak sekaligus
  # satu template KOSONG yang dikutip sebagai bukti kelengkapan Sub-Fase 1B.
  #
  # Tanpa job ini, tautan yang putus baru ketahuan berbulan-bulan kemudian:
  # persis pola yang PETA-PRIORITAS-ERP.md §2 catat sebagai sumber 8 kontradiksi.
  # Job sengaja berdiri sendiri — tak butuh instal dependency, tak menyentuh DB,
  # jadi tak ikut antre di concurrency group dan selesai dalam hitungan detik.
  dokumentasi:
    name: Dokumentasi — tautan tidak boleh rusak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pindai tautan rusak di docs/ dan *.md akar
        run: node scripts/cek-tautan-docs.mjs

  # ── A2 (STATUS.md §AUDIT) — dependency & secret scanning ──────────────────
  # `11-devsecops-standard.md` MUST #4 (secret scanning) & MUST #5 (`pnpm audit`
  # memblokir merge untuk CVE Critical/High) adalah SATU-SATUNYA item ber-label
  # Critical yang masih terbuka sampai 2026-07-31 — nol penegakan di workflow
  # mana pun. `23-dependency-management.md` MUST #2 bergantung penuh padanya.
  #
  # Relevansinya naik karena repo ini SEMPAT PUBLIK dengan 4 password test di
  # riwayat git (repo dijadikan private 2026-07-31, tapi riwayatnya tetap ada).
  keamanan:
    name: Keamanan — dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scan butuh riwayat penuh: rahasia yang di-commit lalu dihapus
          # di commit berikutnya TETAP ada di riwayat dan tetap bisa dipulihkan.
          # Depth 1 hanya melihat snapshot terakhir — persis yang gagal ditangkap.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MUST #5: Critical/High memblokir merge. Moderate/Low dilaporkan tapi
      # tidak memblokir — ambang ini yang tertulis di standar, bukan pilihan
      # sembarang. Kalau gagal: upgrade paketnya, jangan longgarkan ambang.
      - name: Dependency audit (Critical/High memblokir)
        run: pnpm audit --audit-level=high

      # MUST #4: secret scanning atas SELURUH riwayat (fetch-depth: 0 di atas),
      # bukan hanya diff PR — rahasia lama yang belum dirotasi tetap terdeteksi.
      #
      # Binary langsung, BUKAN `gitleaks/gitleaks-action@v2`: action resmi
      # menuntut `GITLEAKS_LICENSE` untuk repo milik organisasi dan gagal tanpa
      # itu. Memanggil binary-nya sendiri bebas lisensi, versinya ter-pin
      # (hasilnya reproducible), dan perilakunya identik dengan yang bisa
      # dijalankan siapa pun secara lokal untuk memverifikasi ulang:
      #   gitleaks detect --source . --config .gitleaks.toml --redact
      - name: Secret scan (gitleaks)
        run: |
          VERSI=8.30.1
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSI}/gitleaks_${VERSI}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  # ══════════════════════════════════════════════════════════════════════════
  # Uji browser sungguhan — HANYA untuk yang lapisan lain tak bisa jangkau.
  #
  # Job terpisah dari `web` karena butuh mengunduh Chromium (~115 MB) dan
  # menjalankan `next dev`; menggabungkannya akan memperlambat gerbang lint
  # yang selama ini selesai di bawah 3 menit.
  #
  # Yang dijaga di sini hanya dua hal yang secara STRUKTURAL tak bisa diuji
  # di tempat lain:
  #   1. `middleware.ts` — berjalan di server Next, bukan di React. Sampai
  #      2026-08-02 tak ada satu pun test yang menyentuhnya, dan uji pertama
  #      langsung menemukan dua cacat: izin bocor lewat prefiks mirip
  #      (`/proyek` → `/proyeksi-kas`) dan loop redirect tanpa akhir untuk PM.
  #   2. `useVirtualList` — di jsdom `scrollTop` selalu 0, jadi mutasi
  #      `padTop * 2` lolos. Butuh gulir sungguhan.
  #
  # TIDAK diuji di sini: alur bisnis yang butuh login. Kredensial Supabase di
  # CI ditolak sadar — dan alur uangnya sendiri sudah dijaga di level trigger
  # DB, tempat yang lebih tepat karena berlaku untuk semua penulis.
  # ══════════════════════════════════════════════════════════════════════════
  browser:
    name: Browser — middleware & gulir virtual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `version` eksplisit, sama dengan ketiga job lain. Tanpa itu action
      # mencari field `packageManager` di package.json root — yang tak ada di
      # repo ini — dan mati di 8 detik sebelum satu pun test jalan.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hanya Chromium. Firefox & WebKit menambah ~250 MB unduhan untuk
      # menguji ulang hal yang sama — yang dijaga di sini logika rute dan
      # aritmetika jendela, bukan perbedaan antar-mesin render.
      - name: Pasang Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Binari langsung, bukan `pnpm run` — alasan sama dengan job `web`
      # di atas (ERR_PNPM_MISSING_TARBALL_INTEGRITY pada `xlsx`).
      - name: Uji browser
        run: pnpm exec playwright test

      - name: Simpan jejak kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jejak-playwright
          path: test-results/
          retention-days: 7

  # ── Situs publik (compro) — apps/web-publik ────────────────────────────────
  #
  # App terpisah dari dashboard: pengunjung anonim, dirender ISR, bundle harus
  # kecil, dan satu-satunya tempat Three.js dipakai. Ia punya siklus rusak
  # sendiri — build web-publik bisa gagal tanpa menyentuh apps/web sama sekali.
  #
  # SENGAJA tanpa `needs:` — sama dengan job `web`, kegagalan frontend harus
  # terlihat cepat dan tak menunggu test DB.
  #
  # Belum punya ratchet sendiri (lint/tata-letak/hex) karena app-nya baru dan
  # nol pelanggaran hari ini; menambahkannya sekarang berarti mengunci angka
  # yang belum berarti apa-apa. Yang dijaga dulu yang bisa runtuh: tipe, build,
  # dan test murni.
  web-publik:
    name: Situs publik — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-publik
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # Binari langsung, bukan `pnpm run` — alasan sama dengan job `web`:
      # ERR_PNPM_MISSING_TARBALL_INTEGRITY pada `xlsx` di CI.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Test murni (tanpa DB, tanpa jaringan): resolusi tenant dan format
      # nomor WhatsApp. Keduanya gagal DALAM DIAM kalau salah — tenant yang
      # tak ter-resolve merender halaman kosong, dan nomor salah format
      # membuka WhatsApp ke nomor yang tak ada.
      - name: Test
        run: pnpm exec vitest run

      # Kontras DIHITUNG, bukan ditaksir. Saat menambah keluarga token terang
      # (2026-08-08) saya menulis tiga angka kontras dari taksiran dan
      # KETIGANYA meleset. Penjaga ini menghitung 11 pasangan warna yang
      # benar-benar dipakai bersama, termasuk satu PAGAR: aksen kuning wajib
      # tetap GAGAL di latar terang, supaya kelangkaannya dijaga fisika warna
      # dan bukan disiplin penyuntingnya.
      - name: Kontras token situs
        run: node scripts/kontras-situs.mjs

      # Em-dash adalah tanda tangan tulisan mesin, dan situs ini menjual
      # kredibilitas kontraktor yang benar-benar membangun pabrik. Memeriksa
      # berkas SAJA tidak cukup: seluruh teksnya tinggal di tabel `situs_*`
      # dan bisa disunting lewat UI admin tanpa deploy. Tanpa DB, langkah ini
      # menyatakan bagian yang dilewatinya alih-alih diam-diam lulus.
      - name: Em-dash (berkas + konten DB)
        run: node scripts/audit-em-dash.mjs

      # ⚠ KOMENTAR LAMA DI SINI KELIRU, dan CI merah 12 run berturut-turut
      #   karenanya. Ia menyatakan "build menoleransi API yang tak terjangkau,
      #   dan halaman akan di-render ulang saat runtime". Diukur: TIDAK.
      #
      #     TypeError: fetch failed
      #     Error occurred prerendering page "/"
      #     Export encountered an error on /page: /, exiting the build.
      #
      #   `ambilKonten()` MELEMPAR saat API tak terjangkau, dan `app/page.tsx`
      #   memanggilnya di server component — jadi prerender gagal dan build
      #   berhenti.
      #
      # Yang TIDAK dilakukan untuk memperbaikinya:
      #
      #   a. Menandai halaman `dynamic = 'force-dynamic'` — itu membatalkan
      #      cache tag yang sengaja dirancang (`revalidateTag('situs')` supaya
      #      admin melihat perubahannya seketika tanpa deploy). Merusak fitur
      #      demi lulus CI.
      #
      #   b. Membuat `ambilKonten()` memulangkan konten kosong saat gagal —
      #      itu menerbitkan SITUS KOSONG diam-diam di produksi, kelas cacat
      #      yang jauh lebih buruk daripada build merah.
      #
      # Yang dilakukan: menyalakan server API tiruan yang membalas bentuk yang
      # benar. Build lalu menguji apa yang memang ingin diuji — bahwa halaman
      # bisa dirender dari konten yang sah — bukan sekadar bahwa TypeScript-nya
      # lolos.
      - name: Server konten tiruan (untuk prerender)
        run: |
          cat > /tmp/situs-tiruan.mjs <<'EOF'
          import { createServer } from 'node:http'
          // Bentuk minimum yang membuat `app/page.tsx` bisa dirender: daftar
          // seksi kosong berarti halaman terbit tanpa satu pun seksi — sah,
          // dan cukup untuk membuktikan pipeline render-nya utuh.
          const data = { seksi: [], merek: {}, kategori: [], konten: {}, media: [], milestone: [], legalitas: [] }
          createServer((req, res) => {
            res.writeHead(200, { 'content-type': 'application/json' })
            res.end(JSON.stringify({ data }))
          }).listen(3001, () => console.log('situs tiruan siap di :3001'))
          EOF
          node /tmp/situs-tiruan.mjs &
          # Tunggu sampai benar-benar menjawab — `sleep` tetap adalah tebakan.
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/v1/public/situs >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/v1/public/situs >/dev/null \
            || { echo "::error::server tiruan tak pernah menjawab"; exit 1; }

      - name: Build
        run: pnpm exec next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: https://contoh.supabase.co
          SITUS_COMPANY_ID: 00000000-0000-0000-0000-000000000000
