name: CI Project Keep-Alive

# Ping harian ke project Supabase CI supaya tak auto-pause (free project pause ~7 hari
# nganggur → run pertama sesudahnya bisa gagal acak). SELECT 1 saja; selalu exit 0.
on:
  schedule:
    - cron: '17 6 * * *'   # harian 06:17 UTC (jam ganjil agar tak bentrok beban runner)
  workflow_dispatch:

concurrency:
  group: ci-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Ping CI project
        run: node scripts/ci-keepalive.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
