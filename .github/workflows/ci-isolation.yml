name: CI Isolation (manual)

# Operasi setup/verifikasi project Supabase CI — dijalankan manual (workflow_dispatch)
# karena secret CI_* hidup di GitHub Secrets, bukan lokal. Menyentuh project CI (bukan
# dev), jadi TAK boleh berbagi group dengan CI utama — kalau berbagi, run inventaris
# yang PENDING dibatalkan tiap ada CI baru masuk group (cancel older-pending). Group
# sendiri, per-run unik, supaya tak pernah dibatalkan run lain.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inventory (A1) | periksa-gl (R-001 syarat 1) | setup (A2) | setup-clean (WIPE + replay bersih)'
        required: true
        default: inventory
        type: choice
        options: [inventory, periksa-gl, setup, setup-clean]
      paksa_ulang:
        description: 'Nomor migrasi yang catatannya dihapus supaya DIPUTAR ULANG (mis. "377,398"). Kosongkan bila tak perlu.'
        required: false
        default: ''
        type: string

# ⚠ Group per-run ini menjaga run inventaris dari pembatalan — TETAPI ia juga
# menempatkan workflow ini DI LUAR barisan `ci-shared-ci-db` milik `ci.yml`.
#
# Keduanya menulis ke project CI yang SAMA. Diukur 2026-09-04, tiga run
# `setup-clean` gagal berturut-turut karena itu:
#
#     19:25:24  CI              ← 6 shard menjalankan Prepare CI project
#     19:25:21  CI Isolation    ← WIPE mengosongkan basis
#
# WIPE mengosongkan, shard memutar migrasi ke dalamnya, lalu `setup-clean`
# mencoba 001 dan gagal `type "project_status" already exists` — galat yang
# menuduh migrasinya, padahal yang bertabrakan dua workflow.
#
# Menyatukan group akan membuat run inventaris bisa dibatalkan CI — persis yang
# komentar di bawah cegah. Jadi sampai R-009 (isolasi nyata per shard) selesai,
# yang berlaku aturan operasional, bukan setelan:
#
#     JALANKAN `setup-clean` HANYA saat tak ada run CI aktif, dan jangan
#     mem-push apa pun selama ia berjalan — push memicu CI, CI memicu balapan.
#
#     Periksa dulu:  gh run list --limit 5 --json name,status \
#                      --jq '.[]|select(.status!="completed")|.name'
concurrency:
  group: ci-isolation-ops-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # A1 — inventaris READ-ONLY project CI. Job MERAH (exit 2) bila TIDAK kosong.
      - name: A1 Inventory CI project (read-only)
        if: ${{ inputs.action == 'inventory' }}
        run: node scripts/ci-project-inventory.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # R-001 syarat (1) — periksa BENTUK tabel GL di project CI sebelum
      # memensiunkan migrasi 047. READ-ONLY.
      #
      # Exit 0 = aman (accounts belum ada, ATAU sudah memakai bentuk 167).
      # Exit 2 = accounts memakai bentuk 047 tanpa company_id → GL tenant-blind,
      #          dan tabelnya TAK BISA diperbaiki dengan menjalankan 167 karena
      #          167 memakai CREATE TABLE IF NOT EXISTS. Reset CI dari nol wajib:
      #          gh workflow run ci-isolation.yml -f action=setup-clean
      - name: Periksa bentuk GL di project CI (R-001 syarat 1, read-only)
        if: ${{ inputs.action == 'periksa-gl' }}
        run: node scripts/ci-periksa-bentuk-gl.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # A2 — setup: apply migrasi 001..116 + seed data uji minimal ke project CI.
      - name: A2 Setup CI project (migrate + seed)
        if: ${{ inputs.action == 'setup' }}
        run: node scripts/ci-project-setup.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
          PAKSA_ULANG: ${{ inputs.paksa_ulang }}

      # A2 — setup-clean: WIPE project CI lalu replay BERSIH sekali dari nol (angka jujur).
      - name: A2 Setup CLEAN (wipe + replay + seed)
        if: ${{ inputs.action == 'setup-clean' }}
        run: node scripts/ci-project-setup.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
          PAKSA_ULANG: ${{ inputs.paksa_ulang }}
          WIPE: '1'
