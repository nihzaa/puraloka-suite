name: CI Isolation (manual)

# Operasi setup/verifikasi project Supabase CI — dijalankan manual (workflow_dispatch)
# karena secret CI_* hidup di GitHub Secrets, bukan lokal. Menyentuh project CI (bukan
# dev), jadi TAK boleh berbagi group dengan CI utama — kalau berbagi, run inventaris
# yang PENDING dibatalkan tiap ada CI baru masuk group (cancel older-pending). Group
# sendiri, per-run unik, supaya tak pernah dibatalkan run lain.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inventory (A1) | setup (A2) | setup-clean (WIPE + replay bersih)'
        required: true
        default: inventory
        type: choice
        options: [inventory, setup, setup-clean]

concurrency:
  group: ci-isolation-ops-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # A1 — inventaris READ-ONLY project CI. Job MERAH (exit 2) bila TIDAK kosong.
      - name: A1 Inventory CI project (read-only)
        if: ${{ inputs.action == 'inventory' }}
        run: node scripts/ci-project-inventory.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # A2 — setup: apply migrasi 001..116 + seed data uji minimal ke project CI.
      - name: A2 Setup CI project (migrate + seed)
        if: ${{ inputs.action == 'setup' }}
        run: node scripts/ci-project-setup.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      # A2 — setup-clean: WIPE project CI lalu replay BERSIH sekali dari nol (angka jujur).
      - name: A2 Setup CLEAN (wipe + replay + seed)
        if: ${{ inputs.action == 'setup-clean' }}
        run: node scripts/ci-project-setup.mjs
        env:
          CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
          WIPE: '1'
