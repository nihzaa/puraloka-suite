name: Cadangan Harian (terenkripsi)

# ============================================================================
# CADANGAN HARIAN — pengganti Point-in-Time Recovery untuk paket Supabase free.
#
# ══════════════════════════════════════════════════════════════════════════
# MASALAH YANG DIPECAHKAN
# ══════════════════════════════════════════════════════════════════════════
#
# Paket free Supabase hanya menyimpan cadangan HARIAN. Kalau data rusak jam 3
# sore, titik pemulihan terdekat adalah tengah malam — pekerjaan sehari hilang.
# Point-in-Time Recovery (yang bisa kembali ke jam 2:59 sore) adalah fitur
# berbayar.
#
# Cadangan ini TIDAK menggantikan PITR — ia tak bisa. Yang ia lakukan:
# memberi salinan KEDUA yang hidup di LUAR akun Supabase. Itu menutup satu
# risiko yang tak ditutup cadangan penyedia mana pun: kalau yang hilang justru
# AKSES ke akunnya, cadangan yang hanya ada di dalam akun ikut hilang bersamanya.
#
# ── Keputusan pemilik (2026-08-03)
#
#   • Tempat simpan : GitHub Actions artifact, TERENKRIPSI
#   • Toleransi     : harian sudah cukup — belum ada pelanggan
#   • Tripwire      : sebelum pelanggan PERTAMA masuk, naikkan ke PITR berbayar
#
# ⚠️ TRIPWIRE ITU MENGIKAT. Begitu ada data pelanggan sungguhan, cadangan
#    harian TIDAK lagi memadai — kehilangan sehari kerja milik orang lain
#    bukan hal yang bisa diminta maaf. Naikkan ke paket Pro dan aktifkan PITR
#    SEBELUM pelanggan pertama, bukan sesudah.
#
# ══════════════════════════════════════════════════════════════════════════
# KENAPA DIENKRIPSI — INI TIDAK BOLEH DILEPAS
# ══════════════════════════════════════════════════════════════════════════
#
# Repo ini PUBLIC. Artifact GitHub bisa diunduh siapa pun yang bisa melihat
# repo-nya. Mengunggah dump mentah ke sini sama dengan MENERBITKAN seluruh isi
# basis data ke internet.
#
# Karena itu dump dikunci dengan AES-256 sebelum diunggah, dan sandinya hidup
# di GitHub Secrets (`SANDI_CADANGAN`) — tak pernah tertulis di berkas mana pun.
#
# Job ini GAGAL bila sandinya tak ada. Itu disengaja: cadangan tak terenkripsi
# di repo publik lebih berbahaya daripada tidak ada cadangan sama sekali,
# karena ia terasa seperti keamanan padahal justru kebocoran.
# ============================================================================

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, tiap hari.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: cadangan-harian
  cancel-in-progress: false

jobs:
  cadangkan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Dibutuhkan sejak jaring pengaman R-006 ditambahkan: langkah cadangan
      # darurat menjalankan `scripts/db/cadangan-darurat.mjs`, dan tanpa
      # checkout runner tak punya satu pun berkas repo.
      #
      # Sebelumnya workflow ini memang tak memerlukannya — ia hanya memanggil
      # pg_dump. Menambah langkah yang butuh berkas repo tanpa menambah
      # checkout adalah cara jaring pengaman gagal justru saat dipakai:
      # ia terpicu benar, lalu mati dengan "Cannot find module".
      - uses: actions/checkout@v4

      # ── Gerbang: tanpa sandi, JANGAN jalan ────────────────────────────────
      #
      # Diperiksa PALING AWAL, sebelum satu byte pun data disentuh. Menemukan
      # sandi hilang setelah dump jadi berarti ada dump tak terenkripsi
      # menganggur di disk runner.
      - name: Pastikan sandi enkripsi ada
        env:
          SANDI: ${{ secrets.SANDI_CADANGAN }}
        run: |
          if [ -z "$SANDI" ]; then
            echo "::error::Secret SANDI_CADANGAN belum diisi."
            echo "Repo ini PUBLIC — artifact bisa diunduh siapa pun."
            echo "Cadangan TIDAK akan dibuat tanpa enkripsi."
            echo ""
            echo "Cara mengisi:"
            echo "  1. Buat sandi acak:"
            echo "     node -e \"console.log(require('crypto').randomBytes(32).toString('base64'))\""
            echo "  2. GitHub → Settings → Secrets and variables → Actions → New secret"
            echo "  3. Nama: SANDI_CADANGAN"
            echo "  4. SIMPAN SANDINYA DI TEMPAT LAIN JUGA (password manager)."
            echo "     Tanpa sandi itu, cadangan ini TIDAK BISA DIBUKA selamanya."
            exit 1
          fi
          echo "✅ sandi tersedia"

      # pg_dump HARUS >= versi server (PostgreSQL 17). Klien lebih tua bisa
      # kehilangan objek yang belum dikenalinya — kerusakan yang baru ketahuan
      # saat restore, yaitu saat paling gawat.
      - name: Pasang klien Postgres 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # PATH tidak cukup: runner sudah membawa client-16, dan
          # /usr/bin/pg_dump menang atas /usr/lib/postgresql/17/bin/pg_dump.
          # Memasang bukan berarti memakai — terbukti di run 30829393757.
          echo "PATH=/usr/lib/postgresql/17/bin:$PATH" >> $GITHUB_ENV
          V=$(/usr/lib/postgresql/17/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "versi yang AKAN dipakai: $V"
          [ "$V" -ge 17 ] || { echo "::error::pg_dump $V < 17 — dump bisa kehilangan objek"; exit 1; }

      # ── Sandi bersimbol WAJIB di-encode ──────────────────────────────────
      #
      # Insiden 2026-08-03: `@` di dalam sandi memisahkan URL di tempat yang
      # salah, dan pesan galat pg_dump MENCETAK potongan sandi ke log. GitHub
      # me-mask nilai secret yang persis sama, tetapi potongan hasil parsing
      # yang keliru bukan nilai yang sama — jadi lolos dari mask. Di repo
      # publik, itu kredensial yang terbit.
      - name: Susun URL aman (sandi ter-encode)
        env:
          SUMBER: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$SUMBER" ]; then
            echo "::error::Secret DIRECT_URL belum diisi."; exit 1
          fi
          AMAN=$(SUMBER="$SUMBER" node -e '
            const u = process.env.SUMBER;
            // ⚠️ JANGAN encode URL yang SUDAH sah.
            //
            // Sandi di .env repo ini sudah ter-encode (memuat %). Meng-encode
            // ULANG mengubah % jadi %25; Postgres men-decode-nya jadi nilai
            // BERBEDA, lalu menolak dengan "password authentication failed for
            // user postgres" — pesan yang menuduh username, padahal sandinya
            // yang rusak. Dua run cadangan pertama gagal karena ini.
            //
            // Lebih dari satu "@" di bagian kredensial = sandi memuat @ mentah
            // = URL salah baca. Hanya kasus itu yang perlu diperbaiki.
            const tanpaSkema = u.replace(/^postgres(ql)?:\/\//, "");
            if ((tanpaSkema.match(/@/g) || []).length === 1) {
              try {
                const p = new URL(u);
                if (p.hostname && p.username) { process.stdout.write(u); process.exit(0); }
              } catch { /* rusak — perbaiki di bawah */ }
            }
            const m = u.match(/^(postgres(?:ql)?:\/\/)([^:]+):(.*)@([^@]+)$/);
            if (!m) { console.error("format URL tak dikenali"); process.exit(1); }
            const [, skema, user, sandi, sisa] = m;
            process.stdout.write(skema + encodeURIComponent(user) + ":" +
                                 encodeURIComponent(sandi) + "@" + sisa);
          ')
          echo "::add-mask::$AMAN"
          echo "URL_AMAN=$AMAN" >> $GITHUB_ENV

      - name: Cadangkan (READ-ONLY terhadap sumber)
        run: |
          mkdir -p keluar
          CAP=$(date -u +%Y-%m-%d)
          t0=$(date +%s)
          # pg_dump tak pernah menulis ke basis data yang dibacanya.
          # stderr dibungkam: galat koneksi bisa memuat potongan kredensial.
          # --serializable-deferrable: satu snapshot yang konsisten secara
          # transaksional. Tanpanya cadangan bisa memuat baris anak yang
          # induknya tak ikut terbawa — dan cadangan yang tak konsisten
          # referensial adalah cadangan yang TIDAK BISA dipulihkan utuh.
          # Terbukti di drill: pelanggaran FK saat restore.
          #
          # --schema=public: schema test sementara milik CI bisa lenyap di
          # tengah dump ("schema … does not exist"). Yang perlu dipulihkan saat
          # bencana memang hanya public.
          # ── Coba ulang saat terkena BALAPAN, bukan menyerah ───────────────
          #
          # `--schema=public` menutup sebagian, tetapi pg_dump tetap membaca
          # KATALOG schema di awal. Kalau sebuah schema lenyap di antara
          # pembacaan katalog dan pengambilan isinya, ia mati dengan
          #     schema with OID 2840025 does not exist
          #
          # Ini nyata di sini: DIRECT_URL produksi menunjuk database yang SAMA
          # dengan yang dipakai test suite (schema `test` ada di sana), dan CI
          # bisa berjalan kapan saja. Run 30838449838 gagal karena CI mulai dua
          # detik sebelumnya.
          #
          # Balapan bukan kerusakan — ia hanya perlu diulang. Tiga percobaan
          # dengan jeda; kalau ketiganya kena, barulah itu masalah sungguhan.
          # ⚠️ R-006: pg_dump SEDANG TIDAK BISA dipakai di database ini —
          # satu fungsi yatim menunjuk schema terhapus, dan lima varian
          # pg_dump gagal identik. Selama R-006 belum selesai, langkah ini
          # akan gagal, dan langkah "Cadangan darurat" di bawahlah yang
          # menyelamatkan datanya.
          #
          # Kegagalannya SENGAJA tidak dimatikan: kalau ia dibungkam, tak ada
          # yang akan tahu saat R-006 akhirnya selesai dan pg_dump pulih.
          BERHASIL=0
          for PERCOBAAN in 1 2 3; do
            # --exclude-schema=test: database ini punya baris pg_depend YATIM
            # yang menunjuk schema sudah-terhapus (OID 2840025, sisa fungsi
            # yang ikut terhapus bersamanya). pg_dump menelusuri pg_depend dan
            # tersandung di sana:  "schema with OID 2840025 does not exist".
            # Bukan balapan — OID-nya SAMA di tiga percobaan berturut-turut.
            #
            # Membersihkan baris katalog itu berarti menulis ke katalog sistem
            # = Gerbang Keras G-2, butuh ratifikasi. Mengecualikan schema `test`
            # menghindarinya tanpa mengurangi apa pun yang berharga: schema itu
            # milik test suite, bukan data pelanggan.
            if pg_dump --format=custom --no-owner --no-privileges \
                       --schema=public --exclude-schema=test \
                       --serializable-deferrable \
                       --file="keluar/puraloka-$CAP.dump" "$URL_AMAN" 2>/tmp/galat.txt; then
              BERHASIL=1; break
            fi
            if grep -qiE "does not exist|concurrently (updated|deleted)" /tmp/galat.txt; then
              echo "::notice::percobaan $PERCOBAAN kena balapan dengan test suite — mengulang"
              sleep 20; continue
            fi
            break   # galat lain: jangan diulang, laporkan apa adanya
          done

          if [ "$BERHASIL" = "0" ]; then
            echo "::error::pg_dump gagal."
            if   grep -qi "password authentication failed" /tmp/galat.txt; then
              echo "SEBAB: sandi SALAH. Perbarui secret DIRECT_URL."
            elif grep -qi "could not translate host name\|Name or service not known" /tmp/galat.txt; then
              echo "SEBAB: host tak dikenali — URL salah bentuk, atau project di-pause/dihapus."
            elif grep -qi "Tenant or user not found" /tmp/galat.txt; then
              echo "SEBAB: user tak ada di pooler — username Supabase berbentuk 'postgres.<ref>'."
            elif grep -qi "timeout\|timed out\|connection refused" /tmp/galat.txt; then
              echo "SEBAB: sambungan ditolak/kehabisan waktu — project mungkin di-PAUSE."
            else
              echo "SEBAB: tak dikenali."
            fi
            # Disensor sebelum dicetak. Pola `@` menerima karakter APA PUN
            # sebelumnya — kelas sempit gagal menyensor sandi bersimbol.
            sed -E 's#postgres(ql)?://[^ "]*#[URL-DISENSOR]#g; s#[^ "]*@[A-Za-z0-9.-]+#[KREDENSIAL-DISENSOR]#g' \
              /tmp/galat.txt | head -1 || true
            exit 1
          fi
          t1=$(date +%s)
          echo "CAP=$CAP" >> $GITHUB_ENV
          echo "DETIK=$((t1-t0))" >> $GITHUB_ENV
          echo "::notice::dump $((t1-t0))s, $(du -h keluar/puraloka-$CAP.dump | cut -f1)"

      # Dump yang "berhasil" tapi kosong adalah jebakan paling halus: ia lolos
      # setiap pemeriksaan yang hanya melihat kode keluar. Diperiksa SEBELUM
      # enkripsi — setelah dikunci, isinya tak bisa diperiksa lagi.
      # ── JARING PENGAMAN saat pg_dump gagal (R-006) ───────────────────────
      #
      # `if: failure()` — berjalan HANYA ketika langkah di atas gagal.
      #
      # COPY tak menelusuri pg_depend, jadi ia lolos dari fungsi yatim yang
      # mematikan pg_dump. Diukur, bukan diasumsikan: 123 tabel / 48.330 baris
      # tersalin dalam 7,6 detik, dan jumlah baris tiap tabel diverifikasi
      # ulang terhadap database.
      #
      # Yang TIDAK tertutup: struktur, RLS, policy, trigger. Itu bukan
      # kehilangan permanen — semuanya bisa dibangun ulang dari
      # `db/migrations/*.sql` yang hidup di git. Justru itu gunanya migrasi
      # disimpan sebagai berkas bernomor, bukan sekadar dijalankan sekali.
      #
      # Jaring ini TIDAK menggantikan pg_dump dan tak boleh jadi alasan
      # menunda R-006.
      - name: Cadangan darurat (COPY) — hanya bila pg_dump gagal
        if: failure()
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # WAJIB ada di sini: openssl membacanya lewat `-pass env:SANDI`.
          # Tanpa deklarasi ini, enkripsi gagal dan CSV mentah bisa lolos ke
          # artifact di repo PUBLIK. Nyaris terjadi — ketahuan saat memeriksa
          # ulang berkas ini sebelum push.
          SANDI: ${{ secrets.SANDI_CADANGAN }}
        run: |
          echo "::warning::pg_dump gagal (R-006). Menyelamatkan DATA lewat COPY."

          # `scripts/db/_koneksi.mjs` mengambil paket `pg` dari
          # apps/api/node_modules (createRequire). Runner belum pernah
          # `pnpm install`, jadi tanpa ini skripnya mati "Cannot find module
          # 'pg'" — cacat sekelas dengan checkout yang tadi hilang: langkah
          # baru dipasang tanpa prasyaratnya ikut dipasang.
          #
          # Hanya `pg` yang dipasang, bukan seluruh workspace: jaring pengaman
          # harus berjalan secepat dan sesedikit mungkin bergantung.
          mkdir -p apps/api/node_modules
          npm install --no-save --prefix apps/api pg pg-copy-streams >/dev/null 2>&1 || {
            echo "::error::gagal memasang paket pg — cadangan darurat DIBATALKAN"; exit 1; }

          if [ -z "$SANDI" ]; then
            echo "::error::SANDI_CADANGAN kosong — cadangan darurat DIBATALKAN."
            echo "CSV mentah tak boleh diunggah tanpa enkripsi di repo publik."
            exit 1
          fi
          mkdir -p apps/api
          # Skrip membaca apps/api/.env lewat parser bersama, jadi secret
          # dituliskan ke sana — bukan dirakit ulang di tempat lain.
          printf 'DIRECT_URL=%s\n' "$DIRECT_URL" > apps/api/.env
          node scripts/db/cadangan-darurat.mjs --keluaran keluar-darurat
          rm -f apps/api/.env

          CAP=$(date -u +%Y-%m-%d)
          # Diarsipkan lalu DIKUNCI sebelum menyentuh artifact — repo ini
          # publik, dan CSV mentah adalah seluruh isi basis data.
          tar -czf "keluar-darurat-$CAP.tar.gz" keluar-darurat
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
            -in "keluar-darurat-$CAP.tar.gz" \
            -out "darurat-$CAP.tar.gz.enc" \
            -pass env:SANDI
          rm -rf keluar-darurat "keluar-darurat-$CAP.tar.gz"
          echo "CAP=$CAP" >> $GITHUB_ENV

          # ── BUKTIKAN bisa dibuka kembali, di run yang sama ───────────────
          #
          # Cadangan yang tak pernah diuji-buka adalah berkas sampah yang
          # menyamar jadi jaring pengaman — dan penyamarannya baru terbongkar
          # pada hari ia dibutuhkan.
          #
          # Diperiksa sampai ke ISINYA: didekripsi, di-untar, lalu MANIFES.json
          # dibaca dan jumlah tabelnya dicocokkan. Berhasil-mendekripsi saja
          # belum cukup — arsip bisa terbuka tetapi kosong.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in "darurat-$CAP.tar.gz.enc" -out /tmp/uji.tar.gz -pass env:SANDI
          mkdir -p /tmp/uji && tar -xzf /tmp/uji.tar.gz -C /tmp/uji
          N=$(node -e "
            const m=require('/tmp/uji/keluar-darurat/'+require('fs')
              .readdirSync('/tmp/uji/keluar-darurat')[0]+'/MANIFES.json');
            process.stdout.write(String(m.tabel));
          " 2>/dev/null || echo 0)
          rm -rf /tmp/uji /tmp/uji.tar.gz
          if [ "${N:-0}" -lt 1 ]; then
            echo "::error::cadangan darurat TIDAK bisa dibaca ulang — tak sah"; exit 1
          fi
          echo "✅ terbukti bisa dibuka kembali — $N tabel di dalamnya"
          echo "✅ cadangan darurat terenkripsi: darurat-$CAP.tar.gz.enc"
        # SANDI dipisah ke env agar openssl membacanya lewat env:SANDI,
        # tak pernah jadi argumen (argumen terlihat di daftar proses).

      - name: Simpan cadangan darurat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cadangan-darurat-${{ env.CAP }}
          path: darurat-*.tar.gz.enc
          retention-days: 30
          if-no-files-found: error

      - name: Buktikan dump berisi
        run: |
          N=$(pg_restore --list "keluar/puraloka-$CAP.dump" | grep -c "TABLE DATA" || true)
          echo "TABLE DATA dalam dump: $N"
          if [ "$N" -lt 1 ]; then
            echo "::error::dump TIDAK berisi satu pun tabel data — cadangan tak sah"
            exit 1
          fi
          echo "TABEL=$N" >> $GITHUB_ENV

      - name: Kunci dengan AES-256
        env:
          SANDI: ${{ secrets.SANDI_CADANGAN }}
        run: |
          # -pbkdf2 wajib: tanpanya OpenSSL memakai derivasi kunci lama yang
          # jauh lebih mudah ditebak dengan brute force.
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
            -in "keluar/puraloka-$CAP.dump" \
            -out "keluar/puraloka-$CAP.dump.enc" \
            -pass env:SANDI

          # Dump mentah DIHAPUS sebelum langkah apa pun berikutnya. Runner
          # memang sekali-pakai, tetapi mengandalkan itu berarti satu langkah
          # ceroboh di kemudian hari bisa mengunggahnya.
          rm -f "keluar/puraloka-$CAP.dump"

          ls -la keluar/
          echo "MB=$(du -m keluar/puraloka-$CAP.dump.enc | cut -f1)" >> $GITHUB_ENV

      # Membuktikan berkas terenkripsinya benar-benar bisa dibuka kembali.
      # Cadangan yang tak bisa didekripsi adalah berkas sampah yang menyamar
      # sebagai jaring pengaman — dan itu baru ketahuan saat dibutuhkan.
      - name: Buktikan masih bisa dibuka
        env:
          SANDI: ${{ secrets.SANDI_CADANGAN }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in "keluar/puraloka-$CAP.dump.enc" \
            -out /tmp/uji.dump -pass env:SANDI
          N=$(pg_restore --list /tmp/uji.dump | grep -c "TABLE DATA" || true)
          rm -f /tmp/uji.dump
          [ "$N" = "$TABEL" ] || {
            echo "::error::hasil dekripsi TIDAK sama dengan aslinya ($N vs $TABEL)"; exit 1; }
          echo "✅ terbukti bisa dibuka kembali — $N tabel"

      - name: Simpan
        uses: actions/upload-artifact@v4
        with:
          name: cadangan-${{ env.CAP }}
          path: keluar/*.enc
          # 30 hari: cukup panjang untuk menyadari kerusakan yang tak langsung
          # terlihat, cukup pendek supaya kuota tak habis.
          retention-days: 30

      - name: Ringkasan
        run: |
          {
            echo "## Cadangan $CAP"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ukuran (terenkripsi) | ${MB} MB |"
            echo "| tabel berisi data | ${TABEL} |"
            echo "| durasi dump | ${DETIK} dtk |"
            echo "| tersimpan | 30 hari |"
            echo ""
            echo "🔐 AES-256 · terbukti bisa didekripsi ulang di run ini."
            echo ""
            echo "**Membuka:** unduh artifact, lalu:"
            echo '```'
            echo "openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \\"
            echo "  -in puraloka-$CAP.dump.enc -out puraloka.dump"
            echo '```'
            echo ""
            echo "Langkah pemulihan lengkap: \`docs/ops/RUNBOOK-PEMULIHAN.md\`"
          } >> $GITHUB_STEP_SUMMARY
