packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

# ── Kenapa pemeriksaan dependensi pra-script dimatikan ─────────────────────
#
# pnpm v11 menjalankan pemeriksaan status dependensi sebelum SETIAP
# `pnpm <script>`. Pemeriksaan itu tak bisa memverifikasi `xlsx` yang dipasang
# dari tarball CDN sheetjs: untuk paket ber-URL tarball, entri `snapshots:` di
# lockfile v9 memang kosong (`{}`) sementara `integrity`-nya hidup di blok
# `packages:` (pnpm-lock.yaml:7072 vs :14900).
#
# Akibatnya setiap `pnpm lint`/`typecheck`/`build` di CI mati dengan
# ERR_PNPM_MISSING_TARBALL_INTEGRITY — bahkan setelah `pnpm install` di step
# sebelumnya BERHASIL. Terbukti di run 30594212080: install lulus dalam 31 detik,
# yang gagal justru step `pnpm lint:ratchet` sesudahnya.
#
# Aman: jaminan integritas yang sesungguhnya tetap ada di step install CI yang
# memakai `--frozen-lockfile`. Yang dimatikan hanya pemeriksaan ULANG sebelum
# tiap script — bukan verifikasi saat paket benar-benar dipasang.
#
# ⚠️ Harus di SINI, bukan `.npmrc`: pnpm v11 membaca konfigurasi ini dari
#    pnpm-workspace.yaml. Di `.npmrc` ia diabaikan diam-diam — sama seperti
#    `overrides` di bawah.
verifyDepsBeforeRun: false

# ── A2 (STATUS.md §AUDIT) — versi aman untuk dependency TRANSITIF ───────────
#
# Konteks: step `pnpm audit --audit-level=high` ditambahkan ke CI 2026-07-31.
# Saat pertama dijalankan: 1 critical + 35 high. Nyaris semuanya TRANSITIF —
# tak bisa diperbaiki dengan meng-upgrade dependency langsung, karena yang
# menariknya paket lain (mayoritas apps/mobile: Expo menyeret pohon dependency
# besar yang tertinggal beberapa versi).
#
# ⚠️ LOKASI PENTING: sejak pnpm v10+, `overrides` dibaca dari FILE INI, bukan
# dari `package.json`. Menaruhnya di package.json tidak menimbulkan error —
# ia hanya diabaikan diam-diam, dan audit tetap merah tanpa petunjuk kenapa.
#
# Kenapa override, bukan melonggarkan ambang audit ke 'critical': ambang high
# memblokir-merge adalah bunyi `11-devsecops-standard.md` MUST #5 apa adanya.
# Melonggarkannya = mengubah standar diam-diam, persis governance drift yang
# A3 justru sedang diperbaiki.
#
# Tiap entri = versi PATCH minimum dari advisory, bukan mayor terbaru:
# menutup lubang tanpa memicu breaking change. Saat paket induk akhirnya ikut
# naik, override yang tak relevan boleh dihapus (pnpm memperingatkannya).
overrides:
  tar: '>=7.5.19'
  '@xmldom/xmldom': '>=0.8.12'
  form-data: '>=4.0.6'
  # ⚠ BERBATAS ATAS, dan itu bukan kelonggaran keamanan.
  #
  # Ambang bawah `>=6.27.0` tetap: itu yang menutup advisory-nya.
  # Batas atas `<7` ditambahkan 2026-09-01 karena build APK GAGAL:
  #
  #     [PREBUILD] webidl.util.markAsUncloneable is not a function
  #     [PREBUILD] ✖ Failed to create the native directory
  #
  # `markAsUncloneable` adalah API Node 22. Diukur:
  #
  #     undici terpasang di repo   8.9.0   engines: node >=22.19.0
  #     Node di server EAS Build   20.19.2
  #     undici 6.28.0              engines: node >=18.17   ← cocok
  #
  # Tanpa batas atas, `>=6.27.0` menarik undici 8 yang MENUNTUT Node 22, dan
  # prebuild mati di server yang memakai Node 20. Web dan API tak terganggu
  # karena keduanya berjalan di Node 24.
  #
  # Cara memeriksa kalau batas ini masih dibutuhkan:
  #     versi Node server terbaca di log build, fase SPIN_UP_BUILDER.
  #     Begitu EAS memakai Node >=22.19, `<7` boleh dilonggarkan.
  undici: '>=6.27.0 <7'
  js-yaml: '>=4.3.0'
  shell-quote: '>=1.8.5'
  axios: '>=1.18.0'
  # Advisory kedua (host confusion via backslash, butuh >=4.1.2) muncul
  # 2026-08-04 — beda dari yang pertama. Batas dinaikkan, bukan diabaikan:
  # ini patch dalam mayor yang sama, jadi tak ada perubahan bentuk ekspor.
  fast-uri: '>=4.1.2'
  sharp: '>=0.35.0'
  postcss: '>=8.5.18'
  find-my-way: '>=9.6.1'
  # nanoid — DUA advisory, ambang berbeda (GHSA-28wg-ghj8-5hjv butuh >=3.3.16,
  # GHSA-2v37-7h3g-55p8 butuh >=3.3.18). Dipakai yang lebih tinggi.
  #
  # Ditarik dari dua arah: apps/mobile lewat expo-router → @react-navigation,
  # dan apps/api lewat @vitest/coverage-v8 → vitest. Keduanya transitif; nol
  # pemakaian langsung di kode kita.
  #
  # Diverifikasi ADA di registry sebelum dipasang:
  #   pnpm view nanoid@3.3.18 version   → 3.3.18
  #
  # ⚠ Dibatasi `<4`: `>=3.3.18` saja menarik nanoid 6.0.1 — lompatan DUA mayor
  #   yang mengubah bentuk ekspor (v4+ ESM-only). Override yang menambal lubang
  #   sambil memutus impor bukan perbaikan, dan putusnya tak terlihat sampai
  #   sesuatu yang jarang dipanggil gagal di produksi.
  nanoid: '>=3.3.18 <4'

# ── auditConfig — HANYA untuk temuan yang terbukti tidak berlaku ────────────
#
# ⚠️ Daftar ini BUKAN tempat membuang temuan yang merepotkan. Tiap entri wajib
# menyertakan alasan yang bisa diverifikasi ulang orang lain. Kalau ragu:
# perbaiki paketnya, jangan tambahkan di sini.
auditConfig:
  ignoreGhsas:
    # xlsx (SheetJS) — Prototype Pollution + ReDoS.
    #
    # TERPASANG 0.20.3, DI ATAS kedua ambang (butuh >=0.19.3 dan >=0.20.2).
    # Verifikasi ulang kapan saja:
    #   node -e "console.log(require('./apps/api/node_modules/xlsx/package.json').version)"
    #
    # Kenapa tetap muncul di audit: sejak 0.18.5 SheetJS berhenti mempublikasi
    # ke npm dan pindah ke CDN sendiri (cdn.sheetjs.com). Paket ini dipasang
    # dari URL tarball, dan `pnpm audit` tak bisa membaca versi dari URL —
    # ia mencocokkan by-name lalu mengasumsikan yang terburuk. Temuan ini
    # false positive terhadap versi yang benar-benar terpasang.
    #
    # Jalur yang benar-benar mem-parse input asing (`XLSX.read` atas file
    # unggahan pengguna) hanya ada di `apps/api/src/routes/v1/rab.ts:627`;
    # `apps/web` cuma MENULIS file (`json_to_sheet`/`writeFile`), tak mem-parse.
    # Keduanya kini di 0.20.3.
    - GHSA-4r6h-8v6p-xvw6 # Prototype Pollution in sheetJS (butuh >=0.19.3)
    - GHSA-5pgg-2g8v-p4x9 # SheetJS ReDoS (butuh >=0.20.2)

    # brace-expansion — DoS via ekspansi `{}` (butuh >=5.0.7 / >=5.0.8).
    #
    # TIDAK BISA di-override: v5 mengubah bentuk ekspor (`expand` bukan lagi
    # default export). `minimatch@3` — yang masih dipakai `@eslint/config-array`
    # dan sejumlah paket lain — memanggilnya dengan cara lama, jadi menaikkan
    # versinya membuat ESLint MATI TOTAL:
    #   TypeError: expand is not a function (minimatch/minimatch.js:271)
    # Diverifikasi 2026-07-31: baik override global maupun `minimatch>brace-
    # expansion` sama-sama membuat `pnpm lint:ratchet` crash.
    #
    # Penilaian paparan: kerentanannya DoS lewat pola glob yang disusun
    # penyerang. Di repo ini `brace-expansion` hanya dipakai perkakas
    # build/lint (eslint, glob) atas pola yang KITA tulis sendiri di config —
    # tak ada satu pun jalur di mana pola glob berasal dari input pengguna.
    # Tak ada permukaan serang di runtime produksi.
    #
    # Cabut entri ini begitu ekosistem eslint pindah ke minimatch modern.
    - GHSA-mh99-v99m-4gvg # brace-expansion DoS (unbounded expansion → OOM)

    # brace-expansion GHSA-rgw5-rvv9-x895 — advisory BARU (muncul 2026-08-03),
    # butuh >=1.1.18 / >=2.1.4 / >=5.0.9.
    #
    # ⚠️ SAYA MENCOBA MEMPERBAIKINYA LEBIH DULU, dan mendokumentasikan
    # kegagalannya di sini supaya tak ada yang mengulang percobaan yang sama:
    #
    #   'brace-expansion@1'    → selektor tak dikenali pnpm; versi lama tetap
    #   'brace-expansion@1.x'  → tak menggantikan; audit 4 high → 2, bukan 0
    #   'brace-expansion': '>=5.0.9'
    #                          → audit BERSIH (4 high → 0) dan lint API hijau,
    #                            TETAPI ESLint WEB MATI TOTAL:
    #                              TypeError: expand is not a function
    #                              at Minimatch.braceExpand
    #                              (minimatch@3.1.5/minimatch.js:271)
    #
    # Percobaan ketiga nyaris saya terima sebagai keberhasilan — audit bersih,
    # `lint:ratchet` API hijau. Yang menyelamatkan hanya karena web ikut diuji.
    # MENGUJI SATU APP LALU MENYIMPULKAN UNTUK DUA APP adalah cara catatan yang
    # benar (entri GHSA-mh99 di atas) dibuang sebagai "sudah usang".
    #
    # Penilaian paparan SAMA dengan GHSA-mh99 dan tetap berlaku: brace-expansion
    # hanya dipakai perkakas build/lint atas pola glob yang KITA tulis di config.
    # Nol jalur di mana polanya berasal dari input pengguna; nol permukaan
    # serang di runtime produksi.
    #
    # Cabut bersamaan dengan GHSA-mh99 begitu ekosistem eslint meninggalkan
    # minimatch@3.
    - GHSA-rgw5-rvv9-x895 # brace-expansion DoS (patch memutus ESLint web)

    # image-size — DoS lewat parser ICNS dan JXL/HEIF (butuh >=2.0.3).
    #
    # ⚠️ VERSI TAMBALANNYA BELUM ADA. Diverifikasi 2026-08-31:
    #     pnpm view image-size version         → 2.0.2
    #     pnpm view image-size@2.0.3 version   → ERR_PNPM_PACKAGE_NOT_FOUND
    #
    # Advisory menuntut >=2.0.3, dan 2.0.2 adalah rilis TERTINGGI yang ada.
    # Override ke versi yang belum dipublikasi akan membuat `pnpm install`
    # gagal total — bukan menambal apa pun.
    #
    # Penilaian paparan (tiap poin bisa diperiksa ulang):
    #
    #   1. Ditarik HANYA lewat apps/mobile:
    #        apps__mobile>@expo/vector-icons>expo-font>expo>expo-asset>
    #        expo-constants>react-native>@react-native/community-cli-*
    #      Verifikasi: `pnpm audit --audit-level=high` lalu baca kolom `Paths`.
    #
    #   2. `apps/mobile` TIDAK ter-deploy. Verifikasi:
    #        grep -n mobile docker-compose.yml    → nol hasil
    #      Yang berjalan di VPS cuma api, web, web-publik.
    #
    #   3. Nol pemakaian langsung di kode kita. Verifikasi:
    #        grep -rn "image-size\|imageSize" apps/*/src apps/*/app apps/*/lib
    #
    #   4. Jalurnya `community-cli` — perkakas PENGEMBANGAN React Native, bukan
    #      runtime aplikasi. Ia mem-parse gambar dari proyek sendiri saat build,
    #      bukan dari unggahan pengguna.
    #
    # Tak ada permukaan serang: DoS pada parser gambar menuntut penyerang bisa
    # MEMASOK gambarnya, dan tak ada jalur di mana itu terjadi.
    #
    # ⚠ CABUT BEGITU 2.0.3 TERBIT. Periksa berkala:
    #     pnpm view image-size version
    - GHSA-w3rx-r6r6-pgpr # image-size ICNS DoS (2.0.3 belum dirilis)
    - GHSA-5p2g-fcmc-qvqq # image-size JXL/HEIF DoS (2.0.3 belum dirilis)
