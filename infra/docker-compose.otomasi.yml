# ============================================================================
# n8n + Evolution API — PURALOKA
# ============================================================================
#   cd /srv/puraloka-suite/infra
#   docker compose -f docker-compose.otomasi.yml up -d
#
# ⚠⚠ BERKAS INI PALING BERISIKO DI SELURUH DEPLOY. Baca bagian di bawah
#     sebelum mengubah satu angka pun.
#
# ════════════════════════════════════════════════════════════════════════════
# MESIN INI SUDAH MENJALANKAN n8n DAN EVOLUTION MILIK TJS
# ════════════════════════════════════════════════════════════════════════════
#
# Diukur di VPS 2026-08-30 dengan `ss -tlnp`, bukan diasumsikan:
#
#   :5678  node /usr/bin/n8n start                    → n8n TJS
#   :5679  (broker internal n8n TJS)                  → n8n TJS
#   :8080  /var/www/tjs/evolution-api                 → Evolution TJS
#   :5432  postgres (host, systemd)                   → basis TJS
#   :3000  next-server                                → aplikasi TJS
#
# Dan `.env` Evolution TJS memakai `DATABASE_CONNECTION_CLIENT_NAME=evolution_tjs`
# dengan database bernama `evolution`.
#
# Kalau Puraloka memakai port atau database yang sama, akibatnya BUKAN galat —
# melainkan pesan WhatsApp Puraloka dikirim ke webhook TJS, dan riwayat chat
# dua perusahaan bercampur di satu tabel. CLAUDE.md §7 mencatat ini sebagai
# jebakan yang sudah memakan waktu.
#
# ── Port Puraloka, semuanya diverifikasi BEBAS sebelum dipilih
#
#   :5690  n8n UI          (TJS 5678)
#   :5691  n8n broker      (TJS 5679)
#   :8091  Evolution       (TJS 8080)
#
# ⚠ n8n memakai DUA port: UI dan "Task Broker" internal. CLAUDE.md mencatat
#   percobaan menyetel N8N_PORT=5679 GAGAL karena instance TJS memegang 5679
#   sebagai broker-nya — dan pesan galatnya tak menyebut bahwa yang bentrok
#   adalah port internal. Karena itu keduanya disebut eksplisit di sini.
#
# ── Isolasi data, bukan cuma port
#
#   n8n        volume `n8n-puraloka-data` sendiri (bukan ~/.n8n milik TJS)
#   Evolution  database `evolution_puraloka` + clientName `evolution_puraloka`
#
# Keduanya dipetakan ke 127.0.0.1 SAJA. Evolution memegang sesi WhatsApp
# perusahaan; terbuka ke internet berarti siapa pun yang menemukan portnya
# bisa mengirim pesan atas nama Anda. Jalan masuk hanya lewat nginx.
# ============================================================================

name: puraloka-otomasi

networks:
  puraloka-otomasi-net:
    driver: bridge

volumes:
  n8n-puraloka-data:
  evolution-puraloka-instances:

services:
  n8n:
    image: n8nio/n8n:1.68.0
    container_name: puraloka-n8n
    restart: unless-stopped
    environment:
      # Port UI + broker — keduanya BERBEDA dari milik TJS (5678/5679).
      N8N_PORT: 5690
      N8N_RUNNERS_BROKER_PORT: 5691
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_HOST: n8n.puraloka-suite.duckdns.org
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.puraloka-suite.duckdns.org/
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      # Sama dengan jalankan-n8n.cmd: sukses tak disimpan (bising dan besar),
      # galat disimpan penuh, dan yang lama dipangkas otomatis.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      # Konsol internal: pendaftaran mandiri dimatikan setelah akun pemilik
      # dibuat. Pintu daftar terbuka di alat yang memegang kredensial semua
      # integrasi adalah lubang yang tak perlu ada.
      N8N_USER_MANAGEMENT_DISABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?wajib diisi di .env}
    volumes:
      # Volume SENDIRI. Berbagi dengan ~/.n8n milik TJS berarti dua instance
      # menulis workflow dan kredensial ke folder yang sama.
      - n8n-puraloka-data:/home/node/.n8n
    ports: ["127.0.0.1:5690:5690"]
    networks: [puraloka-otomasi-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5690/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: puraloka-evolution
    restart: unless-stopped
    environment:
      SERVER_PORT: 8091
      SERVER_URL: https://wa.puraloka-suite.duckdns.org
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?wajib diisi di .env}
      # ⚠ DATABASE SENDIRI — `evolution_puraloka`, bukan `evolution` milik TJS.
      # Berbagi database membuat sesi WhatsApp dan riwayat chat dua perusahaan
      # bercampur, tanpa satu pun galat.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DB_URI:?wajib diisi di .env}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_puraloka
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      CONFIG_SESSION_PHONE_CLIENT: Puraloka Suite
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR
      DEL_INSTANCE: "false"
    volumes:
      - evolution-puraloka-instances:/evolution/instances
    ports: ["127.0.0.1:8091:8091"]
    networks: [puraloka-otomasi-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
