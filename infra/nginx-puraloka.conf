# Puraloka Suite — empat vhost, satu berkas
#
#   https://puraloka-suite.duckdns.org        → compro publik (container :3103)
#   https://app.puraloka-suite.duckdns.org    → ERP           (container :3102)
#   https://api.puraloka-suite.duckdns.org    → API           (container :3101)
#   https://n8n.puraloka-suite.duckdns.org    → n8n           (container :5690)
#   https://wa.puraloka-suite.duckdns.org     → Evolution     (host      :8091)
#
# Semuanya dipetakan ke 127.0.0.1 saja; firewall hanya membuka 22/80/443.
# Satu-satunya jalan masuk adalah berkas ini.
#
# ⚠ MESIN INI MELAYANI TJS. `nginx -t` WAJIB hijau sebelum reload — config
# rusak menjatuhkan tjs, n8n TJS, brilliante, dan admin-saas sekaligus.
#
# Pasang:
#   cp infra/nginx-puraloka.conf /etc/nginx/sites-available/puraloka-suite
#   ln -sf /etc/nginx/sites-available/puraloka-suite /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d puraloka-suite.duckdns.org \
#                   -d app.puraloka-suite.duckdns.org \
#                   -d api.puraloka-suite.duckdns.org \
#                   -d n8n.puraloka-suite.duckdns.org \
#                   -d wa.puraloka-suite.duckdns.org

# ── Compro publik (akar domain) ─────────────────────────────────────────────
server {
    server_name puraloka-suite.duckdns.org;
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    listen 80;
}

# ── ERP ─────────────────────────────────────────────────────────────────────
server {
    server_name app.puraloka-suite.duckdns.org;

    # Unggahan foto progres lapangan & lampiran dokumen melebihi bawaan 1 MB
    # dengan mudah.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Laporan besar (RAB, kurva-S lintas proyek) bisa lewat 60 detik.
        proxy_read_timeout 120s;
    }
    listen 80;
}

# ── API ─────────────────────────────────────────────────────────────────────
server {
    server_name api.puraloka-suite.duckdns.org;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    listen 80;
}

# ── n8n PURALOKA (:5690 — BUKAN :5678 milik TJS) ────────────────────────────
server {
    server_name n8n.puraloka-suite.duckdns.org;

    # Impor workflow bisa melebihi bawaan 1 MB.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5690;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WAJIB untuk n8n: editornya memakai WebSocket untuk log eksekusi
        # langsung. Tanpa dua baris ini UI tetap terbuka, tapi eksekusi tampak
        # menggantung selamanya.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
    listen 80;
}

# ── Evolution API PURALOKA (:8091 — BUKAN :8080 milik TJS) ──────────────────
server {
    server_name wa.puraloka-suite.duckdns.org;

    # Kirim media lewat WhatsApp.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Evolution memakai SSE untuk status koneksi & QR pairing.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    listen 80;
}
