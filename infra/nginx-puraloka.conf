# Puraloka Suite — dua vhost, satu berkas
#
#   https://puraloka-suite.duckdns.org      → web  (container :3102)
#   https://api.puraloka-suite.duckdns.org  → api  (container :3101)
#
# Keduanya dipetakan ke 127.0.0.1 saja; firewall hanya membuka 22/80/443.
# Satu-satunya jalan masuk adalah berkas ini.
#
# Pasang:
#   cp infra/nginx-puraloka.conf /etc/nginx/sites-available/puraloka-suite
#   ln -sf /etc/nginx/sites-available/puraloka-suite /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d puraloka-suite.duckdns.org -d api.puraloka-suite.duckdns.org
#
# ⚠ `nginx -t` DULU sebelum reload. Mesin ini melayani TJS, n8n,
# brilliante-next-chapter, dan admin-saas — config rusak menjatuhkan semuanya.

server {
    server_name puraloka-suite.duckdns.org;

    # Unggahan berkas (foto progres lapangan, lampiran dokumen) melebihi
    # bawaan 1 MB dengan mudah.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3102;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Laporan besar (RAB, kurva-S lintas proyek) bisa lewat 60 detik.
        proxy_read_timeout 120s;
    }

    listen 80;
}

server {
    server_name api.puraloka-suite.duckdns.org;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3101;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    listen 80;
}
