        blok .dark          globals.css:471 (token gelap lengkap)
        provider            components/theme-provider.tsx (next-themes)
        terpasang           app/layout.tsx:58
        toggle              components/theme-toggle.tsx → topbar.tsx:199
        sudah diaudit WCAG  kontras-ratchet: 38 pasangan, KEDUA mode

      Sidebar sudah gelap dengan sendirinya saat temanya gelap. Token
      --sidebar-* TIDAK dibuat.

      Alat ukur yang membuat saya salah: `grep "dark:" apps/web/app` → 0
      berkas. Itu mencari utility Tailwind; repo ini memakai CSS variable.
      Salah alat, salah kesimpulan.

  - id: UI-0-4
    lapis: 0
    judul: "SEBARKAN komponen bersama (bukan bangun — sudah ada, cuma tak dipakai)"
    blokir_oleh: []
    kriteria_selesai:
      - "penjaga `tabel-mentah-ratchet` ada, ber-lantai, TERBUKTI bisa merah"
      - "jumlah halaman ber-<table> mentah TURUN dari lantai 28"
      - "NOL perubahan globals.css — token kerapatan dipegang sesi lain"
      - "tak menambah hex mentah (hex-ratchet 49) & 8 penjaga visual hijau"
      - "tiap halaman yang dipindahkan tetap lulus a11y kedua mode"
    cara_verifikasi: "node scripts/tabel-mentah-ratchet.mjs + vitest + 8 penjaga"
    bobot: M
    status: berjalan
    hasil_2026_08_07: |
      penjaga tabel-mentah-ratchet.mjs DIBANGUN, terbukti bisa merah lewat
      mutasi, terdaftar di ci.yml. dasar.test.tsx dibuat (13 test) — berkas
      itu tak punya test sama sekali padahal seluruh argumen UI-0-4
      bersandar pada klaim komentarnya. Prop `total` -> <tfoot> ditambahkan.

        halaman ber-<table>  28 -> 13
        tabel mentah         63 -> 44

      Sisa 13 halaman: estimasi (15 tabel), procurement (9), laporan (5),
      proyek/[id] (3), dashboard (2), dan 8 lainnya berisi 1 tabel.
    catatan: |
      ⚠️ PREMIS ITEM INI SALAH — dikoreksi 2026-08-07.

      Judul lama menyuruh MEMBANGUN empat komponen. Keempatnya SUDAH ADA,
      dan berkualitas tinggi (a11y dijaga di dalam komponen, lengkap dengan
      catatan alasannya):

        KartuKPI        components/ui-dasar.tsx:123
        Panel + grafik  components/ui-dasar.tsx:260, 382, 448
        Tabel<T>        components/dasar.tsx:320
        KepalaHalaman   components/dasar.tsx:82

      Membangunnya lagi akan menciptakan pustaka primitif KETIGA — persis
      cacat yang sudah tercatat di komentar `dasar.tsx:419` (dua `Kosong`
      berbeda prop, `/aset` memanggil salah satu dengan prop milik yang lain).

      MASALAH SEBENARNYA — diukur 2026-08-07, dan angkanya tajam:

        halaman total              75
        memakai komponen bersama   19  (25%)
        memakai <Tabel>             1  ← satu
        menulis <table> mentah     28  ← dua puluh delapan

      Komponennya dibangun bagus lalu nyaris tak dipakai. ITU penyebab
      "tiap halaman terasa buatan sendiri" — bukan ketiadaan komponen.

      Karena itu pekerjaannya berubah jadi PENYEBARAN + PENJAGA. Tanpa
      penjaga, rasio 1-dari-28 akan pulih ke keadaan semula dalam beberapa
      minggu; pola yang sama sudah terbukti pada audit-triase-submenu
      ("aturan yang tak dijaga mesin akan dilanggar, sebaik apa pun niatnya").

      Penyebaran didahulukan pada halaman yang JUGA akan dipecah (mandor,
      kas) supaya satu berkas tak disentuh dua kali.

      Ini yang menghapus kesan "buatan sendiri": 59 halaman dibangun bertahap,
      jadi kartu dan tabel punya bentuk sedikit berbeda di tiap halaman.

      Keadaan kosong DITANGANI DI KOMPONEN, bukan diserahkan ke pemanggil —
      kalau diserahkan, separuh halaman akan lupa, dan layar kosong tanpa
      penjelasan terbaca sebagai fitur rusak.

  # ── LAPIS 0R — REDESIGN "COMMAND CENTER" ─────────────────────────────────
  # Gerbang 1 ditutup 2026-08-08. Sumber: docs/design/DESIGN-BRIEF.md §C.0.
  # Sembilan keputusan founder ada di sana; JANGAN tanyakan ulang.

  - id: UIR-0B
    lapis: 0
    judul: "Hijaukan kerapatan-ratchet SEBELUM redesign menyentuh halaman"
    blokir_oleh: []
    kriteria_selesai:
      - "node apps/web/scripts/kerapatan-ratchet.mjs exit 0"
      - "lantai TIDAK dinaikkan — pelanggarannya diperbaiki, bukan diampuni"
      - "8 penjaga visual lain tetap hijau"
    cara_verifikasi: "node apps/web/scripts/kerapatan-ratchet.mjs; echo $?"
    bobot: S
    status: selesai
    hasil_2026_08_08: |
      ✅ HIJAU. 308 -> 307, lantai TIDAK dinaikkan.

      SEBAB SEBENARNYA — bukan "ada yang menambah":

      Ditelusuri mundur 40 commit, angkanya SELALU 308. Lalu diperiksa
      commit yang menulis lantainya sendiri (3a96902, "358 -> 307"): di
      pohon commit ITU pun kenyataannya sudah 308 sementara lantai tercatat
      307. Jadi penjaga ini MERAH SEJAK LANTAINYA DITULIS — tak pernah ada
      regresi yang perlu dicari.

      Penyebabnya mekanisme auto-turun penjaga sendiri (baris 138-144):
      lantai ikut turun saat hitungan turun. Satu jalan yang membaca 307
      mengunci angka itu, sementara pohon yang di-commit mengukur 308.

      PERBAIKANNYA NYATA, BUKAN PENGAMPUNAN:

        components/document-section.tsx:494
        gap: 16  ->  gap: "var(--gap-bagian)"

      --gap-bagian bernilai 16px (globals.css:374) — nilai IDENTIK, jadi
      NOL perubahan visual. Yang berubah hanya: angkanya kini dibaca dari
      token, sehingga ikut berubah kalau kerapatan disetel ulang nanti.

      Dipilih karena konteksnya memang benar: jarak vertikal antar-bidang
      di badan modal = --gap-bagian. Bukan padding keadaan-kosong, yang
      sengaja TIDAK disentuh 3a96902 ("token kartu tak berlaku di sana").

      MUTASI (§8a.2): gap token -> 16 dipaku = MERAH (exit 1);
      dipulihkan = HIJAU (exit 0). Penjaga terbukti masih bisa merah.

      VERIFIKASI: 9 penjaga visual HIJAU · tsc --noEmit exit 0 ·
      vitest 32 berkas / 428 test LULUS.

  - id: UIR-0C
    lapis: 0
    judul: "next build GAGAL — useSearchParams tanpa Suspense di /procurement/lanjutan"
    blokir_oleh: []
    kriteria_selesai:
      - "npx next build exit 0"
      - "useSearchParams dibungkus <Suspense> (atau halaman jadi dinamis)"
      - "tak ada halaman lain ikut berubah perilakunya"
    cara_verifikasi: "cd apps/web && npx next build; echo $?"
    bobot: S
    status: selesai
    hasil_2026_08_08: |
      ✅ `next build` exit 0 — build HIJAU pertama di cabang ini.

      GALATNYA MENUNJUK BERKAS YANG SALAH, dan itu inti pelajarannya.

      Build menyalahkan /procurement/lanjutan dan /keuangan/contingency.
      Diperiksa: KEDUANYA tak memakai useSearchParams sama sekali. Bahkan
      /procurement/lanjutan tidak ada dalam daftar 12 halaman yang memakainya —
      dan kedua belas halaman itu SUDAH punya Suspense.

      Penyebab sebenarnya DUA komponen bersama:

        components/sidebar.tsx       dirender (dashboard)/layout.tsx
                                     -> SELURUH halaman dashboard mewarisinya
        components/judul-bagian.tsx  dipakai 5 pemanggil, 4 di antaranya layout

      Jadi satu titik, gejala di mana-mana, dan penunjuknya salah alamat —
      halaman yang disalahkan hanyalah yang kebetulan diprerender lebih dulu.

      PERBAIKAN: batas Suspense ditanggung DI DALAM komponen, bukan diserahkan
      ke pemanggil. Diukur: kelima pemanggil JudulBagian lupa, dan empat di
      antaranya layout.tsx — satu kelupaan menjatuhkan seluruh cabang halaman.
      Pola yang sama dengan Tabel/Kosong di dasar.tsx: keadaan yang mudah
      terlupa ditangani di komponen, karena "separuh pemanggil akan lupa"
      bukan kemungkinan melainkan hasil pengukuran.

      Fallback dibuat SELEBAR sidebar aslinya — shell memesan marginLeft
      sebesar --sidebar-w, jadi rangka lebih sempit membuat halaman melompat
      saat hidrasi.

      KAUSALITAS DIBUKTIKAN: Suspense dilepas dari <Sidebar /> -> build MERAH
      dengan galat IDENTIK di KEDUA halaman yang sama; dipulihkan -> exit 0.

      PENJAGA BARU: scripts/suspense-ratchet.mjs, terdaftar di ci.yml. LARANGAN
      (nol toleransi), bukan ratchet — satu pelanggaran = build merah = tak ada
      yang bisa dirilis, jadi tak ada lantai yang masuk akal.

      PENJAGA ITU SENDIRI CACAT DUA KALI, ketahuan saat diuji mutasi:
        1. /\bSuspense\b/ juga cocok pada KOMENTAR -> batas bisa dihapus
           sementara penjaga tetap hijau, diselamatkan kalimat penjelasnya.
        2. Sesudah diperketat jadi /<Suspense[\s>]/, sisi DETEKSI-nya masih
           membaca komentar -> layout.tsx dilaporkan melanggar padahal hanya
           MENYEBUT useSearchParams di komentar.
      Diperbaiki: komentar dibuang lebih dulu, DUA arah. Repo ini berkomentar
      padat, jadi penjaga yang membaca komentar sebagai kode akan salah justru
      pada berkas yang paling dijelaskan.

      VERIFIKASI: 11 penjaga visual HIJAU · next build exit 0 · tsc exit 0 ·
      vitest 33 berkas / 462 test LULUS.

    catatan: |
      DITEMUKAN 2026-08-08 saat memverifikasi UIR-1, dan BUKAN disebabkan olehnya.

      Dibuktikan: seluruh perubahan UIR-1 di-stash sampai pohon = HEAD bersih,
      lalu `npx next build` dijalankan — GAGAL dengan galat IDENTIK:

        ⨯ useSearchParams() should be wrapped in a suspense boundary
          at page "/procurement/lanjutan"
        Export encountered an error on /(dashboard)/keuangan/contingency/page

      Berkas itu tidak disentuh UIR-1 (dicek: `git status | grep lanjutan` = 0).

      KENAPA PENTING SEKARANG: DoD redesign (brief §13) menuntut "pnpm build
      lolos" untuk tiap halaman. Selama build merah, TIAP PR redesign berikutnya
      tak bisa membuktikan kriteria itu — dan kita kehilangan sinyal yang sama
      seperti kasus kerapatan-ratchet (UIR-0B): tak bisa membedakan kerusakan
      BARU dari yang LAMA.

      Sebaiknya dikerjakan sebelum UIR-4 (shell), karena shell menyentuh layout
      yang dipakai SEMUA halaman — dan build merah saat itu paling mahal.

  - id: UIR-1
    lapis: 0
    judul: "lib/format.ts — 83 panggilan format ad-hoc di 51 halaman"
    blokir_oleh: [UIR-0B]
    kriteria_selesai:
      - "lib/format.ts: rupiah, rupiahSingkat (rb/jt/M/T), persen, tanggal, relatif"
      - "penjaga format-ratchet ber-lantai 83, TERBUKTI bisa merah lewat mutasi"
      - "desimal koma, ribuan titik, zona Asia/Jakarta"
    cara_verifikasi: "node apps/web/scripts/format-ratchet.mjs + vitest"
    bobot: M
    status: selesai
    hasil_2026_08_08: |
      ✅ lib/format.ts + 34 test (ditulis SEBELUM implementasi) + penjaga
      terdaftar di ci.yml.

      TIGA JEBAKAN yang diselesaikan sekali, bukan di 141 tempat:

        1. ICU mengeluarkan SPASI TAK-PUTUS (U+00A0) di "Rp 1.000". Perbandingan
           string gagal dengan cara yang DI LAYAR TERLIHAT IDENTIK. Dinormalkan.
        2. `numeric` Postgres tiba sebagai STRING (driver menjaga presisi).
           Helper menerima number|string — kalau tidak, tiap pemanggil menulis
           Number() sendiri dan sebagian lupa → "Rp NaN".
        3. Jam tanpa zona ikut zona MESIN. Dipaku Asia/Jakarta.

      Nilai kosong → "—", BUKAN "0". Nol adalah FAKTA ("kas Rp 0"); tak-ada-data
      keadaan lain. Menyamakannya persis cacat d66956d (laporan menampilkan
      Rp 0 untuk biaya yang sebenarnya tak terbaca).

      PENYEBARAN LEWAT CODEMOD, bukan tangan (pindah-format.mjs):

        141 → 123 panggilan   (18 pembungkus rupiah lokal, 17 berkas)
        page.tsx: 83 → 70

      Diganti hanya SATU bentuk — pembungkus rupiah satu baris — dengan NAMA
      LOKAL DIPERTAHANKAN (`const rupiah = formatRupiah`), jadi seluruh
      pemanggilan di berkas itu tak perlu disentuh. Permukaan perubahan 1 baris
      per berkas, bukan 127.

      SENGAJA TIDAK disentuh: pembungkus yang sudah punya penanganan null /
      tangga M-jt sendiri (aset, kepatuhan) — perilakunya belum tentu sama
      persis, dan menyamakannya diam-diam = mengubah tampilan tanpa keputusan.
      Serta `toLocaleString` polos, yang dipakai untuk kuantitas/luas (bukan
      uang). Keduanya tetap terhitung ratchet, jadi turun bertahap.

      CACAT CODEMOD YANG SAYA BUAT DAN PERBAIKI: pola impor /^import .*$/m
      mencocokkan BARIS PEMBUKA impor multi-baris, lalu menyisipkan impor baru
      di TENGAH daftar nama — 2 berkas gagal parse (TS1003/TS1005 beruntun).
      Ketahuan typecheck, di-revert, pola diperbaiki menuntut penutup
      `from "...";`. Jadi alasan codemod diverifikasi typecheck, bukan dipercaya.

      MUTASI (§8a.2): +1 toLocaleString = MERAH (exit 1); dipulihkan = HIJAU.

      VERIFIKASI: 10 penjaga visual HIJAU · tsc exit 0 · vitest 33 berkas /
      462 test LULUS (428 + 34 baru).

      ⚠️ TEMUAN TERPISAH — `next build` GAGAL, dan BUKAN karena UIR-1:
      /procurement/lanjutan memakai useSearchParams() tanpa <Suspense>.
      Dibuktikan dengan stash seluruh perubahan → build di HEAD bersih gagal
      dengan galat IDENTIK. Berkas itu tak saya sentuh. Didaftarkan UIR-0C.

  - id: UIR-2
    lapis: 0
    judul: "Sebarkan KepalaHalaman — dipakai 0 dari 105 halaman"
    blokir_oleh: [UIR-0B]
    kriteria_selesai:
      - "halaman ber-KepalaHalaman NAIK dari lantai 0"
      - "penjaga ber-lantai, terbukti bisa merah"
      - "tinggi header seragam di seluruh grup"
    cara_verifikasi: "node apps/web/scripts/judul-ratchet.mjs"
    bobot: M
    status: berjalan
    hasil_2026_08_08: |
      ✅ GELOMBANG PERTAMA. KepalaHalaman 0 → 10 halaman; <h1> tangan 61 → 51.
      Penjaga `judul-ratchet` ber-lantai 51, terbukti bisa merah, terdaftar CI.

      DIUKUR LEBIH DULU — dan hasilnya mengubah rencana:

        66 halaman menulis <h1> sendiri, dalam 27 VARIAN gaya berbeda
           fontSize 20 · 22 · 24 · 26 · 28
           fontWeight 700 · 800
           warna C.text · var(--text-primary) · campuran
        30 halaman SUDAH benar — judulnya dari layout lewat <JudulBagian>
        13 halaman memakai UBIN IKON di kiri judul
         8 memang tanpa judul (callback, redirect — semestinya begitu)

      DUA KOREKSI yang mencegah kerusakan:

      1. KepalaHalaman TAK PUNYA prop ikon. Memindahkan 13 halaman ber-ubin
         apa adanya berarti MENGHAPUS penanda kategori yang justru diminta
         brief §3.3. Prop `ikon` ditambahkan lebih dulu, dengan 3 test (TDD),
         `aria-hidden` (ikon di sebelah judul yang sudah menyebut halamannya
         hanya menambah kebisingan pembaca layar).

      2. Enam halaman sempat terukur "punya DUA <h1>" — cacat a11y nyata kalau
         benar. Diperiksa: KEENAMNYA artefak KOMENTAR (catatan "jangan tulis
         <h1> di sini, layout sudah menyediakannya"). Nol yang nyata. Kalau
         dipercaya, enam halaman yang SUDAH BENAR akan "diperbaiki" jadi rusak.
         Cacat sejenis muncul di suspense-ratchet sehari sebelumnya — karena
         itu judul-ratchet membuang komentar lebih dulu, dan itu diuji.

      CODEMOD, dan TIGA cacatnya yang ketahuan sebelum masuk commit:
        a. impor tak ditambahkan — `includes('@/components/dasar')` bernilai
           true karena berkasnya sudah mengimpor `Tabel` dari modul yang sama.
           Pemeriksaannya benar, kesimpulannya salah → TS2304 di 5 berkas.
           Diperbaiki jadi menyisipkan nama ke daftar impor yang sudah ada.
        b. POLA_IKON cocok NOL kali — `[^}]*` berhenti pada `}}` milik style
           wadah luar. Diperbaiki dengan memulai pola dari UBIN-nya.
        c. gerbang berkas hanya menguji POLA polos, jadi 5 halaman
           /pengaturan/* yang hanya cocok POLA_IKON tak pernah diperiksa.
        Ketiganya ketahuan `tsc`/pratinjau, bukan sesudah commit.

      SISA 51 SENGAJA DITINGGALKAN: sebagian memang bukan judul halaman
      (sapaan dinamis beranda "Selamat datang, {nama}"), sebagian di portal
      yang shell-nya berbeda, sebagian punya tombol aksi yang butuh keputusan
      per halaman. Ratchet menahan supaya tak bertambah; gelombang berikutnya
      menurunkannya.

      VERIFIKASI: 12 penjaga visual HIJAU · next build exit 0 · tsc exit 0 ·
      vitest 33 berkas / 465 test LULUS (462 + 3 baru).

    catatan: |
      TEMUAN 2026-08-08, dan ini perbaikan TERMURAH di seluruh redesign:
      KepalaHalaman ADA di components/dasar.tsx:82, berkualitas baik, dan
      dipakai NOL dari 105 halaman. Artinya tiap halaman menulis judulnya
      sendiri — sumber paling langsung dari "tiap halaman terasa buatan
      sendiri", tanpa perlu menyentuh isi halaman satu pun.

      Pola yang sama dengan UI-0-4: yang gagal PENYEBARAN, bukan komponennya.

