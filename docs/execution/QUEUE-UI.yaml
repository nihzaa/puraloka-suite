# ============================================================================
# QUEUE-UI — antrean kerja UI/UX, TERPISAH dari QUEUE.yaml
# ============================================================================
#
# ── Kenapa terpisah
#
# Founder 2026-08-04: "bikin roadmap terpisah dari roadmap utama".
# Alasannya benar, dan ada bukti yang mendukungnya:
#
# QUEUE.yaml punya 43 item dan NOL di antaranya menyentuh UI. Itu sebabnya
# lima modul INTI bisa dibangun lengkap dengan API, migrasi, test, dan
# mutation-test — TANPA SATU PUN HALAMAN — dan tak ada penjaga yang protes.
# CLAUDE.md §8 melarangnya ("kolom DB sudah ada BUKAN selesai"), tapi larangan
# itu tak punya mekanisme.
#
# Berkas ini adalah mekanismenya.
#
# ── Hubungannya dengan QUEUE.yaml
#
# Bukan menggantikan. Dikerjakan BERSELANG: satu item UI, satu item fitur.
# Kalau UI dikerjakan sampai tuntas dulu, fitur berhenti berbulan-bulan; kalau
# fitur terus jalan, UI tak pernah kebagian.
#
# ── Gerbang — TERBUKA 2026-08-07
#
# Keempat pertanyaan ARAH-VISUAL-2026.md §10 SUDAH DIJAWAB. Berkas ini tidak
# lagi `menunggu-ratifikasi`.
#
#   1. aksen indigo   ⏸ DITAHAN  — "tunjukkan dulu, baru saya putuskan"
#   2. sidebar gelap  ❌ DITOLAK  — "tergantung mode-nya, dark atau light"
#   3. pecah tab      ✅ SETUJU   — keuangan sudah selesai; sisa mandor + kas
#   4. halaman contoh ✅ Dashboard
#
# ⚠️ BATAS WILAYAH: token kerapatan (--pad-kartu, --gap-grid, --teks-*) di
# globals.css sedang digarap SESI LAIN. Founder: "lewati kerapatan, garap
# sisanya". UI-0-1 karena itu `dipegang-sesi-lain`, bukan `todo`.
#
# ⚠️ Dark mode SUDAH ADA dan jalan (blok .dark globals.css:471, next-themes,
# toggle di topbar, 38 pasangan lulus WCAG kedua mode). Tiap token baru WAJIB
# punya pasangan .dark dan kontras-ratchet wajib tetap hijau.
# ============================================================================

meta:
  diperbarui: 2026-08-07
  gerbang: >
    TERBUKA. Empat pertanyaan §10 sudah dijawab founder 2026-08-07.
    Yang tersisa bukan pertanyaan melainkan pekerjaan: bangun perbandingan
    visual aksen navy-vs-indigo supaya founder memutuskan dari gambar,
    bukan dari hex di tabel.
  prinsip:
    - "Token dulu, halaman kemudian. Ubah token = 59 halaman ikut rapat serentak."
    - "Satu halaman contoh sebelum menyebar. Biaya salah = satu halaman, bukan 59."
    - "Sembilan penjaga visual yang ada WAJIB tetap hijau. Tak ada ambang dinaikkan."
    - "Halaman baru mengikuti arah baru — tak ada pekerjaan dua kali."

items:
  # ── LAPIS 0 — FONDASI VISUAL ─────────────────────────────────────────────
  # Tak menyentuh satu pun halaman. Kalau berhenti di sini, aplikasi tetap
  # utuh dan sudah lebih rapat.

  - id: UI-0-1
    lapis: 0
    judul: "Token kerapatan: padding 24→12, gap 16→8, font tabel 9-11→12.5"
    blokir_oleh: []
    kriteria_selesai:
      - "token spasi & tipografi baru di globals.css"
      - "sembilan penjaga visual tetap hijau"
      - "nol perubahan struktur halaman"
    cara_verifikasi: "penjaga visual + tinjau 3 halaman terpadat secara visual"
    bobot: M
    status: dipegang-sesi-lain
    catatan: |
      ⚠️ JANGAN KERJAKAN DARI SINI — 2026-08-07.
      Token --pad-kartu / --gap-grid / --teks-* sedang diubah di sesi lain.
      Founder: "lewati kerapatan, garap sisanya". Mengubah globals.css dari
      sini akan menimpa pekerjaan yang sedang berjalan.

      PALING BERDAMPAK, PALING MURAH. Diukur: padding 24px (standar
      data-dense 12px), font tabel 9-11px (standar 12-14px). Halaman terasa
      lemas karena longgar TAPI tulisannya kecil.

      Font NAIK sementara padding TURUN — bukan kontradiksi, itu rahasianya.
      Ruang yang dihemat dipakai untuk teks yang lebih terbaca.

  - id: UI-0-2
    lapis: 0
    judul: "Palet aksen indigo + deret warna data 5 tingkat"
    blokir_oleh: [UI-0-1]
    kriteria_selesai:
      - "token --aksen-* dan --data-1..5"
      - "aturan 'satu aksen per layar' tertulis di globals.css"
      - "kontras-hex-ratchet tetap hijau"
    cara_verifikasi: "node scripts/kontras-hex-ratchet.mjs + periksa mode gelap"
    bobot: S
    status: dicoret
    catatan: |
      ❌ DICORET 2026-08-07 sesudah founder MELIHAT perbandingannya.

      Perjalanannya: founder tidak menolak indigo dan tidak menyetujuinya —
      ia menolak MEMUTUSKAN WARNA DARI TEKS ("tunjukkan dulu, baru saya
      putuskan"). Perbandingan dibangun (`scripts/banding-aksen.mjs`,
      4 tangkapan: navy/indigo × terang/gelap), dilihat, lalu diputuskan:
      **tetap navy**.

      KENAPA USULNYA GAGAL — terlihat begitu dirender

      Indigo hanya menyentuh EMPAT tempat: garis grafik arus kas, sparkline
      KPI, irisan aktif donat, progress bar. Kartu KPI, sidebar, lencana, dan
      tautan SEMUANYA tetap navy — mereka memakai token `--navy`, bukan
      `--aksen`.

      Hasilnya bukan "lebih hidup" melainkan TIDAK MENYATU: garis grafik ungu
      di dalam kartu bertepi navy terbaca seperti komponen dari aplikasi lain.

      Mode gelap lebih telak. Di sana `--aksen` navy sudah jadi biru TERANG
      (#7ABDFF), jadi indigo terang di sebelah kartu KPI biru cerah terbaca
      KUSAM — dua biru yang berselisih sedikit, bukan dua warna yang
      berpasangan. Itu persis penyakit "biru-di-atas-biru" yang dokumen
      janjikan akan disembuhkan.

      Pelajarannya bukan "indigo warna jelek". Usulnya lahir dari membaca
      DAFTAR TOKEN, bukan dari melihat berapa banyak layar yang benar-benar
      dikendalikan token itu. Empat dari belasan elemen berwarna — terlalu
      sedikit untuk mengubah kesan, cukup banyak untuk merusak kesatuan.

      Navy #003366 TETAP jadi aksen tunggal. Nilai `--aksen*` di globals.css
      TIDAK diubah.

  - id: UI-0-3
    lapis: 0
    judul: "Sidebar gelap #0B1220 + garis aksen item aktif"
    blokir_oleh: []
    kriteria_selesai: []
    cara_verifikasi: "—"
    bobot: S
    status: dicoret
    catatan: |
      ❌ DICORET 2026-08-07 — founder: "sidebar itu tergantung pada mode-nya,
      dark atau light".

      Ini bukan penolakan estetika melainkan KOREKSI FAKTUAL terhadap premis
      item ini. Usul #0B1220 permanen lahir dari asumsi saya bahwa aplikasi
      tak punya mode gelap. Asumsi itu SALAH — diukur 2026-08-07:

        blok .dark          globals.css:471 (token gelap lengkap)
        provider            components/theme-provider.tsx (next-themes)
        terpasang           app/layout.tsx:58
        toggle              components/theme-toggle.tsx → topbar.tsx:199
        sudah diaudit WCAG  kontras-ratchet: 38 pasangan, KEDUA mode

      Sidebar sudah gelap dengan sendirinya saat temanya gelap. Token
      --sidebar-* TIDAK dibuat.

      Alat ukur yang membuat saya salah: `grep "dark:" apps/web/app` → 0
      berkas. Itu mencari utility Tailwind; repo ini memakai CSS variable.
      Salah alat, salah kesimpulan.

  - id: UI-0-4
    lapis: 0
    judul: "SEBARKAN komponen bersama (bukan bangun — sudah ada, cuma tak dipakai)"
    blokir_oleh: []
    kriteria_selesai:
      - "penjaga `tabel-mentah-ratchet` ada, ber-lantai, TERBUKTI bisa merah"
      - "jumlah halaman ber-<table> mentah TURUN dari lantai 28"
      - "NOL perubahan globals.css — token kerapatan dipegang sesi lain"
      - "tak menambah hex mentah (hex-ratchet 49) & 8 penjaga visual hijau"
      - "tiap halaman yang dipindahkan tetap lulus a11y kedua mode"
    cara_verifikasi: "node scripts/tabel-mentah-ratchet.mjs + vitest + 8 penjaga"
    bobot: M
    status: berjalan
    hasil_2026_08_07: |
      penjaga tabel-mentah-ratchet.mjs DIBANGUN, terbukti bisa merah lewat
      mutasi, terdaftar di ci.yml. dasar.test.tsx dibuat (13 test) — berkas
      itu tak punya test sama sekali padahal seluruh argumen UI-0-4
      bersandar pada klaim komentarnya. Prop `total` -> <tfoot> ditambahkan.

        halaman ber-<table>  28 -> 13
        tabel mentah         63 -> 44

      Sisa 13 halaman: estimasi (15 tabel), procurement (9), laporan (5),
      proyek/[id] (3), dashboard (2), dan 8 lainnya berisi 1 tabel.
    catatan: |
      ⚠️ PREMIS ITEM INI SALAH — dikoreksi 2026-08-07.

      Judul lama menyuruh MEMBANGUN empat komponen. Keempatnya SUDAH ADA,
      dan berkualitas tinggi (a11y dijaga di dalam komponen, lengkap dengan
      catatan alasannya):

        KartuKPI        components/ui-dasar.tsx:123
        Panel + grafik  components/ui-dasar.tsx:260, 382, 448
        Tabel<T>        components/dasar.tsx:320
        KepalaHalaman   components/dasar.tsx:82

      Membangunnya lagi akan menciptakan pustaka primitif KETIGA — persis
      cacat yang sudah tercatat di komentar `dasar.tsx:419` (dua `Kosong`
      berbeda prop, `/aset` memanggil salah satu dengan prop milik yang lain).

      MASALAH SEBENARNYA — diukur 2026-08-07, dan angkanya tajam:

        halaman total              75
        memakai komponen bersama   19  (25%)
        memakai <Tabel>             1  ← satu
        menulis <table> mentah     28  ← dua puluh delapan

      Komponennya dibangun bagus lalu nyaris tak dipakai. ITU penyebab
      "tiap halaman terasa buatan sendiri" — bukan ketiadaan komponen.

      Karena itu pekerjaannya berubah jadi PENYEBARAN + PENJAGA. Tanpa
      penjaga, rasio 1-dari-28 akan pulih ke keadaan semula dalam beberapa
      minggu; pola yang sama sudah terbukti pada audit-triase-submenu
      ("aturan yang tak dijaga mesin akan dilanggar, sebaik apa pun niatnya").

      Penyebaran didahulukan pada halaman yang JUGA akan dipecah (mandor,
      kas) supaya satu berkas tak disentuh dua kali.

      Ini yang menghapus kesan "buatan sendiri": 59 halaman dibangun bertahap,
      jadi kartu dan tabel punya bentuk sedikit berbeda di tiap halaman.

      Keadaan kosong DITANGANI DI KOMPONEN, bukan diserahkan ke pemanggil —
      kalau diserahkan, separuh halaman akan lupa, dan layar kosong tanpa
      penjelasan terbaca sebagai fitur rusak.

