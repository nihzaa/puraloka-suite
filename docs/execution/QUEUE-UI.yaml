      - "4 KPI card dengan delta + spark"
      - "founder melihat dan memutuskan: sebarkan / ubah arah"
    cara_verifikasi: "founder melihat langsung + 8 penjaga visual hijau"
    bobot: M
    status: todo
    catatan: |
      GERBANG KEPUTUSAN. Kalau arahnya ditolak, biayanya SATU halaman.
      Tak ada halaman lain disentuh sebelum ini disetujui.

      2026-08-07: founder memilih Dashboard sebagai halaman contoh (§10 no.4).
      Sekaligus PEMBAWA perbandingan aksen (UI-0-2) — dashboard inilah yang
      dirender dua versi (navy vs indigo) untuk keputusan warna. Satu
      pekerjaan, dua pertanyaan terjawab.

  # ── LAPIS 2 — SEBAR ──────────────────────────────────────────────────────
  # Baru dikerjakan setelah UI-1-1 disetujui.

  - id: UI-2-1
    lapis: 2
    judul: "Pecah halaman keuangan (3.449 baris, ~8 tab) jadi dashboard + 4 halaman"
    blokir_oleh: [UI-1-1]
    kriteria_selesai:
      - "dashboard keuangan: 4 KPI + grafik arus kas"
      - "/keuangan/invoice · /piutang · /retensi · /klaim jadi halaman sendiri"
      - "tiap halaman < 800 baris"
    cara_verifikasi: "wc -l + tautan langsung berfungsi"
    bobot: L
    status: selesai
    catatan: |
      SUDAH DIKERJAKAN sebelum ratifikasi turun — diukur 2026-08-07:
        keuangan/page.tsx  3.449 -> 523 baris
        sub-halaman        arus-kas, invoice, kasbon, pembayaran, profitabilitas
      Founder mengingatnya benar: "kalo ga salah pernah masuk todo".

  - id: UI-2-2
    lapis: 2
    judul: "Pecah halaman mandor (3.848 baris) jadi dashboard + sub-halaman"
    blokir_oleh: [UI-0-4]
    kriteria_selesai:
      - "dashboard mandor: 4 KPI + grafik"
      - "penugasan · upah · kasbon · penagihan · retensi jadi halaman sendiri"
    cara_verifikasi: "wc -l + tautan langsung berfungsi + penjaga hijau"
    bobot: L
    status: todo
    catatan: |
      Angka dokumen SUDAH BASI. Diukur ulang 2026-08-07: 3.848 baris, bukan
      3.667 — halaman ini MEMBESAR sejak dokumen ditulis. Sudah punya 3
      sub-halaman ([id], absensi, retensi); sisanya masih dalam satu berkas.

      Halaman TERBESAR di repo. Uji tab-vs-halaman: "kalau saya kirim tautan
      ini ke rekan, apa yang ia lihat?" — hari ini jawabannya bergantung tab
      mana yang terakhir dibuka. Itu tanda ia seharusnya halaman.

  - id: UI-2-3
    lapis: 2
    judul: "Dashboard per menu induk — 8 menu sisanya"
    blokir_oleh: [UI-0-4, UI-1-1]
    kriteria_selesai:
      - "proyek · kas · procurement · lapangan · kontrak · aset · tender · klien"
      - "tiap satu: 4 KPI + minimal 1 grafik + daftar"
      - "semua KPI memakai API yang SUDAH ADA — nol endpoint baru"
    cara_verifikasi: "tiap halaman dibuka, KPI terisi angka nyata"
    bobot: XL
    status: todo
    catatan: |
      Diukur ulang 2026-08-07: 24 menu induk, 16 di antaranya SATU halaman
      (bukan "20 dari 22" — dokumen lama). Yang sudah berlapis: pengaturan 9,
      keuangan 6, mandor 4, proyek/procurement/lapangan/gudang 3, kontrak 2.

      Diukur: 20 dari 22 menu induk hanya punya SATU halaman — langsung tabel.
      Itu penyebab monoton, bukan warnanya.

      Daftar KPI per menu sudah dirancang di ARAH-VISUAL-2026.md §5c, dan
      SELURUHNYA memakai endpoint yang sudah ada.

  # ── LAPIS 3 — PENJAGA ────────────────────────────────────────────────────

  - id: UI-3-1
    lapis: 3
    judul: "Penjaga CI: modul ber-API wajib punya UI"
    blokir_oleh: []
    kriteria_selesai:
      - "penjaga memindai endpoint vs pemakaian di apps/web"
      - "TERBUKTI bisa merah"
      - "lantai = keadaan hari ini, ratchet"
    cara_verifikasi: "suntik endpoint tanpa UI -> penjaga merah"
    bobot: M
    status: selesai-oleh-f8-2
    catatan: |
      INI YANG SEHARUSNYA ADA SEJAK AWAL.

      CLAUDE.md §8 melarang "kolom DB sudah ada = selesai", tapi larangan itu
      tak punya mekanisme — dan saya melanggarnya LIMA KALI berturut-turut
      tanpa satu pun penjaga protes.

      Pola yang sama dengan audit-triase-submenu: aturan yang tak dijaga
      mesin akan dilanggar, sebaik apa pun niatnya.
