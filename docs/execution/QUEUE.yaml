      LANJUTAN 2026-08-10: agent loop + rute chat SELESAI dan diuji terhadap model sungguhan.
      lib/ai-loop.ts: ronde TERAKHIR dikirim tanpa tools (C-4 — TJS mengembalikan balasan KOSONG
