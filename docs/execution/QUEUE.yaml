      `correlation_id` (merunut satu request) dan `severity`.
      Dijaga `audit-jejak-terbaca.test.ts` (4 test, 3 mutasi tertangkap).

      KRITERIA 2 - "alasan tersimpan": SEBAGIAN. Tiga pemanggil menaruh alasan
      di `newValues` alih-alih kolom `reason`, sehingga 636 `estimate.rejected`
      + 624 `estimate.approved` tercatat NOL beralasan. Ketiganya diperbaiki,
      dan `audit-alasan-di-kolomnya.mjs` mencegah terulang (mutation-tested).

      KRITERIA 3 - `workflow_id` terikat: SELESAI 2026-08-07.

      `correlation_id` hanya mengikat event dalam SATU request. Persetujuan
      berjenjang bukan satu request: level 1 hari ini, level 2 besok, oleh
      orang berbeda. Diukur: tiga estimasi punya dua langkah masing-masing,
      dan tiga event tiap alurnya (submitted -> approval.level -> approved)
      tak punya satu pun penanda bersama.

      `idAlurPersetujuan(entityId)` di utils/approval.ts memakai id entitas
      apa adanya - deterministik, unik per-alur, sudah bertipe uuid. Terpasang
      di 12 langkah pada 7 berkas. Dua di antaranya (procurement, submittal)
      ditemukan PENJAGA, bukan pencarian tangan.

