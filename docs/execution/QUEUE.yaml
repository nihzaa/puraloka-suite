  - id: T5A-PERMISSIVE
    fase: 2
    judul: "RLS: 30 tabel ber-restrictive TANPA permissive = mati total (dulu: '6 tabel permissive')"
    blokir_oleh: []
    kriteria_selesai:
      - "nol policy tenant_isolation yang permissive"
      - "t5a-policy-tenant.test.ts hijau"
      - "f2-3-batch3-tenancy-turunan.test.ts hijau"
    cara_verifikasi: >-
      cd apps/api && npx vitest run src/routes/v1/__tests__/t5a-policy-tenant.test.ts
      src/routes/v1/__tests__/f2-3-batch3-tenancy-turunan.test.ts
    catatan: >-
      DUA TEST MERAH DI MAIN, ditemukan 2026-08-09 saat menjalankan suite penuh
      untuk TJS-A0. BUKAN regresi dari pekerjaan itu — dibuktikan dengan
      menjalankan keduanya pada kode sebelum perubahan (git stash): tetap merah.

      Pesannya: "policy tenant jadi PERMISSIVE = ia MELEBARKAN akses, bukan
      membatasi" — 6 tabel, salah satunya `pencocokan_bank`.

      ── DIUKUR ULANG 2026-08-12 (sesudah R-011) ──────────────────────────
      Kriteria PERTAMA sudah LUNAS: `tenant_isolation` yang permissive kini
      NOL (diukur ke `pg_policy`). Keenam tabel itu sudah diperbaiki entah
      kapan tanpa item ini ditutup.

      Tetapi test-nya MASIH MERAH, dan sebabnya HAL LAIN — bukan yang ditulis
      judul item ini. Assertion yang gagal: "tiap tabel ber-policy-restriktif
      masih punya policy permissive". Postgres menggabungkan policy sebagai
      `(OR seluruh PERMISSIVE) AND (AND seluruh RESTRICTIVE)`, dan `OR` atas
      himpunan kosong adalah FALSE — jadi tabel yang HANYA punya restrictive
      MATI TOTAL: nol baris terbaca siapa pun yang tunduk RLS.

      Diukur: 40 tabel begitu. Sepuluh di antaranya (G5/G6/R-012) diperbaiki
      migrasi 312+313 → tersisa **30**, seluruhnya utang lama (`insiden_k3`,
      `audit_mutu`, `cuti_hak`, dan seterusnya — sebagian dari G3/G4).

      TIDAK diperbaiki massal, dan itu keputusan sadar: tiap tabel butuh
      penilaian izin mana yang tepat untuk membacanya, dan menebaknya akan
      memberi akses yang tak pernah diputuskan siapa pun — kesalahan yang
      lebih mahal daripada tabel yang terlalu tertutup.

      JUDUL ITEM INI SEKARANG MENYESATKAN. Yang tersisa bukan "6 tabel
      permissive" melainkan "30 tabel tanpa permissive". Dua masalah yang
      berlawanan arah, dan yang membaca judulnya akan mencari yang salah.

      ── SELESAI 2026-08-12 (migrasi 314) ─────────────────────────────────
      Tabel mati total sekarang **NOL** (dari 40 → 30 → 0).

      Izin baca tiap tabel DIUKUR dari rute yang benar-benar membacanya
      (`requirePermission` pada endpoint yang menyentuhnya), lalu diverifikasi
      ADA di tabel `permissions` — bukan ditebak dari nama tabel. Dua tebakan
      tertangkap saat mengukur: `tarif_payroll_*` ternyata punya rutenya
      sendiri (`payroll:tarif:view`, bukan `payroll:jalankan:view`), dan
      `pegawai` dipakai LIMA rute sehingga ia master data SDM.

      Isolasi tenant TIDAK dilonggarkan: `(OR PERMISSIVE) AND (AND
      RESTRICTIVE)` berarti yang restriktif tetap harus lolos. Blok verifikasi
      memeriksa keduanya masih terpasang pada ketiga puluh tabel.

      Keempat test RLS hijau (t5a, t5a0, t7, f2-3), dan 196 test modul
      terdampak (K3, mutu, cuti, payroll, kompetensi, timesheet, risiko) tetap
      lulus sesudah policy ditambahkan.

      Kelasnya sama dengan yang dicatat di spec lapisan AI (§5.4): perlindungan
      tenant di repo ini bertumpu pada penyaringan aplikasi, dan policy RLS-nya
      belum bisa diandalkan sebagai lapis kedua. Ditulis sebagai item tersendiri
      supaya tak tenggelam di antara pekerjaan AI.

      ⚠ Yang TIDAK dijawab item ini: apakah RLS kini bisa diandalkan sebagai
      lapis kedua. Yang dibuktikan hanya bahwa tiap tabel punya policy yang
      SAH BENTUKNYA — bukan bahwa predikatnya benar untuk setiap peran.
      Membuktikan itu menuntut pengujian dengan sesi tiap peran, bukan
      koneksi service-role. Item tersendiri kalau kelak dibutuhkan.
    bobot: M
    status: done
