# ============================================================================
# Puraloka Suite — susunan produksi VPS
# ============================================================================
#   docker compose up -d --build
#
# Basis data TIDAK ada di sini: ia hidup di Supabase (lihat apps/api/.env).
# Yang dijalankan berkas ini cuma DUA proses aplikasi — api dan web.
#
# ⚠ TIDAK ADA CADDY, dan itu diukur bukan diasumsikan.
#
# Rencana awal memakai Caddy untuk TLS otomatis. Diukur di VPS 2026-08-30:
# port 80 & 443 sudah dipegang nginx yang melayani EMPAT situs hidup — tjs,
# n8n, brilliante-next-chapter, dan admin-saas. Menjalankan Caddy berarti
# gagal bind, dan berisiko menjatuhkan TJS yang sedang dipakai.
#
# Pola yang dipakai sama dengan admin-saas yang sudah live: container
# mendengarkan 127.0.0.1 saja, nginx menghadap internet, certbot mengurus
# sertifikat. Vhost-nya di `infra/nginx-puraloka.conf`.
#
# ⚠ Sebelum `up` pertama kali, isi `.env` di sebelah berkas ini.
#   Contohnya ada di `.env.deploy.example`. Tanpa itu compose berhenti dengan
#   menyebut variabel yang kosong — bukan jalan dengan nilai bawaan yang salah.
#
# ⚠ KENAPA `.env`, BUKAN `.env.deploy` — perbedaan yang memakan waktu kalau
#   tak diketahui: `env_file:` memberi variabel kepada PROSES DI DALAM
#   container, sedangkan `${...}` di berkas compose ini di-interpolasi oleh
#   compose SENDIRI, dan itu hanya membaca `.env` (atau shell). Jadi dua-duanya
#   menunjuk berkas yang sama: `.env`.
#
#   Terbukti saat menulisnya: dengan nama `.env.deploy`, `docker compose config`
#   gagal dengan "required variable API_URL_PUBLIK is missing a value" padahal
#   berkasnya ada dan terisi.
# ============================================================================

name: puraloka

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 3001
    # 127.0.0.1 SAJA — nginx yang menghadap internet (lihat catatan di kepala
    # berkas). Membukanya ke 0.0.0.0 berarti API bisa diakses tanpa TLS,
    # melewati seluruh proxy.
    ports: ["127.0.0.1:3101:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Dipanggang saat build — lihat peringatan di apps/web/Dockerfile.
        NEXT_PUBLIC_API_URL: ${API_URL_PUBLIK:?API_URL_PUBLIK wajib diisi di .env}
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
    ports: ["127.0.0.1:3102:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

