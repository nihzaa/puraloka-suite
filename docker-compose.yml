# ============================================================================
# Puraloka Suite — susunan produksi VPS
# ============================================================================
#   docker compose up -d --build
#
# Basis data TIDAK ada di sini: ia hidup di Supabase (lihat apps/api/.env).
# Yang dijalankan berkas ini cuma DUA proses aplikasi — api dan web.
#
# ⚠ TIDAK ADA CADDY, dan itu diukur bukan diasumsikan.
#
# Rencana awal memakai Caddy untuk TLS otomatis. Diukur di VPS 2026-08-30:
# port 80 & 443 sudah dipegang nginx yang melayani EMPAT situs hidup — tjs,
# n8n, brilliante-next-chapter, dan admin-saas. Menjalankan Caddy berarti
# gagal bind, dan berisiko menjatuhkan TJS yang sedang dipakai.
#
# Pola yang dipakai sama dengan admin-saas yang sudah live: container
# mendengarkan 127.0.0.1 saja, nginx menghadap internet, certbot mengurus
# sertifikat. Vhost-nya di `infra/nginx-puraloka.conf`.
#
# ⚠ Sebelum `up` pertama kali, isi `.env` di sebelah berkas ini.
#   Contohnya ada di `.env.deploy.example`. Tanpa itu compose berhenti dengan
#   menyebut variabel yang kosong — bukan jalan dengan nilai bawaan yang salah.
#
# ⚠ KENAPA `.env`, BUKAN `.env.deploy` — perbedaan yang memakan waktu kalau
#   tak diketahui: `env_file:` memberi variabel kepada PROSES DI DALAM
#   container, sedangkan `${...}` di berkas compose ini di-interpolasi oleh
#   compose SENDIRI, dan itu hanya membaca `.env` (atau shell). Jadi dua-duanya
#   menunjuk berkas yang sama: `.env`.
#
#   Terbukti saat menulisnya: dengan nama `.env.deploy`, `docker compose config`
#   gagal dengan "required variable API_URL_PUBLIK is missing a value" padahal
#   berkasnya ada dan terisi.
# ============================================================================

name: puraloka

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Versi yang dipanggang ke image, dibaca `/health`.
      # Diisi `infra/perbarui-vps.sh`; kosong saat build manual, dan
      # `/health` lalu berkata 'tak diketahui' alih-alih menebak.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    # Nama dipaku supaya `docker inspect` di infra/perbarui-vps.sh bisa
    # menanyakan kesehatannya tanpa menebak awalan proyek.
    container_name: puraloka-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 3001
      # ⚠ WIB, bukan UTC — ini menentukan TANGGAL TRANSAKSI, bukan tampilan.
      #
      # Sudah disetel di `apps/api/Dockerfile` (bersama `tzdata`); diulang di
      # sini supaya `docker compose up` dengan image yang di-build di tempat
      # lain tetap benar, dan supaya siapa pun yang membaca compose ini tahu
      # zona waktunya keputusan, bukan bawaan.
      #
      # `node:22-alpine` = UTC. Antara 00:00–07:00 WIB, tanggal UTC masih
      # HARI KEMARIN — dan `paid_at` (pembayaran termin mandor) serta
      # `settled_at` (penyelesaian borongan) tak punya cadangan dari klien,
      # jadi UTC satu-satunya sumbernya.
      TZ: Asia/Jakarta
      # ⚠ WAJIB `0.0.0.0` DI DALAM CONTAINER.
      #
      # `index.ts` memakai `process.env.HOST ?? '127.0.0.1'` — bawaan yang
      # BENAR untuk mesin pengembangan (API tak terbuka ke jaringan lokal),
      # dan salah total di dalam container: ia mengikat ke loopback CONTAINER,
      # jadi pemetaan port Docker tak punya apa pun untuk diteruskan.
      #
      # Gejalanya menyesatkan: container "healthy" (healthcheck-nya berjalan DI
      # DALAM container, jadi 127.0.0.1 memang terjangkau), port terpetakan dan
      # docker-proxy mendengarkan — tetapi host mendapat 000 dan nginx 502.
      # Semua tanda menunjuk jaringan, padahal yang salah alamat bind.
      HOST: 0.0.0.0
    # 127.0.0.1 SAJA — nginx yang menghadap internet (lihat catatan di kepala
    # berkas). Membukanya ke 0.0.0.0 berarti API bisa diakses tanpa TLS,
    # melewati seluruh proxy.
    ports: ["127.0.0.1:3101:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Dipanggang saat build — lihat peringatan di apps/web/Dockerfile.
        NEXT_PUBLIC_API_URL: ${API_URL_PUBLIK:?API_URL_PUBLIK wajib diisi di .env}
        # `/auth/callback` di-PRERENDER saat build dan mengevaluasi modul
        # Supabase-nya — tanpa keduanya build gagal "supabaseUrl is required".
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?wajib diisi di .env}
        NEXT_PUBLIC_SUPABASE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?wajib diisi di .env}
    container_name: puraloka-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      # ⚠ PORT WAJIB ditimpa di sini.
      #
      # `.env` bersama memuat `PORT=3001` untuk API, dan `env_file` memberikan
      # SELURUH isinya ke tiap layanan. Next lalu mendengarkan 3001 sementara
      # pemetaan menunggu 3000 — container hidup, log menulis "Ready", dan host
      # mendapat 000.
      #
      # Kelas cacat yang sama dengan admin-saas (bawaan `-p 3100`), dan sama
      # sunyinya: tak ada yang salah kecuali angkanya.
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3102:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Compro publik ─────────────────────────────────────────────────────────
  # Halaman jual, dibaca siapa pun tanpa sesi. Ia TIDAK bergantung pada api
  # untuk merender — datanya dari Supabase langsung — jadi tak ada
  # `depends_on`: compro yang ikut mati saat API bermasalah adalah kerugian
  # tanpa alasan.
  web-publik:
    build:
      context: .
      dockerfile: apps/web-publik/Dockerfile
      args:
        # Keduanya DIPANGGANG saat build. `NEXT_PUBLIC_SUPABASE_URL` kosong
        # membuat next/image jatuh ke `localhost` dan SELURUH foto compro mati
        # di peramban pengunjung — tanpa galat di server.
        NEXT_PUBLIC_API_URL: ${API_URL_PUBLIK:?wajib diisi di .env}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?wajib diisi di .env}
        # Halaman `/` di-PRERENDER saat build dan benar-benar mengambil
        # datanya — jadi ketiganya dibutuhkan di tahap BUILD, bukan runtime.
        # Tanpa SITUS_COMPANY_ID build gagal dengan "Situs publik tidak tahu
        # konten milik siapa", di tempat yang mudah disalahartikan sebagai
        # cacat kode.
        SITUS_COMPANY_ID: ${SITUS_COMPANY_ID:?wajib diisi di .env}
        SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?wajib diisi di .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY:?wajib diisi di .env}
    container_name: puraloka-web-publik
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      # Sama dengan `web`: `.env` bersama memuat PORT=3001 milik API.
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3103:3000"]
    healthcheck:
      # `/api/health`, BUKAN `/` — dan itu bukan sekadar kerapian.
      #
      # Menembak halaman depan tiap 30 detik membuatnya di-render penuh
      # (profil, seksi, foto dari Supabase), dan yang lebih mahal: ia
      # MENGOTORI log API. Diukur 2026-09-12 di produksi — 48 dari 48
      # peringatan dalam 24 jam berbunyi "host situs tak terdaftar di
      # situs_domain" dengan host 127.0.0.1.
      #
      # Penolakannya BENAR (situs publik meresolusi tenant dari hostname
      # sejak migrasi 564; loopback memang bukan domain tenant). Yang salah
      # siapa yang mengetuk.
      #
      # Akibatnya satu-satunya peringatan harian adalah peringatan yang tak
      # berarti apa-apa — dan itu melatih orang mengabaikan level 40.
      # Alasan lengkapnya di `apps/web-publik/app/api/health/route.ts`.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
